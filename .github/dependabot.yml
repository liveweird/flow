# Weekly dependency bumps, grouped so one PR per workspace per week carries the minor/patch set
# and majors arrive alone (a major deserves its own review — see the pin rationales in
# gradle/libs.versions.toml).
version: 2
updates:
  # Gradle: Dependabot regenerates the module lockfiles (`core/gradle.lockfile`,
  # `server/gradle.lockfile`) in each bump PR but NOT the root `settings-gradle.lockfile`, which
  # pins the `io.ktor:ktor-version-catalog` coordinate loaded in `settings.gradle.kts` (currently
  # `3.6.0`, enforced by dependency locking). A Ktor catalog bump needs
  # `./gradlew build --write-locks` run on the branch by hand before it can go green — see
  # `.claude/docs/dependencies.md`'s lockfile-regeneration command.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
        # These families carry compatibility pins; review their updates independently.
        exclude-patterns: ["io.opentelemetry:*", "io.opentelemetry.instrumentation:*", "io.netty:*", "io.projectreactor.netty:*", "org.jetbrains.exposed:*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["vitest", "@vitest/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    # TypeScript majors are held back: `openapi-typescript` (peer `typescript ^5.x`, tolerated on
    # 6.0 via `--legacy-peer-deps`) drives the compiler-factory API that TypeScript 7.0 removed —
    # `npm run check:api` crashes on `createKeywordTypeNode`. Lift this ignore once
    # openapi-typescript declares TypeScript 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # External image tags and digests are reviewed just like application dependencies.
  - package-ecosystem: docker
    directories: ["/", "/k8s"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
