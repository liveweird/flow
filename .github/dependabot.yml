# Weekly dependency bumps, grouped so one PR per workspace per week carries the minor/patch set
# and majors arrive alone (a major deserves its own review — see the pin rationales in
# gradle/libs.versions.toml).
version: 2
updates:
  # Gradle: Dependabot regenerates the module lockfiles (`core/gradle.lockfile`,
  # `server/gradle.lockfile`) in each bump PR but NOT the root `settings-gradle.lockfile`, which
  # pins the `io.ktor:ktor-version-catalog` coordinate loaded in `settings.gradle.kts` (currently
  # `3.6.0`, enforced by dependency locking). A Ktor catalog bump needs
  # `./gradlew build --write-locks` run on the branch by hand before it can go green — see
  # `.claude/docs/dependencies.md`'s lockfile-regeneration command.
  #
  # Dependabot also has no story for `gradle/verification-metadata.xml` (Gradle's separate
  # SHA-256 dependency-verification checksums) — it only touches lockfiles. EVERY Gradle bump PR,
  # not just the Ktor-catalog case above, needs verification metadata regenerated by hand from an
  # empty GRADLE_USER_HOME before it can go green — see `.claude/docs/dependency-reproducibility.md`
  # for the hard rule and the exact command.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
        # These families carry compatibility pins; review their updates independently.
        exclude-patterns: ["io.opentelemetry:*", "io.opentelemetry.instrumentation:*", "io.netty:*", "io.projectreactor.netty:*", "org.jetbrains.exposed:*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["vitest", "@vitest/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    # TypeScript majors are held back: `openapi-typescript` (peer `typescript ^5.x`, tolerated on
    # 6.0 via `--legacy-peer-deps`) drives the compiler-factory API that TypeScript 7.0 removed —
    # `npm run check:api` crashes on `createKeywordTypeNode`. Lift this ignore once
    # openapi-typescript declares TypeScript 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major actually running in production (mise.toml); a newer
      # major can expose APIs missing at runtime even if the build passes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
    # Same openapi-typescript/typescript-eslint reason as /web: TypeScript 7 needs a coordinated
    # migration across both workspaces' tooling.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major actually running in production (mise.toml); a newer
      # major can expose APIs missing at runtime even if the build passes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # External image tags and digests are reviewed just like application dependencies.
  - package-ecosystem: docker
    directories: ["/", "/k8s"]
    schedule:
      interval: weekly
    # One PR for a PostgreSQL bump across both directories (compose's copy is a separate ecosystem —
    # see the PostgreSQL paragraph in .claude/docs/dependencies.md; PostgresImagePinTest fails a partial bump).
    groups:
      postgres-image:
        patterns: ["postgres"]
    ignore:
      # JDK 21 LTS policy — only LTS majors, decided deliberately; matches `jvmToolchain(21)` and
      # mise.toml's pinned JDK.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # Node 24 LTS line, pinned in mise.toml.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
