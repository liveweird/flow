name: e2e

# Blackbox Playwright suite: brings the full stack up via docker compose and drives a real browser.
on:
  # Not on push/PR: the compose stack + Playwright on a runner takes ~10+ minutes — ci.yml
  # (server/web/e2e-static gates) is the PR gate. The suite runs NIGHTLY against master so a
  # UI regression is caught within a day, and on demand from the Actions tab → "e2e" → "Run workflow".
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The image compose builds is `<project>-app`; pin the project so the build, `up` and every
      # later `docker compose` call agree on it whatever the checkout directory is called.
      COMPOSE_PROJECT_NAME: flow
      BUILDX_CACHE_DIR: /tmp/buildx-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Docker build context includes .git: no checkout token may be stored in its config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc mirrors mise.toml's node pin (and the Dockerfile's node tag); bump them together.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # The step split below exists so the nightly's time is attributable: `ci-times.mjs --workflows e2e
      # --steps e2e` shows the image build, the stack start-up and the specs as separate rows, each with
      # a budget in scripts/timings/budgets.json (`ci-steps`). Playwright's global setup reuses a stack
      # that already answers /api/v1/ready, so it starts nothing itself here.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser download is what the cache skips; the OS libraries live outside the cache, so
      # `install-deps` runs either way.
      - name: Install Playwright browser
        working-directory: e2e
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # A docker-container BuildKit builder is what can export a layer cache; the plain docker driver cannot.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned BuildKit (tag + multi-platform index digest, derived via `docker buildx imagetools
          # inspect moby/buildkit:v0.33.0`): the builder image is otherwise pulled floating.
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      # Keyed on the inputs of the slow, dependency-shaped layers, so the cache is rewritten only when a
      # dependency layer changes. (ci.yml's `images` job used to share this entry; it dropped the cache on
      # 2026-10-01 — it cost more than it saved there, `.claude/docs/build-times.md` WHY 9.)
      - name: Cache the image build layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: buildx-flow-${{ hashFiles('Dockerfile', 'gradle.lockfile', 'settings-gradle.lockfile', 'buildscript-gradle.lockfile', 'core/gradle.lockfile', 'core/buildscript-gradle.lockfile', 'server/gradle.lockfile', 'server/buildscript-gradle.lockfile', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'server/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'web/package.json', 'web/package-lock.json') }}
          restore-keys: buildx-flow-

      - name: Build images
        run: |
          mkdir -p "$BUILDX_CACHE_DIR"
          docker compose -f docker-compose.yaml -f .github/compose-buildx-cache.yaml build
          # The export wrote a complete new cache beside the old one; swap so unused blobs never pile up.
          rm -rf "$BUILDX_CACHE_DIR"
          mv "$BUILDX_CACHE_DIR-new" "$BUILDX_CACHE_DIR"

      # Every service that defines a healthcheck must report healthy — postgres and app declare theirs in
      # docker-compose.yaml, mailpit and wiremock ship one in their images; `--wait` fails the step (with
      # the failing service named) instead of leaving the wait to the first Playwright step.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      # Container logs make a red nightly diagnosable without reproducing it.
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
