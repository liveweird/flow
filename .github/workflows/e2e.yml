name: e2e

# Blackbox Playwright suite: brings the full stack up via docker compose and drives a real browser.
on:
  # Not on push/PR: the compose stack + Playwright on a runner takes ~10+ minutes — ci.yml
  # (server/web/e2e-static gates) is the PR gate. The suite runs NIGHTLY against master so a
  # UI regression is caught within a day, and on demand from the Actions tab → "e2e" → "Run workflow".
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # global-setup runs `docker compose up -d --build` on the runner and waits for :8084.
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
