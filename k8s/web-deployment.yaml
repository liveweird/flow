apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: flow
spec:
  replicas: 1
  # Never overlap old password writers with the credential-revision-aware server (V20).
  # This single-instance deployment accepts brief downtime during application upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      # The app never calls the Kubernetes API — do not mount a ServiceAccount token into the pod.
      automountServiceAccountToken: false
      # The image runs as uid 10001 (Dockerfile), the root filesystem is read-only (the JVM
      # only needs a writable /tmp), no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            # Secrets come from the `flow-secrets` Secret — see k8s/secret.yaml for how to
            # create it (never commit real values). The app fail-closes on placeholder/burned
            # JWT secrets and on unrotated seed passwords, so a misconfigured deploy crash-loops
            # instead of running with a backdoor.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: JWT_SECRET
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: DATA_ENCRYPTION_KEY
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/flow
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/flow
            # Production posture (the image default). For throwaway local-cluster testing over
            # plain HTTP (no TLS ingress), set this to "true" — HTTPS redirect / HSTS turn off
            # and the seed credentials are tolerated, exactly like the compose demo.
            - name: KTOR_DEVELOPMENT
              value: "false"
            # This Deployment serves the HTTP API + SPA and runs no ingestion worker
            # (`.claude/docs/ingestion.md` "Roles") — `k8s/worker-deployment.yaml` is the
            # counterpart the Service below never selects.
            - name: FLOW_ROLE
              value: "web"
            # The app sits behind an ingress / LB that must terminate TLS and set
            # X-Forwarded-For + X-Forwarded-Proto (and strip client-supplied values), so rate
            # limiting keys on the real client IP and the HTTPS redirect sees the real scheme.
            # HTTP_PROXY_HOPS = trusted proxies that APPEND to X-Forwarded-For (1 = the
            # ingress alone; see application.yaml `http.proxyHops`).
            - name: HTTP_BEHIND_PROXY
              value: "true"
            - name: HTTP_PROXY_HOPS
              value: "1"
            # Password reset and email MFA need outbound mail. This deployment ships with
            # mail disabled — set "smtp" plus real SMTP_HOST/MAIL_FROM/MAIL_APP_URL to enable
            # those flows (production refuses the `log` transport).
            # SMTP credentials come from the Secret.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "flow@localhost"
            - name: MAIL_APP_URL
              value: ""
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Local render placeholder. apply-local.sh substitutes an immutable per-build tag
          # before kubectl sees the manifest; OrbStack shares Docker's image store.
          image: flow-app:local-build
          imagePullPolicy: IfNotPresent
          name: flow-app
          ports:
            - containerPort: 8084
              protocol: TCP
          # Sized for the tuned JVM baked into the image (SerialGC + -Xmx256m + C1): ~270 MiB RSS
          # under light load. Request covers steady state; the 512 MiB limit bounds it with headroom.
          resources:
            requests:
              cpu: "250m"
              memory: "320Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /api/v1/ready round-trips the database (SELECT 1) — the pod leaves the Service while
          # postgres is unreachable; /api/v1/health only proves the process answers. The
          # startupProbe gives JVM boot + Flyway migrations up to ~150s (30 x 5s) before the
          # liveness clock starts, so a slow first boot cannot trigger a restart.
          # Every probe sends X-Forwarded-Proto: https — the header the TLS-terminating ingress
          # sets (HTTP_BEHIND_PROXY above makes the app trust it). Without it, production mode
          # answers the plain-HTTP probe with a 301 to https://<pod-ip>/, which the kubelet
          # FOLLOWS (same host) into a refused :443 — probes never pass and the pod crash-loops
          # (Lettuce's v3.6.1 incident, reproduced in production here). startupProbe/livenessProbe
          # hit /api/v1/health, which never waits on the database (plugins/Health.kt) — the
          # kubelet's default timeoutSeconds: 1 is sane as-is; only readinessProbe (below) needs
          # a longer one.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8084
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8084
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            # /ready can wait in the R2DBC pool queue up to READINESS_TIMEOUT_MS (3s,
            # plugins/Health.kt) before answering — the kubelet's default 1s probe timeout would
            # abort the HTTP call (and count it as a failed probe) well before that budget is
            # spent. timeoutSeconds must exceed 3s; failureThreshold above the kubelet default
            # (3) tolerates a few probes landing during a brief pool-saturation spike (a burst of
            # concurrent requests, not an actual outage) without flapping the pod out of the
            # Service.
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8084
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
