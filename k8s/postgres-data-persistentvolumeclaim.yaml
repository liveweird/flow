apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: postgres-data
  name: postgres-data
  namespace: flow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Postgres 18's fresh cluster alone is ~40 MiB; the raw Jira store and the derived tables grow from there.
      storage: 1Gi
