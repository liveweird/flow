apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: postgres-data
  name: postgres-data
  namespace: flow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Postgres 18's fresh cluster alone is ~40 MiB; contracts are capped at 2 MiB each.
      storage: 1Gi
