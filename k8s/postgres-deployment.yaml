apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: postgres
  name: postgres
  namespace: flow
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: flow
            # Credentials come from the `flow-secrets` Secret (see k8s/secret.yaml) so the
            # same values feed both this container and the app's connection settings.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_USER
          image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
          # Keep the probe command as a proper argv list (a single-string argv can't exec).
          # The readinessProbe gates the Service endpoint (the compose
          # `depends_on: service_healthy` equivalent).
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flow", "-d", "flow"]
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "flow", "-d", "flow"]
            initialDelaySeconds: 10
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          name: flow-postgres
          ports:
            - containerPort: 5432
              protocol: TCP
          # Without requests the pod is BestEffort — the first thing evicted under node pressure,
          # taking the database with it. Sized for the demo's data volume; raise the limit with it.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            # postgres 18+ images keep data in a versioned subdir of /var/lib/postgresql;
            # mounting the pre-18 /var/lib/postgresql/data path breaks the container.
            - mountPath: /var/lib/postgresql
              name: postgres-data
      restartPolicy: Always
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
