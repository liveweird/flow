apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: worker
  name: worker
  namespace: flow
spec:
  replicas: 1
  # One worker: the sync-job queue's lease/heartbeat claim makes a second replica safe (an
  # expired lease is reclaimable by any worker) but pointless — there is nothing for a second
  # instance to parallelize beyond `ingest.workerSlots`' in-process concurrency. Recreate, like
  # the web Deployment, so an upgrade never overlaps old and new workers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: worker
  template:
    metadata:
      labels:
        io.kompose.service: worker
    spec:
      # The app never calls the Kubernetes API — do not mount a ServiceAccount token into the pod.
      automountServiceAccountToken: false
      # The image runs as uid 10001 (Dockerfile), the root filesystem is read-only (the JVM
      # only needs a writable /tmp), no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            # Secrets come from the `flow-secrets` Secret — see k8s/secret.yaml for how to
            # create it (never commit real values). The app fail-closes on placeholder/burned
            # JWT secrets and on unrotated seed passwords, so a misconfigured deploy crash-loops
            # instead of running with a backdoor.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: JWT_SECRET
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: DATA_ENCRYPTION_KEY
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/flow
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/flow
            # Production posture (the image default). For throwaway local-cluster testing over
            # plain HTTP (no TLS ingress), set this to "true" — HTTPS redirect / HSTS turn off
            # and the seed credentials are tolerated, exactly like the compose demo.
            - name: KTOR_DEVELOPMENT
              value: "false"
            # This Deployment runs the ingestion worker and serves ONLY the health/ready probes
            # (`.claude/docs/ingestion.md` "Roles") — no feature routes, no SPA. Its labels are
            # deliberately distinct from `k8s/app-service.yaml`'s selector (`io.kompose.service:
            # app`, matched by `k8s/web-deployment.yaml` alone), so the Service never load-balances
            # API traffic onto a worker pod.
            - name: FLOW_ROLE
              value: "worker"
            # The tuned JVM baked into the image defaults to -Xmx256m (server/build.gradle.kts);
            # the worker holds Jira response bodies (up to `jira.maxResponseBytes`, 32 MiB) plus
            # normalization batches in memory, so it gets a larger heap. The launcher script
            # (server/build/install/server/bin/server, generated by the Gradle `application`
            # plugin) assembles the JVM command line as `$DEFAULT_JVM_OPTS $JAVA_OPTS
            # $SERVER_OPTS` — DEFAULT_JVM_OPTS is the image's baked `-Xmx256m`, appended BEFORE
            # JAVA_OPTS on the same `java` invocation, and the JVM takes the LAST `-Xmx` flag on
            # its command line — so this env var's `-Xmx512m` wins over the baked default without
            # rebuilding the image.
            - name: JAVA_OPTS
              value: "-Xmx512m"
            # The app sits behind an ingress / LB that must terminate TLS and set
            # X-Forwarded-For + X-Forwarded-Proto (and strip client-supplied values), so rate
            # limiting keys on the real client IP and the HTTPS redirect sees the real scheme.
            # HTTP_PROXY_HOPS = trusted proxies that APPEND to X-Forwarded-For (1 = the
            # ingress alone; see application.yaml `http.proxyHops`). The worker's only HTTP
            # surface is the health/ready probes, but they still answer through the same
            # HTTPS-redirect/HSTS posture as the web Deployment (see the probe comment below).
            - name: HTTP_BEHIND_PROXY
              value: "true"
            - name: HTTP_PROXY_HOPS
              value: "1"
            # Password reset and email MFA need outbound mail. This deployment ships with
            # mail disabled — set "smtp" plus real SMTP_HOST/MAIL_FROM/MAIL_APP_URL to enable
            # those flows (production refuses the `log` transport). The worker itself sends no
            # mail; these vars are carried for parity with the web Deployment and Bootstrap,
            # which run in every role.
            # SMTP credentials come from the Secret.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "flow@localhost"
            - name: MAIL_APP_URL
              value: ""
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Local render placeholder. apply-local.sh substitutes an immutable per-build tag
          # before kubectl sees the manifest; OrbStack shares Docker's image store. Same image
          # as k8s/web-deployment.yaml — one codebase, one image, FLOW_ROLE picks the role.
          image: flow-app:local-build
          imagePullPolicy: IfNotPresent
          name: flow-worker
          ports:
            - containerPort: 8084
              protocol: TCP
          # 384Mi/768Mi (vs the web Deployment's 320Mi/512Mi) covers the -Xmx512m heap above plus
          # the same JVM baseline overhead (SerialGC, C1) the web Deployment's comment measures.
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # The worker's only HTTP surface is /api/v1/health and /api/v1/ready
          # (plugins/Health.kt, always registered regardless of role) — same probes, same
          # X-Forwarded-Proto header and the same plain-HTTP crash-loop rationale as
          # k8s/web-deployment.yaml (`.claude/docs/security.md` "Probes and the plain-HTTP
          # crash-loop"). The startupProbe gives JVM boot + Flyway migrations up to ~150s
          # (30 x 5s) before the liveness clock starts.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8084
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8084
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            # Same budget as the web Deployment: /ready can wait in the R2DBC pool queue up to
            # READINESS_TIMEOUT_MS (3s, plugins/Health.kt) before answering.
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8084
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
