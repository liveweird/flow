# TEMPLATE — do NOT apply with these placeholder values (the app refuses to start on the
# placeholder JWT secret and admin password). Create the real secret out-of-band and never commit it:
#
#   kubectl create namespace flow
#   kubectl -n flow create secret generic flow-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATA_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_USER=flow \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=ADMIN_INITIAL_PASSWORD='<choose-the-first-admin-password>'
#
# ADMIN_INITIAL_PASSWORD rotates the seeded admin account away from the well-known 'changeme'
# on first boot; without it, production mode refuses to start.
# DATA_ENCRYPTION_KEY encrypts stored credentials (from v0.2.0: the Jira connection token) at rest — losing it
# loses every stored credential; back it up apart from the database. The placeholder below is
# not 64 hex characters, so the app refuses it in ANY mode.
apiVersion: v1
kind: Secret
metadata:
  name: flow-secrets
  namespace: flow
type: Opaque
stringData:
  JWT_SECRET: CHANGE-ME-openssl-rand-hex-32
  DATA_ENCRYPTION_KEY: CHANGE-ME-openssl-rand-hex-32
  POSTGRES_USER: flow
  POSTGRES_PASSWORD: CHANGE-ME
  ADMIN_INITIAL_PASSWORD: CHANGE-ME
