  /api/v1/reports/compare-people:
    get:
      tags: [reports]
      operationId: getReportComparePeople
      summary: Report 18 — compare people (two people head to head over a date range, across every team)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 18". Two people (`accountId` repeated, EXACTLY two
        distinct Jira account ids; one, three, or two that collapse to one are 400) over a `from`/`to` period (default the trailing 90
        days; `teamId`, `lastSprints` and `sprintId` are not accepted — 400) are read ACROSS every team they belonged to: a task is
        a person's by its assignee at done, a worklog by its author, whatever the team. `domain`/`domainView`/`activityType`/
        `workCategory`/`connectionId` slice both people alike (the WIP rows ignore the slices, like report 9). A `from` before the history
        horizon's first day (`meta.historyHorizon`, A48) is raised to it - the window is read from that day, `meta.from` says so - and a
        period wholly before it is `400`. Every row of `rows` is a
        figure another report defines (`key`, in table order): delivered MD and items (report 2), the median task size (the estimate at
        start in MD, report 19's value; an unestimated or never-started task is excluded, never 0; lower is better), the share of
        done tasks reopened at least once (`reopenedShare`; lower is better), cycle time p50/p90 in working and
        elapsed days (7), flow efficiency p50 (A18) and reported time ÷ cycle p50 (8; target 1.0), PRED(25) of the accuracy at start and
        at done (3), the share of started tasks changed after start and the median change (5), average WIP per working day (9;
        read at query time, the plan's days cut off at the last derived day), the items still in progress at the last listed day and
        their median age (11), the share of done tasks that were blocked and the blocked share of the cycle (12), logged MD (16), the
        foreign share of it (A21) and the data-quality shares of report 14 (worklog coverage, late logging over a day, no estimate).
        The `CODE` group (A50, Report 21's member cells, computed by the very same functions) holds the person's GitLab activity over
        the period: `commits`, `linesChanged` (counted lines added + deleted; a commit with unknown counted lines adds nothing and is
        listed with no figure), `mrsMerged`, `mrCycleWorkingDaysP50` and `mrSizeLinesP50` (the p50 of the person's merged merge requests,
        working days and lines, lower is better, hidden under `minSampleSize`), `reviewsGiven` and `approvalsGiven` (DISTINCT merge
        requests) and `comments` (acts); the volumes are NEUTRAL (no `better`). They are attributed by the identity key LINKED to the
        person on every ACTIVE GitLab source, whatever the team (a person with no link has 0 in every count, never hidden), and the
        slices (`domain`/`domainView`/`activityType`/`workCategory`/`connectionId`) do not apply to them.
        Each cell is `{value, n, hidden}`: `n` the cell's sample, `hidden` true (value null) when a distribution-shaped figure has
        fewer than `minSampleSize` measured items. `direction` says which side is better (HIGHER, LOWER, TARGET — the value closer to
        `target` — or NEUTRAL: no side); `difference` is B minus A (both values present); `better` (A or B) is absent for a NEUTRAL
        row, when either side has no value, when either side's `n` is under `minSampleSize` (not on the pure item counts `deliveredItems`
        and `wipAtEndItems`, which are facts rather than statistics), and on a tie (the gap is within `tolerance`, a per-unit
        constant); `margin` (>= 0) is by how much, present exactly with `better`. `cycleTime` holds the two histograms of the cycle
        time: the UNION of both people with a `byUser` split per person (index-aligned with `people`). `workMix` groups both people's
        delivered tasks by activity type, work category (`UNCATEGORIZED` = none) and domain (key null = none), neutral, no cue.

        CAPACITY (A39 per person) — the ONE caller-shaped part: for an ADMIN, or the ACTIVE manager of EVERY team either person
        belonged to during the period (checked per request; not a guard, never a 403; a pair with no team in the period has no manager,
        so only an ADMIN), the response also carries `capacity` and the four rows `availableMd` (summed per day across the teams the
        person belonged to, a transfer day counted once), `loggedPerAvailableMd` (logged MD ÷ available MD; target 1.0),
        `deliveredMdPerAvailableMd` and `deliveredItemsPerAvailableMd`. For every other caller those keys are ABSENT — all or nothing
        for the pair. `wipDays` names the working days the WIP rows were averaged over; `note` says why they are empty or partial.
        400: a malformed parameter (see above), `from` after `to`, a span over 1100 days, an unknown connection (never 404), and a selection whose
        `CODE` rows read more than `reports.codeMaxRows` GitLab rows (default 100000; the `detail` says to narrow the period or pick fewer people).
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportComparePeopleAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The comparison
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparePeopleReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/compare-people/items:
    get:
      tags: [reports]
      operationId: getReportComparePeopleItems
      summary: The items behind one person's cell of the compare-people table (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items" and "Report 18". Takes the parent
        report's parameters (`GET /api/v1/reports/compare-people`: exactly two `accountId`s, a `from`/`to` period, the common slices,
        `tailPercent`) plus the cell's identity: `segmentAccountId` (REQUIRED, one of the two `accountId`s — every compare-people figure
        is one person's) and `view`, the `drill` of the row. The list is produced by the report's own fetch and per-item value, so
        `bar.count` equals the cell's `n` for a distribution or a count (delivered, cycle time, flow efficiency, the reported-time
        ratio, the accuracy, the changes, the items in progress at the end, the logged worklogs), the items counted in the NUMERATOR for
        a share (`ADJUSTED` the started tasks changed after start, `BLOCKED` the blocked tasks, `FOREIGN` the foreign worklogs, `LATE`
        the worklogs logged over a day late, `NO_ESTIMATE` the tasks without any estimate, `REOPENED` the tasks reopened at least
        once, `figure` = the reopen count; `TASK_SIZE` lists the tasks with an estimate at start, `figure` = that estimate in MD, and
        its `bar.count` is the cell's `n`) or the gap for the coverage (`NO_WORKLOGS`
        the done tasks without a worklog) and, for `WIP_TASK_DAYS`, the distinct tasks held on the working days the average runs over
        (`figure` = the days each was held; their sum over `bar.count` is not the average's `n`, which counts days). `figure` is the
        item's value in the row's unit (MD for `DELIVERED`, days, a ratio, the age in working days for `WIP_AT_END`, the blocked working
        days, the number of changes for `ADJUSTED`, a worklog's MD for `LOGGED`/`FOREIGN`/`LATE`), `anchorAt` its `done_at`
        (`started_at` for `ADJUSTED` and the worklogs, none for `WIP_TASK_DAYS`); worklog rows are `itemKind` `WORKLOG` and
        `bar.sumMd` is their MD (for `DELIVERED` the estimate at done; a task without one is listed with a null `figure`, an item worth
        0 MD). `bucketIndex` — the cycle-time views (`CYCLE_WORKING_DAYS`, `CYCLE_ELAPSED_DAYS`) only, 0-based into the matching
        `cycleTime` histogram (the open tail last) — narrows the list to that bar's share of the person (the histogram's `byUser`
        count) and sets `bar.from`/`bar.to`; without it the cell's whole measured set. The `CODE` rows' views (`COMMITS`, `MRS_MERGED`,
        `MR_CYCLE_WORKING_DAYS`, `MR_SIZE_LINES`, `REVIEWS_GIVEN`, `APPROVALS_GIVEN`, `COMMENTS`) are `GET /api/v1/reports/code-activity/items`'
        own selection for the person in any team: `itemKind` `COMMIT` or `MERGE_REQUEST`, `bar.count` equals the cell's `n`, no `teamId`. A cell hidden under `minSampleSize` still lists
        its items (the histogram bar of a hidden distribution is 400). Sorted by `figure` descending, newest `anchorAt`, then issue key;
        at most 500 listed — `total` (equal to `bar.count`) says how many are behind the cell. 400: a missing or unknown `view`, a
        missing `segmentAccountId` or one outside the picks, a `bucketIndex` on another view, not a non-negative integer or outside the
        histogram, plus every 400 of the parent.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportComparePeopleAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - name: segmentAccountId
          in: query
          required: true
          schema: { type: string }
          description: Whose cell — one of the two `accountId`s (400 otherwise).
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [DELIVERED, CYCLE_WORKING_DAYS, CYCLE_ELAPSED_DAYS, REPORTED_TIME_RATIO, FLOW_EFFICIENCY, ACCURACY_AT_START, ACCURACY_AT_DONE, ADJUSTED, ADJUSTMENT_CHANGE, WIP_TASK_DAYS, WIP_AT_END, BLOCKED, LOGGED, FOREIGN, LATE, NO_WORKLOGS, NO_ESTIMATE, TASK_SIZE, REOPENED, COMMITS, MRS_MERGED, MR_CYCLE_WORKING_DAYS, MR_SIZE_LINES, REVIEWS_GIVEN, APPROVALS_GIVEN, COMMENTS]
          description: Which set of items — the `drill` of a row of the parent report.
        - name: bucketIndex
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: The cycle-time views only — a bar of the `cycleTime` histogram, 0-based (the open tail bucket last). A 400 on any other view or outside the histogram.
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The items behind the cell
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDrillItems'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/person-trend:
    get:
      tags: [reports]
      operationId: getReportPersonTrend
      summary: Report 20 — person trend (one person's compare-people figures over rolling 90-day windows, across every team)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 20". ONE person (`accountId`, required; a repeated key
        is 400) over a `from`/`to` range (default the trailing 365 days; `teamId`, `lastSprints` and `sprintId` are not accepted — 400),
        read ACROSS every team the person belonged to, like `GET /api/v1/reports/compare-people`. The range is a grid of POINTS: `to`,
        then every 14 days back while not before `from` (`windows`, oldest first; at most 79 for the 1100-day span cap). Each point is
        a rolling WINDOW of 90 calendar days ending on that day (`windows[].from`..`end`, inclusive, in the configured zone), so the
        first window reaches 89 days before `from`. ONE TRUTH: every `rows[].points[]` is the person's side-A cell of the SAME row of
        `GET /api/v1/reports/compare-people` over `from=windows[].from&to=windows[].end` (same `key`, `unit`, `direction`, `target`,
        `tolerance`, `drill` and the same `{value, n, hidden}`; `value` is absent when hidden or undefined) — the rows are
        `cycleWorkingDaysP50`/`P90`, `flowEfficiencyP50`, `deliveredItems`, `deliveredMd`, `accuracyAtStartPred25`, `avgWip`,
        `wipAtEndMedianAgeWd`, `blockedItemsShare`, `worklogCoverage`, `lateLoggingShare`, `noEstimateShare`, `reopenedShare`,
        `taskSizeP50` and the three `CODE` rows `mrsMerged`, `mrCycleWorkingDaysP50` and `reviewsGiven` (A50, from the person's linked GitLab
        identities in any team; the Jira slices do not apply to them), in that order; no capacity row (A39) is ever present. `domain`/`domainView`/`activityType`/`workCategory`/
        `connectionId` slice every window alike (the WIP rows ignore the slices, like report 9). `windows[].coverage` says how much data
        backs a window: `FULL`; `PARTIAL` when it starts before the latest `backfillFrom` of the connections in scope or before the history
        horizon's first day (`meta.historyHorizon`, A48: the figures read from that day, and the points of a `from` before it start at it) or
        ends after the last derived day; `NONE` when nothing is derived or the window lies wholly outside that span (its cells are still Compare
        people's figures over it — typically empty — and a client draws a gap). `rows[].trend` is the CUE: the first against the last
        point whose window is `FULL` and whose cell has a value (`fromEnd`/`toEnd` name them; absent with fewer than two), with the
        `difference` (last minus first) and a `verdict` (`BETTER`/`WORSE` by the row's `direction`, Compare people's rule: sample-gated,
        a tie within `tolerance` has none). `workMix` is context, not a measure: the person's delivered man-days by activity type and by
        work category (`UNCATEGORIZED` = none) per window, a point for EVERY window (`md` 0 where nothing was delivered under the key),
        with `share` = the key's man-days over all the window's (absent when the window delivered none); series ordered by total
        man-days descending, then key. `note` says why the WIP rows are empty or partial. TEAM REFERENCE (A46, amended 2026-10-28): each
        window names its reference team in `windows[].team` — the team the person belonged to (dated membership) on the window's END day; if
        several memberships cover that day (a transfer day), the one the person belonged to for the most days inside the window, then
        the lowest team id; absent when no membership covers the day. Each `rows[].points[].reference` is then the median of that same
        row's cell over the person's PEERS in that window — the OTHER members of the reference team (membership covering the end day),
        never the person — each peer's cell being the very Compare-people figure over the same window (one truth). A member with NO
        activity in the window (no delivered task and no worklog under the request's slices, no work in progress on any day) is no
        peer at all, for any row; a peer whose cell is hidden or has no value is left out of that row, and with fewer than 3 peers contributing `reference.value` is absent (`reference.peers`
        is the number that contributed). The work mix has no reference, and the cue (`trend`) is the person's own first-against-last,
        unaffected. Same visibility as the figures (D12). 400: a missing or repeated `accountId`, a
        malformed parameter, `from` after `to`, a span over 1100 days, an unknown connection (never 404), and a range whose
        `CODE` rows read more than `reports.codeMaxRows` GitLab rows (default 100000; the `detail` says to narrow the period or pick fewer people).
      parameters:
        - { $ref: '#/components/parameters/ReportPersonTrendFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportPersonTrendAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The trend
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonTrendReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/person-trend/items:
    get:
      tags: [reports]
      operationId: getReportPersonTrendItems
      summary: The items behind one point of one row of the person trend (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 20". Takes the parent report's parameters
        (`GET /api/v1/reports/person-trend`: ONE `accountId`, a `from`/`to` range, the common slices; its own parser, so the same 400s)
        plus the point's identity: `pointEnd` (REQUIRED; an ISO date that is one of the range's point days, the `windows[].end` the
        parent answers with — 400 otherwise) and `view`, the `drill` of a row of the parent (a view of a Compare-people-only row is 400).
        The list IS the person's `GET /api/v1/reports/compare-people/items` for that view over the point's window
        (`from=pointEnd − 89 days&to=pointEnd`, the parent's `windows[].from`..`end`): same items, `figure`s, `bar` and `meta` (whose
        `from`/`to` are the window), so `bar.count` reconciles with the point exactly as Compare people's drill does with its cell
        (the point's `n` for a distribution or a count, the numerator's items for a share, the gap for the worklog coverage; a hidden
        point still lists its items). There is no `bucketIndex` (400 if sent): the list is the person's whole set in the window. Sorted
        by `figure` descending, newest `anchorAt`, then issue key; at most 500 listed — `total` (equal to `bar.count`) says how many are
        behind the point. 400: a missing or unknown `view`, one that is no row's drill, a missing, malformed or off-grid `pointEnd`,
        a `bucketIndex`, plus every 400 of the parent.
      parameters:
        - { $ref: '#/components/parameters/ReportPersonTrendFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportPersonTrendAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - name: pointEnd
          in: query
          required: true
          schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
          description: The point's day — one of the parent's `windows[].end` for the same `from`/`to` (400 otherwise).
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [DELIVERED, CYCLE_WORKING_DAYS, FLOW_EFFICIENCY, ACCURACY_AT_START, WIP_TASK_DAYS, WIP_AT_END, BLOCKED, LATE, NO_WORKLOGS, NO_ESTIMATE, TASK_SIZE, REOPENED, MRS_MERGED, MR_CYCLE_WORKING_DAYS, REVIEWS_GIVEN]
          description: Which set of items — the `drill` of a row of the parent report.
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The items behind the point
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDrillItems'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/code-activity:
    get:
      tags: [reports]
      operationId: getReportCodeActivity
      summary: Report 21 — code activity (a team's merge-request flow over the GitLab code layer, with per-member volumes as neutral context)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 21", domain-model A50. Read per team: `teamId` is
        required (`400` otherwise; `0` is the UNASSIGNED bucket — the work of identities with no decision at all and of linked people
        with no membership at the anchor); there is no domain slice, so `domain`, `domainView`, `activityType` and `workCategory` are
        not accepted parameters (ignored like any unknown name). The period is dates (default the trailing 90 days) or the team's
        sprints (`lastSprints`, `sprintId`); `accountId` repeats 1 to 8 and sets the USER level, where every distribution splits per
        picked person. `connectionId` names one ACTIVE GITLAB data source (a Jira, deleted or unknown one is `400`); without it every
        active GitLab source is read. The report is computed at request time from the stored code layer and attributed through the
        administrators' identity links (A50): a row belongs to the person its identity key is LINKED to and to the team that person's
        dated membership covers at the row's anchor (a commit by `committed_at`, a merged merge request by `merged_at`, an opened one by
        `created_at`, an open one by now, an act by `event_at`); an identity an administrator decided BOT or IGNORED is in no figure and in
        no unlinked count. `meta` is the JIRA star's (the roster, names and sprints come from it): the freshness of the code figures is
        `sources[]` (`lastSyncAt`, and the commits whose files and the merge requests whose details were still unread at the last data
        profile). `quality` counts, connection-wide for the period, what no figure can use: `unlinkedIdentities` / `unlinkedCommits` /
        `unlinkedMergeRequests` / `unlinkedEvents` (undecided identities and their activity), `commitsLinesUnknown`, `mrsSizeUnknown`,
        `mrsDetailsNotRead`, `eventsUndated`. `flow` is the merge-request FLOW of the team over the period: `merged` and `closedUnmerged`;
        `cycleWorkingDays` / `cycleElapsedDays` (created to merged); `timeToFirstReviewWorkingDays` (created to the first event of kind
        COMMENT, DIFF_COMMENT, APPROVAL, REVIEWED or CHANGES_REQUESTED by another human — REVIEWED is approximate — over the merged merge
        requests whose details were read); `sizeLines` (`additions + deletions`, exclusion-blind GraphQL totals) and `sizeFiles`;
        `mergedWithoutReview` / `mergedWithoutApproval` (counts and shares against the merged merge requests whose details were read);
        `weekly` (Monday-started weeks of the configured zone, zero-filled). The figures here may be coloured by a client (lower is better
        for the cycle, first review, size and merged without review); the response carries no verdict. `open` is the open merge requests
        now: `count` the non-draft ones, `drafts` counted apart, `age` the waiting ones' age in working days. `review` (absent while no
        merged merge request has its details read) is the review concentration: reviewers per merged merge request (p50) and the share of
        the distinct (merge request, reviewer) pairs the busiest reviewer holds. `groups` are the per-member volumes — NEUTRAL context,
        never a performance verdict: commits (non-merge), counted files and lines (exclusion-aware; commits with an unknown count are left
        out and counted in `commitsLinesUnknown`), merge requests merged / opened / open now, the p50 of the member's cycle and size,
        and the distinct merge requests reviewed / approved / with changes requested, the comments (acts) and the review requests
        received. TEAM level lists every member of the team (zeros kept); `teamId=0` lists the undecided unlinked identities (named by
        their GitLab display name or username) and the linked people with no membership. Counts are never hidden; the distributions
        and p50 cells are hidden under `meta.minSampleSize`. 400: a missing or malformed `teamId`, a malformed or conflicting
        period, more than 8 `accountId`, a bad `tailPercent`, an unknown or inactive team, an unknown or non-GitLab `connectionId`, and a
        selection that reads more than `reports.codeMaxRows` code rows (commits, merge requests and review events; default 100000, env
        `REPORTS_CODE_MAX_ROWS`) — answered with a `detail` that names the budget and says to narrow the period or pick fewer people,
        never with a silently cut figure. 429: besides the per-user rate limit, at most `reports.codeReadPermits` (default 2, env
        `REPORTS_CODE_READ_PERMITS`) Code activity computations run at once in a web process; a request waits up to the statement budget
        (`reports.statementTimeoutSeconds`) for a permit and is then refused with a `detail` asking to retry in a moment.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamIdRequired' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportCodeConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The code activity report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeActivityReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/code-activity/items:
    get:
      tags: [reports]
      operationId: getReportCodeActivityItems
      summary: The commits or merge requests behind one figure of the code activity report (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 21". Takes the parent report's parameters
        (`GET /api/v1/reports/code-activity`: a REQUIRED `teamId`, the period, up to 8 `accountId`, `connectionId`, `tailPercent`, so the
        same 400s) plus the figure's identity: `view` (REQUIRED) and, for the histogram views, an optional `bucketIndex`; for `WEEK` the
        REQUIRED `bucketStart`. The list is read from the SAME rows by the report's own attribution and value functions, so
        `bar.count` equals the figure it stands behind: `COMMITS` a member's `commits`; `MRS_MERGED` `flow.merged` / `mrsMerged`;
        `MRS_OPENED` `mrsOpened`; `OPEN_MRS` the member's `openMrs` (drafts included) and `OPEN_MRS_WAITING` `open.count` (the
        non-draft ones; `figure` is the age in working days); the five histogram views `MR_CYCLE_WORKING_DAYS`, `MR_CYCLE_ELAPSED_DAYS`,
        `TIME_TO_FIRST_REVIEW`, `MR_SIZE_LINES`, `MR_SIZE_FILES` the merged merge requests the distribution measures — with a
        `bucketIndex` (0-based into that distribution's `histogram`, the open tail last) the bar's own items (`bar.count` equals
        `histogram[bucketIndex].count`, `bar.from`/`bar.to` its range, `to` null = the open tail; the layout is the union's and
        `segmentAccountId` narrows to a person's share, the `byUser` count), without one the whole measured set (a member's p50 cell);
        `MERGED_WITHOUT_REVIEW` / `MERGED_WITHOUT_APPROVAL` the numerators of the two shares; `REVIEWS_GIVEN`, `APPROVALS_GIVEN`,
        `CHANGES_REQUESTED_GIVEN` and `REVIEW_REQUESTS_RECEIVED` the DISTINCT merge requests behind a member's cell (one row per member
        and merge request, anchored by the earliest such act); `COMMENTS` one row per comment ACT (the cell counts acts); `WEEK` the
        merge requests merged in the weekly bar that starts on `bucketStart` (one of the report's `flow.weekly[].bucketStart`, else 400).
        `itemKind` is `COMMIT` or `MERGE_REQUEST`; `issueKey` is `<project path>@<sha12>` / `<project path>!<iid>`, `summary` the first
        line of the message / the title, `accountId` the author or actor's linked account (null for an unlinked identity, whose
        `assignee` is its display name or username under `teamId=0` and null otherwise — never its key), `teamId` the request's team,
        `anchorAt` the figure's anchor (`committed_at`, `merged_at`, `created_at`, `event_at`) and `figure` the figure's own value (a
        commit's counted lines, a merge request's cycle in working days / size in lines / age; null where the list has none). Sorted by
        `figure` descending, newest `anchorAt`, then key; at most 500 listed — `total` (equal to `bar.count`) says how many are behind the
        figure. `segmentAccountId` needs USER level and must be one of the picked `accountId`s, else 400 (a TEAM-level member's cell is the
        request with that member as the only `accountId`). 400: a missing or unknown `view`, a `bucketIndex` that is not a non-negative
        integer, is sent with a non-histogram view or lies outside the histogram, a hidden distribution (fewer than `meta.minSampleSize`
        values: no bar exists), a `bucketStart` that is missing for `WEEK`, sent with another view or not a week of the period,
        plus every 400 of the parent (the code-row budget one included: a selection over `reports.codeMaxRows` is refused, not cut), and the
        429 of the parent (a computation permit that did not free up within the statement budget). The merge requests and commits link to the GitLab host of `sources[].baseUrl` of the parent.
        A `MERGE_REQUEST` item also carries `linkedKeys`: the Jira issue keys its title or source branch names within the known Jira projects (A51).
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamIdRequired' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportCodeConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [COMMITS, MRS_MERGED, MRS_OPENED, OPEN_MRS, OPEN_MRS_WAITING, MR_CYCLE_WORKING_DAYS, MR_CYCLE_ELAPSED_DAYS, TIME_TO_FIRST_REVIEW, MR_SIZE_LINES, MR_SIZE_FILES, MERGED_WITHOUT_REVIEW, MERGED_WITHOUT_APPROVAL, REVIEWS_GIVEN, APPROVALS_GIVEN, CHANGES_REQUESTED_GIVEN, COMMENTS, REVIEW_REQUESTS_RECEIVED, WEEK]
          description: Which figure's items — see the operation description.
        - name: bucketIndex
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: The histogram views only — a bar of that distribution's `histogram`, 0-based (the open tail bucket last). A 400 on any other view or outside the histogram; absent, the whole measured set.
        - name: bucketStart
          in: query
          required: false
          schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
          description: The `WEEK` view only (and REQUIRED there) — the first day of one weekly bar, one of the report's `flow.weekly[].bucketStart`.
        - { $ref: '#/components/parameters/ReportDrillSegmentAccountId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportDrillItemsOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/task-code:
    get:
      tags: [reports]
      operationId: getReportTaskCode
      summary: Report 22 — tasks and code (the done tasks of a team or domain and the GitLab merge requests that name them by issue key)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 22", domain-model A51. Population as cycle time (Report 7):
        level-0 tasks (no sub-tasks) DONE in the period (`done_at`), team = the D5 credit team, domain per `domainView` (default TASK),
        `teamId` or `domain` required (`400` otherwise: a report is read per team or per domain, never for the whole unit); the period is
        dates (default the trailing 90 days) or the team's sprints (`lastSprints`, `sprintId`). There is no user level in this slice: an
        `accountId` is a `400`. `connectionId` names one JIRA data source (a GitLab, deleted or unknown id is `400`) and narrows only the
        tasks; without it every active Jira source's tasks are read. Whether a key names one issue is always decided over EVERY active
        Jira source. The merge requests are
        those of EVERY active GitLab source, live ones only, linked to a task by the issue keys their title or source branch name
        (stored at PROCESS, scoped to the known Jira projects and resolved at read time): a key links to a task when it is the task's
        current key or an old key from its `issuekey` changes AND names exactly one live issue (not deleted, not moved out) of the active
        Jira sources; a key naming several issues is ambiguous and links to none, a key naming none links to none. `meta` is the JIRA star's; the freshness of the merge requests is `sources[]`
        (empty while no GitLab source is active: then no task has a merge request, which says nothing about the tasks).
        `tasks`: `done` tasks, of which `withMergeRequest` have at least one linked MERGED merge request (state `merged` with a date) and
        `withoutMergeRequest` have none (a task with only open, closed or locked merge requests is "without" and counted in
        `quality.onlyUnmergedMrs`); `withoutShare` is `withoutMergeRequest` over `done` (absent when nothing is done), a NEUTRAL context figure with
        no verdict. `codeLeadTimeWorkingDays` is a `Distribution` of the working days (the configured calendar) from the task's start
        (`started_at`, the cycle-time anchor) to its LAST linked merged merge request, over the tasks that started and have one (a merge
        before the start is 0); hidden below `meta.minSampleSize`. `mergedAfterDone` counts the done tasks whose last linked merge
        happened after `done_at` (`count`; `share` over `tasks.withMergeRequest`, absent when there is none; `lagWorkingDays` the working
        days from `done_at` to that merge). Lower is better for the lead time and the merged-after-done figures; the response carries no
        verdict. `quality`, all counts of done tasks of the period: `neverStarted` (no `started_at`, so no lead time), `onlyUnmergedMrs` (linked
        merge requests, none merged: open, closed unmerged, locked, or `merged` with no date; counted in `tasks.withoutMergeRequest`) and
        `tasksWithAmbiguousKey` (a key of the task names more than one live issue, so it linked nothing through that key). The merge
        requests are read by the keys of the done tasks and charged to `reports.codeMaxRows` (a selection over it is a `400` that says to
        narrow the period, never a cut figure).
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The tasks and code report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCodeReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/reported-time-ratio:
    get:
      tags: [reports]
      operationId: getReportReportedTimeRatio
      summary: Report 8 — reported time ÷ cycle time (man-days logged per working day of cycle)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 7, 8". Population and
        attribution as cycle time (level-0 DONE tasks by `done_at`, credit team / assignee at done, domain per
        `domainView`, default TASK). `ratio` is `actual_md ÷ cycle_working_days` — how much of the elapsed working
        time was logged — a `Distribution`, hidden below `minSampleSize`. Each task lands in exactly ONE
        exclusion bucket (`excluded`, checked in this order): `noWorklogs` (D14 — none logged, or `actual_md` of
        0.00), `neverStarted` (no `started_at`, so no cycle), `zeroCycle` (`cycle_working_days = 0`, nothing to
        divide by). So `ratio.n + noWorklogs + neverStarted + zeroCycle = population`. Levels: UNIT `groups` per
        credit team, TEAM per assignee at done; `teamId` AND `accountId` narrow to USER level — `accountId` repeats
        here (and on commitments, throughput, cycle time, adjustments, task accuracy, task estimates and WIP too, no other report), 1 to 8 distinct accounts, more is a 400.
        At USER level both distributions read the UNION of the picked people (tasks whose assignee at done is one of
        them) and carry `byUser`, one share per picked account in request order, splitting every histogram bucket
        (the open tail bucket included) per person, so the shares sum to each bucket's count; `groups` lists each
        picked account (assignee at done) with its own plain distributions, an empty entry when it has no task.
        Each group carries its own distribution and exclusion counts. Sprint-relative periods use the resolved
        sprints' envelope.
        Beside the ratio, `flowEfficiency` is the status-based flow efficiency (A18) `active_ms ÷ cycle_ms` over
        the same population — active time is the time in IN_PROGRESS stages (WAITING and BLOCKED time are wait, A30 and A36) minus Flagged time while in progress;
        `flowEfficiencyExcluded` puts each task that is not measurable in exactly ONE bucket (`neverStarted`, then
        `zeroCycle` = `cycle_ms` of 0, so `flowEfficiency.n + neverStarted + zeroCycle = population`); worklogs play
        no part, so a task with none is still measured. Reported time ratios can be dominated by very short
        cycles, a real outlier that is never dropped: the mean, p95 and histogram reflect it.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The reported time ratio report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportedTimeRatioReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/reported-time-ratio/items:
    get:
      tags: [reports]
      operationId: getReportReportedTimeRatioItems
      summary: The tasks behind one bar of the reported-time ratio or flow-efficiency histogram (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items". Takes the parent report's
        parameters (`GET /api/v1/reports/reported-time-ratio`, `tailPercent` included — it shapes the histogram) plus the bar's
        identity: `view` (`RATIO` — `actual_md ÷ cycle_working_days` — or `FLOW_EFFICIENCY` — `active_ms ÷ cycle_ms`) and
        `bucketIndex`, 0-based into that distribution's `histogram` (the open tail bucket last). The tasks the report excludes from
        the view (no worklogs, never started, a zero cycle) are in no bar. `bar.count` equals `histogram[bucketIndex].count`,
        `bar.from`/`bar.to` its range (`to` null = the open tail); a listed task's `figure` is its ratio or fraction and `anchorAt`
        its `done_at`. Sorting, the 500 cap, `total`/`truncated`, `segmentAccountId` (USER level, one of the picked accounts) and the
        400 matrix are those of `GET /api/v1/reports/cycle-time/items`.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [RATIO, FLOW_EFFICIENCY] }
          description: Which of the report's histograms the bar belongs to.
        - { $ref: '#/components/parameters/ReportDrillBucketIndex' }
        - { $ref: '#/components/parameters/ReportDrillSegmentAccountId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportDrillItemsOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/metrics-settings:
    get:
      tags: [metrics]
      operationId: getMetricsSettings
      summary: Get the global metrics settings singleton
      description: |
        ADMIN only. The ONE `metrics.settings` row every DERIVE run reads under its
        `configRevision` — the calendar/thresholds the whole metrics layer is built against
        (`.claude/docs/domain-model.md` "Configuration"). `timeZone` defaults to `Europe/Warsaw`. The holidays are NOT
        part of the settings: they are the public-holiday dictionary (`/api/v1/public-holidays`).
      responses:
        '200':
          description: The current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSettingsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateMetricsSettings
      summary: Replace the global metrics settings
      description: >-
        ADMIN only, guard before the body decode. A full replace — every field is required.
        Bumps `configRevision`, which (from a later commit on) enqueues a `DERIVE` job for every
        enabled connection. `historyHorizonMonths` is required but nullable: 6..120 months, or `null` for no horizon
        (domain-model A48; the reports and the data-source backfill floor follow in later releases).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsSettingsRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Flow's own vital signs - processes, storage, per-connection sync health, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, connection names and their sync health), read-only, no audit event;
        served by the `web`/`all` roles (a `worker` answers 404 like every API route); both telemetry reads share one per-user rate bucket
        (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (web, worker or all) with its latest raw sample: every live process, and per role the
        newest stale one when none is alive (a worker that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `connections` lists every data source a PURGE has not
        drained (`deleted` = soft-deleted, awaiting it) - id and name only, never its settings or token - with the size estimate of
        the last estimate run, its sync freshness, the live queue (due PENDING and RUNNING jobs), its latest SYNC job and latest
        backfill (a SYNC whose run was a first download or widened the scope), the Jira 429s and back-off of the last 24 hours and its
        latest DERIVE run. `requests` is the latest sample interval of the web processes: the `*` total and the 15 busiest report routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event; served by the `web`/`all` roles.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched; `sync`, `derive` and `storage` have their own budget of 25 connections - four series each for `sync` and `derive`, plus
        sync's two queue series; two each for `storage`, plus its database and per-schema series, which are always kept - and leave the
        least active connections out whole (`storage`: the smallest estimated bytes, ties the higher id) - `omittedConnectionIds`); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        serving roles into one series per route (`requests`, `role` null); `storage` and the queue of `sync` are cluster-wide
        (`role` null). `sync` and `derive` add four series per connection aggregated at read time from the job tables
        (`sync.runs`, `sync.failures`, `sync.duration_ms`, `sync.rate_limited`; `derive.runs`, `derive.failures`, `derive.duration_ms`,
        `derive.rows_written`), by the bucket in which the job ended; a `failures` / `rate_limited` series that never left zero is
        absent (absent = 0). `requests` keeps the `*` total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range
        (count, p50, p95). A DELTA series' `avg` is the bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or
        PERCENTILE series' `avg` is the n-weighted mean and `max` the largest sample. `historyFrom` is the oldest instant the range can
        actually hold: the first sampler boot for the sampled groups, the oldest ended job or DERIVE run still retained for `sync` and
        `derive` (a fresh install, or job retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, sync, derive, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
      description: >-
        A previously received report `ETag` (or a list of them, or `*`). A weak match answers `304` without running the report.
        Evaluated only after authentication and request validation: a malformed request is still `400`, never `304`.
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    Q:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Free-text substring filter (case- and accent-insensitive) — API-LIST-005.

    # The shared report filter parameters (`reports/ReportFilter.kt`), `$ref`'d by the report paths
    # (each path lists the ones it accepts).
    ReportFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
      description: >-
        Period start, inclusive, in the configured zone. Defaults to 90 days before `to` (or today).
        Mutually exclusive with `lastSprints`/`sprintId`. Under the history horizon (`meta.historyHorizon`) a `from` before the horizon's
        first day is clamped to it (`meta.from` tells); a period lying entirely before it is a `400`.
    ReportTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
      description: >-
        Period end, inclusive, in the configured zone. Defaults to today. Must not be before `from`; the span must not exceed 1100 days.
        A `to` before the history horizon's first day (`meta.historyHorizon.from`) is a `400`: the period lies entirely before it.
    ReportLastSprints:
      name: lastSprints
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 52 }
      description: >-
        Each team's own last N closed sprints (union at unit level); a sprint completed before the history horizon is not counted.
        Mutually exclusive with `from`/`to`/`sprintId`.
    ReportSprintId:
      name: sprintId
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
      description: >-
        One specific sprint's own period. Mutually exclusive with `from`/`to`/`lastSprints`. A sprint completed before the history
        horizon's first day is a `400`, like an unknown one.
    ReportTeamId:
      name: teamId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: >-
        Sets the level to TEAM (groups by user); `0` is the UNASSIGNED bucket. Combined with `accountId`, sets the level to USER.
        Required unless `domain` selects the scope (`epicId` on epic progress): a report is read per team or per domain, never for the
        whole unit; a request with neither is `400`.
    ReportTeamIdRequired:
      name: teamId
      in: query
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
      description: >-
        The team (required: this report carries no domain slice, so a request without `teamId` is `400`). Sets the level to TEAM (groups by
        user); `0` is the UNASSIGNED bucket. Combined with `accountId`, sets the level to USER.
    ReportEpicId:
      name: epicId
      in: query
      required: false
      schema: { type: string }
      description: >-
        One epic's issue key (as `issueKey` lists it, e.g. `FLO-33`) — selects epic progress at level EPIC.
        Mutually exclusive with `domain` and `teamId`; one of the three is required on epic progress.
    ReportEpicProgressBasis:
      name: basis
      in: query
      required: false
      schema: { type: string, enum: [PERIOD, CUMULATIVE] }
      description: >-
        Epic progress only: what the `series` (and its `pvOriginal`) is measured over. `CUMULATIVE` sums from the
        beginning of time; `PERIOD` rebases every point to what was planned, earned and spent inside the period. Defaults
        per level — CUMULATIVE at EPIC, PERIOD at DOMAIN and TEAM; the effective value is echoed as `basis`.
        An unknown value is `400`.
    ReportTrendWindowDays:
      name: trendWindowDays
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 7, maximum: 182, default: 28 }
      description: >-
        Epic progress only: the trailing window (days) each `trend` point's SPI and CPI are measured over. Outside
        `7..182` or not an integer is `400`.
    ReportAccountIds:
      name: accountId
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        maxItems: 8
        items: { type: string }
      description: Repeated — one to eight distinct Jira account ids; sets the level to USER. Requires `teamId`.
    ReportComparePeopleAccountIds:
      name: accountId
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: string }
      description: >-
        Repeated — exactly two distinct Jira account ids (the first is side A, the second side B; on the drill, the same two as on
        the parent report). Duplicates collapse before the count, so `a, a` is one person (400), and `a, b, a` is two.
    ReportPersonTrendFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
      description: >-
        Range start, inclusive, in the configured zone: the oldest day a point may sit on (the first window reaches 89 days before it).
        Defaults to 364 days before `to` (a 365-day range, 27 points). `to` minus `from` must not exceed 1099 days (a span of 1100 days
        counting both ends, 79 points). Person trend takes no `lastSprints` or `sprintId`.
    ReportPersonTrendAccountId:
      name: accountId
      in: query
      required: true
      schema: { type: string }
      description: One Jira account id — the person whose trend it is. Repeating the key is a 400; there is no `teamId`.
    ReportAccountId:
      name: accountId
      in: query
      required: false
      schema: { type: string }
      description: One Jira account id — sets the level to USER. Requires `teamId`.
    ReportDomainView:
      name: domainView
      in: query
      required: false
      schema: { type: string, enum: [TASK, EPIC] }
      description: D3's two domain views ("delivered in" vs. "earned in"). Defaults per report.
    ReportDomain:
      name: domain
      in: query
      required: false
      schema: { type: string }
      description: >-
        Restricts to one domain key. Without `teamId` it is the scope: a UNIT-level read of that domain, grouped by team.
    ReportDomainRequired:
      name: domain
      in: query
      required: true
      schema: { type: string }
      description: The domain key (required; a missing or unknown one is `400`).
    ReportActivityType:
      name: activityType
      in: query
      required: false
      schema: { type: string }
      description: Restricts to one activity type (a standard Jira issue type name).
    ReportWorkCategory:
      name: workCategory
      in: query
      required: false
      schema: { type: string }
      description: Restricts to one work category, or the literal `UNCATEGORIZED`.
    ReportConnectionId:
      name: connectionId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: Restricts to one data source's own connection. Defaults to every enabled, active connection.
    ReportCodeConnectionId:
      name: connectionId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: >-
        Restricts to one ACTIVE GitLab data source (a Jira, deleted or unknown id is `400`). Defaults to every active GitLab data
        source, a disabled one included.
    ReportTailPercent:
      name: tailPercent
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0, maximum: 25, default: 5 }
      description: >-
        On a report whose response carries a `Distribution`: the share (percent) of the largest values folded into the
        histogram's one final OPEN bucket (`to: null`), so a few far outliers do not stretch every equal-width bucket.
        `0` keeps the plain equal-width histogram; only the histogram changes, never `n`, `mean`, `min`, `max` or the
        percentiles. Outside `0..25` or not an integer is `400`.
    ReportBucket:
      name: bucket
      in: query
      required: false
      schema: { type: string, enum: [WEEK, MONTH], default: WEEK }
      description: The time resolution of a report's bucketed series; weeks start Monday, buckets in the configured zone.
    ReportDrillSegmentAccountId:
      name: segmentAccountId
      in: query
      required: false
      schema: { type: string }
      description: Narrows a drill list (and its bar) to ONE person's share of a stacked bar; USER level only, one of the picked `accountId`s (400 otherwise).
    ReportDrillEpicSegment:
      name: epicSegment
      in: query
      required: false
      schema: { type: string }
      description: >-
        Narrows a sprint-scope drill list (and its bar) to ONE epic segment of a by-epic chart (Commitments' / Throughput's / Costs' `byEpic[].key`):
        an epic's issue id, `NO_EPIC` (items without an epic) or `OTHER_EPICS` (every epic outside the chart's top 6, which needs
        `topEpicId`). The item's epic is its current one (`dim_task.epic_id`; on Costs a worklog's, see `GET /api/v1/reports/costs`). Anything else is a 400.
    ReportDrillTopEpicId:
      name: topEpicId
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 6
        items: { type: integer, format: int64, minimum: 1 }
      description: >-
        With `epicSegment=OTHER_EPICS` only (required there, a 400 otherwise): the chart's own top epics (the `epicId`s of its
        `byEpic` segments, 1 to 6 distinct, digits only -- a sign is a 400, duplicates collapse), i.e. the epics that are NOT in the folded "Other" segment. The ranking runs over the parent
        report's whole period, which a one-sprint drill cannot recompute, so the client names them.
    ReportDrillBucketIndex:
      name: bucketIndex
      in: query
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
      description: The bar of a histogram drill, 0-based into the chosen distribution's `histogram` (the open tail bucket last). Outside the histogram is a 400.
    ReportWipBy:
      name: by
      in: query
      required: false
      schema: { type: string, enum: [STATUS, STAGE, COLUMN], default: STAGE }
      description: What the WIP report keys its counts by; COLUMN needs a `teamId` with a mapped board.
    ReportWipItemKind:
      name: itemKind
      in: query
      required: false
      schema: { type: string, enum: [TASK, EPIC], default: TASK }
      description: Which items the WIP report counts — level-0 tasks (default) or epics (a different grain); never both summed.
    ReportBlockedItemKind:
      name: itemKind
      in: query
      required: false
      schema: { type: string, enum: [TASK, EPIC, BOTH], default: TASK }
      description: Which DONE items the blocked-time report counts — level-0 tasks (default), epics (a different grain), or both.
  headers:
    ReportETag:
      description: >-
        The weak validator (`W/"…"`) of this report answer: a hash of the request (route and canonical query) and a data stamp
        read BEFORE the report runs — see `.claude/docs/reports.md` "Cache validators". Send it back as `If-None-Match`.
      schema: { type: string }
    ReportCacheControl:
      description: >-
        Always `no-store`: no browser or proxy cache may keep the answer. The `ETag` serves a client that sends `If-None-Match` itself.
      schema: { type: string }

  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotModified:
      description: >-
        The report's `ETag` is listed in `If-None-Match` (weak comparison): the figures did not change, nothing was computed,
        and there is no body. (`If-None-Match: *` also answers `304`, but only after the report ran successfully, with its body
        dropped.) Carries the same `ETag` and `Cache-Control` as the 200 would.
      headers:
        ETag: { $ref: '#/components/headers/ReportETag' }
        Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a report
        endpoint (`/api/v1/reports/**`) the per-USER report bucket is exhausted (the same generic
        detail; `REPORT_RATE_LIMIT_PER_MINUTE`, 120/min in production), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), or, on /login, the
        per-account lockout is active (account-specific detail). All carry a ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ReportDrillItemsOk:
      description: The items behind the bar
      headers:
        ETag: { $ref: '#/components/headers/ReportETag' }
        Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReportDrillItems' }
    InternalServerError:
      description: >-
        Unexpected server error. On a `reports` operation the same `500` also answers a selection that exceeded the
        report query's time budget (the `detail` says the query exceeded its time budget — narrow the selection and
        retry); a fault and a timeout are told apart by that `detail` only.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/FlowUserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    FlowUserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V18) — set at
        create, changed only via PUT /flow-users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    FlowUserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    FlowUserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    FlowUserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/FlowUserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    FlowUserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/FlowUserRole' }

    FlowUserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/FlowUserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    FlowUserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlowUserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a Flow user; must be active (`400` otherwise). The manager and the
            administrators may edit the team's capacity.
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a Flow user; must be active (`400` otherwise). The manager and the
            administrators may edit the team's capacity. Omitted on PUT (a full replace) = no manager.
    TeamResponse:
      type: object
      required: [id, name, managerUserId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerUserId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerUserId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerUserId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    JiraConnectionRequest:
      type: object
      required: [siteUrl, email, projectKeys]
      properties:
        siteUrl:
          type: string
          maxLength: 253
          description: >-
            Exactly `https://<site>.atlassian.net` — origin only, no path/query/trailing slash
            (the outbound allow-list boundary). Fixed at create; a PUT changing it is `409`.
        email:
          type: string
          maxLength: 254
          description: The Jira service-account email.
        apiToken:
          type: string
          maxLength: 1000
          nullable: true
          description: >-
            Write-only. Required (non-blank) on create. On update, omitted OR blank keeps the
            current token (the SPA's masked-password field sends an empty string for
            "unchanged"); any other value rotates it. Never echoed back in any response.
        projectKeys:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}$' }
        authScheme:
          $ref: '#/components/schemas/JiraAuthScheme'
    JiraAuthScheme:
      type: string
      enum: [BASIC, BEARER]
      default: BASIC
    DataSourceKind:
      type: string
      enum: [JIRA_CLOUD, GITLAB]
      description: The connector kind; fixed at create by which request block is present.
    GitLabConnectionRequest:
      type: object
      required: [baseUrl, groupPaths]
      properties:
        baseUrl:
          type: string
          maxLength: 300
          description: >-
            The GitLab instance origin, `https://host[:port]` (no path, query, fragment or credentials; a trailing `/` is dropped).
            It must be on the operator's `GITLAB_ALLOWED_HOSTS`, or the development stub's origin. Stored canonical; fixed at
            create (a PUT naming another origin is `409`).
        token:
          type: string
          maxLength: 1000
          nullable: true
          description: >-
            Write-only personal access token, sent as `PRIVATE-TOKEN`; Flow needs `read_api` only and refuses a token with any scope that does not
            start with `read_` (`api`, `sudo`, `write_*`, `create_runner`, ...), `admin_mode` aside (an Admin-Mode instance needs it for emails). Required (non-blank) on create. On update, omitted OR blank keeps the current token; any
            other value rotates it. Never echoed back in any response.
        groupPaths:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 255 }
          description: >-
            Full group paths whose projects (subgroups included, archived and shared ones not) are read. Trimmed, stripped of
            leading/trailing `/`, lowercased and de-duplicated before validation (so the request accepts any case); each normalised path must then be
            `/`-separated segments of `[a-z0-9_][a-z0-9_.-]*` (else `400`), and none may equal or nest in another.
        pathExclusions:
          type: array
          maxItems: 100
          nullable: true
          items: { type: string, minLength: 1, maxLength: 255 }
          description: >-
            Gitignore-like globs of files whose lines a commit does not count. A pattern without `/` matches the file name at any depth
            (`package-lock.json`, `*.min.js`); one with `/` matches the whole path (`**` crosses `/`, `*` and `?` stay inside a segment,
            `[...]` is a class); case-sensitive. Trimmed and de-duplicated, order kept; each must be a valid glob (else `400`).
            Omitted or null on create = the built-in defaults (`GET /data-sources/kinds`), which the source then keeps following; omitted
            or null on update = unchanged; a list replaces the stored one and an empty list excludes nothing. Applied when commits are
            processed into the code layer (a later release), never at fetch: until then the list is stored and echoed only.
    GitLabConnectionResponse:
      type: object
      required: [baseUrl, hasToken, groupPaths, pathExclusions]
      properties:
        baseUrl: { type: string }
        hasToken:
          type: boolean
          description: The token itself is never returned.
        groupPaths:
          type: array
          items: { type: string }
        pathExclusions:
          type: array
          items: { type: string }
          description: >-
            The EFFECTIVE path-exclusion globs: the stored list, or the built-in defaults while the source never set its own. Not applied
            until commits are processed into the code layer (a later release).
    DataSourceRequest:
      type: object
      required: [name, syncIntervalMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean, default: true }
        syncIntervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        backfillFrom:
          type: string
          format: date
          nullable: true
          description: >-
            ISO date (YYYY-MM-DD), not in the future and not more than 10 years back (nor before
            2000-01-01), and not before the history horizon's first day (`historyHorizonFrom` on
            the metrics settings; an update that leaves the stored date unchanged is exempt).
            Omitted or null takes today minus 24 months, or that first day when it is later (the horizon
            only floors the default, it never widens it).
        reconcileHourUtc: { type: integer, minimum: 0, maximum: 23, default: 3 }
        jira:
          allOf: [{ $ref: '#/components/schemas/JiraConnectionRequest' }]
          nullable: true
          description: The Jira Cloud connection. Exactly one of `jira` and `gitlab` must be present (else `400`); it sets the kind.
        gitlab:
          allOf: [{ $ref: '#/components/schemas/GitLabConnectionRequest' }]
          nullable: true
          description: The self-managed GitLab connection. Exactly one of `jira` and `gitlab` must be present (else `400`); it sets the kind.
    JiraConnectionResponse:
      type: object
      required: [siteUrl, email, hasApiToken, projectKeys, authScheme]
      properties:
        siteUrl: { type: string }
        email: { type: string }
        hasApiToken:
          type: boolean
          description: The token itself is never returned.
        projectKeys:
          type: array
          items: { type: string }
        authScheme:
          $ref: '#/components/schemas/JiraAuthScheme'
        cloudId:
          type: string
          nullable: true
          description: Resolved on the first successful probe/sync (not populated by this commit's CRUD).
    DataSourceState:
      type: string
      enum: [NEVER_SYNCED, CURRENT, STALE, FAILED, DISABLED]
    DataSourceStatus:
      type: object
      required: [state, consecutiveFailures, limitTrips, reconcileLimitTrips]
      properties:
        state:
          $ref: '#/components/schemas/DataSourceState'
        lastSyncStartedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        lastSyncSucceededAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        lastSyncErrorCode: { type: string, nullable: true }
        consecutiveFailures: { type: integer, minimum: 0 }
        runningJobId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The connection's currently RUNNING sync job, if any.
        pausedAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            Epoch millis the ceiling-trip pause began; null while scheduled syncing is not paused. A paused connection gets no
            scheduled SYNC (its RECONCILE continues, unless it has a pause of its own) until an ADMIN's "Sync now" (`POST .../sync-jobs` with `SYNC`) or a PUT lifts it.
        pauseReason:
          type: string
          nullable: true
          description: >-
            Why it paused - the constant code of the trip that reached the threshold (`LIMIT_EXCEEDED` or `TIME_EXCEEDED`); set
            exactly when `pausedAt` is. A closed vocabulary (the database enforces it; no OpenAPI `enum`, whose nullable form the
            conformance validator rejects against an explicit `null`).
        limitTrips:
          type: integer
          minimum: 0
          description: >-
            Consecutive SYNCs that stopped at a ceiling without storing a change (in the tripping stream for a limit, anywhere in the run for the wall clock). Reset by a succeeded SYNC, "Sync now" and a PUT;
            the connection pauses when it reaches `ingest.pauseAfterLimitTrips`.
        reconcilePausedAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            Epoch millis the RECONCILE ceiling-trip pause began; null while scheduled RECONCILE is not paused. A connection with a
            RECONCILE pause gets no scheduled RECONCILE (its SYNC continues) until an ADMIN's "Reconcile now" (`POST .../sync-jobs`
            with `RECONCILE`) or a PUT lifts it. Independent of `pausedAt`.
        reconcilePauseReason:
          type: string
          nullable: true
          description: >-
            Why RECONCILE paused - the constant code of the trip that reached the threshold (`LIMIT_EXCEEDED` or `TIME_EXCEEDED`);
            set exactly when `reconcilePausedAt` is. Closed vocabulary, like `pauseReason`.
        reconcileLimitTrips:
          type: integer
          minimum: 0
          description: >-
            Consecutive RECONCILEs that stopped at a ceiling without storing a durable change (a tombstone or an index-gap upsert after
            the id sweep; the sweep's scratch pages are no change). A trip that did store one resets the count. Also reset by a
            succeeded RECONCILE, "Reconcile now" and a PUT; RECONCILE pauses when it reaches `ingest.pauseAfterLimitTrips`.
    DataSourceResponse:
      type: object
      required:
        - id
        - kind
        - name
        - enabled
        - syncIntervalMinutes
        - backfillFrom
        - reconcileHourUtc
        - configRevision
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kind:
          $ref: '#/components/schemas/DataSourceKind'
        name: { type: string }
        enabled: { type: boolean }
        syncIntervalMinutes: { type: integer }
        backfillFrom: { type: string, format: date }
        reconcileHourUtc: { type: integer }
        configRevision: { type: integer, format: int64 }
        jira:
          allOf: [{ $ref: '#/components/schemas/JiraConnectionResponse' }]
          nullable: true
          description: Present exactly for a `JIRA_CLOUD` data source, null otherwise.
        gitlab:
          allOf: [{ $ref: '#/components/schemas/GitLabConnectionResponse' }]
          nullable: true
          description: Present exactly for a `GITLAB` data source, null otherwise.
        status:
          $ref: '#/components/schemas/DataSourceStatus'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DataSourcePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    DataSourceKindInfo:
      type: object
      required: [kind, enabled, allowedOrigins, defaultPathExclusions]
      properties:
        kind:
          $ref: '#/components/schemas/DataSourceKind'
        enabled:
          type: boolean
          description: Whether a data source of this kind can be created on this server.
        defaultPathExclusions:
          type: array
          items: { type: string }
          description: >-
            The path-exclusion globs a source of this kind follows until it sets its own (GitLab's built-ins; empty for Jira Cloud). The
            editor prefills and restores them; they are not applied until commits are processed into the code layer (a later release).
        allowedOrigins:
          type: array
          items: { type: string }
          description: >-
            The origins a `baseUrl` of this kind may name (`https://host[:port]`); empty for Jira Cloud (its allow-list is the
            Atlassian site shape) and for a disabled kind.
    DataSourceKindsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceKindInfo'
    DataSourceTestRequest:
      type: object
      description: Exactly one of `jira` and `gitlab` must be present (else `400`); the token inside it is required.
      properties:
        jira:
          allOf: [{ $ref: '#/components/schemas/JiraConnectionRequest' }]
          nullable: true
        gitlab:
          allOf: [{ $ref: '#/components/schemas/GitLabConnectionRequest' }]
          nullable: true
    ConnectionTestRow:
      type: object
      required: [name, path, required, ok]
      properties:
        name: { type: string, description: "The probe's short identifier (e.g. myself, project_statuses:ENG)." }
        path: { type: string, description: The endpoint path probed. }
        required: { type: boolean, description: Whether a real sync depends on this endpoint. }
        ok: { type: boolean }
        status: { type: integer, nullable: true, description: "The upstream HTTP status, when the probe ran." }
        code:
          type: string
          nullable: true
          description: A `FetchException` code on failure (e.g. `AUTHENTICATION_FAILED`, `FORBIDDEN_SCOPE`).
        scopeHint:
          type: string
          nullable: true
          description: The Jira OAuth/API-token scope this endpoint likely needs, for a failed optional/required row.
    ConnectionTestResult:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionTestRow'
        cloudId:
          type: string
          nullable: true
          description: Jira only - resolved once the `tenant_info` probe succeeds; null for a GitLab result.

    SyncJobKind:
      type: string
      enum: [SYNC, RECONCILE, REPROCESS, PURGE, DERIVE]
    SyncJobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    SyncJobRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/SyncJobKind'
          description: "`PURGE` is internal-only and rejected here with `400`."
    SyncJobResponse:
      type: object
      required:
        - id
        - connectionId
        - kind
        - status
        - priority
        - configRevision
        - requestedAt
        - attempt
        - maxAttempts
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        kind:
          $ref: '#/components/schemas/SyncJobKind'
        status:
          $ref: '#/components/schemas/SyncJobStatus'
        priority: { type: integer, description: "0 manual, 10 scheduler-enqueued." }
        requestedByUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Null for scheduler-enqueued jobs.
        configRevision: { type: integer, format: int64 }
        requestedAt: { type: integer, format: int64, description: Epoch millis }
        notBefore:
          type: integer
          format: int64
          nullable: true
          description: >-
            Epoch millis. Set only on a configuration-caused `DERIVE` that is debounced: the worker does not claim the job
            before this time, and a further configuration edit pushes it out. A `PENDING` job with a future `notBefore` is
            scheduled, not stuck or failed. Null (due at once) for every other job.
        startedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        finishedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        leaseUntil: { type: integer, format: int64, nullable: true, description: Epoch millis }
        heartbeatAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        cancelRequestedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        currentStream: { type: string, nullable: true }
        progress:
          type: object
          nullable: true
          additionalProperties: true
        errorCode: { type: string, nullable: true }
        errorDetail: { type: string, nullable: true }
    SyncJobPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncJobResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    SyncJobActionResult:
      type: object
      required: [job, coalesced]
      properties:
        job:
          $ref: '#/components/schemas/SyncJobResponse'
        coalesced:
          type: boolean
          description: True when an already-open job for the same (connection, kind) was returned instead of a new one.

    SyncCursorSummary:
      type: object
      required: [stream, position]
      properties:
        stream: { type: string, description: "The stream's `sync_cursors.stream` key (e.g. issues, reference, reconcile)." }
        watermarkAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        position:
          type: string
          description: >-
            The stream's own raw persisted cursor JSON — an opaque, per-stream-owned diagnostic
            string, not reparsed here.
        lastCompletedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
    GitLabSyncCounts:
      type: object
      required: [projects, projectsMovedOut, projectsDeleted, users, usersDeleted, commits, commitsMerge, commitsDeleted, commitFilesPending, mergeRequests, mergeRequestsMerged, mrEvents, mrDetailsPending, mrDiffStatsMissing, mergeRequestsDeleted, mrDetailsUnread]
      properties:
        projects: { type: integer, format: int64, minimum: 0, description: Live projects of the configured groups. }
        projectsMovedOut: { type: integer, format: int64, minimum: 0, description: Projects no longer listed under any configured group (rows kept). }
        projectsDeleted: { type: integer, format: int64, minimum: 0, description: Projects marked deleted by a reconcile. }
        users: { type: integer, format: int64, minimum: 0, description: Live users of the instance. }
        usersDeleted: { type: integer, format: int64, minimum: 0, description: Users no longer listed. }
        commits: { type: integer, format: int64, minimum: 0, description: Live default-branch commits (merge commits included). }
        commitsMerge: { type: integer, format: int64, minimum: 0, description: "Live merge commits (two or more parents), a subset of `commits`." }
        commitsDeleted: { type: integer, format: int64, minimum: 0, description: Commits tombstoned because they left the default branch (rows kept). }
        commitFilesPending: { type: integer, format: int64, minimum: 0, description: Live non-merge commits whose per-file diff has not been read yet. }
        mergeRequests: { type: integer, format: int64, minimum: 0, description: "Live merge requests of the configured groups' projects." }
        mergeRequestsMerged: { type: integer, format: int64, minimum: 0, description: "Live merge requests in the merged state, a subset of `mergeRequests`." }
        mrEvents: { type: integer, format: int64, minimum: 0, description: "Stored review events: notes as action codes, approvals and reviewer states." }
        mrDetailsPending: { type: integer, format: int64, minimum: 0, description: "Live merge requests whose notes, approvals, reviewers and diff stats are not read yet, or are older than the merge request's last change." }
        mrDiffStatsMissing: { type: integer, format: int64, minimum: 0, description: "Live merge requests whose details were read but whose diff stats GraphQL did not answer." }
        mergeRequestsDeleted: { type: integer, format: int64, minimum: 0, description: "Merge requests marked deleted by a reconcile (rows and events kept)." }
        mrDetailsUnread: { type: integer, format: int64, minimum: 0, description: "Live merge requests of live projects whose details could not be read: the notes answered 404, a page was over the response ceiling, or the read kept failing (`NOT_FOUND` / `LIMIT_EXCEEDED` / `FETCH_FAILED`)." }
    SyncCounts:
      type: object
      description: >-
        Raw-layer row counts. For a `GITLAB` connection the Jira integers are 0 and `gitlab` carries its counts (null when this
        process has no GitLab store, i.e. the kind is off here).
      required: [rawIssues, tombstonedDeleted, tombstonedMovedOut, changelogs, worklogs, entitiesByKind, needsProcessing]
      properties:
        gitlab:
          allOf: [{ $ref: '#/components/schemas/GitLabSyncCounts' }]
          nullable: true
        rawIssues: { type: integer, format: int64, minimum: 0 }
        tombstonedDeleted: { type: integer, format: int64, minimum: 0 }
        tombstonedMovedOut: { type: integer, format: int64, minimum: 0 }
        changelogs: { type: integer, format: int64, minimum: 0 }
        worklogs: { type: integer, format: int64, minimum: 0, description: Live (non-tombstoned) worklogs. }
        entitiesByKind:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        needsProcessing: { type: integer, format: int64, minimum: 0 }
    SyncStatusResponse:
      type: object
      required: [connection, cursors, counts, lastJobs]
      properties:
        connection:
          $ref: '#/components/schemas/DataSourceResponse'
        cursors:
          type: array
          items:
            $ref: '#/components/schemas/SyncCursorSummary'
        counts:
          $ref: '#/components/schemas/SyncCounts'
        lastJobs:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SyncJobResponse' }
          description: Keyed by SyncJobKind name — the most recent job of each kind ever requested for this connection.
        currentJob:
          allOf: [{ $ref: '#/components/schemas/SyncJobResponse' }]
          nullable: true
          description: >-
            The connection's open job — the RUNNING job if any, else the PENDING one the worker would claim first (just
            requested, or released back to the queue); null when nothing is open. `connection.status.runningJobId` stays RUNNING-only.

    NormalizedStatusInterval:
      type: object
      required: [seq, statusId, statusName, category, fromAtMs, source]
      properties:
        seq: { type: integer, format: int32, minimum: 1 }
        statusId: { type: string }
        statusName: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        fromAtMs: { type: integer, format: int64, description: Epoch millis }
        toAtMs: { type: integer, format: int64, nullable: true, description: "Epoch millis; null means the open (current) interval." }
        source:
          type: string
          enum: [CREATED, CHANGE]
    NormalizedFieldInterval:
      type: object
      required: [field, seq, fromAtMs]
      properties:
        field:
          type: string
          enum: [ASSIGNEE, SPRINT, FLAGGED, PARENT]
        seq: { type: integer, format: int32, minimum: 1 }
        valueId: { type: string, nullable: true }
        valueText: { type: string, nullable: true }
        fromAtMs: { type: integer, format: int64, description: Epoch millis }
        toAtMs: { type: integer, format: int64, nullable: true }
    StatusCategory:
      type: string
      enum: [TODO, IN_PROGRESS, DONE, UNKNOWN]
    RawIssueWorkItem:
      type: object
      required: [issueKey, projectKey, issueType, statusId, statusName, statusCategory, processedAt, processingVersion]
      properties:
        issueKey: { type: string }
        projectKey: { type: string }
        issueType: { type: string }
        statusId: { type: string }
        statusName: { type: string }
        statusCategory: { $ref: '#/components/schemas/StatusCategory' }
        assigneeAccountId: { type: string, nullable: true }
        hierarchyLevel:
          type: integer
          format: int32
          nullable: true
          description: An epic is level 1, from the REFERENCE stream's ISSUE_TYPE entities — never "type name = Epic".
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis at start of day UTC (the system duedate field). }
        customFields:
          type: object
          additionalProperties: true
          description: Every non-null `customfield_*` current value, keyed by field id — never filtered.
        processedAt: { type: integer, format: int64, description: Epoch millis }
        processingVersion: { type: integer, format: int32 }
        deletedAt: { type: integer, format: int64, nullable: true }
        movedOutAt: { type: integer, format: int64, nullable: true }
    RawIssueInspection:
      type: object
      required: [issueId, issueKey, fetchedAt, changedAt, sha256, needsProcessing, payload]
      properties:
        issueId: { type: integer, format: int64 }
        issueKey: { type: string }
        fetchedAt: { type: integer, format: int64, description: Epoch millis }
        changedAt: { type: integer, format: int64, description: Epoch millis }
        sha256: { type: string }
        deletedAt: { type: integer, format: int64, nullable: true }
        movedOutAt: { type: integer, format: int64, nullable: true }
        needsProcessing: { type: boolean }
        payload:
          type: object
          additionalProperties: true
          description: The stored, trimmed issue document (canonicalized), without comment, description, attachment and embedded worklog copy, and with users reduced to id, name and type.
        changelogs:
          type: array
          items: { type: object, additionalProperties: true }
          description: Every stored changelog history for this issue, oldest first, as stored (trimmed, author reduced to id, name and type, description-edit and remote-link items removed).
        worklogs:
          type: array
          items: { type: object, additionalProperties: true }
          description: This issue's non-tombstoned worklogs as stored (trimmed, without `self` and `comment`, authors reduced to id, name and type).
        workItem:
          allOf: [{ $ref: '#/components/schemas/RawIssueWorkItem' }]
          nullable: true
          description: Null until this issue has been through PROCESS at least once.
        statusIntervals:
          type: array
          items: { $ref: '#/components/schemas/NormalizedStatusInterval' }
        fieldIntervals:
          type: array
          items: { $ref: '#/components/schemas/NormalizedFieldInterval' }
        anomalies:
          type: array
          items: { type: string, enum: [STATUS_CHANGE_BEFORE_CREATED, STATUS_CHAIN_BROKEN, STATUS_MISMATCH_WITH_CURRENT] }

    DataProfileRange:
      type: object
      required: [earliestCreatedAt, latestUpdatedAt]
      properties:
        earliestCreatedAt: { type: integer, format: int64, description: Epoch millis }
        latestUpdatedAt: { type: integer, format: int64, description: Epoch millis }
    ProjectProfile:
      type: object
      required: [projectKey, issueCounts]
      properties:
        projectKey: { type: string }
        issueCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by issue type name.
    WorkflowStatusProfile:
      type: object
      required: [statusId, name, category, transitionCount]
      properties:
        statusId: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        transitionCount:
          type: integer
          format: int64
          minimum: 0
          description: How many status-interval transitions INTO this status this project×type's own issues recorded.
    WorkflowProfile:
      type: object
      required: [projectKey, issueType, observedStatuses, referenceStatusNames]
      properties:
        projectKey: { type: string }
        issueType: { type: string }
        observedStatuses:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStatusProfile' }
        referenceStatusNames:
          type: array
          items: { type: string }
          description: This project's own workflow for this issue type, from Jira's `project/{key}/statuses`.
    BoardColumnProfile:
      type: object
      required: [name, statusNames]
      properties:
        name: { type: string }
        statusNames:
          type: array
          items: { type: string }
    BoardProfile:
      type: object
      required: [boardId, name, boardType, columns, unmappedStatusNames]
      properties:
        boardId: { type: integer, format: int64 }
        name: { type: string }
        boardType: { type: string }
        projectKey: { type: string, nullable: true }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumnProfile' }
        unmappedStatusNames:
          type: array
          items: { type: string }
          description: Statuses observed on this board's project that map to no column.
    CustomFieldProfile:
      type: object
      required: [id, name, type, nonNullCount, fillPercent, role]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: Jira's own `schema.type` for this field. }
        nonNullCount: { type: integer, format: int64, minimum: 0 }
        fillPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        role:
          type: string
          enum: [SPRINT, RANK, TEAM, STORY_POINTS, FLAGGED, OTHER]
    EstimatesProfile:
      type: object
      required: [totalIssues, storyPointsCount, storyPointsPercent, originalEstimateCount, originalEstimatePercent]
      properties:
        totalIssues: { type: integer, format: int64, minimum: 0 }
        storyPointsCount: { type: integer, format: int64, minimum: 0 }
        storyPointsPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        originalEstimateCount: { type: integer, format: int64, minimum: 0 }
        originalEstimatePercent: { type: number, format: double, minimum: 0, maximum: 100 }
    WorklogsProfile:
      type: object
      required: [count, totalHours, itemsWithWorklog, itemsWithWorklogPercent, authorCount]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        totalHours: { type: number, format: double, minimum: 0 }
        itemsWithWorklog: { type: integer, format: int64, minimum: 0 }
        itemsWithWorklogPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        authorCount: { type: integer, format: int64, minimum: 0 }
    ReopensProfile:
      type: object
      required: [count, totalIssues, percent]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        totalIssues: { type: integer, format: int64, minimum: 0 }
        percent: { type: number, format: double, minimum: 0, maximum: 100 }
    SprintsProfile:
      type: object
      required: [count, stateCounts, itemsWithSprint, itemsWithSprintPercent, carryOverCount, carryOverPercent]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        stateCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        itemsWithSprint: { type: integer, format: int64, minimum: 0 }
        itemsWithSprintPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        carryOverCount: { type: integer, format: int64, minimum: 0 }
        carryOverPercent: { type: number, format: double, minimum: 0, maximum: 100 }
    PeopleProfile:
      type: object
      required: [activeAssignees, unassignedPercent]
      properties:
        activeAssignees: { type: integer, format: int64, minimum: 0 }
        unassignedPercent: { type: number, format: double, minimum: 0, maximum: 100 }
    GitLabProjectsProfile:
      type: object
      required: [live, movedOut, deleted, archived]
      description: The GitLab projects by marker. `live` is neither moved out nor deleted; `archived` counts among the live ones.
      properties:
        live: { type: integer, format: int64, minimum: 0 }
        movedOut: { type: integer, format: int64, minimum: 0 }
        deleted: { type: integer, format: int64, minimum: 0 }
        archived: { type: integer, format: int64, minimum: 0 }
    GitLabCommitsProfile:
      type: object
      required: [count, merges, filesPending, filesUnavailable, filesCapped, commitsWithCounts]
      description: The live commits. `count` is non-merge commits; the commit-time range covers all live commits.
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        merges: { type: integer, format: int64, minimum: 0 }
        earliestCommittedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null when there is no live commit." }
        latestCommittedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null when there is no live commit." }
        filesPending: { type: integer, format: int64, minimum: 0, description: "Commits whose diff has not been read yet (the COMMIT FILES backlog)." }
        filesUnavailable: { type: integer, format: int64, minimum: 0, description: "Live commits whose diff ended in a terminal error." }
        filesCapped: { type: integer, format: int64, minimum: 0, description: "Non-merge commits with more files than were stored (the first 1,000)." }
        commitsWithCounts: { type: integer, format: int64, minimum: 0, description: "Non-merge commits whose counted lines (after the path exclusions) are known." }
    GitLabMergeRequestsProfile:
      type: object
      required: [byState, withDiffStats, withDiffStatsPercent, detailsPending, detailsUnreadable, withIssueKeyCandidates, issueKeyCandidates]
      description: The live merge requests.
      properties:
        byState:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by GitLab's merge request state (`opened`, `merged`, `closed`, `locked`).
        withDiffStats: { type: integer, format: int64, minimum: 0, description: "Merge requests whose diff stats are not a gap." }
        withDiffStatsPercent: { type: number, format: double, minimum: 0, maximum: 100, description: "One decimal." }
        detailsPending: { type: integer, format: int64, minimum: 0, description: "Merge requests whose details (events, stats) are stale." }
        detailsUnreadable: { type: integer, format: int64, minimum: 0, description: "Merge requests whose details read ended in a terminal error." }
        withIssueKeyCandidates: { type: integer, format: int64, minimum: 0, description: "Merge requests whose title or source branch names at least one Jira issue-key CANDIDATE (a KEY-123 token); candidates are not yet matched to a Jira task." }
        issueKeyCandidates: { type: integer, format: int64, minimum: 0, description: "The distinct (merge request, key) candidate rows of the live merge requests, junk tokens (UTF-8, V2-3) included; not yet matched to a Jira task." }
    GitLabEventsProfile:
      type: object
      required: [byKind]
      description: The review events of the live merge requests.
      properties:
        byKind:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by event kind (`COMMENT`, `DIFF_COMMENT`, `APPROVAL`, `REVIEW_REQUESTED`, `REVIEWED`, `CHANGES_REQUESTED`); every kind is present.
    GitLabIdentitiesProfile:
      type: object
      required: [users, bots, usersDeleted, usersWithEmail, usersWithEmailPercent, ghosts, emailOnly, commitsUnmatched]
      description: Counts of the people the code layer names. No name, address or key.
      properties:
        users: { type: integer, format: int64, minimum: 0, description: "Listed, live GitLab users (bots included)." }
        bots: { type: integer, format: int64, minimum: 0 }
        usersDeleted: { type: integer, format: int64, minimum: 0 }
        usersWithEmail: { type: integer, format: int64, minimum: 0, description: "Live users with at least one known address." }
        usersWithEmailPercent: { type: number, format: double, minimum: 0, maximum: 100, description: "Share of `users`, one decimal." }
        ghosts: { type: integer, format: int64, minimum: 0, description: "User ids the facts name that the users listing never returned." }
        emailOnly: { type: integer, format: int64, minimum: 0, description: "Commit author addresses matching no GitLab user." }
        commitsUnmatched: { type: integer, format: int64, minimum: 0, description: "Live non-merge commits authored by those addresses." }
    GitLabDataProfile:
      type: object
      required: [projects, commits, mergeRequests, events, identities]
      description: The GitLab section of the data profile - facts about the stored code layer, counts only.
      properties:
        projects:
          $ref: '#/components/schemas/GitLabProjectsProfile'
        commits:
          $ref: '#/components/schemas/GitLabCommitsProfile'
        mergeRequests:
          $ref: '#/components/schemas/GitLabMergeRequestsProfile'
        events:
          $ref: '#/components/schemas/GitLabEventsProfile'
        identities:
          $ref: '#/components/schemas/GitLabIdentitiesProfile'
    DataProfile:
      type: object
      required: [estimates, worklogs, reopens, sprints, people]
      properties:
        computedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null before the first PROCESS pass." }
        range:
          allOf: [{ $ref: '#/components/schemas/DataProfileRange' }]
          nullable: true
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectProfile' }
        workflows:
          type: array
          items: { $ref: '#/components/schemas/WorkflowProfile' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/BoardProfile' }
        customFields:
          type: array
          items: { $ref: '#/components/schemas/CustomFieldProfile' }
        estimates:
          $ref: '#/components/schemas/EstimatesProfile'
        worklogs:
          $ref: '#/components/schemas/WorklogsProfile'
        reopens:
          $ref: '#/components/schemas/ReopensProfile'
        sprints:
          $ref: '#/components/schemas/SprintsProfile'
        people:
          $ref: '#/components/schemas/PeopleProfile'
        anomalyCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by anomaly code (`STATUS_CHANGE_BEFORE_CREATED`/`STATUS_CHAIN_BROKEN`/`STATUS_MISMATCH_WITH_CURRENT`).
        workflowStatusIds:
          type: array
          items: { type: string }
          description: Sorted, distinct status ids across every in-scope project's reference workflow (`PROJECT_STATUSES`); empty on a profile stored before this field existed.
        schemeFieldIds:
          type: array
          nullable: true
          items: { type: string }
          description: Sorted, distinct field ids in the in-scope projects' field schemes (`PROJECT_FIELDS`, Jira's experimental `GET /projects/fields`, scope `read:field-configuration:jira`); null = unknown (no project has the entity — the optional step was skipped or never ran, or the profile predates it).
        epicWorkflowStatusIds:
          type: array
          items: { type: string }
          description: Sorted, distinct status ids of the workflows of the issue types at hierarchy level 1 (epics) across the in-scope projects; empty while the issue-type hierarchy is unknown or on a profile stored before this field existed.
        taskWorkflowStatusIds:
          type: array
          items: { type: string }
          description: Sorted, distinct status ids of the workflows of the issue types at hierarchy level 0 or below (tasks, bugs, sub-tasks; a type of unknown level counts as a task type); empty while the issue-type hierarchy is unknown or on a profile stored before this field existed.
        schemeEpicFieldIds:
          type: array
          nullable: true
          items: { type: string }
          description: The `schemeFieldIds` union restricted to the issue types at hierarchy level 1 (a project whose entity predates the split contributes its whole scheme); null under the same rule as `schemeFieldIds`.
        schemeTaskFieldIds:
          type: array
          nullable: true
          items: { type: string }
          description: The `schemeFieldIds` union restricted to the issue types at hierarchy level 0 or below (sub-tasks count with tasks; a type of unknown level counts as a task type); null under the same rule as `schemeFieldIds`.
        gitlab:
          allOf: [{ $ref: '#/components/schemas/GitLabDataProfile' }]
          nullable: true
          description: Present for a GITLAB data source once its PROFILE ran; null for a Jira source and before the first PROFILE.

    CodeIdentityDecision:
      type: string
      enum: [LINKED, IGNORED, BOT]
      description: "`LINKED` names a Jira person (`jiraAccountId` set); `IGNORED` and `BOT` name nobody."
    CodeIdentityStatus:
      type: string
      enum: [PROPOSED, UNMAPPED, LINKED, IGNORED_OR_BOT]
      description: Read-time, never stored - see `listCodeIdentities`.
    CodeIdentityProposal:
      type: object
      required: [decision]
      description: What confirming would store. `decision` is `LINKED` or `BOT`; `jiraAccountId` is null for a bot.
      properties:
        decision: { $ref: '#/components/schemas/CodeIdentityDecision' }
        jiraAccountId: { type: string, nullable: true }
        jiraDisplayName: { type: string, nullable: true }
    CodeIdentityDecisionView:
      type: object
      required: [decision, decidedByUserId, decidedAt]
      description: A stored decision. `jiraDisplayName` is null for `IGNORED`/`BOT` and for a person no active Jira data source lists any more.
      properties:
        decision: { $ref: '#/components/schemas/CodeIdentityDecision' }
        jiraAccountId: { type: string, nullable: true }
        jiraDisplayName: { type: string, nullable: true }
        decidedByUserId: { type: integer, format: int64, minimum: 0, description: "The deciding Flow user's id (an id only)." }
        decidedAt: { type: string, format: date-time }
    CodeIdentityResponse:
      type: object
      required: [identityKey, kind, bot, deleted, emails, status, seen]
      properties:
        identityKey: { type: string, maxLength: 40 }
        kind: { type: string, enum: [USER, EMAIL] }
        userId: { type: integer, format: int64, nullable: true, description: "The GitLab user id (null for an `EMAIL` identity)." }
        username: { type: string, nullable: true, description: "Null for a ghost (a user id the facts name that the users listing never returned)." }
        displayName: { type: string, nullable: true }
        state: { type: string, nullable: true, description: "The GitLab account state, as listed." }
        bot: { type: boolean }
        deleted: { type: boolean }
        emails:
          type: array
          items: { type: string }
          description: "The identity's canonical addresses (lower-case). ADMIN only."
        status: { $ref: '#/components/schemas/CodeIdentityStatus' }
        seen:
          type: boolean
          description: >-
            False for an orphaned decision: one stored for this instance whose key has no identity row in any active GitLab data source of
            the instance (carries no name, username or address, `userId` null).
        proposal:
          allOf: [{ $ref: '#/components/schemas/CodeIdentityProposal' }]
          nullable: true
          description: Computed at read time; present on decided rows too, while one would still be made. Null for an orphan.
        decision:
          allOf: [{ $ref: '#/components/schemas/CodeIdentityDecisionView' }]
          nullable: true
          description: The stored ADMIN decision; null when none.
    CodeIdentityDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/CodeIdentityDecision' }
        jiraAccountId:
          type: string
          maxLength: 100
          nullable: true
          description: Required (1-100 characters, no control characters) for `LINKED`, forbidden for `IGNORED` and `BOT`.
    CodeIdentityConfirmResult:
      type: object
      required: [linked, bots]
      properties:
        linked: { type: integer, minimum: 0, description: "`LINKED` decisions written." }
        bots: { type: integer, minimum: 0, description: "`BOT` decisions written." }
    CodeIdentityPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CodeIdentityResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.
    MetricsStatusStage:
      type: object
      required: [statusId, stage]
      properties:
        statusId: { type: string }
        stage: { type: string, enum: [NOT_STARTED, IN_PROGRESS, WAITING, BLOCKED, DONE] }
    MetricsDomainStatusStage:
      type: object
      required: [domainKey, statusId, stage]
      description: "A per-domain override of the every-domain status → stage mapping: items of this domain read this stage for this status instead."
      properties:
        domainKey: { type: string, maxLength: 50, description: "A domain the same request defines (a `domains[].domainKey`, or the project key of an observed project it leaves unmapped); never empty." }
        statusId: { type: string }
        stage: { type: string, enum: [NOT_STARTED, IN_PROGRESS, WAITING, BLOCKED, DONE] }
    MetricsFieldConfig:
      type: object
      properties:
        estimateTask: { type: string, nullable: true }
        estimateEpic: { type: string, nullable: true }
        epicStart: { type: string, nullable: true }
        epicDue: { type: string, nullable: true }
        workCategory: { type: string, nullable: true }
    MetricsDomainMapping:
      type: object
      required: [projectKey, domainKey, domainName]
      properties:
        projectKey: { type: string }
        domainKey: { type: string, maxLength: 50 }
        domainName: { type: string, maxLength: 100 }
        ownerTeamId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: "A19/A22 — an explicitly configured owner team for this project row; every row sharing the same domainKey must agree (null or equal). Left unset on GET, it is filled with the computed board-fallback default."
    MetricsBoardTeamMapping:
      type: object
      required: [boardId, teamId]
      properties:
        boardId: { type: integer, format: int64 }
        teamId: { type: integer, format: int32, minimum: 0 }
    MetricsActivityTypeMapping:
      type: object
      required: [issueType, activityType]
      properties:
        issueType: { type: string }
        activityType: { type: string }
    MetricsWorkCategoryMapping:
      type: object
      required: [valueId, category]
      properties:
        valueId: { type: string }
        valueName: { type: string, nullable: true }
        category: { type: string, maxLength: 100 }
    DataSourceMetricsConfig:
      type: object
      required: [configured, statusStages, domainStatusStages, fields, domains, boards, activityTypes, workCategories]
      properties:
        configured: { type: boolean, description: "False means every field below is a COMPUTED default, nothing is stored yet." }
        statusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusStage' }
        domainStatusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainStatusStage' }
          description: "Per-domain overrides of `statusStages` (at most one per domain and status); empty by default — a status without an override for the item's domain uses `statusStages`."
        fields:
          $ref: '#/components/schemas/MetricsFieldConfig'
        domains:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainMapping' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardTeamMapping' }
        activityTypes:
          type: array
          items: { $ref: '#/components/schemas/MetricsActivityTypeMapping' }
        workCategories:
          type: array
          items: { $ref: '#/components/schemas/MetricsWorkCategoryMapping' }
    DataSourceMetricsConfigRequest:
      type: object
      properties:
        statusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusStage' }
        domainStatusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainStatusStage' }
          description: "Per-domain overrides of `statusStages` (at most one per domain and status); empty by default — a status without an override for the item's domain uses `statusStages`."
        fields:
          $ref: '#/components/schemas/MetricsFieldConfig'
        domains:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainMapping' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardTeamMapping' }
        activityTypes:
          type: array
          items: { $ref: '#/components/schemas/MetricsActivityTypeMapping' }
        workCategories:
          type: array
          items: { $ref: '#/components/schemas/MetricsWorkCategoryMapping' }
    MetricsStatusOption:
      type: object
      required: [statusId, name, category, inWorkflow, seenInHistory, inEpicWorkflow, inTaskWorkflow]
      properties:
        statusId: { type: string }
        name: { type: string }
        category: { type: string, enum: [TODO, IN_PROGRESS, DONE, UNKNOWN] }
        inWorkflow: { type: boolean, description: "The status id is in the stored data profile's `workflowStatusIds` (an in-scope project's reference workflow uses it)." }
        seenInHistory: { type: boolean, description: "Some work item's status interval of this connection carries the status id." }
        inEpicWorkflow: { type: boolean, description: "The status id is in the workflow of an epic issue type (hierarchy level 1) of some in-scope project (the profile's `epicWorkflowStatusIds`); false while the split is unknown." }
        inTaskWorkflow: { type: boolean, description: "The status id is in the workflow of a task issue type (hierarchy level 0 or below) of some in-scope project (the profile's `taskWorkflowStatusIds`); false while the split is unknown." }
    MetricsFieldOption:
      type: object
      required: [fieldId, name, type, detectedRole, inScheme, nonNullCount, inEpicScheme, inTaskScheme]
      properties:
        fieldId: { type: string }
        name: { type: string }
        type: { type: string }
        detectedRole: { type: string, description: "SPRINT/RANK/TEAM/STORY_POINTS/FLAGGED/OTHER — `jira/JiraProfile.kt`'s detection." }
        inScheme: { type: boolean, nullable: true, description: "The field id is in the stored data profile's `schemeFieldIds` (an in-scope project's field scheme lists it); null when that set is unknown." }
        nonNullCount: { type: integer, format: int64, minimum: 0, description: "How many live issues carry a value for the field (the profile's fill count) — the editor's fallback relevance signal when inScheme is unknown." }
        inEpicScheme: { type: boolean, nullable: true, description: "The field id is in the stored data profile's `schemeEpicFieldIds` (the field scheme of an epic issue type lists it); null when that set is unknown." }
        inTaskScheme: { type: boolean, nullable: true, description: "The field id is in the stored data profile's `schemeTaskFieldIds` (the field scheme of a task issue type lists it); null when that set is unknown." }
    MetricsBoardOption:
      type: object
      required: [boardId, name]
      properties:
        boardId: { type: integer, format: int64 }
        name: { type: string }
        projectKey: { type: string, nullable: true }
    MetricsFieldValueOption:
      type: object
      required: [valueId]
      properties:
        valueId: { type: string }
        valueName: { type: string, nullable: true }
    DataSourceMetricsConfigOptions:
      type: object
      required: [statuses, fields, projects, boards, issueTypes, workCategoryValues, workCategoryValuesTruncated]
      properties:
        statuses:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusOption' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/MetricsFieldOption' }
        projects:
          type: array
          items: { type: string }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardOption' }
        issueTypes:
          type: array
          items: { type: string }
        workCategoryValues:
          type: array
          items: { $ref: '#/components/schemas/MetricsFieldValueOption' }
        workCategoryValuesTruncated:
          type: boolean
          description: "True when the field carries more than 200 distinct values — the response shows only the first 200 (by id)."

    MetricsSettingsResponse:
      type: object
      required:
        - configRevision
        - hoursPerDay
        - timeZone
        - weekendDays
        - commitmentGraceMinutes
        - minSampleSize
        - agingWindowItems
        - agingPercentiles
        - backlogWindowSprints
        - epicDriftDays
        - epicEstimateGapTolerancePercent
        - historyHorizonMonths
        - historyHorizonFrom
        - updatedAt
        - updatedByUserId
      properties:
        configRevision: { type: integer, format: int64, minimum: 1 }
        hoursPerDay: { type: number, format: double, minimum: 0, maximum: 24, exclusiveMinimum: true }
        timeZone: { type: string, description: "An IANA zone id, e.g. Europe/Warsaw." }
        weekendDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "ISO weekday numbers, 1 (Monday) .. 7 (Sunday)."
        commitmentGraceMinutes: { type: integer, minimum: 0 }
        minSampleSize: { type: integer, minimum: 1 }
