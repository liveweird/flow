  /api/v1/reports/cycle-time/items:
    get:
      tags: [reports]
      operationId: getReportCycleTimeItems
      summary: The tasks or epics behind one bar of a cycle-time histogram (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items". Takes the parent report's
        parameters (`GET /api/v1/reports/cycle-time`, `tailPercent` included — it shapes the histogram; `bucket` is validated but
        only sets the trend's resolution) plus the bar's identity: `view` picks one of the report's four histograms
        (`WORKING_DAYS` and `ELAPSED_DAYS` of the tasks, `EPIC_WORKING_DAYS` and `EPIC_ELAPSED_DAYS` of the `epics` block) and
        `bucketIndex` the bar, 0-based into that distribution's `histogram` (the open tail bucket last). The list is produced by
        the report's own fetch and per-item value and the ONE bucket rule the histogram uses, so `bar.count` equals
        `histogram[bucketIndex].count` and `bar.from`/`bar.to` its range (`to` null = the open tail); a listed item's `figure`
        is its cycle in working or elapsed days and `anchorAt` its `done_at`. Items are sorted by `figure` descending, newest
        `anchorAt` first, then issue key; at most 500 are listed — `total` (equal to `bar.count`) says how many are behind the
        bar and `truncated` is true when that is more than were listed. `segmentAccountId` narrows the list AND the bar to one
        picked account's share of the bucket (the histogram's `byUser` count); it needs USER level and must be one of the picked
        `accountId`s, else 400. A missing or unknown `view`, a `bucketIndex` that is not a non-negative integer or lies outside the
        histogram, and a hidden distribution (fewer than `minSampleSize` measured items, so no bar exists — at USER level that is
        always the case for the epic views) are 400s.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/ReportBucket' }
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [WORKING_DAYS, ELAPSED_DAYS, EPIC_WORKING_DAYS, EPIC_ELAPSED_DAYS] }
          description: Which of the report's histograms the bar belongs to.
        - { $ref: '#/components/parameters/ReportDrillBucketIndex' }
        - { $ref: '#/components/parameters/ReportDrillSegmentAccountId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportDrillItemsOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/wip:
    get:
      tags: [reports]
      operationId: getReportWip
      summary: Report 9 — work in progress per status, stage or board column over time
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 9 — WIP". Off the daily
        aggregate `agg_daily_wip` for the NOT_STARTED, IN_PROGRESS, WAITING, BLOCKED and UNMAPPED stages, and computed at query time
        from the item stage intervals for the DONE stage, which is attributed as at the item's done time (the
        delivery-credit team, the domain in effect at done; domain-model A34): `series` has one point per calendar day of
        the period (in the configured zone), each the END-of-day snapshot of how many items sat in each status / stage /
        board column — items the aggregate has no row for count as zero, and every point carries every key of `keys`. `itemKind` (default
        TASK) counts level-0 tasks, `EPIC` the epics (a different grain, D2); the two are never summed (any other value, `BOTH` included, is a `400`). `by`
        (default STAGE) keys `counts` by `STAGE` (the six stages NOT_STARTED, IN_PROGRESS, WAITING, BLOCKED, DONE, UNMAPPED — WAITING is work
        that has started with nothing actively worked on, a queue, and BLOCKED the same held by an impediment, both admin-mapped stages (A30, A36); UNMAPPED, a status with no stage
        mapping, is its own key; work in progress is IN_PROGRESS plus WAITING plus BLOCKED), `STATUS` (the Jira status id, labelled with its name) or `COLUMN` (the mapped
        board's column, read from `norm.board_columns` at query time; a status no column holds is "(no column)").
        `isWorkingDay` lets a chart hide weekends. Levels: UNIT (a `domain` with no `teamId`) reads that DOMAIN scope (a task's as-was
        domain, an epic's own space); `teamId` reads that team's TEAM scope (tasks: the D5 team as of each day, epics: the
        domain's owner team, A19); `teamId=0` is UNASSIGNED on the task side and UNOWNED on the epic side. USER level
        (`teamId` and `accountId`, which repeats — also on commitments, throughput, cycle time, reported time, adjustments, task accuracy and task estimates, no other report:
        1 to 8 distinct accounts, more is a 400) has no storage in the aggregate and is computed at query time: the level-0 tasks the
        picked people hold at the end of each day (the task's assignee covering that instant), inside the page's team — an open task
        counts when its as-was team (the sprint's, else the assignee's, D5) is `teamId`, a done one when its delivery-credit team
        is — so a person's numbers agree with the other USER-level reports. `counts` is the union of the picks and
        each point's `byUser` splits it per picked account in request order, every key zero-filled. An epic has no assignee: at USER level
        `itemKind=EPIC` is an empty `series` with a `note`. `by=COLUMN` needs a `teamId` naming a team with a mapped board (`400` otherwise, and at UNIT level).
        `400` too: `domain` together with `teamId` (no team × domain split, so USER level has no `domain` either) and `activityType` / `workCategory`
        (not stored per day). Sprint-relative periods use the resolved sprints' envelope. A period reaching past
        the last derived day is cut off there rather than read as zero — the OLDEST, over the connections in scope
        that have derived, of each one's last successful DERIVE day, so a lagging connection's missing days are not
        zeros. No successful DERIVE for any connection in scope gives an empty `series` with a `note` ("Not derived
        yet"); connections that never derived are ignored for the cut-off but named in the `note`. The series also
        starts no earlier than the LATEST `backfill_from` date among the connections in scope that have derived: before
        it a connection's history is incomplete by construction (items finished long before and not updated since were
        never fetched), so no earlier day is listed, and a period that begins earlier says so in the `note`. `domainView` is
        accepted but the report always reads the task's own domain, so `meta.domainView` is always TASK.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportWipBy' }
        - { $ref: '#/components/parameters/ReportWipItemKind' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The WIP report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WipReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/backlog:
    get:
      tags: [reports]
      operationId: getReportBacklog
      summary: Reports 10 and 13 — the estimated backlog over time and the backlog in sprints
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 10, 13". The estimated backlog
        (D9: level-0 NOT_STARTED tasks with an estimate that sit in no started sprint, priced at their OWN estimate)
        as a daily trend off `agg_daily_flow`: `trend` has one point per calendar day of the period (configured
        zone), each the END-of-day item count and man-days (a day with no aggregate row is zero). `current` is the
        last listed day (`asOfDay`) plus report 13's backlog in sprints: `backlogInSprints = md ÷ meanDeliveredMd`,
        where `meanDeliveredMd` is the mean `delivered_md` of the team's last `windowSprints`
        (`backlog_window_sprints`) closed sprints as of that day — `sprintsUsed` of them when fewer exist (at UNIT level there is no velocity) — and
        `null` (with `backlogInSprints`) when there is no closed sprint or the mean is 0. The backlog is owned by
        the OWNER team of the task's domain (A19). Levels: UNIT (a `domain` with no `teamId`) reads that DOMAIN scope and, as for `teamId=0` (the UNOWNED
        backlog), has no velocity of its own (`meanDeliveredMd` and `backlogInSprints` null); `teamId` reads that owner team.
        USER level (`teamId` and `accountId`) is answered empty with a `note` — the aggregate has no per-user
        scope. `400` for `domain` together with `teamId` and for `activityType` / `workCategory` (not stored per
        day). Sprint-relative periods use the resolved sprints' envelope. A period reaching past the last derived day
        is cut off there rather than read as zero — the OLDEST, over the connections in scope that have derived, of
        each one's last successful DERIVE day, so a lagging connection's missing days are not zeros. No successful
        DERIVE for any connection in scope gives an empty `trend` with a `note` ("Not derived yet"); connections
        that never derived are ignored for the cut-off but named in the `note`. `domainView` is accepted but the report always reads
        the task's own domain, so `meta.domainView` is always TASK.

        `touchedWithinDays` narrows EVERY trend day (so `current` and `trend` agree) to the items someone touched recently
        (domain-model A38): `items` / `md` are then the figures of the items whose latest touch before the day's end is within N × 24 hours of it,
        `hiddenItems` / `hiddenMd` the complement (`items + hiddenItems` is the unfiltered figure) and `touchedWithinDays` echoes the
        effective filter; with the parameter absent or `0` the figures are the stored aggregate, the hidden fields are 0 and
        `touchedWithinDays` is null. Computed at query time, nothing DERIVE stores moves.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - name: touchedWithinDays
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0, maximum: 3650 }
          description: >-
            Count only the items touched within this many days (N × 24 hours) before each day's end: the item's creation, any
            Jira history entry of it (any field) or any worklog on it (at its `started` time) — the item's own history only.
            A touch exactly at the day's end belongs to the next day. `0` or absent = no filter (the stored aggregate).
            Outside `0..3650`, a non-integer or a repeated key is `400`.
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The estimated backlog report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/aging-wip:
    get:
      tags: [reports]
      operationId: getReportAgingWip
      summary: Report 11 — the age of every in-progress, waiting or blocked task and epic against the cycle-time percentiles
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 11". An "as of now" read: the
        period parameters are accepted but ignored (a sprint-relative one only resolves sprints). `items` lists every
        OPEN level-0 task and epic in an IN_PROGRESS, WAITING or BLOCKED stage (A30, A36; `UNMAPPED` is not in progress), oldest first, at most 500
        (`itemsTruncated`), each with its age in WORKING days from `started_at` to the request's clock, computed with
        the configured calendar. Tasks are attributed to the CURRENT team and assignee (A25), epics to the owner team
        and have no assignee. `thresholds` are the configured percentiles (`aging_percentiles`) of `cycle_working_days`
        over the LAST `aging_window_items` DONE level-0 tasks of the scope (credit team; `n` of them), `epicThresholds`
        the same over DONE epics — hidden (only `n`, every `workingDays` null) below `minSampleSize`. An item's `band`
        is the highest threshold its age is above (`P85` = above p85 but not above the next), `WITHIN` when above none,
        null when its thresholds are hidden. Thresholds belong to the team, so `accountId` narrows the listed items
        only; at UNIT level they span the whole domain. `blocked` = blocked as of the connection's last DERIVE (a Flagged or BLOCKED-stage spell covers its clock); `waiting` = the item's
        current stage is WAITING (started, nothing actively worked on, a queue — a BLOCKED-stage item is `blocked`, never `waiting`). Each item also says where it sits — `statusId`/`statusName`/`stage`
        from its OPEN `item_stage` row (the same DERIVE as the stage that lists it) and `position`, a key of the top-level `positions`, the
        chart's x-axis (board columns for one team with a mapped board, statuses otherwise). Levels:
        UNIT (a `domain` with no `teamId`), `teamId` (`0` = UNASSIGNED tasks / UNOWNED epics), USER (`teamId` and `accountId` — tasks only,
        epics have no user). `domain`, `activityType` and `workCategory` slice as elsewhere.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The aging WIP report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgingWipReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/blocked-time:
    get:
      tags: [reports]
      operationId: getReportBlockedTime
      summary: Report 12 — blocked working days per DONE item and as a share of its cycle
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 12". Population: DONE items by
        `done_at` in the period — level-0 tasks (`itemKind=TASK`, the default), epics (`EPIC`) or both (`BOTH`); tasks are
        attributed to the D5 credit team and the assignee at done, epics to the owner team (no user). Blocked time is
        the working days between an item's start and its done that it spent Flagged or in a BLOCKED stage (A36)
        (merged, so overlapping spells count once). `blockedWorkingDays` is a `Distribution` over the BLOCKED DONE items only
        (blocked working days above zero); an item never blocked is left out of both distributions and counted in
        `excluded.neverBlocked` (`blockedItems` = `population - neverBlocked`). `shareOfCycle` is
        `blocked ÷ cycle working days` over the blocked items with a cycle above zero; each other item is in exactly ONE
        `excluded` bucket (`neverBlocked`, then `neverStarted`, then `zeroCycle`), so `blockedWorkingDays.n +
        neverBlocked = population` and `shareOfCycle.n + neverBlocked + neverStarted + zeroCycle = population`.
        Both distributions are hidden below `minSampleSize`. `topItems` lists the 20 most-blocked items.
        Levels: UNIT `groups` per team (tasks and epics), TEAM per assignee at done (tasks only — epics have no user,
        so Σ groups is the tasks' total there), USER none and no epics. Sprint-relative periods use the resolved
        sprints' envelope.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/ReportBlockedItemKind' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The blocked time report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedTimeReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/blocked-time/items:
    get:
      tags: [reports]
      operationId: getReportBlockedTimeItems
      summary: The DONE items behind one bar of the blocked-time histograms (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items". Takes the parent report's
        parameters (`GET /api/v1/reports/blocked-time`, `itemKind` and `tailPercent` included) plus the bar's identity: `view`
        (`BLOCKED_WORKING_DAYS` — the blocked DONE items — or `SHARE_OF_CYCLE` — the blocked items with a cycle above zero;
        a never-blocked item is in neither bar) and `bucketIndex`, 0-based into that distribution's `histogram` (the open tail bucket last). With
        `itemKind=BOTH` the list mixes tasks and epics, each row's `itemKind` saying which. `bar.count` equals
        `histogram[bucketIndex].count`, `bar.from`/`bar.to` its range (`to` null = the open tail); a listed item's `figure` is its
        blocked working days or its share of the cycle and `anchorAt` its `done_at`. The histograms carry no per-person split, so
        there is no `segmentAccountId`. Sorting, the 500 cap, `total`/`truncated` and the 400 matrix are those of
        `GET /api/v1/reports/cycle-time/items`.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/ReportBlockedItemKind' }
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [BLOCKED_WORKING_DAYS, SHARE_OF_CYCLE] }
          description: Which of the report's histograms the bar belongs to.
        - { $ref: '#/components/parameters/ReportDrillBucketIndex' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportDrillItemsOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/epic-progress:
    get:
      tags: [reports]
      operationId: getReportEpicProgress
      summary: Report 15 — epic progress / EVM (PV, EV, AC as cumulative curves with SV, SPI, CV, CPI)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 15 — EVM". Planned value, earned
        value and actual cost in man-days, read off the per-day INCREMENTS in `agg_daily_flow` (A23) and summed at query
        time. `asOf` and every row's top-level figures are CUMULATIVE (from the beginning of time); `period` and every
        row's `period` are the same figures inside the period `[period.firstDay, asOf.day]` (A37), and `basis` (the
        request's, else the level's default — PERIOD at DOMAIN and TEAM, CUMULATIVE at EPIC) picks what `series`
        shows: CUMULATIVE points include everything before the period, PERIOD points are rebased to start near 0.
        `period`'s and the rows' `spi` / `cpi` are `null` while ΔPV / ΔAC is under 1 man-day (EV arrives in lumps, so a
        ratio over a sliver is noise). `trend` is SPI and CPI per week end (Monday-start weeks, the last one cut at
        `asOf.day`) over the trailing `trendWindowDays`, null under the same minimum. The listed days never start before the history horizon's
        first day (`meta.historyHorizon`, A48; a sprint window straddling it starts there and `note` says so): `period` and the rebase start there,
        the cumulative baselines stay whole-life. Select the scope with EXACTLY ONE of `epicId` (an epic's issue key, level EPIC),
        `domain` (level DOMAIN — epic-attributed work only), `teamId` (level TEAM, sprint and author based, A20;
        `0` = UNASSIGNED) — none is the whole unit, which is refused. `400` for none of them, for more than
        one of them, for a blank `epicId`, for `accountId` (no user-level EVM), for an explicit `domainView=TASK` (EVM is always the EPIC
        view, D3), for `activityType` / `workCategory` (not stored per day), and for an unknown epic, domain, team,
        sprint or connection (never 404); an `epicId` that exists in several connections in scope is ambiguous — narrow
        with `connectionId`.
        `asOf` is read at the last day of the period, but never later than today or than the last derived day (the
        oldest, over the connections in scope that have derived, of each one's last successful DERIVE day, so EV and AC
        are never compared with a plan they have not caught up with). `asOf.day` names it; SV = EV − PV, SPI = EV ÷ PV
        (null when PV is 0), CV = EV − AC, CPI = EV ÷ AC (null when AC is 0). `series` lists one point per calendar day
        of the period up to `asOf.day`. At EPIC level each point also carries `pvOriginal` (the epic's FIRST baseline
        redrawn) and `epic` describes the plan: the current budget and its source, the baselines
        (`fact_epic_plan`), `drift` (the current baseline against the first), `inPvHorizon` (the current baseline is complete
        and both dates lie within ±10 years of the DERIVE clock — otherwise there is no PV, A23) and `hasPvCurve` (in the
        horizon AND the window holds a working day, so PV is actually spread). `pvOriginal` uses the working days DERIVE
        stamped in `dim_date` where they cover the window, else the current calendar. At TEAM level `foreignWorkShare` is
        the share of the team authors' logged MD from the beginning of time up to `asOf.day` — the same cumulative window
        as CPI — that was foreign work (A20 — read team CPI with it), and `foreignWorkSharePeriod` the same over the
        worklogs started inside the period (the window of the period CPI). `rows` is the drill table as of `asOf.day`: at DOMAIN
        level one row per epic that was in that domain up to `asOf.day` and has a share in it (PV, EV or AC) or a current baseline
        while the domain is the one it has then; an epic that moved is listed under every domain it was in, each row holding only
        that domain's share (`partial` true; A49), so a domain's rows add up to its totals; empty at EPIC and TEAM level. Sprint-relative periods use the resolved sprints'
        envelope. Nothing derived yet gives an empty answer with a `note` ("Not derived yet").
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportEpicId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportEpicProgressBasis' }
        - { $ref: '#/components/parameters/ReportTrendWindowDays' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The epic progress report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpicProgressReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/data-quality:
    get:
      tags: [reports]
      operationId: getReportDataQuality
      summary: Report 14 — data quality (where the data the other reports stand on is missing or inconsistent)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 14". One response, many findings.
        **Populations:** task findings count level-0 DONE tasks with `done_at` in the period (credit team / assignee at
        done) and, separately (`open`), currently open STARTED tasks whatever the period (current team / assignee, A25);
        worklog findings count worklogs with `started_at` in the period (author team as-was); epic findings count epics open
        or done in the period (owner team, A19). A sprint-relative period reads the resolved sprints' envelope.
        **Findings:** `worklogCoverage` (DONE tasks with worklogs, D14), `loggedHours` (hours a team member logged per
        working day on the roster, to read against `hoursPerDay`), `lateLogging` (worklog created vs started),
        `missing` (no estimate / epic / work category — only for connections with a work-category field —, unassigned
        DONE tasks, tasks estimated late (done or open) and DONE tasks estimated only after they were done (A35), epics without an own estimate, without dates, or with dates outside the ±10-year PV horizon so no PV curve
        exists), `outsideSprint` (D10), `crossDomain`, `epicDrift` (D11), `epicEstimateGap` (epics whose own estimate and their tasks' estimates differ by more than
        the configured tolerance of the own estimate (`epicEstimateGapTolerancePercent`, default 25%), the widest gap first), `domainsWithoutOwner` (A19), `unmappedStatuses`,
        `unmappedBoards`, `authorsWithoutTeam`, `itemsAboveEpic` (A31: live issues above the epic level, outside the task/epic
        model, with the MD logged on them), `snapshotDrift` (D13: a closed sprint's live figure vs its frozen one) and
        `deriveWarnings` (A13). Every list is capped at 50 with a `total` beside it. **Levels:** UNIT `groups` per team
        (a null team is UNASSIGNED tasks/authors and UNOWNED epics), TEAM per member (no epic counts — epics carry no user),
        USER none and no epics or sprint findings. The configuration-level findings (`unmappedStatuses`, `unmappedBoards`,
        `itemsAboveEpic`, `snapshotDrift`, `deriveWarnings`) are not narrowed by the team; `domain` narrows `domainsWithoutOwner`. A real
        `teamId` sees no `domainsWithoutOwner` and no `authorsWithoutTeam` (they belong to no team); `teamId=0` sees them.
        `domainView` (default TASK) picks the domain a task/worklog is sliced by.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The data quality report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/costs:
    get:
      tags: [reports]
      operationId: getReportCosts
      summary: Report 16 — Costs (man-days logged in the period, the foreign-work share, by activity type and by work category)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 16". Formerly `GET /api/v1/reports/cost-matrix`
        (that path is gone, no alias; the author-team × domain matrix, its per-person capacity column, the zero rows, the `split` and
        the by-epic table were removed with the rename). Every worklog whose `started_at` falls in the period (a sprint-relative
        period reads the resolved sprints' envelope), narrowed by the shared slices: `domain` (with `domainView`: `EPIC`, the default,
        uses the task's epic's domain as of `started_at` (A47), an epic-less task falling back to its own; `TASK` the task's own domain;
        a worklog logged on an epic takes the epic's own domain as of `started_at` in both views, A21/A47), `activityType`, `workCategory` (`UNCATEGORIZED` = none) and
        `connectionId`. The level narrows the worklogs by their AUTHOR's team as of `started_at`: UNIT (a `domain` with no `teamId`) every worklog of the domain;
        `teamId` the worklogs authored by that team's members (`teamId=0`: the authors in no team); `teamId` and `accountId` that one
        person's. `totalMd` is the rounded EXACT sum of every worklog in scope (never a sum of rounded parts, so it can differ from
        its displayed addends by up to 0.005 per addend). `foreignShare` = `foreignMd` ÷ `totalMd` (A21: the author's team differs
        from the task's sprint team at `started_at`, else from its assignee's team; an epic-logged worklog compares with the epic's
        domain owner team, A22; an unknown side is never foreign), null when nothing was logged. `400` for the shared parser's errors
        (`accountId` without `teamId`, `from` after `to`, a repeated key ...) and an unknown or inactive team, connection or sprint
        (never 404); an unknown `domain` is a valid slice that answers empty.

        BREAKDOWNS — `byActivityType` and `byWorkCategory` split the very same worklogs (same period, level and slices, same
        transaction) into `{key, md, exactMd}` slices for the parts-of-whole charts, ordered by `md` descending then `key`; a worklog
        with no value is `UNCATEGORIZED`. Each `md` is the rounded exact sum, so a list adds up to `totalMd` within 0.005 per slice.
        The tasks behind a slice: `GET /api/v1/reports/costs/items`.

        SPRINTS — with a real `teamId` (the TEAM and USER levels) `sprints` lists the team's sprints by Commitments' rule: the CLOSED
        sprints completed in the period (`lastSprints`: the last N; an OPEN sprint only by an explicit `sprintId`), oldest first. Each
        carries its ACTUAL COST `acMd` — the rounded EXACT sum of the man-days the team's members logged (the author's team at the
        worklog, as every Costs figure) with `started_at` in the sprint's own dates `[startAt, completedAt)` (an open sprint to now),
        under the report's slices (`accountId`, `domain`/`domainView`, `activityType`, `workCategory`) — and `byEpic`, that AC cut by the
        worklogs' CURRENT epic (a sub-task's worklogs carry their parent task's epic, a worklog logged on an epic is its own epic, one on
        an issue above the epic level is `NO_EPIC`): the top 6 epics by Σ AC over the listed sprints, then `OTHER_EPICS`, then `NO_EPIC`,
        zero segments omitted, the same order in every sprint. `capacityMd`/`capacitySource` are the sprint's capacity (A3, A32), shown
        to every viewer (A44), null at USER level. A worklog inside two overlapping listed sprints counts in both. `outsideSprintsMd`
        is the rounded exact MD the same slice logged in the period inside none of the listed sprints (null without a team; with a
        team and no sprint it equals `totalMd`). `sprints` is empty and `outsideSprintsMd` null at UNIT level and for `teamId=0`.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The Costs report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostsReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/costs/items:
    get:
      tags: [reports]
      operationId: getReportCostsItems
      summary: The tasks behind one bar of the Costs charts - a donut slice, or a sprint's AC bar or its epic segment (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items" and "Report 16". Takes the parent report's
        parameters (`GET /api/v1/reports/costs`) plus the bar's identity, one of three shapes. **A donut slice:** `by` (`ACTIVITY_TYPE`
        or `WORK_CATEGORY`) and `key`, repeated — one to 100 distinct values of that breakdown (`byActivityType[].key` /
        `byWorkCategory[].key`; the chart's folded "Other" slice sends all its keys, an `IN` semantics per API-LIST-004).
        `UNCATEGORIZED` also selects the worklogs with none (a null column value). The list is the report's own worklogs (the same
        period, level, domain, domain view and slices) narrowed to those keys. **A sprint's whole AC bar:** no `by`, no `key`, no epic
        parameter, with a `sprintId` period and a `teamId` — the worklogs behind that sprint's `sprints[].acMd`. **One epic segment of
        it:** `by=EPIC` with `epicSegment` (an epic's issue id, `NO_EPIC` or `OTHER_EPICS` with the chart's `topEpicId`s, as on
        `GET /api/v1/reports/sprint-consistency/items`) — the worklogs behind that `byEpic[].acMd`. The worklogs are rolled up to the item
        they were logged on: a sub-task's count for its parent task (D2), a worklog logged on an epic lists the epic (`itemKind` EPIC),
        one on an issue above the epic level lists that issue as a TASK. `figure` is the item's man-days in the bar (the rounded exact
        sum of its worklogs), `anchorAt` the latest `started_at` among them, `assignee` the names of the item's authors, the largest
        contributor first, joined with ", " (`accountId` is set only when there is exactly one author; a worklog with no known author
        is not named), `teamId` is always null. `bar.count` is the number of items and `bar.sumMd` the rounded EXACT sum of the bar's
        worklogs, i.e. the chart's figure for it (`bar.from`/`bar.to` are null). Items are sorted by `figure` descending, newest
        `anchorAt` first, then issue key, and at most 500 are listed — `total` (equal to `bar.count`) says how many are behind the bar
        and `truncated` is true when that is more than were listed. A key or segment no worklog carries lists nothing (200, never 404).
        400 for the parent's parser errors, an unknown or blank `by`, a donut slice without a `key` (or more than 100, or a control
        character), `key` or `epicSegment` on the wrong shape (`key` belongs to the donut slices, `epicSegment` to `by=EPIC`, which
        needs it), and a sprint bar without a `sprintId` period or without a real `teamId`.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - name: by
          in: query
          required: false
          schema: { type: string, enum: [ACTIVITY_TYPE, WORK_CATEGORY, EPIC] }
          description: >-
            Which bar: a donut's breakdown (`ACTIVITY_TYPE`, `WORK_CATEGORY` - these need `key`), or `EPIC` (one epic segment of a sprint's
            AC bar - needs `epicSegment`, a `sprintId` period and a `teamId`). Absent = the whole AC bar of that sprint.
        - name: key
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string }
          description: Repeated — one to 100 distinct keys of the chosen breakdown (several = the folded "Other" slice). Required with `by=ACTIVITY_TYPE|WORK_CATEGORY`, a 400 otherwise. `UNCATEGORIZED` selects the worklogs with no value.
        - { $ref: '#/components/parameters/ReportDrillEpicSegment' }
        - { $ref: '#/components/parameters/ReportDrillTopEpicId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportDrillItemsOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/deep-dive:
    get:
      tags: [reports]
      operationId: getReportDeepDive
      summary: Report 17 — the deep dive (plan, Approximate EV and cost as daily series per task, in man-days)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 17", A29, A40. Plan (PV), Approximate EV and cost (AC) for a chosen
        set of work, as SPARSE DAILY series per task; the client sums days into weeks, months and epic rows. Exactly ONE of two selections
        (the repeated keys are the first `IN` semantics of API-LIST-004 here): **(a)** `domain` and one to 52 `sprintId` — the domain's
        level-0 tasks `in_scope_at_close` (A17) in at least one of those sprints; **(b)** one to 50 `epicId` (issue keys) — every level-0
        task under them. At most 500 tasks in all. One selection reads ONE connection (`connectionId`, else the one the keys resolve to;
        in (a) the domain narrows the candidate connections first). `issueId`, the retired handpick key, is ignored like any unknown
        parameter.

        `range`: mode (a) the envelope of the selected sprints' plan windows; (b) the envelope of every mark (plan, in-progress, done
        and cost days, the epics' planned windows and own cost); `from`/`to` clip it (clipped data stays in each task's `totals`; a lone
        bound outside the envelope yields a single empty day). An implied range over 1100 days keeps its last 1100 days and `note` starts
        `RANGE_CLAMPED`; a GIVEN range over 1100 days is `400`. Under the history horizon (`meta.historyHorizon`, domain-model A48) the range never
        starts before the horizon's first day, and the envelope of an old selection (all its marks before that day) is the single empty day on that
        first day with a `HISTORY_HORIZON` note (totals stay whole-life); a `to` (alone or with `from`) before the horizon's first day is `400`.
        `range.asOfDay` is the day of the selected connection's last DERIVE clock, where an open in-progress interval stops. Every series entry's `d` is a day offset from `range.from`; `nonWorkingDays` are the
        offsets that are not working days.

        Per task, `pv` spreads `planBasisMd` (the `estimate_at_commitment_md` of the task's earliest sprint, else its first later one —
        `planSource`) evenly, with cumulative rounding, over the working days of the union of the windows of every sprint the task was in
        scope at close in; `noPlanReason` says why a task has none (`NEVER_IN_SPRINT`, `NO_ESTIMATE`, or `NO_WORKING_DAY`, which keeps
        the basis and source with an empty `pv`). `approxEv` spreads a DONE task's `estimate_at_done_md` evenly, with cumulative rounding, over the working days it spent
        IN_PROGRESS (`inProgress`, the same days as offsets; WAITING (A30) and BLOCKED (A36) days earn nothing; a day Flagged in Jira while in an
        IN_PROGRESS status counts), so it sums to `done.evMd` exactly; a done task with no such day carries it all on its done day; an open
        task (`evState` OPEN) and one done without an estimate (UNESTIMATED) have none but keep their `inProgress` days. The in-progress days
        and the split are WHOLE-LIFE: the range only clips the series that are drawn, never the split. `done` is the EV marker (`estimate_at_done_md` on the day of `done_at`). `cost` is `fact_worklog.md` on the day of
        `started_at` by author (`a` indexes `authors`; sub-task worklogs roll up to their parent task). `epics[]` carry the epic's CURRENT
        baseline window (`plannedStart`/`plannedDue` offsets, an outline, never summed) and budget, and — mode (b) only — the worklog MD
        logged on the epic itself (`ownCost`); the `(no epic)` row has a null `key`. MD are rounded to 2 decimals.

        Nothing in scope derived yet answers `200` with empty `tasks`/`epics`/`authors`, `range.asOfDay` null and `note` set — never a
        range of zeros. `400` (never 404): no or mixed selections, `domain` without `sprintId`, too
        many values, more than 500 tasks, a given range over 1100 days, `from` after `to` (both given), a `to` before the history horizon, a
        sprint completed before the history horizon, an unknown sprint, epic, domain or connection, a key in several connections without `connectionId`, a malformed date or id, a repeated
        scalar parameter, control characters.
      parameters:
        - name: domain
          in: query
          required: false
          schema: { type: string }
          description: The domain key — required with `sprintId` (selection a), refused otherwise.
        - name: sprintId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 52
            items: { type: integer, format: int64, minimum: 1 }
          description: Repeated — the Jira sprint ids of selection (a); 1 to 52 distinct.
        - name: epicId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, maxLength: 20 }
          description: Repeated — the epics' issue keys of selection (b), 1 to 50 distinct.
        - name: connectionId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: >-
            The ONE connection the selection reads (an active one, else `400`). Without it the keys resolve across every active connection
            and a key present in several is ambiguous (`400`); selection (a) first narrows to the connections that hold `domain`, so a
            sprint id shared by two connections is ambiguous only when both hold the domain.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            ISO date (YYYY-MM-DD), inclusive, in the configured zone: clips the range's start (the envelope's by default). Alone, a `from`
            after the envelope's end gives a single empty day at `from` (totals unchanged), never a `400`. With `to`, `from` after `to`, a
            span over 1100 days is `400`; a `from` before the history horizon's first day is raised to it.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            ISO date (YYYY-MM-DD), inclusive, in the configured zone: clips the range's end (the envelope's by default). Alone, a `to`
            before the envelope's start gives a single empty day at `to`; a `to` before the history horizon's first day is `400` (the period
            lies entirely before it). When the range is NOT fully given and would span over 1100 days,
            its last 1100 days are kept (a given bound is honoured, the other end follows it) and `note` says `RANGE_CLAMPED`.
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The deep dive report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/deep-dive/sprints:
    get:
      tags: [reports]
      operationId: listReportDeepDiveSprints
      summary: Report 17 — the deep dive's sprint picker (the sprints of a domain)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 17". The sprints in which at least one level-0
        task of `domain` (the task's OWN domain, as the report's sprint mode selects) was `in_scope_at_close` (A17), each with
        `taskCount`, the number of those tasks. `domain` is required: a missing or unknown one (no such domain on an active
        connection in scope) is `400`. Active connections only; `connectionId` narrows to one. A sprint completed before the history horizon
        (`meta.historyHorizon` of the reports, A48) is not listed; an open one is.

        - Sortable fields: `id` (the Jira sprint id), `name`, `startAt`, `completeAt`. Default sort is `-id` (the most recent sprints
          first); `id` ascending is appended as the tiebreaker when `id` is not already sorted on, then the connection id.
        - `q` — case- and accent-insensitive substring over the sprint name.
