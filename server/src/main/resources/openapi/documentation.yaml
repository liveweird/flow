openapi: 3.1.0
info:
  title: flow-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for Flow — a developer-intelligence app over Jira analytics.
    This scaffold exposes the generic foundation: the authentication surface, admin-managed
    user accounts (with per-user feature flags and language) and flat teams. Jira-analytics
    features land on top of this foundation.

    Authorization model: every user is implicitly a regular user; additional global roles
    (`ADMIN`) are carried as the `roles` array and only ever ADD privileges on top of that
    baseline. `ADMIN` is the management role and owns the whole `/users` and `/teams` surfaces.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8084
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: users
  - name: teams
  - name: data-sources
  - name: metrics
  - name: reports

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: |
        Public and unauthenticated (the container HEALTHCHECK and the k8s liveness probe call it):
        `200` proves the process answers requests. It touches nothing — use `/api/v1/ready` for the
        database round trip.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: |
        Public and unauthenticated (the k8s readiness probe and the e2e global setup call it): `200`
        once a database round trip succeeds within a short budget, `503` while it does not — the pod
        leaves the Service until the database is back.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter. The in-memory lockout store admits at most
        `LOGIN_LOCKOUT_MAX_TRACKED` identities (default 10,000). At capacity a new identity
        receives `429` before password verification; existing tracked identities continue,
        and expired state frees capacity. This applies equally to existing and unknown emails.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`. The pending challenge store admits at most
        `MFA_MAX_TRACKED` challenges (default 10,000); new issuance at capacity receives
        `429` without sending a code, while existing challenges remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone, password changed — answers the uniform `401`. Rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists, or if the
        token's credential revision no longer matches the user's current credentials. Password
        changes invalidate earlier refresh tokens even within the same clock second. Legacy
        tokens without a credential revision require a fresh sign-in after upgrading to 0.14.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Normally answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a new password is generated and emailed first; only after delivery does
        its hash replace the old one (which stops working, and outstanding refresh tokens are
        invalidated). Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. The in-memory cooldown store admits
        at most `PASSWORD_RESET_MAX_TRACKED` identities (default 10,000). At capacity a new
        identity receives `429` and no reset email is scheduled; elapsed cooldowns free space.
        A soft-deleted account is unknown here (no password is minted or email sent, and the
        response follows the same acceptance and throttling rules). Answers `503` on
        deployments without outbound email (`MAIL_TRANSPORT=disabled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        and pending MFA challenges, including changes within the same clock second
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user — teams are the shared ownership/membership unit future
        features scope permissions to; every mutation below is ADMIN only.

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring), `memberId` (only teams the
          user is a member of — the caller's own id yields "my teams").
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '200':
          description: A page of teams (rosters collapsed to an active-member count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). An optional initial roster: every id must be an active user (`400` otherwise). A
        case-insensitive name clash with an active team is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new team
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team with its roster
      description: Any authenticated user. Soft-deleted members stay in the roster, flagged `deleted`.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateTeam
      summary: Rename / re-describe a team
      description: "ADMIN only, guard before the id lookup (uniform 403). The roster is managed per member below. A case-insensitive name clash with another active team is `409`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (soft)
      description: ADMIN only, guard before the id lookup. Soft delete — the name is freed for reuse.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    post:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a user to a team
      description: ADMIN only. The user must be active (`404` otherwise); an existing member is `409`.
      responses:
        '204':
          description: Added
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a user from a team
      description: ADMIN only. A membership that does not exist is `404` (a soft-deleted member's row can still be removed).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/jira-memberships:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: listTeamJiraMemberships
      summary: List a team's dated Jira-user memberships (D1)
      description: Any authenticated user (the team-reads posture). Most recent `validFrom` first.
      responses:
        '200':
          description: The team's membership rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembershipListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [metrics]
      operationId: createTeamJiraMembership
      summary: Add a dated Jira-user membership to a team
      description: |
        ADMIN only, guard before the id lookup and the body decode. The team must be active
        (`404` otherwise); `accountId` must be known to `norm.people` for some connection (`400`
        otherwise). An overlapping `[validFrom, validTo)` interval for the same account is `409`
        (the exclusion constraint — invariant 1: a Jira user belongs to at most one team at any
        instant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new membership resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembershipResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/jira-memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: membershipId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    put:
      tags: [metrics]
      operationId: updateTeamJiraMembership
      summary: Replace a dated Jira-user membership's validity window
      description: >-
        ADMIN only. A full replace of `validFrom`/`validTo` only — the team and account id are the
        row's fixed identity. An overlap with another row for the same account is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [metrics]
      operationId: deleteTeamJiraMembership
      summary: Remove a dated Jira-user membership
      description: ADMIN only. Hard delete (a pure dated join, the `team_members` idiom).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources:
    get:
      tags: [data-sources]
      operationId: listDataSources
      summary: List data sources
      description: |
        ADMIN only. An ADMIN-managed connection to an external issue tracker — Jira Cloud today
        (`kind: JIRA_CLOUD`).

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [data-sources]
      operationId: createDataSource
      summary: Create a data source
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). `jira.siteUrl` must be exactly `https://<site>.atlassian.net` (origin only — the
        outbound allow-list boundary); it becomes the connection's identity. `jira.apiToken` is
        required here and never echoed back — the response carries `jira.hasApiToken` only. A
        case-insensitive name clash with an active data source is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new data source
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/test:
    post:
      tags: [data-sources]
      operationId: testDataSourceAdHoc
      summary: Test a Jira connection before saving it
      description: |
        ADMIN only (guarded before the body decodes), rate-limited (10/min per IP, bucket
        `data-source-test`). Probes each Jira endpoint the ingestion pipeline needs in sequence
        (at most 10s each, 30s total) and NEVER answers `502` — every probe outcome is a row in
        the response, `ok: false` included. `jira.apiToken` is required here (an ad-hoc test
        before the connection is saved).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceTestRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The probe results (never a failure status — see the row shapes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [data-sources]
      operationId: testDataSourceStored
      summary: Test a saved data source's connection
      description: |
        ADMIN only, rate-limited (10/min per IP, bucket `data-source-test`). Uses the STORED,
        decrypted token — no request body. A successful `tenant_info` probe persists the
        resolved `cloudId` on the connection.
      responses:
        '200':
          description: The probe results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSource
      summary: Get a data source
      description: ADMIN only.
      responses:
        '200':
          description: The data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [data-sources]
      operationId: updateDataSource
      summary: Update a data source (full replace)
      description: |
        ADMIN only, guard before the id lookup (uniform 403). A changed `jira.siteUrl` is `409`
        — it is the connection's identity; create a new data source instead. Omitting OR
        blanking `jira.apiToken` keeps the current token; any other value rotates it (audited
        separately as `data_source.token_rotated`). Any successful update bumps
        `configRevision`. A case-insensitive name clash with another active data source is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [data-sources]
      operationId: deleteDataSource
      summary: Delete a data source (soft)
      description: >-
        ADMIN only, guard before the id lookup. Soft delete — disables the connection and frees
        its name; the raw/normalized rows are purged after a grace period once the sync-job
        queue lands (plan §0 A2).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: listSyncJobs
      summary: List a data source's sync jobs
      description: |
        ADMIN only. History and command queue for one connection (v0.2.0 plan §9).

        - Sortable fields: `id`, `requestedAt`. Default `-requestedAt` (newest first).
        - Filters: `kind` (`SYNC`/`RECONCILE`/`REPROCESS`/`PURGE`), `status`
          (`PENDING`/`RUNNING`/`SUCCEEDED`/`FAILED`/`CANCELLED`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncJobKind' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncJobStatus' }
      responses:
        '200':
          description: A page of sync jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [data-sources]
      operationId: requestSyncJob
      summary: Enqueue a sync job ("Sync now" / "Reconcile now" / "Reprocess")
      description: |
        ADMIN only (guarded before the body decodes). `400` when the connection is disabled, or
        when `kind` is `PURGE` — PURGE is scheduled internally (a soft-deleted connection past
        its grace period) and is never requester-initiated. A second request while one is already
        `PENDING`/`RUNNING` for the same `(connection, kind)` is coalesced (`202`,
        `coalesced: true`, the EXISTING job).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncJobRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted (queued or coalesced with an already-open job)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobActionResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    get:
      tags: [data-sources]
      operationId: getSyncJob
      summary: Get one sync job
      description: ADMIN only.
      responses:
        '200':
          description: The sync job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    post:
      tags: [data-sources]
      operationId: cancelSyncJob
      summary: Cancel a sync job
      description: |
        ADMIN only. `PENDING` → `CANCELLED` immediately; `RUNNING` → `cancel_requested_at` is set
        and the worker honours it cooperatively on its next heartbeat tick; an already-terminal
        job (`SUCCEEDED`/`FAILED`/`CANCELLED`) is `409`.
      responses:
        '202':
          description: Cancellation accepted (or already in effect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSourceStatus
      summary: Get a data source's sync status
      description: |
        ADMIN only, read-only (v0.2.0 plan §9). Connection summary, every persisted stream cursor
        (`reference`/`issues`/`changelogs`/`worklogs`/`reconcile` — a completed pass with nothing
        left to resume has no row, so it is simply absent), raw-store row counts, the most recent
        job of each kind, and the connection's currently RUNNING job, if any.
      responses:
        '200':
          description: The sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/raw-issues/{issueKey}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: issueKey
        in: path
        required: true
        schema:
          type: string
          # The union of the "all digits" (issue id) and issue-key branches `RawIssueInspectorRoutes.kt` accepts.
          pattern: '^([0-9]+|[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10})$'
          maxLength: 20
        description: >-
          An all-digits string is looked up by the stable Jira issue id; anything else must match
          `^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$` (e.g. `ENG-123`) or is `400`.
    get:
      tags: [data-sources]
      operationId: getRawIssue
      summary: Inspect one raw Jira issue
      description: |
        ADMIN only, read-only (v0.2.0 plan §9/§12 item 8b). The stored raw payload, its changelog
        histories and worklogs (oldest first), and — once it has been through PROCESS at least
        once — its `norm.*` shape (`workItem`, `statusIntervals`, `fieldIntervals`, `anomalies`). A
        tombstoned issue (`deletedAt`/`movedOutAt` set) is still returned, never `404`.
      responses:
        '200':
          description: The raw issue inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawIssueInspection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/profile:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSourceProfile
      summary: Get a data source's data profile
      description: |
        ADMIN only, read-only (v0.2.0 plan §8/§9/§12 item 9). SQL aggregates over this
        connection's `raw.*`/`norm.*` rows, computed by the PROFILE step after every successful
        SYNC/REPROCESS. `computedAt` is `null` before the connection's first PROCESS pass — every
        section then carries its own empty default rather than the endpoint `404`ing.
      responses:
        '200':
          description: The data profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/metrics-config:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getDataSourceMetricsConfig
      summary: Get a data source's metrics configuration
      description: |
        ADMIN only (`.claude/docs/domain-model.md` "Configuration"). `configured: false` means
        nothing is stored yet — every field is a COMPUTED default (status → stage from Jira's
        status category; the profile-detected story-points field for both estimate roles;
        `duedate` for the epic due date; 1:1 project → domain and issue type → activity type; no
        board → team mappings, blocked statuses, work categories or sprint capacities).
      responses:
        '200':
          description: The connection's effective metrics configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetricsConfig'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateDataSourceMetricsConfig
      summary: Replace a data source's metrics configuration
      description: >-
        ADMIN only, guard before the body decode. A full replace over all eight per-connection
        config tables in one transaction — every id is validated against this connection's own
        `norm` reference rows (statuses, boards, sprints, project keys, issue types) and its
        stored data profile (field ids), else `400`; a board mapped to a team already mapped
        elsewhere is `409` (D10: one board per team); a `domainStatusStages` override must name a
        domain the same request defines and a known status, once per (domain, status). Bumps the shared `configRevision` unless
        the request is byte-for-byte identical to what is already stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceMetricsConfigRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/metrics-config/options:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getDataSourceMetricsConfigOptions
      summary: Get the reference data for a data source's metrics configuration
      description: |
        ADMIN only, read-only. Statuses (with category), custom fields (with the profile's
        detected role), project keys, boards, issue types and sprints per board — the picklists
        the metrics-config editor uses. `workCategoryValues` is populated only when
        `?workCategoryField=` names a field id, from that field's own distinct observed values
        across this connection's live work items, capped at 200 (`workCategoryValuesTruncated:
        true` when more exist).
      parameters:
        - name: workCategoryField
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The metrics-config reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetricsConfigOptions'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/jira-users:
    get:
      tags: [metrics]
      operationId: listJiraUsers
      summary: List Jira accounts, distinct across connections
      description: |
        `scope=UNIT` (default) — any authenticated user, D12: only accounts already relevant to
        this unit's own data (an assignee or worklog author on an ACTIVE connection's live work
        items, or one that ever held a `metrics.team_membership` row) — the same population every
        other any-authenticated surface can already name. `scope=SITE` — ADMIN only (guard before
        any read; `403` for anyone else, and likewise for any non-`UNIT` value — the guard runs
        before the value is validated), the whole site directory, for picking a brand-new team
        member.

        - Sortable fields: `displayName`. Default ascending, `accountId` ascending tiebreaker.
        - Filters: `q` (case- and accent-insensitive substring on display name OR account id; control
          characters are a `400`), `teamId`
          (that team's CURRENT membership only — combined with `scope` by set intersection).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [UNIT, SITE], default: UNIT }
      responses:
        '200':
          description: A page of Jira accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraUserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/filters:
    get:
      tags: [reports]
      operationId: getReportFilters
      summary: Get the reference data for the reports filter bar
      description: |
        Any authenticated user (D12 — everyone sees every report level). No query parameters: the
        reference data every report's own filter bar/validation reads before a report is even
        requested — active teams with the sprints their board has ever produced and their CURRENT
        Jira roster (D1, with display names), the domain/activity-type/work-category values a real
        DERIVE run has actually produced, active connections (id+name only — never `settings`/the
        encrypted API token), and the shared `derivedAt`/`configRevision`/`minSampleSize` figures
        every report's own `meta` block also carries. Read-only — no audit event.
      responses:
        '200':
          description: The reports reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportFilters'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/velocity:
    get:
      tags: [reports]
      operationId: getReportVelocity
      summary: Report 1 — velocity (committed vs. final scope, per sprint)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 1 — Velocity".
        `initialMd`/`initialItems` are the committed scope, `finalMd`/`finalItems` the final scope
        (A17). `snapshot` is the frozen `fact_sprint_snapshot` figures (null until the sprint was
        first seen closed and team-mapped by a DERIVE run — D13); `drift` compares the two live vs.
        frozen (0.005 MD tolerance). Levels, from the shared filter: UNIT (default) groups every
        team's own closed sprints in the period by team (`groups`, Σ final MD/items); `teamId`
        narrows to TEAM level, `sprints` becomes that one team's own sprints and `groups` becomes a
        per-user split (`fact_sprint_scope.assignee_at_commitment`, Σ committed/final MD — the same
        removed-row rule the team total itself follows, so Σ users == the team total); `teamId` AND
        `accountId` together narrow to USER level — `sprints` itself narrows to that one account's
        own contribution (its `snapshot` is that account's frozen figures, computed from the sprint's
        stored snapshot scope by the same rule as the live ones; null when the sprint has no snapshot)
        and `groups` is always empty. `teamId=0` (UNASSIGNED) is always empty — a
        sprint always carries a real team or is excluded from this report. Velocity carries no
        domain slice, so `domainView` is echoed in `meta` but never changes the result. An active or
        future sprint (`completedAt` null) is reachable only by an explicit `sprintId`: its live figures,
        `snapshot` null, `drift` false.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The velocity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VelocityReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/throughput:
    get:
      tags: [reports]
      operationId: getReportThroughput
      summary: Report 2 — throughput (delivered scope per closed sprint and per time bucket)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 2 — Throughput"
        (with the item counts of report 13). Two views that differ BY DESIGN: `bySprint` is the SPRINT
        view (each team's sprints completed in the period, `fact_sprint.delivered_md/_items` — what was
        done inside the sprint while in it, priced at the sprint's close; `snapshot`/`drift` as in
        velocity); `byBucket` and `groups` are the PERIOD view (level-0 tasks — no sub-tasks — with
        `done_at` in the period, priced at their estimate at done, an unestimated task counting as an
        item worth 0 MD; team = the D5 credit team, `null` = UNASSIGNED; user = assignee at done). A
        task done after its sprint closed is in the period view only. `bucket` (default `WEEK`; weeks
        start Monday, both in the configured zone) sets the resolution of `byBucket`; `bucketStart` is
        the bucket's first day (ISO date) and empty buckets are zero-filled across the whole window.
        For a `from`/`to` period the window is exactly that range; for `lastSprints`/`sprintId` it is
        the resolved sprints' overall envelope `[min(start_at, else complete_at, else now), max(complete_at,
        else now)]` — an open sprint (no `complete_at`, reachable only by an explicit `sprintId`) ends at the
        request's now, and a future sprint yields an empty period view. `domain` (with
        `domainView`: TASK = the task's own domain, EPIC = the epic's domain with an epic-less task
        falling back to its own when `epic_domain_key` is null, which also covers an epic outside the ingested
        scope — A21), `activityType` and `workCategory` (`UNCATEGORIZED` = none)
        slice the period view only; the sprint view carries no slice. Levels: UNIT (default) — `groups`
        are one per credit team (a `teamId: null` group is UNASSIGNED); `teamId` narrows to TEAM level
        (`bySprint` to that team's sprints, the period view to tasks credited to that team — `teamId=0`
        selects UNASSIGNED credit for the period view and yields no sprints) and `groups` becomes one per
        assignee at done; `teamId` AND `accountId` narrow to USER level (`groups` empty; `bySprint` is
        that account's deliveries by assignee at commitment, its `snapshot` that account's frozen share
        computed from the sprint's stored snapshot scope by the same rule as the live figures — null when
        the sprint has no snapshot). Σ `groups` equals Σ `byBucket`.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportBucket' }
      responses:
        '200':
          description: The throughput report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThroughputReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/sprint-consistency:
    get:
      tags: [reports]
      operationId: getReportSprintConsistency
      summary: Reports 6.1-6.3 — sprint consistency (committed, added, removed, final, delivered, carried over, dropped per sprint)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 6" (with the item
        counts of report 13). Every sprint bucket in MD and items, straight off `fact_sprint`: committed,
        added, removed (in no other bucket), final, delivered, carried over and dropped — A17 partition:
        final = delivered + carried over + dropped always, and committed + added = final in items. `snapshot`
        is the frozen `fact_sprint_snapshot` figures (null until the sprint was first seen closed and
        team-mapped by a DERIVE run — D13); `drift` is true when any live figure differs from it (0.005 MD
        tolerance, item counts exactly). Same period/level semantics as velocity: UNIT (default) — `groups`
        sum every figure per team; `teamId` narrows to TEAM level, `sprints` to that team's own sprints and
        `groups` becomes a per-user split (`fact_sprint_scope.assignee_at_commitment`, the same bucket
        predicates the team figures use, so Σ groups == the team figures for every bucket; a null
        `accountId` is the unassigned-at-commitment bucket); `teamId` AND `accountId` narrow to USER level —
        `sprints` narrows to that account's own rows per sprint (its `snapshot` is that account's frozen
        figures, computed from the sprint's stored snapshot scope by the same bucket predicates as the live
        ones — null when the sprint has no snapshot — and `drift` compares the two) and `groups` is empty. `teamId=0` (UNASSIGNED) is always empty. An active or future sprint
        (`completedAt` null) is reachable only by an explicit `sprintId`: its live figures, `snapshot` null.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The sprint consistency report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintConsistencyReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/task-estimation-accuracy:
    get:
      tags: [reports]
      operationId: getReportTaskEstimationAccuracy
      summary: Report 3 — task estimation accuracy (actual cost ÷ estimate, a distribution)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 3, 4, 5". Population:
        level-0 tasks (no sub-tasks — their worklogs and estimates roll into the parent) DONE in the period
        (`done_at`); team = the D5 credit team, user = assignee at done, domain per `domainView` (default TASK).
        `atStart` is `actual_md ÷ estimate at start` (D15, the primary view), `atDone` the same over the
        estimate at done — both `Distribution`s, hidden below `minSampleSize`. A task lands in exactly ONE
        exclusion bucket (`excluded`, checked in this order): `noWorklogs` (D14 — no time logged, or so little that
        `actual_md` is 0.00; both views),
        `neverStarted` (no `started_at`, so no estimate at start — `atStart` only), `unestimatedAtStart`
        (no estimate at start, including estimated-late) / `unestimatedAtDone` (no estimate at done). So
        `atStart.n + noWorklogs + neverStarted + unestimatedAtStart = population` and
        `atDone.n + noWorklogs + unestimatedAtDone = population`. Levels: UNIT (default) — `groups` one per
        credit team (`teamId` null = UNASSIGNED); `teamId` narrows to TEAM (`teamId=0` = the UNASSIGNED
        credit) and `groups` becomes one per assignee at done (null `accountId` = unassigned); `teamId` AND
        `accountId` narrow to USER (`groups` empty). Each group carries its own distributions and exclusion
        counts. For `lastSprints`/`sprintId` the period is the resolved sprints' overall envelope, as in
        throughput.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The task estimation accuracy report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEstimationAccuracyReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/epic-estimation-accuracy:
    get:
      tags: [reports]
      operationId: getReportEpicEstimationAccuracy
      summary: Report 4 — epic estimation accuracy (actual cost ÷ the epic's OWN estimate, a distribution)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 3, 4, 5". Population:
        epics DONE by their own status (D11) in the period (`done_at`); team = the epic's domain OWNER team
        (A19, `teamId=0` = no owner, UNOWNED), domain = the epic's own space (an epic's domain is the same
        under either `domainView`, which defaults to EPIC and is only echoed in `meta`), `workCategory`
        slices; `activityType` is not an epic attribute and is ignored (not declared here). `atStart` is `actual_md ÷ OWN
        estimate at start` (D15), `atDone` the same at done; the sum of the child estimates is listed
        alongside in `epics` (never used as the estimate). An epic lands in exactly ONE exclusion bucket
        (`excluded`): `noActual` (`actual_md = 0`), `neverStarted` (no `started_at`, so no estimate at start —
        `atStart` only), else `unestimatedAtStart` / `unestimatedAtDone` (no OWN estimate at that snapshot —
        e.g. a budget that is only the child sum). `epics` lists every DONE epic
        in scope, newest `doneAt` first (then connection id, then issue id), at most 200 (`epicsTruncated` says when more
        matched); `ratio`/`ratioAtDone` are null for an excluded epic. Levels: UNIT (default) — `groups` one
        per owner team; TEAM narrows to that owner team and has no groups (epics carry no user); USER
        (`teamId` AND `accountId`) is always empty. Sprint-relative periods use the resolved sprints'
        envelope, as in throughput.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The epic estimation accuracy report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpicEstimationAccuracyReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/estimate-adjustments:
    get:
      tags: [reports]
      operationId: getReportEstimateAdjustments
      summary: Report 5 — estimate adjustments (how often and by how much an estimate moved after start)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 3, 4, 5". `tasks`
        (level-0 tasks: team = D5 credit team, user = assignee at done, domain per `domainView`, default
        TASK) and `epics` (the epic's OWN estimate: team = owner team, domain = its own space) each carry
        `AdjustmentFigures`: of the items STARTED in the period (`started_at`), how many had an estimate
        change after start (`changedAfterStart`, `share` their 0..1 fraction — null, counts only, when fewer
        than `minSampleSize` items started) and how many were estimated late
        (no estimate at start, one later); and, over the items DONE in the period (`done_at`) with both
        estimates, the distribution of the fractional change start → done (`(done − start) ÷ start`, `0.25`
        is +25 percent). Estimated-late items are counted separately and never enter the distribution
        (`changeExcluded`: `changeDistribution.n + estimatedLate + unestimated = population`). Attribution
        (A25): a DONE task is attributed to its credit team and assignee at done, a still-OPEN task to its
        current team and current assignee (branching on `done_at`; a DONE task with no credit team is
        legitimately UNASSIGNED). Levels: UNIT (default) — `groups` one per team (both kinds; `teamId` null =
        UNASSIGNED tasks / UNOWNED epics); TEAM narrows to that team, `groups` one per assignee at done
        (tasks only, `epics` null); USER narrows tasks to that account, `epics` is empty and `groups` empty
        (epics carry no user). Sprint-relative periods use the resolved sprints' envelope, as in throughput.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The estimate adjustments report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateAdjustmentsReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/cycle-time:
    get:
      tags: [reports]
      operationId: getReportCycleTime
      summary: Report 7 — cycle time (elapsed and working days, a distribution and a trend)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 7, 8". Population:
        level-0 tasks (no sub-tasks) DONE in the period (`done_at`); team = the D5 credit team, user = assignee
        at done, domain per `domainView` (default TASK). Cycle time = `done_at − started_at` (first entry into
        an IN_PROGRESS stage to the start of the trailing DONE run, so a reopened task counts its whole
        first-start-to-final-done span): `elapsedDays` is wall-clock days (`cycle_ms`), `workingDays` the
        configured calendar's working days (`cycle_working_days`); both `Distribution`s, hidden below
        `minSampleSize`. The only exclusion is `excluded.neverStarted` (no `started_at`, hence no cycle — e.g.
        created straight into DONE); a cycle of zero working days is a real value and stays in. So
        `workingDays.n = population − neverStarted`. `trend` has one bucket per week (Monday start) or month
        (`bucket`, default WEEK, in the configured zone) across the whole window, zero-filled, by `done_at`, on
        working days: `p50`/`p90` null when the bucket's `n` is below `minSampleSize`. Levels: UNIT (default) —
        `groups` one per credit team (`teamId` null = UNASSIGNED); `teamId` narrows to TEAM (`teamId=0` = the
        UNASSIGNED credit) and `groups` becomes one per assignee at done; `teamId` AND `accountId` narrow to
        USER (`groups` empty). Sprint-relative periods use the resolved sprints' envelope, as in throughput.
        `epics` is the same measure over the epics DONE by their own status (D11) in the same window
        (`fact_epic_delivery.cycle_ms` / `cycle_working_days`, the same `done_at − started_at` rule): team = the
        domain's OWNER team (A19; `teamId=0` = UNOWNED), no user, domain = the epic's own space (`domain`,
        `workCategory` slice it; `activityType` is ignored). Its `groups` are one per owner team at UNIT level and
        empty at TEAM level; at USER level the whole block is an all-zero answer (epics carry no user). `epics` has
        no trend.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportBucket' }
      responses:
        '200':
          description: The cycle time report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleTimeReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/wip:
    get:
      tags: [reports]
      operationId: getReportWip
      summary: Report 9 — work in progress per status, stage or board column over time
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 9 — WIP". Straight off the
        daily aggregate `agg_daily_wip`: `series` has one point per calendar day of the period (in the configured
        zone), each the END-of-day snapshot of how many items sat in each status / stage / board column — items
        the aggregate has no row for count as zero, and every point carries every key of `keys`. `itemKind` (default
        TASK) counts level-0 tasks, `EPIC` the epics (a different grain, D2) and `BOTH` the two added together. `by`
        (default STAGE) keys `counts` by `STAGE` (the four stages NOT_STARTED, IN_PROGRESS, DONE, UNMAPPED — UNMAPPED, a status with no stage
        mapping, is its own key), `STATUS` (the Jira status id, labelled with its name) or `COLUMN` (the mapped
        board's column, read from `norm.board_columns` at query time; a status no column holds is "(no column)").
        `isWorkingDay` lets a chart hide weekends. Levels: UNIT (default) sums every TEAM scope — including
        UNASSIGNED tasks and UNOWNED epics — or, with `domain`, reads that DOMAIN scope (a task's as-was domain, an
        epic's own space); `teamId` reads that team's TEAM scope (tasks: the D5 team as of each day, epics: the
        domain's owner team, A19); `teamId=0` is UNASSIGNED on the task side and UNOWNED on the epic side. USER level
        (`teamId` and `accountId`) is answered with an EMPTY `series` and a `note` — the aggregate has no per-user
        scope. `by=COLUMN` needs a `teamId` naming a team with a mapped board (`400` otherwise, and at UNIT level).
        `400` too: `domain` together with `teamId` (no team × domain split) and `activityType` / `workCategory`
        (not stored per day). Sprint-relative periods use the resolved sprints' envelope. A period reaching past
        the last derived day is cut off there rather than read as zero — the OLDEST, over the connections in scope
        that have derived, of each one's last successful DERIVE day, so a lagging connection's missing days are not
        zeros. No successful DERIVE for any connection in scope gives an empty `series` with a `note` ("Not derived
        yet"); connections that never derived are ignored for the cut-off but named in the `note`. `domainView` is
        accepted but the report always reads the task's own domain, so `meta.domainView` is always TASK.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportWipBy' }
        - { $ref: '#/components/parameters/ReportWipItemKind' }
      responses:
        '200':
          description: The WIP report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WipReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/backlog:
    get:
      tags: [reports]
      operationId: getReportBacklog
      summary: Reports 10 and 13 — the estimated backlog over time and the backlog in sprints
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 10, 13". The estimated backlog
        (D9: level-0 NOT_STARTED tasks with an estimate that sit in no started sprint, priced at their OWN estimate)
        as a daily trend off `agg_daily_flow`: `trend` has one point per calendar day of the period (configured
        zone), each the END-of-day item count and man-days (a day with no aggregate row is zero). `current` is the
        last listed day (`asOfDay`) plus report 13's backlog in sprints: `backlogInSprints = md ÷ meanDeliveredMd`,
        where `meanDeliveredMd` is the mean `delivered_md` of the team's last `windowSprints`
        (`backlog_window_sprints`) closed sprints as of that day — `sprintsUsed` of them when fewer exist (at UNIT level
        the minimum across the teams that have closed a sprint, so "some team has fewer than N" is detectable) — and
        `null` (with `backlogInSprints`) when there is no closed sprint or the mean is 0. The backlog is owned by
        the OWNER team of the task's domain (A19). Levels: UNIT (default) sums every owner team — including the
        UNOWNED backlog — and its `meanDeliveredMd` is the SUM of each team's own mean (the unit's delivery per
        sprint); with `domain` it reads that DOMAIN scope and, as for `teamId=0` (the UNOWNED backlog), has no
        velocity of its own (`meanDeliveredMd` and `backlogInSprints` null); `teamId` reads that owner team.
        USER level (`teamId` and `accountId`) is answered empty with a `note` — the aggregate has no per-user
        scope. `400` for `domain` together with `teamId` and for `activityType` / `workCategory` (not stored per
        day). Sprint-relative periods use the resolved sprints' envelope. A period reaching past the last derived day
        is cut off there rather than read as zero — the OLDEST, over the connections in scope that have derived, of
        each one's last successful DERIVE day, so a lagging connection's missing days are not zeros. No successful
        DERIVE for any connection in scope gives an empty `trend` with a `note` ("Not derived yet"); connections
        that never derived are ignored for the cut-off but named in the `note`. `domainView` is accepted but the report always reads
        the task's own domain, so `meta.domainView` is always TASK.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The estimated backlog report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/aging-wip:
    get:
      tags: [reports]
      operationId: getReportAgingWip
      summary: Report 11 — the age of every in-progress task and epic against the cycle-time percentiles
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 11". An "as of now" read: the
        period parameters are accepted but ignored (a sprint-relative one only resolves sprints). `items` lists every
        OPEN level-0 task and epic in an IN_PROGRESS stage (`UNMAPPED` is not in progress), oldest first, at most 500
        (`itemsTruncated`), each with its age in WORKING days from `started_at` to the request's clock, computed with
        the configured calendar. Tasks are attributed to the CURRENT team and assignee (A25), epics to the owner team
        and have no assignee. `thresholds` are the configured percentiles (`aging_percentiles`) of `cycle_working_days`
        over the LAST `aging_window_items` DONE level-0 tasks of the scope (credit team; `n` of them), `epicThresholds`
        the same over DONE epics — hidden (only `n`, every `workingDays` null) below `minSampleSize`. An item's `band`
        is the highest threshold its age is above (`P85` = above p85 but not above the next), `WITHIN` when above none,
        null when its thresholds are hidden. Thresholds belong to the team, so `accountId` narrows the listed items
        only; at UNIT level they span the whole unit. `blocked` = blocked as of the connection's last DERIVE (a blocked spell covers its clock). Levels:
        UNIT (default), `teamId` (`0` = UNASSIGNED tasks / UNOWNED epics), USER (`teamId` and `accountId` — tasks only,
        epics have no user). `domain`, `activityType` and `workCategory` slice as elsewhere.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The aging WIP report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgingWipReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/blocked-time:
    get:
      tags: [reports]
      operationId: getReportBlockedTime
      summary: Report 12 — blocked working days per DONE item and as a share of its cycle
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 12". Population: DONE items by
        `done_at` in the period — level-0 tasks (`itemKind=TASK`, the default), epics (`EPIC`) or both (`BOTH`); tasks are
        attributed to the D5 credit team and the assignee at done, epics to the owner team (no user). Blocked time is
        the working days between an item's start and its done that it spent Flagged or in a configured blocked status
        (merged, so overlapping spells count once). `blockedWorkingDays` is a `Distribution` over EVERY DONE item — an
        item never blocked is a real zero — and `blockedItems` counts those blocked at all. `shareOfCycle` is
        `blocked ÷ cycle working days` over the items with a cycle above zero; each other item is in exactly ONE
        `excluded` bucket (`neverStarted`, then `zeroCycle`), so `shareOfCycle.n + neverStarted + zeroCycle =
        population`. Both distributions are hidden below `minSampleSize`. `topItems` lists the 20 most-blocked items.
        Levels: UNIT `groups` per team (tasks and epics), TEAM per assignee at done (tasks only — epics have no user,
        so Σ groups is the tasks' total there), USER none and no epics. Sprint-relative periods use the resolved
        sprints' envelope.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportBlockedItemKind' }
      responses:
        '200':
          description: The blocked time report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedTimeReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/epic-progress:
    get:
      tags: [reports]
      operationId: getReportEpicProgress
      summary: Report 15 — epic progress / EVM (PV, EV, AC as cumulative curves with SV, SPI, CV, CPI)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 15 — EVM". Planned value, earned
        value and actual cost in man-days, read off the per-day INCREMENTS in `agg_daily_flow` (A23) and summed at query
        time from the beginning of time — a series point is the CUMULATIVE value at the end of that day, including
        everything before the period. Select the scope with AT MOST ONE of `epicId` (an epic's issue key, level EPIC),
        `domain` (level DOMAIN — epic-attributed work only), `teamId` (level TEAM, sprint and author based, A20;
        `0` = UNASSIGNED) — none is the whole UNIT: its `asOf` is the sum of every DOMAIN scope (the epic basis, consistent
        with the EPIC domain view; the domain rows add up to it), it lists no `series`, and `rows` drills into the domains
        and the teams. `400` for more than
        one of them, for a blank `epicId`, for `accountId` (no user-level EVM), for an explicit `domainView=TASK` (EVM is always the EPIC
        view, D3), for `activityType` / `workCategory` (not stored per day), and for an unknown epic, domain, team,
        sprint or connection (never 404); an `epicId` that exists in several connections in scope is ambiguous — narrow
        with `connectionId`.
        `asOf` is read at the last day of the period, but never later than today or than the last derived day (the
        oldest, over the connections in scope that have derived, of each one's last successful DERIVE day, so EV and AC
        are never compared with a plan they have not caught up with). `asOf.day` names it; SV = EV − PV, SPI = EV ÷ PV
        (null when PV is 0), CV = EV − AC, CPI = EV ÷ AC (null when AC is 0). `series` lists one point per calendar day
        of the period up to `asOf.day`. At EPIC level each point also carries `pvOriginal` (the epic's FIRST baseline
        redrawn) and `epic` describes the plan: the current budget and its source, the baselines
        (`fact_epic_plan`), `drift` (the current baseline against the first), `inPvHorizon` (the current baseline is complete
        and both dates lie within ±10 years of the DERIVE clock — otherwise there is no PV, A23) and `hasPvCurve` (in the
        horizon AND the window holds a working day, so PV is actually spread). `pvOriginal` uses the working days DERIVE
        stamped in `dim_date` where they cover the window, else the current calendar. At TEAM level `foreignWorkShare` is
        the share of the team authors' logged MD from the beginning of time up to `asOf.day` — the same cumulative window
        as CPI — that was foreign work (A20 — read team CPI with it). `rows` is the drill table as of `asOf.day`: at DOMAIN
        level one row per epic of that domain with a current baseline or any EV/AC; at UNIT level one row per domain
        (epic basis, summing to the unit's `asOf`) and one per team (sprint/author basis — a different view that does NOT
        sum to the unit headline; `active` is false for a soft-deleted team, whose own drill answers 400), told apart by
        `kind`; empty at EPIC and TEAM level. Sprint-relative periods use the resolved sprints'
        envelope. Nothing derived yet gives an empty answer with a `note` ("Not derived yet").
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportEpicId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The epic progress report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpicProgressReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/data-quality:
    get:
      tags: [reports]
      operationId: getReportDataQuality
      summary: Report 14 — data quality (where the data the other reports stand on is missing or inconsistent)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 14". One response, many findings.
        **Populations:** task findings count level-0 DONE tasks with `done_at` in the period (credit team / assignee at
        done) and, separately (`open`), currently open STARTED tasks whatever the period (current team / assignee, A25);
        worklog findings count worklogs with `started_at` in the period (author team as-was); epic findings count epics open
        or done in the period (owner team, A19). A sprint-relative period reads the resolved sprints' envelope.
        **Findings:** `worklogCoverage` (DONE tasks with worklogs, D14), `loggedHours` (hours a team member logged per
        working day on the roster, to read against `hoursPerDay`), `lateLogging` (worklog created vs started),
        `missing` (no estimate / epic / work category — only for connections with a work-category field —, unassigned
        DONE tasks, epics without an own estimate, without dates, or with dates outside the ±10-year PV horizon so no PV curve
        exists), `outsideSprint` (D10), `crossDomain`, `epicDrift` (D11), `domainsWithoutOwner` (A19), `unmappedStatuses`,
        `unmappedBoards`, `authorsWithoutTeam`, `snapshotDrift` (D13: a closed sprint's live figure vs its frozen one) and
        `deriveWarnings` (A13). Every list is capped at 50 with a `total` beside it. **Levels:** UNIT `groups` per team
        (a null team is UNASSIGNED tasks/authors and UNOWNED epics), TEAM per member (no epic counts — epics carry no user),
        USER none and no epics or sprint findings. The configuration-level findings (`unmappedStatuses`, `unmappedBoards`,
        `snapshotDrift`, `deriveWarnings`) are not narrowed by the team; `domain` narrows `domainsWithoutOwner`. A real
        `teamId` sees no `domainsWithoutOwner` and no `authorsWithoutTeam` (they belong to no team); `teamId=0` sees them.
        `domainView` (default TASK) picks the domain a task/worklog is sliced by.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The data quality report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/cost-matrix:
    get:
      tags: [reports]
      operationId: getReportCostMatrix
      summary: Report 16 — the cost matrix (author team × domain, in man-days) and foreign work
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 16". Every worklog whose `started_at`
        falls in the period (a sprint-relative period reads the resolved sprints' envelope), charged to the AUTHOR's team as of
        `started_at` (rows; the authors in no team are the UNASSIGNED row, `teamId` 0, last) and to a domain (columns):
        `domainView=EPIC` (the default) uses the task's epic's domain, an epic-less task falling back to its own; `TASK` uses the
        task's own domain; a worklog logged on an epic takes the epic's own domain in both views (A21). `domain`, `activityType`,
        `workCategory` (`UNCATEGORIZED` = none) and `connectionId` slice the worklogs. Levels: UNIT (default) — one row per author
        team; `teamId` — one row per author of that team (`teamId=0`: the authors in no team), same columns; `teamId` and `accountId`
        — that one author's row (no row when they logged nothing). `cells` is dense — one per column, in column order, 0 where
        nothing was logged. MD are rounded to 2 decimals from EXACT sums: every total (row, column, grand) is the rounded exact
        sum, never the sum of rounded cells, so a displayed total can differ from its displayed addends by up to 0.005 per addend;
        every worklog lands in exactly one row and one column. `foreignShare` = foreign MD ÷ MD (A21: the author's team differs
        from the task's sprint team at `started_at`, else from its assignee's team; an epic-logged worklog compares with the
        epic's domain owner team, A22; an unknown side is never foreign), null when nothing was logged. `400` for the shared
        parser's errors (`accountId` without `teamId`, `from` after `to`, a repeated key ...) and an unknown or inactive team,
        connection or sprint (never 404); an unknown `domain` is a valid slice that answers empty.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The cost matrix report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostMatrixReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/deep-dive:
    get:
      tags: [reports]
      operationId: getReportDeepDive
      summary: Report 17 — the deep dive (plan, execution and cost as daily series per task, in man-days)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 17", A29. Plan (PV), execution and cost (AC) for a chosen
        set of work, as SPARSE DAILY series per task; the client sums days into weeks, months and epic rows. Exactly ONE of three selections
        (the repeated keys are the first `IN` semantics of API-LIST-004 here): **(a)** `domain` and one to 52 `sprintId` — the domain's
        level-0 tasks `in_scope_at_close` (A17) in at least one of those sprints; **(b)** one to 50 `epicId` (issue keys) — every level-0
        task under them; **(c)** ONE `epicId` and one to 500 `issueId` (issue keys) — exactly those tasks of that epic. At most 500 tasks
        in all. One selection reads ONE connection (`connectionId`, else the one the keys resolve to).

        `range`: mode (a) the envelope of the selected sprints' plan windows; (b) and (c) the envelope of every mark (plan, execution, done
        and cost days, the epics' planned windows and own cost); `from`/`to` clip it (clipped data stays in each task's `totals`; a lone
        bound outside the envelope yields a single empty day). An implied range over 1100 days keeps its last 1100 days and `note` starts
        `RANGE_CLAMPED`; a GIVEN range over 1100 days is `400`. `range.asOfDay` is the day of the selected connection's last DERIVE clock,
        where an open execution interval stops. Every series entry's `d` is a day offset from `range.from`; `nonWorkingDays` are the
        offsets that are not working days.

        Per task, `pv` spreads `planBasisMd` (the `estimate_at_commitment_md` of the task's earliest sprint, else its first later one —
        `planSource`) evenly, with cumulative rounding, over the working days of the union of the windows of every sprint the task was in
        scope at close in; `noPlanReason` says why a task has none (`NEVER_IN_SPRINT`, `NO_ESTIMATE`, or `NO_WORKING_DAY`, which keeps
        the basis and source with an empty `pv`). `exec` is the fraction of each working day spent IN_PROGRESS (task-days, blocked time not
        subtracted). `done` is the EV marker (`estimate_at_done_md` on the day of `done_at`). `cost` is `fact_worklog.md` on the day of
        `started_at` by author (`a` indexes `authors`; sub-task worklogs roll up to their parent task). `epics[]` carry the epic's CURRENT
        baseline window (`plannedStart`/`plannedDue` offsets, an outline, never summed) and budget, and — mode (b) only — the worklog MD
        logged on the epic itself (`ownCost`); the `(no epic)` row has a null `key`. MD are rounded to 2 decimals.

        Nothing in scope derived yet answers `200` with empty `tasks`/`epics`/`authors`, `range.asOfDay` null and `note` set — never a
        range of zeros. `400` (never 404): no or mixed selections, `domain` without `sprintId`, `issueId` without exactly one `epicId`, too
        many values, more than 500 tasks, a given range over 1100 days or `from` after `to` (both given), an unknown sprint, epic, issue, domain or
        connection, an issue not under the epic, a key in several connections without `connectionId`, a malformed date or id, a repeated
        scalar parameter, control characters.
      parameters:
        - name: domain
          in: query
          required: false
          schema: { type: string }
          description: The domain key — required with `sprintId` (selection a), refused otherwise.
        - name: sprintId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 52
            items: { type: integer, format: int64, minimum: 1 }
          description: Repeated — the Jira sprint ids of selection (a); 1 to 52 distinct.
        - name: epicId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, maxLength: 20 }
          description: Repeated — the epics' issue keys of selection (b), 1 to 50 distinct; exactly one with `issueId` (selection c).
        - name: issueId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items: { type: string, maxLength: 20 }
          description: Repeated — the handpicked tasks' issue keys of selection (c), 1 to 500 distinct, all under the one `epicId`.
        - name: connectionId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: >-
            The ONE connection the selection reads (an active one, else `400`). Without it the keys resolve across every active connection
            and a key or sprint id present in several is ambiguous (`400`).
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            ISO date (YYYY-MM-DD), inclusive, in the configured zone: clips the range's start (the envelope's by default). Alone, a `from`
            after the envelope's end gives a single empty day at `from` (totals unchanged), never a `400`. With `to`, `from` after `to` or a
            span over 1100 days is `400`.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            ISO date (YYYY-MM-DD), inclusive, in the configured zone: clips the range's end (the envelope's by default). Alone, a `to`
            before the envelope's start gives a single empty day at `to`. When the range is NOT fully given and would span over 1100 days,
            its last 1100 days are kept (a given bound is honoured, the other end follows it) and `note` says `RANGE_CLAMPED`.
      responses:
        '200':
          description: The deep dive report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/deep-dive/sprints:
    get:
      tags: [reports]
      operationId: listReportDeepDiveSprints
      summary: Report 17 — the deep dive's sprint picker (the sprints of a domain)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 17". The sprints in which at least one level-0
        task of `domain` (the task's OWN domain, as the report's sprint mode selects) was `in_scope_at_close` (A17), each with
        `taskCount`, the number of those tasks. `domain` is required: a missing or unknown one (no such domain on an active
        connection in scope) is `400`. Active connections only; `connectionId` narrows to one.

        - Sortable fields: `id` (the Jira sprint id), `name`, `startAt`, `completeAt`. Default sort is `-id` (the most recent sprints
          first); `id` ascending is appended as the tiebreaker when `id` is not already sorted on, then the connection id.
        - `q` — case- and accent-insensitive substring over the sprint name.
      parameters:
        - { $ref: '#/components/parameters/ReportDomainRequired' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: One page of the domain's sprints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveSprintPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/deep-dive/epics:
    get:
      tags: [reports]
      operationId: listReportDeepDiveEpics
      summary: Report 17 — the deep dive's epic picker
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 17". Every epic (`metrics.dim_epic`) of an active
        connection in scope, optionally narrowed to the epic's own `domain` (an unknown domain answers an empty page). `connectionId`
        narrows to one connection.

        - Sortable fields: `id` (the epic's issue id), `key`, `summary`, `domain`. Default sort is `key` ascending; `id` ascending is
          appended as the tiebreaker, then the connection id.
        - `q` — case- and accent-insensitive substring over the key and the summary.
      parameters:
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: One page of epics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveEpicPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/deep-dive/epics/{epicKey}/tasks:
    get:
      tags: [reports]
      operationId: listReportDeepDiveEpicTasks
      summary: Report 17 — the deep dive's handpick list (one epic's level-0 tasks)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Report 17". The level-0 tasks under the epic
        (`fact_task_delivery.epic_id`, the report's own epic attribution; sub-tasks are never rows). An unknown epic key, or a key
        present in several connections in scope without `connectionId`, is `400` (never `404`).

        - Sortable fields: `id` (the task's issue id), `key`, `summary`. Default sort is `key` ascending; `id` ascending is appended
          as the tiebreaker.
        - `q` — case- and accent-insensitive substring over the key and the summary.
      parameters:
        - name: epicKey
          in: path
          required: true
          schema:
            type: string
            # A Jira issue key; one that does not match simply names no epic (`400`).
            pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$'
            maxLength: 20
          description: The epic's issue key.
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: One page of the epic's tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepDiveTaskPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/reported-time-ratio:
    get:
      tags: [reports]
      operationId: getReportReportedTimeRatio
      summary: Report 8 — reported time ÷ cycle time (man-days logged per working day of cycle)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 7, 8". Population and
        attribution as cycle time (level-0 DONE tasks by `done_at`, credit team / assignee at done, domain per
        `domainView`, default TASK). `ratio` is `actual_md ÷ cycle_working_days` — how much of the elapsed working
        time was logged — a `Distribution`, hidden below `minSampleSize`. Each task lands in exactly ONE
        exclusion bucket (`excluded`, checked in this order): `noWorklogs` (D14 — none logged, or `actual_md` of
        0.00), `neverStarted` (no `started_at`, so no cycle), `zeroCycle` (`cycle_working_days = 0`, nothing to
        divide by). So `ratio.n + noWorklogs + neverStarted + zeroCycle = population`. Levels as cycle time:
        UNIT `groups` per credit team, TEAM per assignee at done, USER none; each group carries its own
        distribution and exclusion counts. Sprint-relative periods use the resolved sprints' envelope.
        Beside the ratio, `flowEfficiency` is the status-based flow efficiency (A18) `active_ms ÷ cycle_ms` over
        the same population — active time is the time in IN_PROGRESS stages minus blocked time while in progress;
        `flowEfficiencyExcluded` puts each task that is not measurable in exactly ONE bucket (`neverStarted`, then
        `zeroCycle` = `cycle_ms` of 0, so `flowEfficiency.n + neverStarted + zeroCycle = population`); worklogs play
        no part, so a task with none is still measured. Reported time ratios can be dominated by very short
        cycles, a real outlier that is never dropped: the mean, p95 and histogram reflect it.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
      responses:
        '200':
          description: The reported time ratio report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportedTimeRatioReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/metrics-settings:
    get:
      tags: [metrics]
      operationId: getMetricsSettings
      summary: Get the global metrics settings singleton
      description: |
        ADMIN only. The ONE `metrics.settings` row every DERIVE run reads under its
        `configRevision` — the calendar/thresholds the whole metrics layer is built against
        (`.claude/docs/domain-model.md` "Configuration"). `timeZone` defaults to `Europe/Warsaw`.
      responses:
        '200':
          description: The current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSettingsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateMetricsSettings
      summary: Replace the global metrics settings
      description: >-
        ADMIN only, guard before the body decode. A full replace — every field is required.
        Bumps `configRevision`, which (from a later commit on) enqueues a `DERIVE` job for every
        enabled connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsSettingsRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    Q:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Free-text substring filter (case- and accent-insensitive) — API-LIST-005.

    # The shared report filter parameters (v0.3.0 M4 commit 10a, `reports/ReportFilter.kt`) — not
    # yet `$ref`'d by any path (this commit only builds `/reports/filters`, which takes none of
    # them), declared here for the report endpoints landing in later commits (plan §10) to reuse.
    ReportFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
      description: >-
        Period start, inclusive, in the configured zone. Defaults to 90 days before `to` (or today).
        Mutually exclusive with `lastSprints`/`sprintId`.
    ReportTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date, description: "ISO date (YYYY-MM-DD)." }
      description: Period end, inclusive, in the configured zone. Defaults to today. Must not be before `from`; the span must not exceed 1100 days.
    ReportLastSprints:
      name: lastSprints
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 52 }
      description: Each team's own last N closed sprints (union at unit level). Mutually exclusive with `from`/`to`/`sprintId`.
    ReportSprintId:
      name: sprintId
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
      description: One specific sprint's own period. Mutually exclusive with `from`/`to`/`lastSprints`.
    ReportTeamId:
      name: teamId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: Sets the level to TEAM (groups by user); `0` is the UNASSIGNED bucket. Combined with `accountId`, sets the level to USER.
    ReportEpicId:
      name: epicId
      in: query
      required: false
      schema: { type: string }
      description: >-
        One epic's issue key (as `issueKey` lists it, e.g. `FLO-33`) — selects epic progress at level EPIC.
        Mutually exclusive with `domain` and `teamId`.
    ReportAccountId:
      name: accountId
      in: query
      required: false
      schema: { type: string }
      description: One Jira account id — sets the level to USER. Requires `teamId`.
    ReportDomainView:
      name: domainView
      in: query
      required: false
      schema: { type: string, enum: [TASK, EPIC] }
      description: D3's two domain views ("delivered in" vs. "earned in"). Defaults per report.
    ReportDomain:
      name: domain
      in: query
      required: false
      schema: { type: string }
      description: Restricts to one domain key.
    ReportDomainRequired:
      name: domain
      in: query
      required: true
      schema: { type: string }
      description: The domain key (required; a missing or unknown one is `400`).
    ReportActivityType:
      name: activityType
      in: query
      required: false
      schema: { type: string }
      description: Restricts to one activity type (a standard Jira issue type name).
    ReportWorkCategory:
      name: workCategory
      in: query
      required: false
      schema: { type: string }
      description: Restricts to one work category, or the literal `UNCATEGORIZED`.
    ReportConnectionId:
      name: connectionId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: Restricts to one data source's own connection. Defaults to every enabled, active connection.
    ReportBucket:
      name: bucket
      in: query
      required: false
      schema: { type: string, enum: [WEEK, MONTH], default: WEEK }
      description: The time resolution of a report's bucketed series; weeks start Monday, buckets in the configured zone.
    ReportWipBy:
      name: by
      in: query
      required: false
      schema: { type: string, enum: [STATUS, STAGE, COLUMN], default: STAGE }
      description: What the WIP report keys its counts by; COLUMN needs a `teamId` with a mapped board.
    ReportWipItemKind:
      name: itemKind
      in: query
      required: false
      schema: { type: string, enum: [TASK, EPIC, BOTH], default: TASK }
      description: Which items the WIP report counts — level-0 tasks (default), epics (a different grain), or both added together.
    ReportBlockedItemKind:
      name: itemKind
      in: query
      required: false
      schema: { type: string, enum: [TASK, EPIC, BOTH], default: TASK }
      description: Which DONE items the blocked-time report counts — level-0 tasks (default), epics (a different grain), or both.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V18) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        memberIds:
          type: array
          maxItems: 200
          items: { type: integer, format: int32, minimum: 0 }
          description: Optional initial roster — every id must be an active user.
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
    TeamMemberResponse:
      type: object
      required: [userId, name, email, deleted]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        deleted:
          type: boolean
          description: The user was soft-deleted after joining; the row stays for the record.
    TeamResponse:
      type: object
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount:
          type: integer
          minimum: 0
          description: Active members only.
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    JiraConnectionRequest:
      type: object
      required: [siteUrl, email, projectKeys]
      properties:
        siteUrl:
          type: string
          maxLength: 253
          description: >-
            Exactly `https://<site>.atlassian.net` — origin only, no path/query/trailing slash
            (the outbound allow-list boundary). Fixed at create; a PUT changing it is `409`.
        email:
          type: string
          maxLength: 254
          description: The Jira service-account email.
        apiToken:
          type: string
          maxLength: 1000
          nullable: true
          description: >-
            Write-only. Required (non-blank) on create. On update, omitted OR blank keeps the
            current token (the SPA's masked-password field sends an empty string for
            "unchanged"); any other value rotates it. Never echoed back in any response.
        projectKeys:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}$' }
        authScheme:
          $ref: '#/components/schemas/JiraAuthScheme'
    JiraAuthScheme:
      type: string
      enum: [BASIC, BEARER]
      default: BASIC
    DataSourceRequest:
      type: object
      required: [name, syncIntervalMinutes, jira]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean, default: true }
        syncIntervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        backfillFrom:
          type: string
          format: date
          nullable: true
          description: >-
            ISO date (YYYY-MM-DD), not in the future and not more than 10 years back (nor before
            2000-01-01). Omitted computes today minus 24 months.
        reconcileHourUtc: { type: integer, minimum: 0, maximum: 23, default: 3 }
        jira:
          $ref: '#/components/schemas/JiraConnectionRequest'
    JiraConnectionResponse:
      type: object
      required: [siteUrl, email, hasApiToken, projectKeys, authScheme]
      properties:
        siteUrl: { type: string }
        email: { type: string }
        hasApiToken:
          type: boolean
          description: The token itself is never returned.
        projectKeys:
          type: array
          items: { type: string }
        authScheme:
          $ref: '#/components/schemas/JiraAuthScheme'
        cloudId:
          type: string
          nullable: true
          description: Resolved on the first successful probe/sync (not populated by this commit's CRUD).
    DataSourceState:
      type: string
      enum: [NEVER_SYNCED, CURRENT, STALE, FAILED, DISABLED]
    DataSourceStatus:
      type: object
      required: [state, consecutiveFailures]
      properties:
        state:
          $ref: '#/components/schemas/DataSourceState'
        lastSyncStartedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        lastSyncSucceededAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        lastSyncErrorCode: { type: string, nullable: true }
        consecutiveFailures: { type: integer, minimum: 0 }
        runningJobId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The connection's currently RUNNING sync job, if any.
    DataSourceResponse:
      type: object
      required:
        - id
        - kind
        - name
        - enabled
        - syncIntervalMinutes
        - backfillFrom
        - reconcileHourUtc
        - configRevision
        - jira
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kind: { type: string, enum: [JIRA_CLOUD] }
        name: { type: string }
        enabled: { type: boolean }
        syncIntervalMinutes: { type: integer }
        backfillFrom: { type: string, format: date }
        reconcileHourUtc: { type: integer }
        configRevision: { type: integer, format: int64 }
        jira:
          $ref: '#/components/schemas/JiraConnectionResponse'
        status:
          $ref: '#/components/schemas/DataSourceStatus'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DataSourcePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    DataSourceTestRequest:
      type: object
      required: [jira]
      properties:
        jira:
          $ref: '#/components/schemas/JiraConnectionRequest'
    ConnectionTestRow:
      type: object
      required: [name, path, required, ok]
      properties:
        name: { type: string, description: "The probe's short identifier (e.g. myself, project_statuses:ENG)." }
        path: { type: string, description: The Jira endpoint path probed. }
        required: { type: boolean, description: Whether a real sync depends on this endpoint. }
        ok: { type: boolean }
        status: { type: integer, nullable: true, description: "The upstream HTTP status, when the probe ran." }
        code:
          type: string
          nullable: true
          description: A `JiraFetchException` code on failure (e.g. `AUTHENTICATION_FAILED`, `FORBIDDEN_SCOPE`).
        scopeHint:
          type: string
          nullable: true
          description: The Jira OAuth/API-token scope this endpoint likely needs, for a failed optional/required row.
    ConnectionTestResult:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionTestRow'
        cloudId:
          type: string
          nullable: true
          description: Resolved once the `tenant_info` probe succeeds.

    SyncJobKind:
      type: string
      enum: [SYNC, RECONCILE, REPROCESS, PURGE, DERIVE]
    SyncJobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    SyncJobRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/SyncJobKind'
          description: "`PURGE` is internal-only and rejected here with `400`."
    SyncJobResponse:
      type: object
      required:
        - id
        - connectionId
        - kind
        - status
        - priority
        - configRevision
        - requestedAt
        - attempt
        - maxAttempts
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        kind:
          $ref: '#/components/schemas/SyncJobKind'
        status:
          $ref: '#/components/schemas/SyncJobStatus'
        priority: { type: integer, description: "0 manual, 10 scheduler-enqueued." }
        requestedByUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Null for scheduler-enqueued jobs.
        configRevision: { type: integer, format: int64 }
        requestedAt: { type: integer, format: int64, description: Epoch millis }
        startedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        finishedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        leaseUntil: { type: integer, format: int64, nullable: true, description: Epoch millis }
        heartbeatAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        cancelRequestedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        currentStream: { type: string, nullable: true }
        progress:
          type: object
          nullable: true
          additionalProperties: true
        errorCode: { type: string, nullable: true }
        errorDetail: { type: string, nullable: true }
    SyncJobPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncJobResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    SyncJobActionResult:
      type: object
      required: [job, coalesced]
      properties:
        job:
          $ref: '#/components/schemas/SyncJobResponse'
        coalesced:
          type: boolean
          description: True when an already-open job for the same (connection, kind) was returned instead of a new one.

    SyncCursorSummary:
      type: object
      required: [stream, position]
      properties:
        stream: { type: string, description: "The stream's `sync_cursors.stream` key (e.g. issues, reference, reconcile)." }
        watermarkAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        position:
          type: string
          description: >-
            The stream's own raw persisted cursor JSON — an opaque, per-stream-owned diagnostic
            string, not reparsed here.
        lastCompletedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
    SyncCounts:
      type: object
      required: [rawIssues, tombstonedDeleted, tombstonedMovedOut, changelogs, worklogs, entitiesByKind, needsProcessing]
      properties:
        rawIssues: { type: integer, format: int64, minimum: 0 }
        tombstonedDeleted: { type: integer, format: int64, minimum: 0 }
        tombstonedMovedOut: { type: integer, format: int64, minimum: 0 }
        changelogs: { type: integer, format: int64, minimum: 0 }
        worklogs: { type: integer, format: int64, minimum: 0, description: Live (non-tombstoned) worklogs. }
        entitiesByKind:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        needsProcessing: { type: integer, format: int64, minimum: 0 }
    SyncStatusResponse:
      type: object
      required: [connection, cursors, counts, lastJobs]
      properties:
        connection:
          $ref: '#/components/schemas/DataSourceResponse'
        cursors:
          type: array
          items:
            $ref: '#/components/schemas/SyncCursorSummary'
        counts:
          $ref: '#/components/schemas/SyncCounts'
        lastJobs:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SyncJobResponse' }
          description: Keyed by SyncJobKind name — the most recent job of each kind ever requested for this connection.
        currentJob:
          allOf: [{ $ref: '#/components/schemas/SyncJobResponse' }]
          nullable: true

    NormalizedStatusInterval:
      type: object
      required: [seq, statusId, statusName, category, fromAtMs, source]
      properties:
        seq: { type: integer, format: int32, minimum: 1 }
        statusId: { type: string }
        statusName: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        fromAtMs: { type: integer, format: int64, description: Epoch millis }
        toAtMs: { type: integer, format: int64, nullable: true, description: "Epoch millis; null means the open (current) interval." }
        source:
          type: string
          enum: [CREATED, CHANGE]
    NormalizedFieldInterval:
      type: object
      required: [field, seq, fromAtMs]
      properties:
        field:
          type: string
          enum: [ASSIGNEE, SPRINT, FLAGGED, PARENT]
        seq: { type: integer, format: int32, minimum: 1 }
        valueId: { type: string, nullable: true }
        valueText: { type: string, nullable: true }
        fromAtMs: { type: integer, format: int64, description: Epoch millis }
        toAtMs: { type: integer, format: int64, nullable: true }
    StatusCategory:
      type: string
      enum: [TODO, IN_PROGRESS, DONE, UNKNOWN]
    RawIssueWorkItem:
      type: object
      required: [issueKey, projectKey, issueType, statusId, statusName, statusCategory, processedAt, processingVersion]
      properties:
        issueKey: { type: string }
        projectKey: { type: string }
        issueType: { type: string }
        statusId: { type: string }
        statusName: { type: string }
        statusCategory: { $ref: '#/components/schemas/StatusCategory' }
        assigneeAccountId: { type: string, nullable: true }
        hierarchyLevel:
          type: integer
          format: int32
          nullable: true
          description: An epic is level 1, from the REFERENCE stream's ISSUE_TYPE entities — never "type name = Epic".
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis at start of day UTC (the system duedate field). }
        customFields:
          type: object
          additionalProperties: true
          description: Every non-null `customfield_*` current value, keyed by field id — never filtered.
        processedAt: { type: integer, format: int64, description: Epoch millis }
        processingVersion: { type: integer, format: int32 }
        deletedAt: { type: integer, format: int64, nullable: true }
        movedOutAt: { type: integer, format: int64, nullable: true }
    RawIssueInspection:
      type: object
      required: [issueId, issueKey, fetchedAt, changedAt, sha256, needsProcessing, payload]
      properties:
        issueId: { type: integer, format: int64 }
        issueKey: { type: string }
        fetchedAt: { type: integer, format: int64, description: Epoch millis }
        changedAt: { type: integer, format: int64, description: Epoch millis }
        sha256: { type: string }
        deletedAt: { type: integer, format: int64, nullable: true }
        movedOutAt: { type: integer, format: int64, nullable: true }
        needsProcessing: { type: boolean }
        payload:
          type: object
          additionalProperties: true
          description: The `search/jql` issue document exactly as Jira returned it (canonicalized).
        changelogs:
          type: array
          items: { type: object, additionalProperties: true }
          description: Every stored changelog history for this issue, oldest first.
        worklogs:
          type: array
          items: { type: object, additionalProperties: true }
          description: This issue's non-tombstoned worklogs, exactly as Jira returned them.
        workItem:
          allOf: [{ $ref: '#/components/schemas/RawIssueWorkItem' }]
          nullable: true
          description: Null until this issue has been through PROCESS at least once.
        statusIntervals:
          type: array
          items: { $ref: '#/components/schemas/NormalizedStatusInterval' }
        fieldIntervals:
          type: array
          items: { $ref: '#/components/schemas/NormalizedFieldInterval' }
        anomalies:
          type: array
          items: { type: string, enum: [STATUS_CHANGE_BEFORE_CREATED, STATUS_CHAIN_BROKEN, STATUS_MISMATCH_WITH_CURRENT] }

    DataProfileRange:
      type: object
      required: [earliestCreatedAt, latestUpdatedAt]
      properties:
        earliestCreatedAt: { type: integer, format: int64, description: Epoch millis }
        latestUpdatedAt: { type: integer, format: int64, description: Epoch millis }
    ProjectProfile:
      type: object
      required: [projectKey, issueCounts]
      properties:
        projectKey: { type: string }
        issueCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by issue type name.
    WorkflowStatusProfile:
      type: object
      required: [statusId, name, category, transitionCount]
      properties:
        statusId: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        transitionCount:
          type: integer
          format: int64
          minimum: 0
          description: How many status-interval transitions INTO this status this project×type's own issues recorded.
    WorkflowProfile:
      type: object
      required: [projectKey, issueType, observedStatuses, referenceStatusNames]
      properties:
        projectKey: { type: string }
        issueType: { type: string }
        observedStatuses:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStatusProfile' }
        referenceStatusNames:
          type: array
          items: { type: string }
          description: This project's own workflow for this issue type, from Jira's `project/{key}/statuses`.
    BoardColumnProfile:
      type: object
      required: [name, statusNames]
      properties:
        name: { type: string }
        statusNames:
          type: array
          items: { type: string }
    BoardProfile:
      type: object
      required: [boardId, name, boardType, columns, unmappedStatusNames]
      properties:
        boardId: { type: integer, format: int64 }
        name: { type: string }
        boardType: { type: string }
        projectKey: { type: string, nullable: true }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumnProfile' }
        unmappedStatusNames:
          type: array
          items: { type: string }
          description: Statuses observed on this board's project that map to no column.
    CustomFieldProfile:
      type: object
      required: [id, name, type, nonNullCount, fillPercent, role]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: Jira's own `schema.type` for this field. }
        nonNullCount: { type: integer, format: int64, minimum: 0 }
        fillPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        role:
          type: string
          enum: [SPRINT, RANK, TEAM, STORY_POINTS, FLAGGED, OTHER]
    EstimatesProfile:
      type: object
      required: [totalIssues, storyPointsCount, storyPointsPercent, originalEstimateCount, originalEstimatePercent]
      properties:
        totalIssues: { type: integer, format: int64, minimum: 0 }
        storyPointsCount: { type: integer, format: int64, minimum: 0 }
        storyPointsPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        originalEstimateCount: { type: integer, format: int64, minimum: 0 }
        originalEstimatePercent: { type: number, format: double, minimum: 0, maximum: 100 }
    WorklogsProfile:
      type: object
      required: [count, totalHours, itemsWithWorklog, itemsWithWorklogPercent, authorCount]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        totalHours: { type: number, format: double, minimum: 0 }
        itemsWithWorklog: { type: integer, format: int64, minimum: 0 }
        itemsWithWorklogPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        authorCount: { type: integer, format: int64, minimum: 0 }
    ReopensProfile:
      type: object
      required: [count, totalIssues, percent]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        totalIssues: { type: integer, format: int64, minimum: 0 }
        percent: { type: number, format: double, minimum: 0, maximum: 100 }
    SprintsProfile:
      type: object
      required: [count, stateCounts, itemsWithSprint, itemsWithSprintPercent, carryOverCount, carryOverPercent]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        stateCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        itemsWithSprint: { type: integer, format: int64, minimum: 0 }
        itemsWithSprintPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        carryOverCount: { type: integer, format: int64, minimum: 0 }
        carryOverPercent: { type: number, format: double, minimum: 0, maximum: 100 }
    PeopleProfile:
      type: object
      required: [activeAssignees, unassignedPercent]
      properties:
        activeAssignees: { type: integer, format: int64, minimum: 0 }
        unassignedPercent: { type: number, format: double, minimum: 0, maximum: 100 }
    DataProfile:
      type: object
      required: [estimates, worklogs, reopens, sprints, people]
      properties:
        computedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null before the first PROCESS pass." }
        range:
          allOf: [{ $ref: '#/components/schemas/DataProfileRange' }]
          nullable: true
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectProfile' }
        workflows:
          type: array
          items: { $ref: '#/components/schemas/WorkflowProfile' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/BoardProfile' }
        customFields:
          type: array
          items: { $ref: '#/components/schemas/CustomFieldProfile' }
        estimates:
          $ref: '#/components/schemas/EstimatesProfile'
        worklogs:
          $ref: '#/components/schemas/WorklogsProfile'
        reopens:
          $ref: '#/components/schemas/ReopensProfile'
        sprints:
          $ref: '#/components/schemas/SprintsProfile'
        people:
          $ref: '#/components/schemas/PeopleProfile'
        anomalyCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by anomaly code (`STATUS_CHANGE_BEFORE_CREATED`/`STATUS_CHAIN_BROKEN`/`STATUS_MISMATCH_WITH_CURRENT`).

    MetricsStatusStage:
      type: object
      required: [statusId, stage]
      properties:
        statusId: { type: string }
        stage: { type: string, enum: [NOT_STARTED, IN_PROGRESS, DONE] }
    MetricsDomainStatusStage:
      type: object
      required: [domainKey, statusId, stage]
      description: "A per-domain override of the every-domain status → stage mapping: items of this domain read this stage for this status instead."
      properties:
        domainKey: { type: string, description: "A domain the same request defines (a `domains[].domainKey`, or the project key of an observed project it leaves unmapped); never empty." }
        statusId: { type: string }
        stage: { type: string, enum: [NOT_STARTED, IN_PROGRESS, DONE] }
    MetricsFieldConfig:
      type: object
      properties:
        estimateTask: { type: string, nullable: true }
        estimateEpic: { type: string, nullable: true }
        epicStart: { type: string, nullable: true }
        epicDue: { type: string, nullable: true }
        workCategory: { type: string, nullable: true }
    MetricsDomainMapping:
      type: object
      required: [projectKey, domainKey, domainName]
      properties:
        projectKey: { type: string }
        domainKey: { type: string }
        domainName: { type: string }
        ownerTeamId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: "A19/A22 — an explicitly configured owner team for this project row; every row sharing the same domainKey must agree (null or equal). Left unset on GET, it is filled with the computed board-fallback default."
    MetricsBoardTeamMapping:
      type: object
      required: [boardId, teamId]
      properties:
        boardId: { type: integer, format: int64 }
        teamId: { type: integer, format: int32, minimum: 0 }
    MetricsActivityTypeMapping:
      type: object
      required: [issueType, activityType]
      properties:
        issueType: { type: string }
        activityType: { type: string }
    MetricsWorkCategoryMapping:
      type: object
      required: [valueId, category]
      properties:
        valueId: { type: string }
        valueName: { type: string, nullable: true }
        category: { type: string }
    MetricsSprintCapacity:
      type: object
      required: [sprintId, capacityMd]
      properties:
        sprintId: { type: integer, format: int64 }
        capacityMd: { type: number, format: double, minimum: 0 }
    DataSourceMetricsConfig:
      type: object
      required: [configured, statusStages, domainStatusStages, fields, domains, boards, activityTypes, workCategories, blockedStatuses, sprintCapacities]
      properties:
        configured: { type: boolean, description: "False means every field below is a COMPUTED default, nothing is stored yet." }
        statusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusStage' }
        domainStatusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainStatusStage' }
          description: "Per-domain overrides of `statusStages` (at most one per domain and status); empty by default — a status without an override for the item's domain uses `statusStages`."
        fields:
          $ref: '#/components/schemas/MetricsFieldConfig'
        domains:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainMapping' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardTeamMapping' }
        activityTypes:
          type: array
          items: { $ref: '#/components/schemas/MetricsActivityTypeMapping' }
        workCategories:
          type: array
          items: { $ref: '#/components/schemas/MetricsWorkCategoryMapping' }
        blockedStatuses:
          type: array
          items: { type: string }
        sprintCapacities:
          type: array
          items: { $ref: '#/components/schemas/MetricsSprintCapacity' }
    DataSourceMetricsConfigRequest:
      type: object
      properties:
        statusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusStage' }
        domainStatusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainStatusStage' }
          description: "Per-domain overrides of `statusStages` (at most one per domain and status); empty by default — a status without an override for the item's domain uses `statusStages`."
        fields:
          $ref: '#/components/schemas/MetricsFieldConfig'
        domains:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainMapping' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardTeamMapping' }
        activityTypes:
          type: array
          items: { $ref: '#/components/schemas/MetricsActivityTypeMapping' }
        workCategories:
          type: array
          items: { $ref: '#/components/schemas/MetricsWorkCategoryMapping' }
        blockedStatuses:
          type: array
          items: { type: string }
        sprintCapacities:
          type: array
          items: { $ref: '#/components/schemas/MetricsSprintCapacity' }
    MetricsStatusOption:
      type: object
      required: [statusId, name, category]
      properties:
        statusId: { type: string }
        name: { type: string }
        category: { type: string, enum: [TODO, IN_PROGRESS, DONE, UNKNOWN] }
    MetricsFieldOption:
      type: object
      required: [fieldId, name, type, detectedRole]
      properties:
        fieldId: { type: string }
        name: { type: string }
        type: { type: string }
        detectedRole: { type: string, description: "SPRINT/RANK/TEAM/STORY_POINTS/FLAGGED/OTHER — `jira/JiraProfile.kt`'s detection." }
    MetricsBoardOption:
      type: object
      required: [boardId, name]
      properties:
        boardId: { type: integer, format: int64 }
        name: { type: string }
