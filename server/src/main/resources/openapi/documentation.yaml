      required: [elapsedDays, workingDays, excluded, groups]
      properties:
        elapsedDays: { $ref: '#/components/schemas/Distribution' }
        workingDays: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/CycleTimeExcluded' }
        groups:
          type: array
          description: One per owner team at UNIT level (`teamId` null = UNOWNED); empty at TEAM and USER level.
          items: { $ref: '#/components/schemas/EpicCycleTimeGroup' }
    ComparePerson:
