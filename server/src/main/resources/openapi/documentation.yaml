        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/task-estimation-accuracy:
    get:
      tags: [reports]
      operationId: getReportTaskEstimationAccuracy
      summary: Report 3 — task estimation accuracy (actual cost ÷ estimate, a distribution)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Reports 3, 4, 5". Population:
        level-0 tasks (no sub-tasks — their worklogs and estimates roll into the parent) DONE in the period
        (`done_at`); team = the D5 credit team, user = assignee at done, domain per `domainView` (default TASK).
        `atStart` is `actual_md ÷ estimate at start` (D15, the primary view), `atDone` the same over the
        estimate at done — both `Distribution`s, hidden below `minSampleSize`. A task lands in exactly ONE
        exclusion bucket (`excluded`, checked in this order): `noWorklogs` (D14 — no time logged, or so little that
        `actual_md` is 0.00; both views),
        `neverStarted` (no `started_at`, so no estimate at start — `atStart` only), `unestimatedAtStart`
        (no estimate at start, including estimated-late) / `unestimatedAtDone` (no estimate at done). So
        `atStart.n + noWorklogs + neverStarted + unestimatedAtStart = population` and
        `atDone.n + noWorklogs + unestimatedAtDone = population`. Levels: UNIT (a `domain` with no `teamId`) — `groups` one per
        credit team (`teamId` null = UNASSIGNED); `teamId` narrows to TEAM (`teamId=0` = the UNASSIGNED
        credit) and `groups` becomes one per assignee at done (null `accountId` = unassigned); `teamId` AND
        `accountId` narrow to USER, where `accountId` repeats (and on commitments, throughput, cycle time, reported
        time, adjustments, task estimates and WIP too, no other report): 1 to 8 distinct accounts, more is a 400. At USER level `atStart` and `atDone` read
        the UNION of the picked people (tasks whose assignee at done is one of them) and carry `byUser`, one share per
        picked account in request order, splitting every histogram bucket (the open tail bucket included) per person, so
        the shares sum to each bucket's count; `groups` lists each picked account with its own plain distributions, an
        empty entry when it has no task. Each group carries its own distributions and exclusion counts. For
        `lastSprints`/`sprintId` the period is the resolved sprints' overall envelope, as in throughput.
        `accuracyAtStart` / `accuracyAtDone` are the accuracy measures (`AccuracyMeasures`) over the very ratios
        `atStart` / `atDone` summarise (the union at USER level, never per person), null while that distribution is
        hidden. The relative error of a PRED / MdMRE / sMAPE reading is taken against the ACTUAL (`MRE = |actual −
        estimate| ÷ actual`), and a ratio of exactly 1 is a perfect estimate.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The task estimation accuracy report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEstimationAccuracyReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/task-estimation-accuracy/items:
    get:
      tags: [reports]
      operationId: getReportTaskEstimationAccuracyItems
      summary: The tasks behind one bar of the task-accuracy ratio histograms (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items". Takes the parent report's
        parameters (`GET /api/v1/reports/task-estimation-accuracy`, `tailPercent` included — it shapes the histogram) plus the
        bar's identity: `view` (`AT_START` — `actual_md ÷ estimate at start` over the tasks that started — or `AT_DONE` —
        over the estimate at done) and `bucketIndex`, 0-based into that distribution's `histogram` (the open tail bucket
        last). The tasks the report excludes from the view (`noWorklogs`, `neverStarted`, unestimated) are in no bar.
        `bar.count` equals `histogram[bucketIndex].count`, `bar.from`/`bar.to` its range (`to` null = the open tail); a
        listed task's `figure` is its ratio and `anchorAt` its `done_at`. Sorting, the 500 cap, `total`/`truncated`,
        `segmentAccountId` (USER level, one of the picked accounts: the person's share of the bucket, the histogram's
        `byUser` count) and the 400 matrix are those of `GET /api/v1/reports/cycle-time/items`.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportTailPercent' }
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [AT_START, AT_DONE] }
