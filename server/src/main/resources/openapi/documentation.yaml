openapi: 3.1.0
info:
  title: flow-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for Flow — a developer-intelligence app over Jira analytics.
    This scaffold exposes the generic foundation: the authentication surface, admin-managed
    user accounts (with per-user feature flags and language) and flat teams. Jira-analytics
    features land on top of this foundation.

    Authorization model: every user is implicitly a regular user; additional global roles
    (`ADMIN`) are carried as the `roles` array and only ever ADD privileges on top of that
    baseline. `ADMIN` is the management role and owns the whole `/users` and `/teams` surfaces.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8084
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: users
  - name: teams
  - name: data-sources
  - name: metrics

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: |
        Public and unauthenticated (the container HEALTHCHECK and the k8s liveness probe call it):
        `200` proves the process answers requests. It touches nothing — use `/api/v1/ready` for the
        database round trip.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: |
        Public and unauthenticated (the k8s readiness probe and the e2e global setup call it): `200`
        once a database round trip succeeds within a short budget, `503` while it does not — the pod
        leaves the Service until the database is back.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter. The in-memory lockout store admits at most
        `LOGIN_LOCKOUT_MAX_TRACKED` identities (default 10,000). At capacity a new identity
        receives `429` before password verification; existing tracked identities continue,
        and expired state frees capacity. This applies equally to existing and unknown emails.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`. The pending challenge store admits at most
        `MFA_MAX_TRACKED` challenges (default 10,000); new issuance at capacity receives
        `429` without sending a code, while existing challenges remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone, password changed — answers the uniform `401`. Rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists, or if the
        token's credential revision no longer matches the user's current credentials. Password
        changes invalidate earlier refresh tokens even within the same clock second. Legacy
        tokens without a credential revision require a fresh sign-in after upgrading to 0.14.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Normally answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a new password is generated and emailed first; only after delivery does
        its hash replace the old one (which stops working, and outstanding refresh tokens are
        invalidated). Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. The in-memory cooldown store admits
        at most `PASSWORD_RESET_MAX_TRACKED` identities (default 10,000). At capacity a new
        identity receives `429` and no reset email is scheduled; elapsed cooldowns free space.
        A soft-deleted account is unknown here (no password is minted or email sent, and the
        response follows the same acceptance and throttling rules). Answers `503` on
        deployments without outbound email (`MAIL_TRANSPORT=disabled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        and pending MFA challenges, including changes within the same clock second
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user — teams are the shared ownership/membership unit future
        features scope permissions to; every mutation below is ADMIN only.

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring), `memberId` (only teams the
          user is a member of — the caller's own id yields "my teams").
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '200':
          description: A page of teams (rosters collapsed to an active-member count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). An optional initial roster: every id must be an active user (`400` otherwise). A
        case-insensitive name clash with an active team is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new team
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team with its roster
      description: Any authenticated user. Soft-deleted members stay in the roster, flagged `deleted`.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateTeam
      summary: Rename / re-describe a team
      description: "ADMIN only, guard before the id lookup (uniform 403). The roster is managed per member below. A case-insensitive name clash with another active team is `409`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (soft)
      description: ADMIN only, guard before the id lookup. Soft delete — the name is freed for reuse.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    post:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a user to a team
      description: ADMIN only. The user must be active (`404` otherwise); an existing member is `409`.
      responses:
        '204':
          description: Added
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a user from a team
      description: ADMIN only. A membership that does not exist is `404` (a soft-deleted member's row can still be removed).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/jira-memberships:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: listTeamJiraMemberships
      summary: List a team's dated Jira-user memberships (D1)
      description: Any authenticated user (the team-reads posture). Most recent `validFrom` first.
      responses:
        '200':
          description: The team's membership rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembershipListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [metrics]
      operationId: createTeamJiraMembership
      summary: Add a dated Jira-user membership to a team
      description: |
        ADMIN only, guard before the id lookup and the body decode. The team must be active
        (`404` otherwise); `accountId` must be known to `norm.people` for some connection (`400`
        otherwise). An overlapping `[validFrom, validTo)` interval for the same account is `409`
        (the exclusion constraint — invariant 1: a Jira user belongs to at most one team at any
        instant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new membership resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembershipResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/jira-memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: membershipId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    put:
      tags: [metrics]
      operationId: updateTeamJiraMembership
      summary: Replace a dated Jira-user membership's validity window
      description: >-
        ADMIN only. A full replace of `validFrom`/`validTo` only — the team and account id are the
        row's fixed identity. An overlap with another row for the same account is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [metrics]
      operationId: deleteTeamJiraMembership
      summary: Remove a dated Jira-user membership
      description: ADMIN only. Hard delete (a pure dated join, the `team_members` idiom).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources:
    get:
      tags: [data-sources]
      operationId: listDataSources
      summary: List data sources
      description: |
        ADMIN only. An ADMIN-managed connection to an external issue tracker — Jira Cloud today
        (`kind: JIRA_CLOUD`).

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [data-sources]
      operationId: createDataSource
      summary: Create a data source
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). `jira.siteUrl` must be exactly `https://<site>.atlassian.net` (origin only — the
        outbound allow-list boundary); it becomes the connection's identity. `jira.apiToken` is
        required here and never echoed back — the response carries `jira.hasApiToken` only. A
        case-insensitive name clash with an active data source is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new data source
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/test:
    post:
      tags: [data-sources]
      operationId: testDataSourceAdHoc
      summary: Test a Jira connection before saving it
      description: |
        ADMIN only (guarded before the body decodes), rate-limited (10/min per IP, bucket
        `data-source-test`). Probes each Jira endpoint the ingestion pipeline needs in sequence
        (at most 10s each, 30s total) and NEVER answers `502` — every probe outcome is a row in
        the response, `ok: false` included. `jira.apiToken` is required here (an ad-hoc test
        before the connection is saved).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceTestRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The probe results (never a failure status — see the row shapes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [data-sources]
      operationId: testDataSourceStored
      summary: Test a saved data source's connection
      description: |
        ADMIN only, rate-limited (10/min per IP, bucket `data-source-test`). Uses the STORED,
        decrypted token — no request body. A successful `tenant_info` probe persists the
        resolved `cloudId` on the connection.
      responses:
        '200':
          description: The probe results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSource
      summary: Get a data source
      description: ADMIN only.
      responses:
        '200':
          description: The data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [data-sources]
      operationId: updateDataSource
      summary: Update a data source (full replace)
      description: |
        ADMIN only, guard before the id lookup (uniform 403). A changed `jira.siteUrl` is `409`
        — it is the connection's identity; create a new data source instead. Omitting OR
        blanking `jira.apiToken` keeps the current token; any other value rotates it (audited
        separately as `data_source.token_rotated`). Any successful update bumps
        `configRevision`. A case-insensitive name clash with another active data source is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [data-sources]
      operationId: deleteDataSource
      summary: Delete a data source (soft)
      description: >-
        ADMIN only, guard before the id lookup. Soft delete — disables the connection and frees
        its name; the raw/normalized rows are purged after a grace period once the sync-job
        queue lands (plan §0 A2).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: listSyncJobs
      summary: List a data source's sync jobs
      description: |
        ADMIN only. History and command queue for one connection (v0.2.0 plan §9).

        - Sortable fields: `id`, `requestedAt`. Default `-requestedAt` (newest first).
        - Filters: `kind` (`SYNC`/`RECONCILE`/`REPROCESS`/`PURGE`), `status`
          (`PENDING`/`RUNNING`/`SUCCEEDED`/`FAILED`/`CANCELLED`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncJobKind' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncJobStatus' }
      responses:
        '200':
          description: A page of sync jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [data-sources]
      operationId: requestSyncJob
      summary: Enqueue a sync job ("Sync now" / "Reconcile now" / "Reprocess")
      description: |
        ADMIN only (guarded before the body decodes). `400` when the connection is disabled, or
        when `kind` is `PURGE` — PURGE is scheduled internally (a soft-deleted connection past
        its grace period) and is never requester-initiated. A second request while one is already
        `PENDING`/`RUNNING` for the same `(connection, kind)` is coalesced (`202`,
        `coalesced: true`, the EXISTING job).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncJobRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted (queued or coalesced with an already-open job)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobActionResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    get:
      tags: [data-sources]
      operationId: getSyncJob
      summary: Get one sync job
      description: ADMIN only.
      responses:
        '200':
          description: The sync job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    post:
      tags: [data-sources]
      operationId: cancelSyncJob
      summary: Cancel a sync job
      description: |
        ADMIN only. `PENDING` → `CANCELLED` immediately; `RUNNING` → `cancel_requested_at` is set
        and the worker honours it cooperatively on its next heartbeat tick; an already-terminal
        job (`SUCCEEDED`/`FAILED`/`CANCELLED`) is `409`.
      responses:
        '202':
          description: Cancellation accepted (or already in effect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSourceStatus
      summary: Get a data source's sync status
      description: |
        ADMIN only, read-only (v0.2.0 plan §9). Connection summary, every persisted stream cursor
        (`reference`/`issues`/`changelogs`/`worklogs`/`reconcile` — a completed pass with nothing
        left to resume has no row, so it is simply absent), raw-store row counts, the most recent
        job of each kind, and the connection's currently RUNNING job, if any.
      responses:
        '200':
          description: The sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/raw-issues/{issueKey}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: issueKey
        in: path
        required: true
        schema:
          type: string
          # The union of the "all digits" (issue id) and issue-key branches `RawIssueInspectorRoutes.kt` accepts.
          pattern: '^([0-9]+|[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10})$'
          maxLength: 20
        description: >-
          An all-digits string is looked up by the stable Jira issue id; anything else must match
          `^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$` (e.g. `ENG-123`) or is `400`.
    get:
      tags: [data-sources]
      operationId: getRawIssue
      summary: Inspect one raw Jira issue
      description: |
        ADMIN only, read-only (v0.2.0 plan §9/§12 item 8b). The stored raw payload, its changelog
        histories and worklogs (oldest first), and — once it has been through PROCESS at least
        once — its `norm.*` shape (`workItem`, `statusIntervals`, `fieldIntervals`, `anomalies`). A
        tombstoned issue (`deletedAt`/`movedOutAt` set) is still returned, never `404`.
      responses:
        '200':
          description: The raw issue inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawIssueInspection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/profile:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSourceProfile
      summary: Get a data source's data profile
      description: |
        ADMIN only, read-only (v0.2.0 plan §8/§9/§12 item 9). SQL aggregates over this
        connection's `raw.*`/`norm.*` rows, computed by the PROFILE step after every successful
        SYNC/REPROCESS. `computedAt` is `null` before the connection's first PROCESS pass — every
        section then carries its own empty default rather than the endpoint `404`ing.
      responses:
        '200':
          description: The data profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/metrics-config:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getDataSourceMetricsConfig
      summary: Get a data source's metrics configuration
      description: |
        ADMIN only (`.claude/docs/domain-model.md` "Configuration"). `configured: false` means
        nothing is stored yet — every field is a COMPUTED default (status → stage from Jira's
        status category; the profile-detected story-points field for both estimate roles;
        `duedate` for the epic due date; 1:1 project → domain and issue type → activity type; no
        board → team mappings, blocked statuses, work categories or sprint capacities).
      responses:
        '200':
          description: The connection's effective metrics configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetricsConfig'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateDataSourceMetricsConfig
      summary: Replace a data source's metrics configuration
      description: >-
        ADMIN only, guard before the body decode. A full replace over all eight per-connection
        config tables in one transaction — every id is validated against this connection's own
        `norm` reference rows (statuses, boards, sprints, project keys, issue types) and its
        stored data profile (field ids), else `400`; a board mapped to a team already mapped
        elsewhere is `409` (D10: one board per team). Bumps the shared `configRevision` unless
        the request is byte-for-byte identical to what is already stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceMetricsConfigRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/metrics-config/options:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getDataSourceMetricsConfigOptions
      summary: Get the reference data for a data source's metrics configuration
      description: |
        ADMIN only, read-only. Statuses (with category), custom fields (with the profile's
        detected role), project keys, boards, issue types and sprints per board — the picklists
        the metrics-config editor uses. `workCategoryValues` is populated only when
        `?workCategoryField=` names a field id, from that field's own distinct observed values
        across this connection's live work items, capped at 200 (`workCategoryValuesTruncated:
        true` when more exist).
      parameters:
        - name: workCategoryField
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The metrics-config reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetricsConfigOptions'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/jira-users:
    get:
      tags: [metrics]
      operationId: listJiraUsers
      summary: List Jira accounts, distinct across connections
      description: |
        `scope=UNIT` (default) — any authenticated user, D12: only accounts already relevant to
        this unit's own data (an assignee or worklog author on an ACTIVE connection's live work
        items, or one that ever held a `metrics.team_membership` row) — the same population every
        other any-authenticated surface can already name. `scope=SITE` — ADMIN only (guard before
        any read; `403` for anyone else), the whole site directory, for picking a brand-new team
        member.

        - Sortable fields: `displayName`. Default ascending, `accountId` ascending tiebreaker.
        - Filters: `q` (case- and accent-insensitive substring on display name), `teamId`
          (that team's CURRENT membership only — combined with `scope` by set intersection).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [UNIT, SITE], default: UNIT }
      responses:
        '200':
          description: A page of Jira accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraUserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/metrics-settings:
    get:
      tags: [metrics]
      operationId: getMetricsSettings
      summary: Get the global metrics settings singleton
      description: |
        ADMIN only. The ONE `metrics.settings` row every DERIVE run reads under its
        `configRevision` — the calendar/thresholds the whole metrics layer is built against
        (`.claude/docs/domain-model.md` "Configuration"). `timeZone` defaults to `Europe/Warsaw`.
      responses:
        '200':
          description: The current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSettingsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateMetricsSettings
      summary: Replace the global metrics settings
      description: >-
        ADMIN only, guard before the body decode. A full replace — every field is required.
        Bumps `configRevision`, which (from a later commit on) enqueues a `DERIVE` job for every
        enabled connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsSettingsRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    Q:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Free-text substring filter (case- and accent-insensitive) — API-LIST-005.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint (declared here on the largest-bodied operation; field-level maxLength
        rules reject oversized values far earlier on ordinary payloads).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V18) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        memberIds:
          type: array
          maxItems: 200
          items: { type: integer, format: int32, minimum: 0 }
          description: Optional initial roster — every id must be an active user.
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
    TeamMemberResponse:
      type: object
      required: [userId, name, email, deleted]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        deleted:
          type: boolean
          description: The user was soft-deleted after joining; the row stays for the record.
    TeamResponse:
      type: object
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount:
          type: integer
          minimum: 0
          description: Active members only.
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    JiraConnectionRequest:
      type: object
      required: [siteUrl, email, projectKeys]
      properties:
        siteUrl:
          type: string
          maxLength: 253
          description: >-
            Exactly `https://<site>.atlassian.net` — origin only, no path/query/trailing slash
            (the outbound allow-list boundary). Fixed at create; a PUT changing it is `409`.
        email:
          type: string
          maxLength: 254
          description: The Jira service-account email.
        apiToken:
          type: string
          maxLength: 1000
          nullable: true
          description: >-
            Write-only. Required (non-blank) on create. On update, omitted OR blank keeps the
            current token (the SPA's masked-password field sends an empty string for
            "unchanged"); any other value rotates it. Never echoed back in any response.
        projectKeys:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}$' }
        authScheme:
          $ref: '#/components/schemas/JiraAuthScheme'
    JiraAuthScheme:
      type: string
      enum: [BASIC, BEARER]
      default: BASIC
    DataSourceRequest:
      type: object
      required: [name, syncIntervalMinutes, jira]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean, default: true }
        syncIntervalMinutes: { type: integer, minimum: 5, maximum: 1440 }
        backfillFrom:
          type: string
          format: date
          nullable: true
          description: >-
            ISO date (YYYY-MM-DD), not in the future and not more than 10 years back (nor before
            2000-01-01). Omitted computes today minus 24 months.
        reconcileHourUtc: { type: integer, minimum: 0, maximum: 23, default: 3 }
        jira:
          $ref: '#/components/schemas/JiraConnectionRequest'
    JiraConnectionResponse:
      type: object
      required: [siteUrl, email, hasApiToken, projectKeys, authScheme]
      properties:
        siteUrl: { type: string }
        email: { type: string }
        hasApiToken:
          type: boolean
          description: The token itself is never returned.
        projectKeys:
          type: array
          items: { type: string }
        authScheme:
          $ref: '#/components/schemas/JiraAuthScheme'
        cloudId:
          type: string
          nullable: true
          description: Resolved on the first successful probe/sync (not populated by this commit's CRUD).
    DataSourceState:
      type: string
      enum: [NEVER_SYNCED, CURRENT, STALE, FAILED, DISABLED]
    DataSourceStatus:
      type: object
      required: [state, consecutiveFailures]
      properties:
        state:
          $ref: '#/components/schemas/DataSourceState'
        lastSyncStartedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        lastSyncSucceededAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        lastSyncErrorCode: { type: string, nullable: true }
        consecutiveFailures: { type: integer, minimum: 0 }
        runningJobId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The connection's currently RUNNING sync job, if any.
    DataSourceResponse:
      type: object
      required:
        - id
        - kind
        - name
        - enabled
        - syncIntervalMinutes
        - backfillFrom
        - reconcileHourUtc
        - configRevision
        - jira
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kind: { type: string, enum: [JIRA_CLOUD] }
        name: { type: string }
        enabled: { type: boolean }
        syncIntervalMinutes: { type: integer }
        backfillFrom: { type: string, format: date }
        reconcileHourUtc: { type: integer }
        configRevision: { type: integer, format: int64 }
        jira:
          $ref: '#/components/schemas/JiraConnectionResponse'
        status:
          $ref: '#/components/schemas/DataSourceStatus'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DataSourcePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    DataSourceTestRequest:
      type: object
      required: [jira]
      properties:
        jira:
          $ref: '#/components/schemas/JiraConnectionRequest'
    ConnectionTestRow:
      type: object
      required: [name, path, required, ok]
      properties:
        name: { type: string, description: "The probe's short identifier (e.g. myself, project_statuses:ENG)." }
        path: { type: string, description: The Jira endpoint path probed. }
        required: { type: boolean, description: Whether a real sync depends on this endpoint. }
        ok: { type: boolean }
        status: { type: integer, nullable: true, description: "The upstream HTTP status, when the probe ran." }
        code:
          type: string
          nullable: true
          description: A `JiraFetchException` code on failure (e.g. `AUTHENTICATION_FAILED`, `FORBIDDEN_SCOPE`).
        scopeHint:
          type: string
          nullable: true
          description: The Jira OAuth/API-token scope this endpoint likely needs, for a failed optional/required row.
    ConnectionTestResult:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionTestRow'
        cloudId:
          type: string
          nullable: true
          description: Resolved once the `tenant_info` probe succeeds.

    SyncJobKind:
      type: string
      enum: [SYNC, RECONCILE, REPROCESS, PURGE]
    SyncJobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    SyncJobRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/SyncJobKind'
          description: "`PURGE` is internal-only and rejected here with `400`."
    SyncJobResponse:
      type: object
      required:
        - id
        - connectionId
        - kind
        - status
        - priority
        - configRevision
        - requestedAt
        - attempt
        - maxAttempts
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        kind:
          $ref: '#/components/schemas/SyncJobKind'
        status:
          $ref: '#/components/schemas/SyncJobStatus'
        priority: { type: integer, description: "0 manual, 10 scheduler-enqueued." }
        requestedByUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Null for scheduler-enqueued jobs.
        configRevision: { type: integer, format: int64 }
        requestedAt: { type: integer, format: int64, description: Epoch millis }
        startedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        finishedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        leaseUntil: { type: integer, format: int64, nullable: true, description: Epoch millis }
        heartbeatAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        cancelRequestedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        currentStream: { type: string, nullable: true }
        progress:
          type: object
          nullable: true
          additionalProperties: true
        errorCode: { type: string, nullable: true }
        errorDetail: { type: string, nullable: true }
    SyncJobPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncJobResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    SyncJobActionResult:
      type: object
      required: [job, coalesced]
      properties:
        job:
          $ref: '#/components/schemas/SyncJobResponse'
        coalesced:
          type: boolean
          description: True when an already-open job for the same (connection, kind) was returned instead of a new one.

    SyncCursorSummary:
      type: object
      required: [stream, position]
      properties:
        stream: { type: string, description: "The stream's `sync_cursors.stream` key (e.g. issues, reference, reconcile)." }
        watermarkAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        position:
          type: string
          description: >-
            The stream's own raw persisted cursor JSON — an opaque, per-stream-owned diagnostic
            string, not reparsed here.
        lastCompletedAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
    SyncCounts:
      type: object
      required: [rawIssues, tombstonedDeleted, tombstonedMovedOut, changelogs, worklogs, entitiesByKind, needsProcessing]
      properties:
        rawIssues: { type: integer, format: int64, minimum: 0 }
        tombstonedDeleted: { type: integer, format: int64, minimum: 0 }
        tombstonedMovedOut: { type: integer, format: int64, minimum: 0 }
        changelogs: { type: integer, format: int64, minimum: 0 }
        worklogs: { type: integer, format: int64, minimum: 0, description: Live (non-tombstoned) worklogs. }
        entitiesByKind:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        needsProcessing: { type: integer, format: int64, minimum: 0 }
    SyncStatusResponse:
      type: object
      required: [connection, cursors, counts, lastJobs]
      properties:
        connection:
          $ref: '#/components/schemas/DataSourceResponse'
        cursors:
          type: array
          items:
            $ref: '#/components/schemas/SyncCursorSummary'
        counts:
          $ref: '#/components/schemas/SyncCounts'
        lastJobs:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SyncJobResponse' }
          description: Keyed by SyncJobKind name — the most recent job of each kind ever requested for this connection.
        currentJob:
          allOf: [{ $ref: '#/components/schemas/SyncJobResponse' }]
          nullable: true

    NormalizedStatusInterval:
      type: object
      required: [seq, statusId, statusName, category, fromAtMs, source]
      properties:
        seq: { type: integer, format: int32, minimum: 1 }
        statusId: { type: string }
        statusName: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        fromAtMs: { type: integer, format: int64, description: Epoch millis }
        toAtMs: { type: integer, format: int64, nullable: true, description: "Epoch millis; null means the open (current) interval." }
        source:
          type: string
          enum: [CREATED, CHANGE]
    NormalizedFieldInterval:
      type: object
      required: [field, seq, fromAtMs]
      properties:
        field:
          type: string
          enum: [ASSIGNEE, SPRINT, FLAGGED, PARENT]
        seq: { type: integer, format: int32, minimum: 1 }
        valueId: { type: string, nullable: true }
        valueText: { type: string, nullable: true }
        fromAtMs: { type: integer, format: int64, description: Epoch millis }
        toAtMs: { type: integer, format: int64, nullable: true }
    StatusCategory:
      type: string
      enum: [TODO, IN_PROGRESS, DONE, UNKNOWN]
    RawIssueWorkItem:
      type: object
      required: [issueKey, projectKey, issueType, statusId, statusName, statusCategory, processedAt, processingVersion]
      properties:
        issueKey: { type: string }
        projectKey: { type: string }
        issueType: { type: string }
        statusId: { type: string }
        statusName: { type: string }
        statusCategory: { $ref: '#/components/schemas/StatusCategory' }
        assigneeAccountId: { type: string, nullable: true }
        hierarchyLevel:
          type: integer
          format: int32
          nullable: true
          description: An epic is level 1, from the REFERENCE stream's ISSUE_TYPE entities — never "type name = Epic".
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis at start of day UTC (the system duedate field). }
        customFields:
          type: object
          additionalProperties: true
          description: Every non-null `customfield_*` current value, keyed by field id — never filtered.
        processedAt: { type: integer, format: int64, description: Epoch millis }
        processingVersion: { type: integer, format: int32 }
        deletedAt: { type: integer, format: int64, nullable: true }
        movedOutAt: { type: integer, format: int64, nullable: true }
    RawIssueInspection:
      type: object
      required: [issueId, issueKey, fetchedAt, changedAt, sha256, needsProcessing, payload]
      properties:
        issueId: { type: integer, format: int64 }
        issueKey: { type: string }
        fetchedAt: { type: integer, format: int64, description: Epoch millis }
        changedAt: { type: integer, format: int64, description: Epoch millis }
        sha256: { type: string }
        deletedAt: { type: integer, format: int64, nullable: true }
        movedOutAt: { type: integer, format: int64, nullable: true }
        needsProcessing: { type: boolean }
        payload:
          type: object
          additionalProperties: true
          description: The `search/jql` issue document exactly as Jira returned it (canonicalized).
        changelogs:
          type: array
          items: { type: object, additionalProperties: true }
          description: Every stored changelog history for this issue, oldest first.
        worklogs:
          type: array
          items: { type: object, additionalProperties: true }
          description: This issue's non-tombstoned worklogs, exactly as Jira returned them.
        workItem:
          allOf: [{ $ref: '#/components/schemas/RawIssueWorkItem' }]
          nullable: true
          description: Null until this issue has been through PROCESS at least once.
        statusIntervals:
          type: array
          items: { $ref: '#/components/schemas/NormalizedStatusInterval' }
        fieldIntervals:
          type: array
          items: { $ref: '#/components/schemas/NormalizedFieldInterval' }
        anomalies:
          type: array
          items: { type: string, enum: [STATUS_CHANGE_BEFORE_CREATED, STATUS_CHAIN_BROKEN, STATUS_MISMATCH_WITH_CURRENT] }

    DataProfileRange:
      type: object
      required: [earliestCreatedAt, latestUpdatedAt]
      properties:
        earliestCreatedAt: { type: integer, format: int64, description: Epoch millis }
        latestUpdatedAt: { type: integer, format: int64, description: Epoch millis }
    ProjectProfile:
      type: object
      required: [projectKey, issueCounts]
      properties:
        projectKey: { type: string }
        issueCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by issue type name.
    WorkflowStatusProfile:
      type: object
      required: [statusId, name, category, transitionCount]
      properties:
        statusId: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        transitionCount:
          type: integer
          format: int64
          minimum: 0
          description: How many status-interval transitions INTO this status this project×type's own issues recorded.
    WorkflowProfile:
      type: object
      required: [projectKey, issueType, observedStatuses, referenceStatusNames]
      properties:
        projectKey: { type: string }
        issueType: { type: string }
        observedStatuses:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStatusProfile' }
        referenceStatusNames:
          type: array
          items: { type: string }
          description: This project's own workflow for this issue type, from Jira's `project/{key}/statuses`.
    BoardColumnProfile:
      type: object
      required: [name, statusNames]
      properties:
        name: { type: string }
        statusNames:
          type: array
          items: { type: string }
    BoardProfile:
      type: object
      required: [boardId, name, boardType, columns, unmappedStatusNames]
      properties:
        boardId: { type: integer, format: int64 }
        name: { type: string }
        boardType: { type: string }
        projectKey: { type: string, nullable: true }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumnProfile' }
        unmappedStatusNames:
          type: array
          items: { type: string }
          description: Statuses observed on this board's project that map to no column.
    CustomFieldProfile:
      type: object
      required: [id, name, type, nonNullCount, fillPercent, role]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: Jira's own `schema.type` for this field. }
        nonNullCount: { type: integer, format: int64, minimum: 0 }
        fillPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        role:
          type: string
          enum: [SPRINT, RANK, TEAM, STORY_POINTS, FLAGGED, OTHER]
    EstimatesProfile:
      type: object
      required: [totalIssues, storyPointsCount, storyPointsPercent, originalEstimateCount, originalEstimatePercent]
      properties:
        totalIssues: { type: integer, format: int64, minimum: 0 }
        storyPointsCount: { type: integer, format: int64, minimum: 0 }
        storyPointsPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        originalEstimateCount: { type: integer, format: int64, minimum: 0 }
        originalEstimatePercent: { type: number, format: double, minimum: 0, maximum: 100 }
    WorklogsProfile:
      type: object
      required: [count, totalHours, itemsWithWorklog, itemsWithWorklogPercent, authorCount]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        totalHours: { type: number, format: double, minimum: 0 }
        itemsWithWorklog: { type: integer, format: int64, minimum: 0 }
        itemsWithWorklogPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        authorCount: { type: integer, format: int64, minimum: 0 }
    ReopensProfile:
      type: object
      required: [count, totalIssues, percent]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        totalIssues: { type: integer, format: int64, minimum: 0 }
        percent: { type: number, format: double, minimum: 0, maximum: 100 }
    SprintsProfile:
      type: object
      required: [count, stateCounts, itemsWithSprint, itemsWithSprintPercent, carryOverCount, carryOverPercent]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        stateCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        itemsWithSprint: { type: integer, format: int64, minimum: 0 }
        itemsWithSprintPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        carryOverCount: { type: integer, format: int64, minimum: 0 }
        carryOverPercent: { type: number, format: double, minimum: 0, maximum: 100 }
    PeopleProfile:
      type: object
      required: [activeAssignees, unassignedPercent]
      properties:
        activeAssignees: { type: integer, format: int64, minimum: 0 }
        unassignedPercent: { type: number, format: double, minimum: 0, maximum: 100 }
    DataProfile:
      type: object
      required: [estimates, worklogs, reopens, sprints, people]
      properties:
        computedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null before the first PROCESS pass." }
        range:
          allOf: [{ $ref: '#/components/schemas/DataProfileRange' }]
          nullable: true
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectProfile' }
        workflows:
          type: array
          items: { $ref: '#/components/schemas/WorkflowProfile' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/BoardProfile' }
        customFields:
          type: array
          items: { $ref: '#/components/schemas/CustomFieldProfile' }
        estimates:
          $ref: '#/components/schemas/EstimatesProfile'
        worklogs:
          $ref: '#/components/schemas/WorklogsProfile'
        reopens:
          $ref: '#/components/schemas/ReopensProfile'
        sprints:
          $ref: '#/components/schemas/SprintsProfile'
        people:
          $ref: '#/components/schemas/PeopleProfile'
        anomalyCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          description: Keyed by anomaly code (`STATUS_CHANGE_BEFORE_CREATED`/`STATUS_CHAIN_BROKEN`/`STATUS_MISMATCH_WITH_CURRENT`).

    MetricsStatusStage:
      type: object
      required: [statusId, stage]
      properties:
        statusId: { type: string }
        stage: { type: string, enum: [NOT_STARTED, IN_PROGRESS, DONE] }
    MetricsFieldConfig:
      type: object
      properties:
        estimateTask: { type: string, nullable: true }
        estimateEpic: { type: string, nullable: true }
        epicStart: { type: string, nullable: true }
        epicDue: { type: string, nullable: true }
        workCategory: { type: string, nullable: true }
    MetricsDomainMapping:
      type: object
      required: [projectKey, domainKey, domainName]
      properties:
        projectKey: { type: string }
        domainKey: { type: string }
        domainName: { type: string }
    MetricsBoardTeamMapping:
      type: object
      required: [boardId, teamId]
      properties:
        boardId: { type: integer, format: int64 }
        teamId: { type: integer, format: int32, minimum: 0 }
    MetricsActivityTypeMapping:
      type: object
      required: [issueType, activityType]
      properties:
        issueType: { type: string }
        activityType: { type: string }
    MetricsWorkCategoryMapping:
      type: object
      required: [valueId, category]
      properties:
        valueId: { type: string }
        valueName: { type: string, nullable: true }
        category: { type: string }
    MetricsSprintCapacity:
      type: object
      required: [sprintId, capacityMd]
      properties:
        sprintId: { type: integer, format: int64 }
        capacityMd: { type: number, format: double, minimum: 0 }
    DataSourceMetricsConfig:
      type: object
      required: [configured, statusStages, fields, domains, boards, activityTypes, workCategories, blockedStatuses, sprintCapacities]
      properties:
        configured: { type: boolean, description: "False means every field below is a COMPUTED default, nothing is stored yet." }
        statusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusStage' }
        fields:
          $ref: '#/components/schemas/MetricsFieldConfig'
        domains:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainMapping' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardTeamMapping' }
        activityTypes:
          type: array
          items: { $ref: '#/components/schemas/MetricsActivityTypeMapping' }
        workCategories:
          type: array
          items: { $ref: '#/components/schemas/MetricsWorkCategoryMapping' }
        blockedStatuses:
          type: array
          items: { type: string }
        sprintCapacities:
          type: array
          items: { $ref: '#/components/schemas/MetricsSprintCapacity' }
    DataSourceMetricsConfigRequest:
      type: object
      properties:
        statusStages:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusStage' }
        fields:
          $ref: '#/components/schemas/MetricsFieldConfig'
        domains:
          type: array
          items: { $ref: '#/components/schemas/MetricsDomainMapping' }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardTeamMapping' }
        activityTypes:
          type: array
          items: { $ref: '#/components/schemas/MetricsActivityTypeMapping' }
        workCategories:
          type: array
          items: { $ref: '#/components/schemas/MetricsWorkCategoryMapping' }
        blockedStatuses:
          type: array
          items: { type: string }
        sprintCapacities:
          type: array
          items: { $ref: '#/components/schemas/MetricsSprintCapacity' }
    MetricsStatusOption:
      type: object
      required: [statusId, name, category]
      properties:
        statusId: { type: string }
        name: { type: string }
        category: { type: string, enum: [TODO, IN_PROGRESS, DONE, UNKNOWN] }
    MetricsFieldOption:
      type: object
      required: [fieldId, name, type, detectedRole]
      properties:
        fieldId: { type: string }
        name: { type: string }
        type: { type: string }
        detectedRole: { type: string, description: "SPRINT/RANK/TEAM/STORY_POINTS/FLAGGED/OTHER — `jira/JiraProfile.kt`'s detection." }
    MetricsBoardOption:
      type: object
      required: [boardId, name]
      properties:
        boardId: { type: integer, format: int64 }
        name: { type: string }
        projectKey: { type: string, nullable: true }
    MetricsSprintOption:
      type: object
      required: [sprintId, name, state]
      properties:
        sprintId: { type: integer, format: int64 }
        boardId: { type: integer, format: int64, nullable: true }
        name: { type: string }
        state: { type: string }
    MetricsFieldValueOption:
      type: object
      required: [valueId]
      properties:
        valueId: { type: string }
        valueName: { type: string, nullable: true }
    DataSourceMetricsConfigOptions:
      type: object
      required: [statuses, fields, projects, boards, issueTypes, workCategoryValues, workCategoryValuesTruncated, sprints]
      properties:
        statuses:
          type: array
          items: { $ref: '#/components/schemas/MetricsStatusOption' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/MetricsFieldOption' }
        projects:
          type: array
          items: { type: string }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardOption' }
        issueTypes:
          type: array
          items: { type: string }
        workCategoryValues:
          type: array
          items: { $ref: '#/components/schemas/MetricsFieldValueOption' }
        workCategoryValuesTruncated:
          type: boolean
          description: "True when the field carries more than 200 distinct values — the response shows only the first 200 (by id)."
        sprints:
          type: array
          items: { $ref: '#/components/schemas/MetricsSprintOption' }

    MetricsSettingsResponse:
      type: object
      required:
        - configRevision
        - hoursPerDay
        - timeZone
        - weekendDays
        - holidays
        - commitmentGraceMinutes
        - minSampleSize
        - agingWindowItems
        - agingPercentiles
        - backlogWindowSprints
        - epicDriftDays
        - updatedAt
        - updatedByUserId
      properties:
        configRevision: { type: integer, format: int64, minimum: 1 }
        hoursPerDay: { type: number, format: double, minimum: 0, maximum: 24, exclusiveMinimum: true }
        timeZone: { type: string, description: "An IANA zone id, e.g. Europe/Warsaw." }
        weekendDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "ISO weekday numbers, 1 (Monday) .. 7 (Sunday)."
        holidays:
          type: array
          items: { type: string, description: "ISO date (YYYY-MM-DD)." }
        commitmentGraceMinutes: { type: integer, minimum: 0 }
        minSampleSize: { type: integer, minimum: 1 }
        agingWindowItems: { type: integer, minimum: 1 }
        agingPercentiles:
          type: array
          items: { type: integer, minimum: 1, maximum: 99 }
        backlogWindowSprints: { type: integer, minimum: 1 }
        epicDriftDays: { type: integer, minimum: 0 }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        updatedByUserId: { type: integer, format: int64, minimum: 0, nullable: true }
    MetricsSettingsRequest:
      type: object
      required:
        - hoursPerDay
        - timeZone
        - weekendDays
        - holidays
        - commitmentGraceMinutes
        - minSampleSize
        - agingWindowItems
        - agingPercentiles
        - backlogWindowSprints
        - epicDriftDays
      properties:
        hoursPerDay: { type: number, format: double, minimum: 0, maximum: 24, exclusiveMinimum: true }
        timeZone: { type: string }
        weekendDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        holidays:
          type: array
          items: { type: string }
        commitmentGraceMinutes: { type: integer, minimum: 0 }
        minSampleSize: { type: integer, minimum: 1 }
        agingWindowItems: { type: integer, minimum: 1 }
        agingPercentiles:
          type: array
          items: { type: integer, minimum: 1, maximum: 99 }
        backlogWindowSprints: { type: integer, minimum: 1 }
        epicDriftDays: { type: integer, minimum: 0 }

    JiraUserResponse:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string }
        displayName: { type: string }
    JiraUserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JiraUserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    TeamMembershipListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMembershipResponse'
    TeamMembershipResponse:
      type: object
      required: [id, accountId, validFrom, validTo, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        accountId: { type: string, description: "The Jira accountId — global across connections." }
        validFrom: { type: integer, format: int64, description: Epoch millis }
        validTo: { type: integer, format: int64, nullable: true, description: "Epoch millis; null = open-ended (the current membership)." }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamMembershipCreateRequest:
      type: object
      required: [accountId, validFrom]
      properties:
        accountId: { type: string, maxLength: 100 }
        validFrom: { type: integer, format: int64 }
        validTo: { type: integer, format: int64, nullable: true }
    TeamMembershipUpdateRequest:
      type: object
      required: [validFrom]
      properties:
        validFrom: { type: integer, format: int64 }
        validTo: { type: integer, format: int64, nullable: true }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
