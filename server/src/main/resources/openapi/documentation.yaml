  /api/v1/teams/{id}/jira-memberships/seed-candidates:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: listTeamJiraMembershipSeedCandidates
      summary: Preview the people a team's Jira roster could be seeded with from an Atlassian Team
      description: |
        ADMIN only, guard before the id lookup and the query. The candidates are the ASSIGNEES of the live
        task-level issues (not deleted, not moved out of scope, on an active connection; epics and issues above them
        are not counted — the one epic/task rule) whose Atlassian Team field (`norm.work_items.team_value`) equals
        `atlassianTeamId` — site-global, so it matches across connections.
        Per person: the number of such issues, `firstSeen`/`lastSeen` (creation instants of the earliest and latest
        one) and `validFrom`, what seeding would store: the first instant of `firstSeen`'s calendar day in the
        configured metrics zone (membership dates are zone days), moved forward to the end of the person's latest
        CLOSED membership that reaches past it. `conflict` is non-null when an existing membership of the account
        (any team, this one included) still overlaps `[validFrom, ∞)` — in practice an OPEN one — and the apply would
        skip it. An assignee with no `norm.people` row is left out; an inactive person is listed. A missing `atlassianTeamId` is `400`; a missing or soft-deleted team
        is `404`. Read-only, so no audit event.
      parameters:
        - name: atlassianTeamId
          in: query
          required: true
          description: The Atlassian Team id, as listed by `GET /api/v1/jira-teams`.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: The candidates, ordered by display name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedCandidateListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/jira-memberships/seed:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [metrics]
      operationId: seedTeamJiraMemberships
      summary: Seed a team's Jira memberships from an Atlassian Team's assignees
      description: |
        ADMIN only, guard before the id lookup and the body decode. ONE transaction: the team is locked active
        (`404` otherwise), the candidates are RECOMPUTED server-side for `atlassianTeamId` (the client's list is
        only the selection) and each requested account is created as an open-ended membership starting at its
        candidate `validFrom` — through the same insert as `POST …/jira-memberships` — or skipped:
        `NOT_A_CANDIDATE` (not an assignee of that Atlassian Team's issues) or `CONFLICT` (an existing membership
        overlaps its start). `accountIds` holds 1 to 100 distinct ids. A concurrent write that slips an overlapping
        membership in between the recompute and the insert is `409` (the exclusion constraint; nothing is created).
        The rows are inserted in account-id order, so concurrent seeds cannot deadlock. The shared `config_revision`
        bumps exactly once, and only when something was created; that case is audited `team.jira_memberships_seeded`
        (counts, no names).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMembershipSeedRequest'
      responses:
        '200':
          description: What was created and what was skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembershipSeedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/capacity:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getTeamCapacity
      summary: Read a team's default capacity figure (A32)
      description: >-
        Any authenticated user. The team's ONE default sprint capacity in man-days (`defaultCapacityMd`, null = no default)
        that DERIVE uses for a sprint without a calendar (`TEAM_DEFAULT`, ahead of the members × working days default).
        `canEdit` tells the caller whether `PUT` would be accepted (ADMIN, or the team's own active manager). A missing or
        soft-deleted team is `404`.
      responses:
        '200':
          description: The team's default figure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCapacityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateTeamCapacity
      summary: Set or clear a team's default capacity figure (A32)
      description: >-
        ADMIN or the team's own active manager (`requireTeamManagerOrAdmin`), checked FIRST — before the team lookup, the
        body decode and any validation — so any other caller gets a uniform `403` whether or not the team exists (and a
        manager of ANOTHER team gets `403`); then `404` for a missing or soft-deleted team, then `400` for an invalid body
        (`defaultCapacityMd` null or 0 to 999999.99 with at most two decimals). A full replace (`null` clears the figure).
        A change bumps the shared `config_revision` (every enabled connection re-derives) and audits
        `team.capacity_default_updated`; re-sending the stored figure is a no-op `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCapacityRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated (or unchanged)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/work-category-targets:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getTeamWorkCategoryTargets
      summary: Read a team's work-category targets (Costs part 3)
      description: >-
        Any authenticated user. The team's ONE current set of work-category targets — the share of its effort each category should
        take, in whole percent — beside the categories it can choose from. `categories` lists every work category mapped (the
        metrics config's `workCategories`) on ANY ACTIVE data source — whoever owns a board there, since Costs attributes a team's
        worklogs by author team across all of them — plus the literal `UNCATEGORIZED` (the "No category" row, always offered), each with its `targetPercent` (null = no target stored) and
        `mapped`; a stored target whose category is no longer mapped comes back with `mapped: false` (the client drops it before
        saving). Ordered: mapped categories by key, `UNCATEGORIZED`, then the unmapped ones by key. An empty set (no target
        stored anywhere) means no targets are configured; `updatedAt`/`updatedByUserId` describe the last replace of a non-empty
        set (null when none is stored). A missing or soft-deleted team is `404`.
      responses:
        '200':
          description: The team's targets and its available categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamWorkCategoryTargetsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateTeamWorkCategoryTargets
      summary: Replace a team's work-category targets (Costs part 3)
      description: >-
        ADMIN only, checked FIRST — before the team lookup and the body decode — so any other caller gets a uniform `403`
        whether or not the team exists; then `404` for a missing or soft-deleted team, then `400` for an invalid body: a
        percent outside 0..100, a duplicate or blank key, a key containing control characters, a category the team cannot choose
        (not mapped on any active data source, and not `UNCATEGORIZED`), or a non-empty set whose
        percentages do not sum to exactly 100. An empty `targets` clears the set (no targets configured). A full replace, in one
        transaction under a lock on the team; it bumps no config revision and enqueues no DERIVE (targets are read at query time).
        A change audits `team.work_category_targets_updated`; re-sending the stored set is a no-op `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamWorkCategoryTargetsRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced (or unchanged)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/sprint-calendars:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: listTeamSprintCalendars
      summary: List a team's sprints with their capacity-calendar state (A32)
      description: |
        Any authenticated user. The sprints DERIVE mapped to this team (via the board → team map) on active connections —
        an unbounded synced sub-collection, hence the paged envelope. A missing or soft-deleted team is `404`.

        - Sortable fields: `id` (the sprint id), `startAt`. Default `id` ascending.
        - `hasCalendar` says whether a calendar is stored; `capacityMd`/`capacitySource` are the figures as of the last DERIVE.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of the team's sprints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintCalendarPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/sprint-calendars/{sprintId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: sprintId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 0 }
    get:
      tags: [metrics]
      operationId: getTeamSprintCalendar
      summary: Read a team's person × day capacity calendar for one sprint (A32)
      description: >-
        Any authenticated user (a conscious D12 extension: the grid is a per-person per-day availability, i.e. an absence
        calendar). The rows are the team's Jira members overlapping the sprint; the columns the sprint's calendar days in the
        configured zone. Public holidays (the `/api/v1/public-holidays` dictionary) are ALWAYS off: a day's `holiday` names it and its
        `enabled` is false whatever was stored; so is a day an earlier sprint of the team holds (lower start, ties by lower id; `claimedBy` names
        that sprint, A42). Defaults are materialized on read when nothing is stored (`hasCalendar: false`: working days counted,
        weekends/holidays off, every cell 1, coefficients carried from the team's most recent earlier calendar); a stored
        calendar is re-projected onto the sprint's CURRENT window and roster, so `capacityMd` is the capacity of THIS grid if
        saved (`derivedCapacityMd`/`derivedCapacitySource` are the figure reports use now). Each person's `coefficient` is
        shown to the team's manager and ADMINs only (`null` otherwise); `canEdit` says which. A sprint without a start date, or one spanning over 60 days, answers `window: null` with a `note` and an empty
        grid. A missing or soft-deleted team, or a sprint that is not this team's, is `404`.
      responses:
        '200':
          description: The sprint's calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintCalendarResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateTeamSprintCalendar
      summary: Replace a team's capacity calendar for one sprint (A32)
      description: >-
        ADMIN or the team's own active manager (`requireTeamManagerOrAdmin`), checked FIRST — before any lookup or the body
        decode — so any other caller (a manager of ANOTHER team included) gets a uniform `403` whether or not the team or
        sprint exists. Then `404` (team missing/soft-deleted, or the sprint is not this team's — nothing is modified), `400`
        (an invalid body, a window over 60 days, an unknown Jira account id), `409` (the sprint has no start date). The body
        is the whole document (a full replace): `days` must be exactly the sprint's window and every person's `cells` too;
        coefficients 0 to 2, availability 0 to 1, at most two decimals; a non-member account is allowed; a public-holiday day, or a day an earlier sprint of the team holds (`claimedBy`),
        sent `enabled: true` is accepted (no `400`) and counts as off. A change bumps the
        shared `config_revision` (every enabled connection re-derives) and audits `team.sprint_calendar_updated`; a canonically
        equal document is a no-op `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprintCalendarDocument'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated (or unchanged)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays:
    get:
      tags: [metrics]
      operationId: listPublicHolidays
      summary: List the public-holiday dictionary
      description: |
        Any authenticated caller. The whole dictionary (`metrics.public_holidays`), oldest date first — **unpaged**: it is an
        admin-curated, intrinsically small set (the team-memberships posture). A public holiday is never a working day: it
        feeds the one working calendar (`dim_date`, DEFAULT capacity, every report) and is locked off in capacity calendars.
      responses:
        '200':
          description: All public holidays, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHolidayList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [metrics]
      operationId: createPublicHoliday
      summary: Add a public holiday
      description: |
        ADMIN only, guard before the body decode. A strict zero-padded ISO `YYYY-MM-DD` date and a non-blank name of at most
        100 characters (trimmed; control characters are a `400`). At most one holiday per date: a duplicate is `409` (the unique
        index, no pre-check). Bumps the shared `config_revision` (every enabled connection re-derives, like a settings PUT) and
        audits `public_holiday.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicHolidayCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created - the new holiday
          headers:
            Location:
              schema: { type: string }
              description: URL of the new holiday resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHoliday'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [metrics]
      operationId: deletePublicHoliday
      summary: Delete a public holiday
      description: |
        ADMIN only, guard before the id lookup (a non-admin probe gets a uniform `403`). Hard-deletes the row (a registry
        exception to the soft-delete convention, `.claude/docs/persistence.md`), bumps the shared `config_revision` and audits
        `public_holiday.deleted`. An unknown id is `404`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources:
    get:
      tags: [data-sources]
      operationId: listDataSources
      summary: List data sources
      description: |
        ADMIN only. An ADMIN-managed connection to an external system — Jira Cloud (`kind: JIRA_CLOUD`, the `jira` block)
        or a self-managed GitLab instance (`kind: GITLAB`, the `gitlab` block). Rows of both kinds are listed, whether or not
        the kind is enabled on this server (`GET /api/v1/data-sources/kinds`).

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [data-sources]
      operationId: createDataSource
      summary: Create a data source
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). `jira.siteUrl` must be exactly `https://<site>.atlassian.net` (origin only — the
        outbound allow-list boundary); it becomes the connection's identity. `jira.apiToken` is
        required here and never echoed back — the response carries `jira.hasApiToken` only. A
        case-insensitive name clash with an active data source is `409`. Two scope rules are
        `409` as well: every active data source reads the SAME Jira site (a `jira.siteUrl` other
        than the one in use answers `type` `urn:flow:problem:data-source-other-site`), and no
        project key sits in two active data sources (a key already in another one answers
        `urn:flow:problem:data-source-project-overlap`). Both name the conflicting data source
        and, for the overlap, the shared keys in `detail`, and carry that data source's path
        (`/api/v1/data-sources/{id}`) as `instance`; a soft-deleted source holds nothing. A
        `backfillFrom` before the history horizon's first day (`historyHorizonFrom` on the metrics
        settings) is `400`; a blank one becomes today minus 24 months, or that day when it is later.

        **GitLab.** Exactly one of `jira` and `gitlab` is present (anything else is `400`); the block sets the kind, which
        never changes. `gitlab.baseUrl` is the instance origin (`https://host[:port]`, no path, query or credentials):
        it is canonicalised (lowercase host, default port dropped) and must be on the operator's `GITLAB_ALLOWED_HOSTS`
        (`400` whose `detail` names the refusal code `gitlab-host-not-allowed`, or `gitlab-disabled` when the kind is off on
        this server). `gitlab.token` is the read-only personal access token, required here, write-only, never echoed
        (the response carries `gitlab.hasToken` only). `gitlab.groupPaths` are 1-10 full group paths, trimmed, stripped of
        leading/trailing `/`, lowercased and de-duplicated; a path equal to or nested in another of the same request is `400`.
        Two scope rules are `409` as well: every active GitLab data source reads the SAME instance (a different `baseUrl`
        answers `urn:flow:problem:data-source-other-instance`), and no group path equals, sits under or contains one of
        another active GitLab data source (`urn:flow:problem:data-source-group-overlap`). Jira and GitLab sources never
        conflict with each other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new data source
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/kinds:
    get:
      tags: [data-sources]
      operationId: listDataSourceKinds
      summary: The data-source kinds this server can create
      description: |
        ADMIN only. One entry per `DataSourceKind`, in enum order, so the editor can offer only kinds that can work: Jira Cloud
        is always enabled; GitLab is enabled when the operator listed at least one host in `GITLAB_ALLOWED_HOSTS` (or runs
        a development stub). `allowedOrigins` are the origins a GitLab `baseUrl` may name (`https://host[:port]`, port
        omitted when 443; the development stub's origin too), empty when the kind is disabled and for Jira. A bounded,
        operator-curated set, so the plain `{items}` wrapper (no paging).
      responses:
        '200':
          description: The kinds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceKindsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/test:
    post:
      tags: [data-sources]
      operationId: testDataSourceAdHoc
      summary: Test a connection before saving it
      description: |
        ADMIN only (guarded before the body decodes), rate-limited (10/min per IP, bucket
        `data-source-test`). Exactly one of `jira` and `gitlab` (else `400`; a GitLab block is validated like a create,
        so a base URL off the operator's list is `400`). Probes each endpoint the ingestion pipeline needs in sequence
        (at most 10s each, 30s total) and NEVER answers `502` — every probe outcome is a row in
        the response, `ok: false` included. The block's token (`jira.apiToken`, `gitlab.token`) is required here (an
        ad-hoc test before the connection is saved). GitLab's rows, in order: `version`, `user`, `user_admin` (optional;
        `code` `NOT_ADMIN` when the token's owner is no admin, so user emails will be hidden), `token_scopes` (a token with any scope that does not start
        with `read_` and is not `admin_mode` fails it with `TOKEN_SCOPE_TOO_BROAD`, an inactive one with `TOKEN_INACTIVE`; an answer missing `scopes` or `active` is `INVALID_RESPONSE`),
        then `group:<path>` and `group_projects:<path>` per configured path, `users` and `user_emails` (optional). A GitLab
        result carries no `cloudId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceTestRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The probe results (never a failure status — see the row shapes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [data-sources]
      operationId: testDataSourceStored
      summary: Test a saved data source's connection
      description: |
        ADMIN only, rate-limited (10/min per IP, bucket `data-source-test`). Uses the STORED,
        decrypted token — no request body — and probes the data source's own kind (see the ad-hoc test for GitLab's rows). A
        successful `tenant_info` probe persists the resolved `cloudId` on a Jira connection. A GitLab data source whose kind is
        switched off on this server (no `GITLAB_ALLOWED_HOSTS`) answers `409`
        `urn:flow:problem:data-source-kind-unsupported`.
      responses:
        '200':
          description: The probe results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSource
      summary: Get a data source
      description: ADMIN only.
      responses:
        '200':
          description: The data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [data-sources]
      operationId: updateDataSource
      summary: Update a data source (full replace)
      description: |
        ADMIN only, guard before the id lookup (uniform 403). A changed `jira.siteUrl` (or, for GitLab, a `gitlab.baseUrl`
        whose canonical origin differs from the stored one) is `409`
        — it is the connection's identity; create a new data source instead. So is a block of the other kind: the kind is fixed
        at create. Omitting OR
        blanking the token (`jira.apiToken`, `gitlab.token`) keeps the current token; any other value rotates it (audited
        separately as `data_source.token_rotated`). A GitLab update is validated like a create (`400` for a base URL off the
        operator's list or while the kind is off on this server, `gitlab-disabled`); a `gitlab.groupPaths` entry equal to, under or
        above a group path of ANOTHER active GitLab data source is `409` `urn:flow:problem:data-source-group-overlap`. Any successful update bumps
        `configRevision`. A case-insensitive name clash with another active data source is `409`.
        So is a `jira.projectKeys` entry already in ANOTHER active data source (`type`
        `urn:flow:problem:data-source-project-overlap`; `detail` names that data source and the
        shared keys, `instance` is its path `/api/v1/data-sources/{id}`); the site never changes
        on update, so the one-Jira-site rule cannot fire here. A save also lifts the ceiling-trip
        pauses (SYNC's `status.pausedAt` and RECONCILE's `status.reconcilePausedAt`) with their trip counts,
        each audited as `data_source.resumed`. A `backfillFrom` that MOVES to a day before the
        history horizon's first day (`historyHorizonFrom` on the metrics settings) is `400`; the
        stored date unchanged is accepted however old it is, and a blank one becomes today minus 24
        months, or the horizon's first day when that is later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [data-sources]
      operationId: deleteDataSource
      summary: Delete a data source (soft)
      description: >-
        ADMIN only, guard before the id lookup. Soft delete — disables the connection and frees
        its name; the raw/normalized rows are purged after a grace period once the sync-job
        queue lands (plan §0 A2).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: listSyncJobs
      summary: List a data source's sync jobs
      description: |
        ADMIN only. History and command queue for one connection (v0.2.0 plan §9).

        - Sortable fields: `id`, `requestedAt`. Default `-requestedAt` (newest first).
        - Filters: `kind` (`SYNC`/`RECONCILE`/`REPROCESS`/`PURGE`), `status`
          (`PENDING`/`RUNNING`/`SUCCEEDED`/`FAILED`/`CANCELLED`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncJobKind' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncJobStatus' }
      responses:
        '200':
          description: A page of sync jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [data-sources]
      operationId: requestSyncJob
      summary: Enqueue a sync job ("Sync now" / "Reconcile now" / "Reprocess")
      description: |
        ADMIN only (guarded before the body decodes). `400` when the connection is disabled, or
        when `kind` is `PURGE` — PURGE is scheduled internally (a soft-deleted connection past
        its grace period) and is never requester-initiated. A second request while one is already
        `PENDING`/`RUNNING` for the same `(connection, kind)` is coalesced (`202`,
        `coalesced: true`, the EXISTING job). A `SYNC` request ("Sync now") also lifts the SYNC
        ceiling-trip pause with its trip count (`status.pausedAt`), a `RECONCILE` request ("Reconcile now")
        the RECONCILE one (`status.reconcilePausedAt`); each lifts only its own kind's pause, audited as
        `data_source.resumed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncJobRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted (queued or coalesced with an already-open job)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobActionResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    get:
      tags: [data-sources]
      operationId: getSyncJob
      summary: Get one sync job
      description: ADMIN only.
      responses:
        '200':
          description: The sync job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/sync-jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: jobId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    post:
      tags: [data-sources]
      operationId: cancelSyncJob
      summary: Cancel a sync job
      description: |
        ADMIN only. `PENDING` → `CANCELLED` immediately; `RUNNING` → `cancel_requested_at` is set
        and the worker honours it cooperatively on its next heartbeat tick; an already-terminal
        job (`SUCCEEDED`/`FAILED`/`CANCELLED`) is `409`.
      responses:
        '202':
          description: Cancellation accepted (or already in effect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSourceStatus
      summary: Get a data source's sync status
      description: |
        ADMIN only, read-only (v0.2.0 plan §9). Connection summary, every persisted stream cursor
        (`reference`/`issues`/`changelogs`/`worklogs`/`reconcile` — a completed pass with nothing
        left to resume has no row, so it is simply absent; an install that ran the retired TRIM step may still list a `trim` row), raw-store row counts, the most recent
        job of each kind, and the connection's open job (RUNNING, else the PENDING one the worker would claim first), if any.
      responses:
        '200':
          description: The sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/raw-issues/{issueKey}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: issueKey
        in: path
        required: true
        schema:
          type: string
          # The union of the "all digits" (issue id) and issue-key branches `RawIssueInspectorRoutes.kt` accepts.
          pattern: '^([0-9]+|[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10})$'
          maxLength: 20
        description: >-
          An all-digits string is looked up by the stable Jira issue id; anything else must match
          `^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$` (e.g. `ENG-123`) or is `400`.
    get:
      tags: [data-sources]
      operationId: getRawIssue
      summary: Inspect one raw Jira issue
      description: |
        ADMIN only, read-only (v0.2.0 plan §9/§12 item 8b). The stored raw payload, its changelog
        histories and worklogs (oldest first), and — once it has been through PROCESS at least
        once — its `norm.*` shape (`workItem`, `statusIntervals`, `fieldIntervals`, `anomalies`). A
        tombstoned issue (`deletedAt`/`movedOutAt` set) is still returned, never `404`. The stored text is
        embedded as it is stored (no tree is built); an issue whose stored text exceeds `jira.processPageBytes`
        (the figure PROCESS refuses an issue at, default 8 MiB) is `413`, answered before any of it is read. An existing
        data source that is not a Jira connection (GitLab) is `409` with `type` `urn:flow:problem:data-source-kind-unsupported`.
      responses:
        '200':
          description: The raw issue inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawIssueInspection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: >-
            The issue's stored text (payload, histories and live worklogs together) is over `jira.processPageBytes`,
            so it is too large to inspect. Constant detail; nothing of the document is echoed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/profile:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: getDataSourceProfile
      summary: Get a data source's data profile
      description: |
        ADMIN only, read-only (v0.2.0 plan §8/§9/§12 item 9). SQL aggregates over this
        connection's `raw.*`/`norm.*` rows, computed by the PROFILE step after every successful
        SYNC/REPROCESS. `computedAt` is `null` before the connection's first PROCESS pass — every
        section then carries its own empty default rather than the endpoint `404`ing.
      responses:
        '200':
          description: The data profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/code-identities:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [data-sources]
      operationId: listCodeIdentities
      summary: List a GitLab data source's identities with their mapping status
      description: |
        ADMIN only (guard first: a non-admin gets `403` whatever the id). The GitLab identities of this data source (the `norm`
        code layer's users and commit-only author addresses) beside the ADMIN decisions stored for its instance and the proposals
        computed at read time, `.claude/docs/gitlab-integration.md` "Identity". **The page carries the GitLab addresses**
        (`emails`), to ADMIN only, so an admin can judge a match. A `status` is never stored: `LINKED` (decided and linked),
        `IGNORED_OR_BOT` (decided ignored or bot), `PROPOSED` (no decision, but an address matches exactly one Jira person, or the
        identity is a bot) and `UNMAPPED` (neither). A decision whose identity no active GitLab data source on the instance still has
        (`seen: false`) is listed on its decided status, with no name, username or address; a key only another source of the instance has is not
        listed here. Sortable fields are `displayName` (the default), `username` and `id`, where `id`
        is the identity key; an absent name or username sorts last. `q` is a case- and accent-insensitive substring over the
        display name, username and addresses (at most 100 characters, else `400`; an unseen decision never matches). Filtered, sorted and paged in memory over one
        connection's identities (`list-endpoints.md`). A data source that is not a GitLab connection is `409` with `type`
        `urn:flow:problem:data-source-kind-unsupported`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CodeIdentityStatus' }
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: One page of identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeIdentityPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/code-identities/{identityKey}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: identityKey
        in: path
        required: true
        description: "`u<GitLab user id>` or `e<32 hex digits>` (a commit author address that matches no user)."
        schema: { type: string, maxLength: 40, pattern: '^(u[0-9]{1,19}|e[0-9a-f]{32})$' }
    put:
      tags: [data-sources]
      operationId: decideCodeIdentity
      summary: Decide what a GitLab identity is
      description: |
        ADMIN only, guard before everything else. Stores the decision for this identity on the data source's INSTANCE (the host),
        so it survives a re-created data source and a purge. Order of checks: `403`, `404` data source, `409` not a GitLab source,
        `400` malformed key or body, `404` the identity (none in this data source's code layer and no decision stored for the key
        either; an unseen identity with a decision may be changed), `400` unknown Jira account (`jiraAccountId` must be a person of
        an active Jira data source; a re-PUT of the account already stored is accepted). `LINKED` requires `jiraAccountId`;
        `IGNORED` and `BOT` forbid it. Answers the row as the list would now show it. An identical re-PUT is a `200` that writes
        and audits nothing; a change is audited `code_identity.decided`. A change that loses a race with a concurrent delete is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeIdentityDecisionRequest'
      responses:
        '200':
          description: The identity as the list shows it now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeIdentityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [data-sources]
      operationId: removeCodeIdentityDecision
      summary: Remove the decision about a GitLab identity
      description: |
        ADMIN only, guard first. Removes the stored decision for the key on the data source's instance (the identity becomes
        `PROPOSED` or `UNMAPPED` again), whether or not the identity is still in this data source's code layer. Audited
        `code_identity.decision_removed`. `404` when no decision is stored for the key.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/code-identities/confirm-proposals:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [data-sources]
      operationId: confirmCodeIdentityProposals
      summary: Confirm every current proposal of a GitLab data source
      description: |
        ADMIN only, guard first, no request body. Stores a `LINKED` decision for every identity whose address matches exactly one
        Jira person and a `BOT` decision for every bot, that has no stored decision yet. A decision stored meanwhile wins. The
        counts are of the decisions actually written, each audited as one `code_identity.decided` (`via` `CONFIRM_PROPOSALS`); a
        second call writes nothing, answers zeros and audits nothing.
      responses:
        '200':
          description: How many decisions were written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeIdentityConfirmResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/metrics-config:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getDataSourceMetricsConfig
      summary: Get a data source's metrics configuration
      description: |
        ADMIN only (`.claude/docs/domain-model.md` "Configuration"). `configured: false` means
        nothing is stored yet — every field is a COMPUTED default (status → stage from Jira's
        status category; the profile-detected story-points field for both estimate roles;
        `duedate` for the epic due date; 1:1 project → domain and issue type → activity type; no
        board → team mappings or work categories; no status defaults to WAITING or BLOCKED, which an admin maps by hand).
        An existing data source whose kind derives no metrics (GitLab) is `409` with `type`
        `urn:flow:problem:data-source-kind-unsupported`.
      responses:
        '200':
          description: The connection's effective metrics configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetricsConfig'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [metrics]
      operationId: updateDataSourceMetricsConfig
      summary: Replace a data source's metrics configuration
      description: >-
        ADMIN only, guard before the body decode. A full replace over all seven per-connection
        config tables in one transaction — every id is validated against this connection's own
        `norm` reference rows (statuses, boards, project keys, issue types) and its
        stored data profile (field ids), else `400`; a board mapped to a team already mapped
        elsewhere is `409` (D10: one board per team); a `domainStatusStages` override must name a
        domain the same request defines and a known status, once per (domain, status). Bumps the shared `configRevision` unless
        the request is byte-for-byte identical to what is already stored. A data source whose kind derives no metrics (GitLab) is
        `409` with `type` `urn:flow:problem:data-source-kind-unsupported`, answered before the body is read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceMetricsConfigRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/data-sources/{id}/metrics-config/options:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [metrics]
      operationId: getDataSourceMetricsConfigOptions
      summary: Get the reference data for a data source's metrics configuration
      description: |
        ADMIN only, read-only. Statuses (with category), custom fields (with the profile's
        detected role), project keys, boards and issue types — the picklists
        the metrics-config editor uses. `workCategoryValues` is populated only when
        `?workCategoryField=` names a field id, from that field's own distinct observed values
        across this connection's live work items, capped at 200 (`workCategoryValuesTruncated:
        true` when more exist). A data source whose kind derives no metrics (GitLab) is `409` with `type`
        `urn:flow:problem:data-source-kind-unsupported`.
      parameters:
        - name: workCategoryField
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The metrics-config reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceMetricsConfigOptions'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/jira-users:
    get:
      tags: [metrics]
      operationId: listJiraUsers
      summary: List Jira accounts, distinct across connections
      description: |
        `scope=UNIT` (default) — any authenticated user, D12: only accounts already relevant to
        this unit's own data (an assignee or worklog author on an ACTIVE connection's live work
        items, or one that ever held a `metrics.team_membership` row) — the same population every
        other any-authenticated surface can already name. `scope=SITE` — ADMIN only (guard before
        any read; `403` for anyone else, and likewise for any non-`UNIT` value — the guard runs
        before the value is validated), the whole site directory, for picking a brand-new team
        member.

        - Sortable fields: `displayName`. Default ascending, `accountId` ascending tiebreaker.
        - Filters: `q` (case- and accent-insensitive substring on display name OR account id; control
          characters are a `400`), `teamId`
          (that team's CURRENT membership only — combined with `scope` by set intersection).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [UNIT, SITE], default: UNIT }
      responses:
        '200':
          description: A page of Jira accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraUserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/jira-teams:
    get:
      tags: [metrics]
      operationId: listJiraTeams
      summary: List the Atlassian Teams seen on issues (the team-seeding picker)
      description: >-
        ADMIN only (guard before any read). Every distinct Atlassian Team (`team_value.id`, site-global) on a live
        work item of an active connection, with the number of such issues; a team renamed in Jira shows under the
        name of its most recently updated issue. A bounded set — a plain `{items}`, ordered by name. Read-only,
        so no audit event.
      responses:
        '200':
          description: The Atlassian Teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraTeamListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/filters:
    get:
      tags: [reports]
      operationId: getReportFilters
      summary: Get the reference data for the reports filter bar
      description: |
        Any authenticated user (D12 — everyone sees every report level). No query parameters: the
        reference data every report's own filter bar/validation reads before a report is even
        requested — active teams with the sprints their board has ever produced and their CURRENT
        Jira roster (D1, with display names), the domain/activity-type/work-category values a real
        DERIVE run has actually produced, active connections (id, name and the Jira `siteUrl` only — never other
        `settings` or the encrypted API token), and the shared `derivedAt`/`configRevision`/`minSampleSize` figures
        every report's own `meta` block also carries. Read-only — no audit event.
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The reports reference data
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportFilters'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/home:
    get:
      tags: [reports]
      operationId: getReportHome
      summary: The Home overview — one figure set per picked team (up to 3), each with its trend against the previous 90 days
      description: |
        Any authenticated user (D12), read-only, no audit — `.claude/docs/reports.md` "Home overview". `teamId` (optional, repeated,
        1 to 3 distinct) picks the teams to list; each must be a real ACTIVE team (0, a non-integer, an unknown or an inactive id,
        or four distinct ids, is a 400; duplicates collapse). Without it the first three active teams in name order are listed —
        the same for every caller, so the content never depends on who asks (the SPA computes its own default and always sends
        explicit ids). `window` is the trailing 90 days ending today in `timeZone` (the shared parser's default period, so a
        link with `from`/`to` of that window reproduces the figures) and `previousWindow` the 90 days before it. `teams` lists
        the picked teams in name order whatever the order of the picks, zero and empty figures included, each with: its last
        closed sprint (`lastSprint`, null = none), the median estimate / cycle / logged cost of the tasks done in the window
        (`granularity`), PRED(10/25/50) at start of the tasks (credit team) and epics (owner team) done in the window
        (`accuracy`), the epics and tasks in progress now with their age percentiles in working days (`wipEpics`, `wipTasks`),
        the weekly delivery with the cycle p50/p85 (`throughput`) and the counts of findings (`quality`: tasks done in the
        window, epics of the Data quality page's population). A `HomeFigure` is hidden (`value` null) under
        `meta.minSampleSize`; `previous` carries the same figure over the previous window and the `verdict` of the current one
        against it (Compare people's rule: sample-gated, a tie within the unit's tolerance reads as none). `unassigned` counts
        the work of NO active team (no team, or a soft-deleted one) — computed against every active team, never against the
        picked subset. `freshness` is each active connection's last successful ingest and DERIVE. Nothing derived reads as an
        empty overview with a null `meta.derivedAt`. The Code section (`code`, 1.44.0) is Report 21's own figures for each team
        over the same two windows (merged merge requests, their cycle p50, the open ones now with their age p50, merged without
        review), read once for all picked teams from the GitLab code layer and attributed through the admin's identity links;
        `code.sources` is Report 21's `sources[]` (empty = no active GitLab source, the section is absent and every team's `code`
        is null) and `code.overBudget` says the read exceeded `reports.codeMaxRows`, in which case the page degrades rather than
        fails (200, every team's `code` null, the Jira sections intact). The ETag also carries Report 21's GitLab stamp lines
        (empty while no GitLab source is active).
      parameters:
        - name: teamId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 3
            items: { type: integer, format: int32, minimum: 1 }
          description: Repeated — the active teams to list; 1 to 3 distinct. Absent = the first three active teams by name.
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The overview
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeOverview'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/home/items:
    get:
      tags: [reports]
      operationId: getReportHomeItems
      summary: The items behind one team's figure of the Home overview (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Home overview". `view` names the figure and `teamId`
        the team (a real active team: 0, an unknown or an inactive id is a 400). The list is produced by the overview's own fetch and
        per-item value, so `bar.count` equals the figure's `n` for a median, a percentile and a count, and the items WITHIN the share
        for a PRED (its `numerator`); `bar.sumMd` is set for `TASK_ESTIMATE` and `TASK_COST`. `figure` is the item's value (MD,
        working days, the `actual ÷ estimate` ratio, the age in working days for `WIP_*`, the epic's gap in MD for
        `QUALITY_EPICS_ESTIMATE_GAP`, otherwise the estimate), `anchorAt` its `done_at` (`started_at` for `WIP_*`); epic views are
        `itemKind` `EPIC`. A figure hidden under `minSampleSize` still lists its items. Sorted by `figure` descending, newest
        `anchorAt`, then issue key; at most 500 listed — `total` (equal to `bar.count`) says how many are behind the figure.
        The `CODE_*` views (1.44.0) list the team's merge requests behind the Code section, by Report 21's own drill over the current
        window: `CODE_MERGED` the merged ones (the merged count and the cycle p50; `figure` = the cycle in working days, `anchorAt` =
        `merged_at`), `CODE_OPEN` the open ones waiting for review (the open count and the age p50; drafts excluded, `figure` = the age
        in working days, `anchorAt` = `created_at`), `CODE_MERGED_WITHOUT_REVIEW` the merged ones with no review by another human
        (`figure` = the cycle). Their `itemKind` is `MERGE_REQUEST` and `issueKey` is `<project path>!<iid>`; the SPA links them with
        the overview's `code.sources[].baseUrl`. With no active GitLab source the list is empty; a read over `reports.codeMaxRows` is
        a 400 (the overview itself degrades instead).
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [TASK_ESTIMATE, TASK_CYCLE, TASK_COST, TASK_PRED10, TASK_PRED25, TASK_PRED50, EPIC_PRED10, EPIC_PRED25, EPIC_PRED50, WIP_TASKS, WIP_EPICS, QUALITY_TASKS_NO_ESTIMATE, QUALITY_TASKS_UNASSIGNED, QUALITY_TASKS_ESTIMATED_LATE, QUALITY_EPICS_NO_ESTIMATE, QUALITY_EPICS_NO_DATES, QUALITY_EPICS_ESTIMATE_GAP, CODE_MERGED, CODE_OPEN, CODE_MERGED_WITHOUT_REVIEW]
          description: Which figure's items.
        - name: teamId
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 1 }
          description: The team the figure belongs to (a real, active team).
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The items behind the figure
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDrillItems'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/commitments:
    get:
      tags: [reports]
      operationId: getReportCommitments
      summary: Report 1 — commitments (committed vs. final scope and capacity, per sprint)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 1 — Commitments".
        `initialMd`/`initialItems` are the committed scope, `finalMd`/`finalItems` the final scope
        (A17). `snapshot` is the frozen `fact_sprint_snapshot` figures (null until the sprint was
        first seen closed and team-mapped by a DERIVE run — D13); `drift` compares the two live vs.
        frozen (0.005 MD tolerance). `teamId` is required (`400` otherwise): this report carries no domain slice and is read per team, never for the whole unit. Levels, from the shared filter: `teamId`
        sets TEAM level, `sprints` are that one team's own sprints and `groups` is a
        per-user split (`fact_sprint_scope.assignee_at_commitment`, Σ committed/final MD — the same
        removed-row rule the team total itself follows, so Σ users == the team total); `teamId` AND
        `accountId` together narrow to USER level — `accountId` repeats here (and on throughput, cycle time,
        reported time, adjustments, task accuracy, task estimates and WIP, no other report),
        1 to 8 distinct accounts, more is a 400. `sprints` itself narrows to the picked accounts' SUMMED
        contribution (its `snapshot` is their summed frozen figures, computed from the sprint's stored
        snapshot scope by the same rule as the live ones; null when the sprint has no snapshot);
        `byUser` splits each sprint into one entry per picked account in request order (live
        figures, zeros included; empty at UNIT/TEAM level) and `groups` lists each picked account's
        period totals. `capacityMd`/`capacitySource` are the team's sprint capacity (A3, A32: the sprint's
        calendar, else the team's default figure, else members × working days; null when the sprint has none) at UNIT and TEAM
        level, always null at USER level (capacity is team-only). `teamId=0` (UNASSIGNED) is always empty — a
        sprint always carries a real team or is excluded from this report. Commitments carries no
        domain slice, so `domainView` is echoed in `meta` but never changes the result. An active or
        future sprint (`completedAt` null) is reachable only by an explicit `sprintId`: its live figures,
        `snapshot` null, `drift` false. `byEpic` splits each sprint's LIVE `initial*`/`final*` figures by the current epic
        (`dim_task.epic_id`) of every item — the 6 epics with the most final MD over the whole response (ties: initial MD, then epic key)
        as segments of their own, every other epic folded into one `OTHER_EPICS` segment, items without an epic in `NO_EPIC`; zero
        segments are omitted, the order is the same in every sprint (top epics by rank, `OTHER_EPICS`, `NO_EPIC`) and the segments add up
        to the row's `initialMd`/`finalMd` to the cent (the MD are rounded sums) and to its `initialItems`/`finalItems` exactly (at USER level: to the picked accounts' summed figures).
        The frozen `snapshot` is not split.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamIdRequired' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The commitments report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentsReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/throughput:
    get:
      tags: [reports]
      operationId: getReportThroughput
      summary: Report 2 — throughput (delivered scope per closed sprint and per time bucket)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 2 — Throughput"
        (with the item counts of report 13). Two views that differ BY DESIGN: `bySprint` is the SPRINT
        view (each team's sprints completed in the period, `fact_sprint.delivered_md/_items` — what was
        done inside the sprint while in it, priced at the sprint's close; `snapshot`/`drift` as in
        commitments); `byBucket` and `groups` are the PERIOD view (level-0 tasks — no sub-tasks — with
        `done_at` in the period, priced at their estimate at done, an unestimated task counting as an
        item worth 0 MD; team = the D5 credit team, `null` = UNASSIGNED; user = assignee at done). A
        task done after its sprint closed is in the period view only. `bucket` (default `WEEK`; weeks
        start Monday, both in the configured zone) sets the resolution of `byBucket`; `bucketStart` is
        the bucket's first day (ISO date) and empty buckets are zero-filled across the whole window.
        For a `from`/`to` period the window is exactly that range; for `lastSprints`/`sprintId` it is
        the resolved sprints' overall envelope `[min(start_at, else complete_at, else now), max(complete_at,
        else now)]` — an open sprint (no `complete_at`, reachable only by an explicit `sprintId`) ends at the
        request's now, and a future sprint yields an empty period view. `domain` (with
        `domainView`: TASK = the task's own domain, EPIC = the epic's domain as of the row's anchor (`done_at`,
        or `started_at` for worklogs, A47) with an epic-less task
        falling back to its own when `epic_domain_key` is null: the task has no epic, or its epic is not an ingested
        item — A21; an epic that moved in from a project the data source does not read is not null, its
        earlier rows read its current domain, A47), `activityType` and `workCategory` (`UNCATEGORIZED` = none)
        slice the period view only; the sprint view carries no slice. Levels: UNIT (a `domain` with no `teamId`) — `groups`
        are one per credit team (a `teamId: null` group is UNASSIGNED); `teamId` narrows to TEAM level
        (`bySprint` to that team's sprints, the period view to tasks credited to that team — `teamId=0`
        selects UNASSIGNED credit for the period view and yields no sprints) and `groups` becomes one per
        assignee at done; `teamId` AND `accountId` narrow to USER level — `accountId` repeats here (and on
        commitments, cycle time, reported time, adjustments, task accuracy, task estimates and WIP, no other report), 1 to 8 distinct accounts, more is a 400. `byBucket` sums the tasks
        whose assignee at done is one of the picked accounts and `groups` lists each picked account's period
        totals (a zero entry when it delivered nothing); `bySprint` is the picked accounts' SUMMED deliveries
        by assignee at commitment, its `snapshot` their summed frozen share computed from the sprint's stored
        snapshot scope by the same rule as the live figures — null when the sprint has no snapshot.
        `byUser` (on every `bySprint` and `byBucket` entry) splits the live figures into one entry per
        picked account in request order, zeros included; empty at UNIT/TEAM level. Σ `groups` equals Σ `byBucket`.
        `bySprint[].byEpic` splits each sprint's LIVE delivered figures by the current epic (`dim_task.epic_id`) of every delivered
        item — the 6 epics with the most delivered MD over all the listed sprints (ties: epic key) as segments of their own, every
        other epic folded into one `OTHER_EPICS` segment, items without an epic in `NO_EPIC`; zero segments are omitted, the order
        is the same in every sprint (top epics by rank, `OTHER_EPICS`, `NO_EPIC`) and the segments add up to the row's
        `deliveredMd` to the cent (the MD are rounded sums) and `deliveredItems` exactly (at USER level: the picked accounts' summed deliveries). The frozen `snapshot` and the
        period view (`byBucket`) are not split.
        `actualCostMd` (on every `bySprint` and `byBucket` entry, MD, 2 decimals) is the ACTUAL COST beside Delivered: the time logged
        (worklogs, by `started_at`) INSIDE the bucket / the sprint's dates on the scope's items, sub-task time counting toward its parent
        task, the rounded exact sum. Period view: the level-0 tasks the slice selects (team, `domain`, `activityType`, `workCategory` exactly
        as Delivered applies them; an open task by its current team) that were NOT DONE BEFORE the bucket began (still
        open, or delivered inside or after it, whether or not it had started when the time was logged), the time logged inside the bucket
        (clipped to the requested range) on them — an item running across buckets is split by log date; time logged after a task was done
        counts only in buckets that begin at or before its `done_at`. Sprint view: the tasks of the sprint's FINAL scope (delivered in it or not;
        an item removed from the sprint is not in it), the time logged between the sprint's start and end (`[start_at, complete_at)` as instants, an open
        sprint ends now; a worklog inside two overlapping sprints of a team counts in both); the sprint view applies no slice, as Delivered. At USER level it is the picked people's own logged time (worklog
        AUTHOR) on the team's items — Delivered's per-person split is by ASSIGNEE, AC's by author — summed in the row and split per
        picked account in `byUser[].actualCostMd`. The frozen `snapshot` carries no actual cost (it is live); `groups` carry none.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportBucket' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The throughput report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThroughputReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/throughput/items:
    get:
      tags: [reports]
      operationId: getReportThroughputItems
      summary: The tasks behind one bar of the throughput period chart (drill to items)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items". Takes the parent report's
        parameters (`GET /api/v1/reports/throughput`) plus the bar's identity: `bucketStart` (the bucket's first
        day, ISO date, exactly as `byBucket[].bucketStart` spells it) under the same `bucket` resolution. The list is produced
        by the report's own fetch and its own bucket rule, so `bar` is the report's bar recomputed over exactly the listed
        set: `bar.count` equals `byBucket[].deliveredItems` and `bar.sumMd` its `deliveredMd` (the unestimated tasks are items
        worth 0 MD: their `figure` is null). `figure` is the task's estimate at done in MD; `anchorAt` its `done_at`;
        `teamId` its credit team. Items are sorted by `figure` descending (nulls last), newest `anchorAt` first, then issue
        key, and at most 500 are listed — `total` (always equal to `bar.count`) says how many are behind the bar and
        `truncated` is true when that is more than were listed. `segmentAccountId` narrows the list AND the bar to one picked
        account's share (`byUser`); it needs USER level and must be one of the picked `accountId`s, else 400. Without
        `bucketStart` a `sprintId` period selects the SPRINT mode: the items that sprint delivered (the sprint chart's bar,
        `bySprint[]`) — exactly `GET /api/v1/reports/sprint-consistency/items?bucket=DELIVERED` without the activity/category
        slice, which the sprint view does not carry; anything else without `bucketStart` is a 400 ("bucketStart or a sprintId
        period is required"). A `bucketStart` that is not the first day of a bucket the report draws inside the period is a 400 too.
        In the sprint mode `epicSegment` (an epic's issue id, `NO_EPIC` or `OTHER_EPICS` with the chart's `topEpicId`s) narrows the list
        AND the bar to one segment of `bySprint[].byEpic`, exactly as on `GET /api/v1/reports/sprint-consistency/items`; with
        `bucketStart` (the period bars, which are not split by epic) it is a 400.
        `measure=ACTUAL_COST` lists instead the tasks behind the ACTUAL COST figure of the same bar (`byBucket[].actualCostMd` for a
        `bucketStart`, `bySprint[].actualCostMd` for a `sprintId` period without one), in the shape of
        `GET /api/v1/reports/costs/items`: one row per task (sub-task time rolled up to its parent), `figure` the MD logged on it
        inside the bar, `anchorAt` the latest `started_at` among those worklogs, `assignee` its authors' display names (largest first;
        `accountId` only for exactly one author), `teamId` null; `bar.sumMd` is the rounded exact sum, i.e. the chart's `actualCostMd`.
        At USER level only the picked authors' time is listed and `segmentAccountId` narrows to one person's (`byUser[].actualCostMd`).
        `epicSegment` is a 400 with this measure.
        **Scope:** `teamId` or `domain` is required (`400` otherwise): a report is read per team or per domain, never for the whole unit.
        The sprint mode (a `sprintId` period with no `bucketStart`) additionally needs `teamId` (`400` otherwise): a sprint's items are read for the sprint's own team.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamId' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportDomain' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/ReportBucket' }
        - name: bucketStart
          in: query
          required: false
          schema: { type: string, format: date }
          description: The bucket's first day (ISO date, as `byBucket[].bucketStart`). Without it a `sprintId` period selects the sprint-delivered mode (400 when there is none).
        - name: measure
          in: query
          required: false
          schema: { type: string, enum: [DELIVERED, ACTUAL_COST], default: DELIVERED }
          description: "What the bar is: the delivered tasks (default) or the worklogs' tasks behind its actual cost."
        - { $ref: '#/components/parameters/ReportDrillSegmentAccountId' }
        - { $ref: '#/components/parameters/ReportDrillEpicSegment' }
        - { $ref: '#/components/parameters/ReportDrillTopEpicId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportDrillItemsOk' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/sprint-consistency:
    get:
      tags: [reports]
      operationId: getReportSprintConsistency
      summary: Reports 6.1-6.3 — sprint consistency (committed, added, removed, final, delivered, carried over, dropped per sprint)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/measures.md` "Report 6" (with the item
        counts of report 13). Every sprint bucket in MD and items, straight off `fact_sprint`: committed,
        added, removed (in no other bucket), final, delivered, carried over and dropped — A17 partition:
        final = delivered + carried over + dropped always, and committed + added = final in items. `snapshot`
        is the frozen `fact_sprint_snapshot` figures (null until the sprint was first seen closed and
        team-mapped by a DERIVE run — D13); `drift` is true when any live figure differs from it (0.005 MD
        tolerance, item counts exactly). Same period/level semantics as commitments: `teamId` is required (`400` otherwise): this report carries no domain slice and is read per team, never for the whole unit. `teamId` sets
        TEAM level, `sprints` are that team's own sprints and
        `groups` is a per-user split (`fact_sprint_scope.assignee_at_commitment`, the same bucket
        predicates the team figures use, so Σ groups == the team figures for every bucket; a null
        `accountId` is the unassigned-at-commitment bucket); `teamId` AND `accountId` narrow to USER level —
        `sprints` narrows to that account's own rows per sprint (its `snapshot` is that account's frozen
        figures, computed from the sprint's stored snapshot scope by the same bucket predicates as the live
        ones — null when the sprint has no snapshot — and `drift` compares the two) and `groups` is empty. `teamId=0` (UNASSIGNED) is always empty. An active or future sprint
        (`completedAt` null) is reachable only by an explicit `sprintId`: its live figures, `snapshot` null.
        `activityType` / `workCategory` (`UNCATEGORIZED` = no category) SLICE every figure at every level: the
        figures are re-derived live from the sprint's scope rows joined to the task (an item with no task row
        has neither attribute and drops out), through the same bucket predicates, so the slices over every
        activity type sum to the unsliced figures. The frozen snapshot is unsliced, so a sliced response always
        has `snapshot` null and `drift` false at every level. Without either parameter the response is unchanged.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamIdRequired' }
        - { $ref: '#/components/parameters/ReportAccountId' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The sprint consistency report
          headers:
            ETag: { $ref: '#/components/headers/ReportETag' }
            Cache-Control: { $ref: '#/components/headers/ReportCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintConsistencyReport'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/sprint-consistency/items:
    get:
      tags: [reports]
      operationId: getReportSprintConsistencyItems
      summary: The tasks behind one sprint bucket of one sprint (drill to items, shared by Commitments, Throughput, Sprint consistency and Home)
      description: |
        Any authenticated user (D12), read-only — `.claude/docs/reports.md` "Drill to items". Takes the parent report's
        parameters (`GET /api/v1/reports/sprint-consistency`) plus the bar's identity: a `sprintId` period (REQUIRED — one
        sprint; any other period is a 400) and `bucket` (REQUIRED — one of the seven scope buckets). One route serves every
        sprint-scope bar because those bars are the same rows: Commitments' initial/final are COMMITTED/FINAL, Throughput's
        sprint view is DELIVERED, Sprint consistency shows all seven. Unlike its parent this route takes several `accountId`s
        (1..8, repeated), because Commitments' and Throughput's stacked USER-level segments need them. The list is the sprint's
        `fact_sprint_scope` rows kept by the SAME per-bucket predicate `fact_sprint` is summed by (the removed rows list under
        REMOVED only), so `bar` is the report's bar recomputed over exactly the listed set: `bar.count` equals the sprint's
        `<bucket>Items` and `bar.sumMd` its `<bucket>Md`. `figure` is the bucket's estimate column in MD (at commitment for
        COMMITTED/ADDED/REMOVED, at close for FINAL/CARRIED_OVER/DROPPED, at done for DELIVERED; null = unestimated, an item
        worth 0 MD); `anchorAt` the sprint's `completedAt` (null while it is open); `accountId`/`assignee` the assignee at
        commitment, which is also what picked accounts and `segmentAccountId` narrow by. `activityType` / `workCategory`
        slice the rows live, exactly as the parent's sliced figures. Sorted, capped and `total`/`truncated` as every drill list.
        `segmentAccountId` needs USER level and must be one of the picked `accountId`s, else 400. `epicSegment` (an epic's issue id,
        `NO_EPIC` or `OTHER_EPICS` with the chart's `topEpicId`s) narrows the list AND the bar to one segment of a by-epic chart
        (`byEpic[]` of Commitments / Throughput), so `bar` equals that segment's figure; it composes with `segmentAccountId`.
        **Scope:** `teamId` is required (`400` otherwise): this report carries no domain slice and is read per team, never for the whole unit.
      parameters:
        - { $ref: '#/components/parameters/ReportFrom' }
        - { $ref: '#/components/parameters/ReportTo' }
        - { $ref: '#/components/parameters/ReportLastSprints' }
        - { $ref: '#/components/parameters/ReportSprintId' }
        - { $ref: '#/components/parameters/ReportTeamIdRequired' }
        - { $ref: '#/components/parameters/ReportAccountIds' }
        - { $ref: '#/components/parameters/ReportDomainView' }
        - { $ref: '#/components/parameters/ReportActivityType' }
        - { $ref: '#/components/parameters/ReportWorkCategory' }
        - { $ref: '#/components/parameters/ReportConnectionId' }
        - name: bucket
          in: query
          required: true
          schema: { type: string, enum: [COMMITTED, ADDED, REMOVED, FINAL, DELIVERED, CARRIED_OVER, DROPPED] }
          description: Which sprint bucket's items to list. Required (400 without it).
        - { $ref: '#/components/parameters/ReportDrillSegmentAccountId' }
        - { $ref: '#/components/parameters/ReportDrillEpicSegment' }
        - { $ref: '#/components/parameters/ReportDrillTopEpicId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
