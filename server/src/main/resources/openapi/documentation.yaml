    TaskAccuracyExcluded:
      type: object
      description: >-
        DONE level-0 tasks a task-accuracy read could not turn into a ratio, each in ONE bucket
        (`noWorklogs` first — D14, incl. `actual_md` of 0.00, both views; then `neverStarted` — `atStart` only; then
        `unestimatedAtStart` / `unestimatedAtDone`). `atStart.n + noWorklogs + neverStarted +
        unestimatedAtStart = population`; `atDone.n + noWorklogs + unestimatedAtDone = population`.
      required: [population, noWorklogs, neverStarted, unestimatedAtStart, unestimatedAtDone]
      properties:
        population: { type: integer, minimum: 0 }
        noWorklogs: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        unestimatedAtStart: { type: integer, minimum: 0 }
        unestimatedAtDone: { type: integer, minimum: 0 }
    TaskAccuracyGroup:
      type: object
      description: >-
        A credit team (UNIT level; `teamId` null = UNASSIGNED, `accountId` null) or an assignee at done
        (TEAM level; a null `accountId` with a null `label` is the unassigned bucket) or, at USER level,
        one picked account (an empty entry when it has no task).
      required: [teamId, accountId, label, atStart, atDone, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        atStart: { $ref: '#/components/schemas/Distribution' }
        atDone: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/TaskAccuracyExcluded' }
    AccuracyMeasures:
      type: object
      description: >-
        The accuracy measures of an estimate-vs-actual ratio sample (`r = actual ÷ estimate`), unrounded. The
        relative error is taken against the ACTUAL: `MRE = |actual − estimate| ÷ actual = |1 − 1/r|`.
        `pred10` / `pred25` / `pred50` are the shares of items with MRE at most 10% / 25% / 50% (the boundary
        counts as within); `mdmre` the median MRE; `smape` the mean of `2|r − 1| ÷ (r + 1)` (0 to 2); `iqr` =
        p75 − p25, `idr` = p90 − p10 and `mad` = the median of `|r − median r|` (unscaled) of the ratios;
        `tailShare` the share of ratios beyond two sample standard deviations of the mean (a normal distribution
        has about 4.6% there), null for fewer than six items (with the sample SD no point can lie two SDs out below that, so
        the share would always read 0) or a constant sample.
      required: [pred10, pred25, pred50, mdmre, smape, iqr, idr, mad, tailShare]
      properties:
        pred10: { type: number, format: double, minimum: 0, maximum: 1 }
        pred25: { type: number, format: double, minimum: 0, maximum: 1 }
        pred50: { type: number, format: double, minimum: 0, maximum: 1 }
        mdmre: { type: number, format: double, minimum: 0 }
        smape: { type: number, format: double, minimum: 0, maximum: 2 }
        iqr: { type: number, format: double, minimum: 0 }
        idr: { type: number, format: double, minimum: 0 }
        mad: { type: number, format: double, minimum: 0 }
        tailShare: { type: number, format: double, minimum: 0, maximum: 1, nullable: true }
    TaskEstimationAccuracyReport:
      type: object
      required: [meta, atStart, atDone, excluded, groups, accuracyAtStart, accuracyAtDone]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        atStart:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ estimate at start` (D15) per DONE level-0 task."
        atDone:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ estimate at done` per DONE level-0 task."
        excluded: { $ref: '#/components/schemas/TaskAccuracyExcluded' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/TaskAccuracyGroup' }
        accuracyAtStart:
          allOf: [{ $ref: '#/components/schemas/AccuracyMeasures' }]
          nullable: true
          description: The accuracy measures over the ratios `atStart` summarises; null while it is hidden.
        accuracyAtDone:
          allOf: [{ $ref: '#/components/schemas/AccuracyMeasures' }]
          nullable: true
          description: The accuracy measures over the ratios `atDone` summarises; null while it is hidden.

    TaskEstimatesExcluded:
      type: object
      description: >-
        DONE level-0 tasks a task-estimates read could not draw, each in ONE bucket (`neverStarted` first — `atStart` only —
        then `unestimatedAtStart` / `unestimatedAtDone`). No `noWorklogs` bucket: the measure is the estimate itself.
        `atStart.n + neverStarted + unestimatedAtStart = population`; `atDone.n + unestimatedAtDone = population`.
      required: [population, neverStarted, unestimatedAtStart, unestimatedAtDone]
      properties:
        population: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        unestimatedAtStart: { type: integer, minimum: 0 }
        unestimatedAtDone: { type: integer, minimum: 0 }
    TaskEstimatesGroup:
      type: object
      description: >-
        A credit team (UNIT level; `teamId` null = UNASSIGNED, `accountId` null) or an assignee at done
        (TEAM level; a null `accountId` with a null `label` is the unassigned bucket) or, at USER level,
        one picked account (an empty entry when it has no task).
      required: [teamId, accountId, label, atDone, atStart, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        atDone: { $ref: '#/components/schemas/Distribution' }
        atStart: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/TaskEstimatesExcluded' }
    TaskEstimatesReport:
      type: object
      required: [meta, atDone, atStart, excluded, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        atDone:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "The estimate at done, in MD, per DONE level-0 task (the primary view)."
        atStart:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "The estimate at start, in MD, per DONE level-0 task that started."
        excluded: { $ref: '#/components/schemas/TaskEstimatesExcluded' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/TaskEstimatesGroup' }

    EpicAccuracyExcluded:
      type: object
      description: >-
        DONE epics an accuracy read could not turn into a ratio, each in ONE bucket (`noActual` first,
        then `neverStarted` — `atStart` only — then `unestimatedAtStart` / `unestimatedAtDone`).
        `atStart.n + noActual + neverStarted + unestimatedAtStart = population`;
        `atDone.n + noActual + unestimatedAtDone = population`.
      required: [population, noActual, neverStarted, unestimatedAtStart, unestimatedAtDone]
      properties:
        population: { type: integer, minimum: 0 }
        noActual: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        unestimatedAtStart: { type: integer, minimum: 0 }
        unestimatedAtDone: { type: integer, minimum: 0 }
    EpicAccuracyRow:
      type: object
      description: >-
        One DONE epic in scope. `ratio` is `actualMd ÷ ownEstimateAtStartMd` (D15), `ratioAtDone` the same
        at done — each null when the epic is excluded from that distribution. `childSumMd` is the sum of
        the child estimates, shown beside the own estimate.
      required: [issueKey, summary, ownerTeamId, doneAt, ownEstimateAtStartMd, ownEstimateAtDoneMd, childSumMd, actualMd, ratio, ratioAtDone]
      properties:
