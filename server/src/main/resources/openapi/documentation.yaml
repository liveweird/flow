        workCategory:
          type: array
          items: { $ref: '#/components/schemas/CompareMixRow' }
        domain:
          type: array
          items: { $ref: '#/components/schemas/CompareMixRow' }
    ComparePeopleCapacity:
      type: object
      description: 'Present ONLY for an ADMIN or the active manager of every team either person belonged to in the period (A39); it travels with the four capacity rows.'
      required: [days]
      properties:
        days: { type: integer, format: int32, minimum: 0, description: 'The period days up to today (a day after today counts no capacity).' }
    CompareWipDays:
      type: object
      required: [workingDays]
      properties:
        workingDays: { type: integer, format: int32, minimum: 0, description: "The working days among the listed days: what `avgWip` averages over." }
        firstDay: { type: string, format: date, description: "The first listed day; absent when none is listed." }
        lastDay: { type: string, format: date, description: "The last listed day (where `wipAtEnd*` are read); absent when none is listed." }
    ComparePeopleReport:
      type: object
      required: [meta, people, rows, cycleTime, workMix, wipDays]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        people:
          type: array
          minItems: 2
          maxItems: 2
          description: "Side A then side B, in request order."
          items: { $ref: '#/components/schemas/ComparePerson' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CompareRow' }
        cycleTime: { $ref: '#/components/schemas/CompareCycleTime' }
        workMix: { $ref: '#/components/schemas/CompareWorkMix' }
        capacity: { $ref: '#/components/schemas/ComparePeopleCapacity' }
        wipDays: { $ref: '#/components/schemas/CompareWipDays' }
        note: { type: string, description: "Why the WIP rows are empty or partial; absent otherwise." }

    PersonTrendTeam:
      type: object
      description: A team as the reference line names it.
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
    PersonTrendReference:
      type: object
      description: The team reference of one row at one point - the median of the person's peers' cells in the window.
      required: [peers]
      properties:
        value: { type: number, format: double, description: "The median (`percentile_cont(0.5)`) of the contributing peers' values; absent when fewer than 3 peers contributed." }
        peers: { type: integer, format: int32, minimum: 0, description: "How many peers contributed: those members of the reference team that were active in the window and whose cell shows a value (not hidden, with a denominator)." }
    PersonTrendWindow:
      type: object
      description: One window of the grid, `from`..`end` inclusive ISO dates in the configured zone (90 days).
      required: [end, from, coverage]
      properties:
        end: { type: string, format: date }
        from: { type: string, format: date }
        team:
          allOf: [{ $ref: '#/components/schemas/PersonTrendTeam' }]
          description: "The point's reference team: the one the person belonged to on `end` (the most days inside the window, then the lowest id, if several memberships cover that day); absent when no membership covers `end`."
        coverage:
          type: string
          enum: [FULL, PARTIAL, NONE]
          description: "FULL = all of it is covered; PARTIAL = it starts before the backfill start or ends after the last derived day; NONE = nothing derived or wholly outside that span."
    PersonTrendPoint:
      type: object
      description: The person's cell of the row over the window ending `end` — Compare people's `{value, n, hidden}`.
      required: [end, n, hidden]
      properties:
        end: { type: string, format: date }
        value: { type: number, format: double, description: "Absent when `hidden` or when the figure has no denominator." }
        n: { type: integer, format: int32, minimum: 0 }
        hidden: { type: boolean }
        reference:
          allOf: [{ $ref: '#/components/schemas/PersonTrendReference' }]
          description: "The team's reference for this row and window: present exactly when the window has a `team`; never on the work mix."
    PersonTrendCue:
      type: object
      description: The first against the last point with a FULL window and a shown value.
      required: [fromEnd, toEnd]
      properties:
        fromEnd: { type: string, format: date }
        toEnd: { type: string, format: date }
        verdict: { type: string, enum: [BETTER, WORSE], description: "The last point against the first by the row's `direction`; absent on a tie within `tolerance` or when a side is under `minSampleSize` (not on a pure item count)." }
        difference: { type: number, format: double, description: "The last value minus the first." }
    PersonTrendRow:
      type: object
      required: [key, group, unit, direction, tolerance, points]
      properties:
        key:
          type: string
          enum:
            - cycleWorkingDaysP50
            - cycleWorkingDaysP90
            - flowEfficiencyP50
            - deliveredItems
            - deliveredMd
            - accuracyAtStartPred25
            - avgWip
            - wipAtEndMedianAgeWd
            - blockedItemsShare
            - worklogCoverage
            - lateLoggingShare
            - noEstimateShare
            - reopenedShare
            - taskSizeP50
            - mrsMerged
            - mrCycleWorkingDaysP50
            - reviewsGiven
        group: { type: string, enum: [DELIVERY, CYCLE, ESTIMATION, WIP, TIME, QUALITY, CODE] }
        unit: { type: string, enum: [MD, MD_PER_MD, ITEMS, ITEMS_PER_DAY, ITEMS_PER_MD, DAYS, LINES, RATIO, SHARE] }
        direction: { type: string, enum: [HIGHER, LOWER, TARGET, NEUTRAL] }
        target: { type: number, format: double, description: "Only on a TARGET row." }
        tolerance: { type: number, format: double, description: "The gap in `unit` below which two values are a tie." }
        drill:
          type: string
          enum: [DELIVERED, CYCLE_WORKING_DAYS, CYCLE_ELAPSED_DAYS, REPORTED_TIME_RATIO, FLOW_EFFICIENCY, ACCURACY_AT_START, ACCURACY_AT_DONE, ADJUSTED, ADJUSTMENT_CHANGE, WIP_TASK_DAYS, WIP_AT_END, BLOCKED, LOGGED, FOREIGN, LATE, NO_WORKLOGS, NO_ESTIMATE, TASK_SIZE, REOPENED, COMMITS, MRS_MERGED, MR_CYCLE_WORKING_DAYS, MR_SIZE_LINES, REVIEWS_GIVEN, APPROVALS_GIVEN, COMMENTS]
          description: "The Compare people `view` that lists the items behind this figure (over one window); `GET /api/v1/reports/person-trend/items` lists them for a point."
        points:
          type: array
          description: One per window, in the order of `windows`.
          items: { $ref: '#/components/schemas/PersonTrendPoint' }
        trend: { $ref: '#/components/schemas/PersonTrendCue' }
    PersonTrendMixPoint:
      type: object
      required: [end, md]
      properties:
        end: { type: string, format: date }
        md: { type: number, format: double, description: "The man-days delivered under the key in the window (2 decimals, from the exact sum); 0 where nothing was." }
        share: { type: number, format: double, description: "`md` over all of the window's delivered man-days (0..1); absent when the window delivered none." }
    PersonTrendMixSeries:
      type: object
      required: [key, points]
      properties:
        key: { type: string, description: "The activity type or work category (`UNCATEGORIZED` = none)." }
        points:
          type: array
          description: One per window, in the order of `windows`.
          items: { $ref: '#/components/schemas/PersonTrendMixPoint' }
    PersonTrendWorkMix:
      type: object
      description: Context, not a measure; each list is ordered by the key's total man-days descending, then key.
      required: [activityType, workCategory]
      properties:
        activityType:
          type: array
          items: { $ref: '#/components/schemas/PersonTrendMixSeries' }
        workCategory:
          type: array
          items: { $ref: '#/components/schemas/PersonTrendMixSeries' }
    PersonTrendReport:
      type: object
      required: [meta, person, windowDays, stepDays, windows, rows, workMix]
      properties:
        meta:
          allOf: [{ $ref: '#/components/schemas/ReportMeta' }]
          description: "`from`/`to` are the requested range (the days the points sit on); the first window reaches `windowDays` - 1 days before `from`."
        person: { $ref: '#/components/schemas/ComparePerson' }
        windowDays: { type: integer, format: int32, description: "The length of each window: 90." }
        stepDays: { type: integer, format: int32, description: "The distance between two points: 14." }
        windows:
          type: array
          minItems: 1
          maxItems: 79
          items: { $ref: '#/components/schemas/PersonTrendWindow' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PersonTrendRow' }
        workMix: { $ref: '#/components/schemas/PersonTrendWorkMix' }
        note: { type: string, description: "Why the WIP rows are empty or partial; absent otherwise." }

    CodeActivityReport:
      type: object
      required: [meta, sources, quality, flow, open, groups]
      properties:
        meta:
          allOf: [{ $ref: '#/components/schemas/ReportMeta' }]
          description: "The JIRA star's (`derivedAt`, `configRevision`): the roster, names and sprints come from it. The code figures' freshness is `sources`."
        sources:
          type: array
          items: { $ref: '#/components/schemas/CodeActivitySource' }
          description: The GitLab sources read, in connection order; empty while no GitLab source is active.
        quality: { $ref: '#/components/schemas/CodeActivityQuality' }
        flow: { $ref: '#/components/schemas/CodeActivityFlow' }
        open: { $ref: '#/components/schemas/CodeActivityOpen' }
        review:
          allOf: [{ $ref: '#/components/schemas/CodeActivityReview' }]
          description: Absent while no merged merge request has its details read.
        groups:
          type: array
          items: { $ref: '#/components/schemas/CodeActivityGroup' }
          description: The per-member volumes. NEUTRAL context — no tint, rank or verdict.
    CodeActivitySource:
      type: object
      required: [connectionId, name, baseUrl, commitFilesPending, mrDetailsPending]
      properties:
        connectionId: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        baseUrl: { type: string, description: "The organisation's own GitLab origin (D12); the drill links to commits and merge requests build on it." }
        lastSyncAt: { type: integer, format: int64, description: "Epoch millis of the last successful sync; absent before the first." }
        commitFilesPending: { type: integer, format: int64, minimum: 0, description: "Commits whose files are still unread, as of the last data profile (their counted lines are unknown meanwhile)." }
        mrDetailsPending: { type: integer, format: int64, minimum: 0, description: "Merge requests whose details are still unread, as of the last data profile." }
    CodeActivityQuality:
      type: object
      description: What the sources hold that no figure can use, connection-wide for the period.
      required: [unlinkedIdentities, unlinkedCommits, unlinkedMergeRequests, unlinkedEvents, commitsLinesUnknown, mrsSizeUnknown, mrsDetailsNotRead, eventsUndated]
      properties:
        unlinkedIdentities: { type: integer, format: int32, minimum: 0, description: "Identity keys with activity in the period and NO decision at all (the ones that need an administrator); a key decided BOT or IGNORED counts nowhere." }
        unlinkedCommits: { type: integer, format: int64, minimum: 0, description: "Their non-merge commits committed in the period." }
        unlinkedMergeRequests: { type: integer, format: int64, minimum: 0, description: "Their merge requests created or merged in the period." }
        unlinkedEvents: { type: integer, format: int64, minimum: 0, description: "Their dated acts on live merge requests in the period." }
        commitsLinesUnknown: { type: integer, format: int64, minimum: 0, description: "Non-merge commits of the period with an unknown counted figure (left out of every sum, never zero)." }
        mrsSizeUnknown: { type: integer, format: int64, minimum: 0, description: "Merge requests merged in the period with an unknown diff total (left out of the size figures, never zero)." }
        mrsDetailsNotRead: { type: integer, format: int64, minimum: 0, description: "Merge requests merged in the period whose details were not read (left out of the review figures, never 'unreviewed')." }
        eventsUndated: { type: integer, format: int64, minimum: 0, description: "Events with no time on the merge requests created or merged in the period (in no period)." }
    CodeActivityShare:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int32, minimum: 0 }
        share: { type: number, format: double, minimum: 0, maximum: 1, description: "The count over the merged merge requests whose details were read; absent when there is none." }
    CodeActivityWeek:
      type: object
      required: [bucketStart, merged]
      properties:
        bucketStart: { type: string, format: date, description: "The Monday that starts the week in the configured zone." }
        merged: { type: integer, format: int32, minimum: 0 }
    CodeActivityFlow:
      type: object
      required: [merged, closedUnmerged, cycleWorkingDays, cycleElapsedDays, timeToFirstReviewWorkingDays, sizeLines, sizeFiles, mergedWithoutReview, mergedWithoutApproval, weekly]
      properties:
        merged: { type: integer, format: int32, minimum: 0, description: "Merge requests merged in the period by authors of the team at `merged_at`; the sum of `weekly`." }
        closedUnmerged: { type: integer, format: int32, minimum: 0, description: "Merge requests closed without merging in the period (the author's team at `closed_at`); in no weekly bar." }
        cycleWorkingDays: { $ref: '#/components/schemas/Distribution' }
        cycleElapsedDays: { $ref: '#/components/schemas/Distribution' }
        timeToFirstReviewWorkingDays: { $ref: '#/components/schemas/Distribution' }
        sizeLines: { $ref: '#/components/schemas/Distribution' }
        sizeFiles: { $ref: '#/components/schemas/Distribution' }
        mergedWithoutReview: { $ref: '#/components/schemas/CodeActivityShare' }
        mergedWithoutApproval: { $ref: '#/components/schemas/CodeActivityShare' }
        weekly:
          type: array
          items: { $ref: '#/components/schemas/CodeActivityWeek' }
          description: Every Monday-started week of the period, oldest first, zero-filled.
    CodeActivityOpenAge:
      type: object
      required: [n, hidden]
      properties:
        n: { type: integer, format: int32, minimum: 0, description: "The waiting (non-draft) open merge requests." }
        hidden: { type: boolean, description: "True under `meta.minSampleSize`; the percentiles are then absent." }
        p50: { type: number, format: double }
        p85: { type: number, format: double }
    CodeActivityOpen:
      type: object
      description: The open merge requests now, whose author belongs to the team now.
      required: [count, drafts, age]
      properties:
        count: { type: integer, format: int32, minimum: 0, description: "The non-draft open merge requests (a draft is not waiting for review)." }
        drafts: { type: integer, format: int32, minimum: 0 }
        age: { $ref: '#/components/schemas/CodeActivityOpenAge' }
    CodeActivityReview:
      type: object
      required: [n]
      properties:
        n: { type: integer, format: int32, minimum: 1, description: "The merged merge requests whose details were read." }
        reviewersPerMergedMrP50: { type: number, format: double, description: "Distinct reviewers per merged merge request, zeros included; absent under `meta.minSampleSize`." }
        topReviewerShare: { type: number, format: double, minimum: 0, maximum: 1, description: "The share of the distinct (merge request, reviewer) pairs held by the busiest reviewer; absent under `meta.minSampleSize` and with no pair." }
    CodeActivityGroup:
      type: object
      description: One member's volumes over the period — NEUTRAL context.
      required: [commits, filesChanged, linesAdded, linesDeleted, commitsLinesUnknown, mrsMerged, mrsOpened, openMrs, reviewsGiven, approvalsGiven, changesRequestedGiven, comments, reviewRequestsReceived]
      properties:
        teamId: { type: integer, format: int32, minimum: 1, description: "Not sent today: every group sits in the request's team." }
        accountId: { type: string, description: "The LINKED Jira account; absent for an unlinked identity (`teamId=0` only)." }
        label: { type: string, description: "The Jira display name (the account id when none is known); for an unlinked identity its GitLab display name or username, absent for a ghost." }
        commits: { type: integer, format: int32, minimum: 0, description: "Non-merge commits committed in the period." }
        filesChanged: { type: integer, format: int64, minimum: 0, description: "Counted files (exclusion-aware) of the commits whose counts are known." }
        linesAdded: { type: integer, format: int64, minimum: 0, description: "Counted additions (exclusion-aware); not a merge request's size, which is exclusion-blind." }
        linesDeleted: { type: integer, format: int64, minimum: 0 }
        commitsLinesUnknown: { type: integer, format: int32, minimum: 0, description: "Commits left out of the three sums because a counted figure is unknown." }
        mrsMerged: { type: integer, format: int32, minimum: 0 }
        mrsOpened: { type: integer, format: int32, minimum: 0, description: "Merge requests created in the period, later merged or closed included." }
        openMrs: { type: integer, format: int32, minimum: 0, description: "Open now, drafts included." }
        mrCycleWorkingDaysP50: { type: number, format: double, description: "Absent under `meta.minSampleSize` merged merge requests." }
        mrSizeLinesP50: { type: number, format: double, description: "Of the merged merge requests with a known size; absent under `meta.minSampleSize`." }
        reviewsGiven: { type: integer, format: int32, minimum: 0, description: "Distinct merge requests (not the member's own) with at least one review-kind event." }
        approvalsGiven: { type: integer, format: int32, minimum: 0, description: "Distinct merge requests approved (approve, unapprove, approve is one)." }
        changesRequestedGiven: { type: integer, format: int32, minimum: 0, description: "Distinct merge requests with changes requested." }
        comments: { type: integer, format: int32, minimum: 0, description: "Comment and diff-comment acts, none excluded." }
        reviewRequestsReceived: { type: integer, format: int32, minimum: 0, description: "Distinct merge requests that named the member as a reviewer." }

    TaskCodeTasks:
      type: object
      required: [done, withMergeRequest, withoutMergeRequest]
      properties:
        done: { type: integer, format: int32, minimum: 0, description: "Level-0 tasks done in the period (the cycle-time population)." }
        withMergeRequest: { type: integer, format: int32, minimum: 0, description: "Of them, with at least one linked MERGED merge request." }
        withoutMergeRequest: { type: integer, format: int32, minimum: 0, description: "`done − withMergeRequest`: no linked merge request, or only unmerged ones (`quality.onlyUnmergedMrs`)." }
        withoutShare: { type: number, format: double, minimum: 0, maximum: 1, description: "`withoutMergeRequest` over `done`; absent when nothing is done. NEUTRAL: no verdict (a task may need no code)." }
    TaskCodeMergedAfterDone:
      type: object
      required: [count, lagWorkingDays]
      properties:
        count: { type: integer, format: int32, minimum: 0, description: "Done tasks whose LAST linked merged merge request merged after the task's `done_at`." }
        share: { type: number, format: double, minimum: 0, maximum: 1, description: "`count` over the tasks with a merged merge request; absent when there is none." }
        lagWorkingDays: { $ref: '#/components/schemas/Distribution' }
    TaskCodeQuality:
      type: object
      required: [neverStarted, onlyUnmergedMrs, tasksWithAmbiguousKey]
      properties:
        neverStarted: { type: integer, format: int32, minimum: 0, description: "Done tasks with no `started_at`: no code lead time (they still count as with / without a merge request)." }
        onlyUnmergedMrs: { type: integer, format: int32, minimum: 0, description: "Done tasks with linked merge requests, none of them merged (open, closed unmerged, locked, or `merged` with no date); counted in `tasks.withoutMergeRequest`." }
        tasksWithAmbiguousKey: { type: integer, format: int32, minimum: 0, description: "Done tasks one of whose keys (current or old) names more than one live issue across the active Jira sources (the key was reused, or two sources hold it): it links no merge request through that key." }
    TaskCodeReport:
      type: object
      required: [meta, sources, tasks, codeLeadTimeWorkingDays, mergedAfterDone, quality]
      properties:
        meta:
          allOf: [{ $ref: '#/components/schemas/ReportMeta' }]
          description: "The JIRA star's (`derivedAt`, `configRevision`): the tasks, roster, names and sprints come from it. The merge requests' freshness is `sources`."
        sources:
          type: array
          items: { $ref: '#/components/schemas/CodeActivitySource' }
          description: The GitLab sources read, in connection order; empty while no GitLab source is active.
        tasks: { $ref: '#/components/schemas/TaskCodeTasks' }
        codeLeadTimeWorkingDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "Working days from a task's `started_at` to its LAST linked merged merge request, over the started tasks that have one; hidden under `meta.minSampleSize`. Lower is better."
        mergedAfterDone: { $ref: '#/components/schemas/TaskCodeMergedAfterDone' }
        quality: { $ref: '#/components/schemas/TaskCodeQuality' }

    CycleTimeReport:
      type: object
      required: [meta, elapsedDays, workingDays, excluded, trend, groups, epics]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        elapsedDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`cycle_ms` in wall-clock days per DONE level-0 task."
        workingDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`cycle_working_days` per DONE level-0 task."
        excluded: { $ref: '#/components/schemas/CycleTimeExcluded' }
        trend:
          type: array
          description: One bucket per week/month across the whole window, zero-filled, by `done_at`, on working days.
          items: { $ref: '#/components/schemas/CycleTimeTrendBucket' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/CycleTimeGroup' }
        epics: { $ref: '#/components/schemas/EpicCycleTime' }

    WipKey:
      type: object
      description: One legend entry of a WIP series — the `key` every point's `counts` uses, and its display `label`.
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }

    WipPoint:
      type: object
      description: One calendar day of a WIP series; `counts` carries EVERY key of the report's `keys` (zero-filled).
      required: [day, isWorkingDay, counts]
      properties:
        day: { type: string, format: date, description: 'ISO date in the configured zone.' }
        isWorkingDay: { type: boolean, description: 'Whether the day is a working day of the configured calendar (weekends and holidays are not).' }
        counts:
          type: object
          description: Items at the END of the day, per key of `keys`.
          additionalProperties: { type: integer, minimum: 0 }
        byUser:
          type: array
          description: >-
            USER level only (omitted below it): one entry per picked account in request order, splitting `counts` per person — every
            key zero-filled, a pick with no task all zeros. The entries sum to `counts`.
          items: { $ref: '#/components/schemas/WipUserShare' }

    WipUserShare:
      type: object
      description: One picked person's own `counts` on one day of a USER-level WIP series.
      required: [accountId, label, counts]
      properties:
        accountId: { type: string }
        label: { type: string, description: "The Jira display name, the account id when none is known." }
        counts:
          type: object
          description: The person's tasks at the END of the day, per key of `keys`.
          additionalProperties: { type: integer, minimum: 0 }

    WipReport:
      type: object
      required: [meta, by, itemKind, keys, series]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        by:
          type: string
          enum: [STATUS, STAGE, COLUMN]
          description: "What `counts` is keyed by (the request's `by`, default STAGE)."
        itemKind:
          type: string
          enum: [TASK, EPIC]
          description: "Which items were counted (the request's `itemKind`, default TASK)."
        keys:
          type: array
          description: >-
            The legend, in display order — the six stages for STAGE, the statuses seen (ordered by stage, then
            name) for STATUS, the board's columns in board order (plus "(no column)" when used) for COLUMN.
          items: { $ref: '#/components/schemas/WipKey' }
        series:
          type: array
          description: >-
            One point per calendar day of the period, oldest first, cut off after the last derived day and starting no
            earlier than the latest `backfill_from` of the connections in scope. Empty at USER level with `itemKind=EPIC` (see `note`), for a
            period with nothing to read, and for a period entirely past the last derived day or before the backfill start.
          items: { $ref: '#/components/schemas/WipPoint' }
        note:
          type: string
          nullable: true
          description: >-
            Why the series is empty or partial — USER level leaving the epics out, not derived yet, no sprint resolved (incl. `teamId=0`
            with a sprint-relative period), connections that never derived and were left out of the cut-off, a period that
            begins before the backfill window ("Before <date> the connection's history is incomplete"); null otherwise.

    BacklogTrendPoint:
      type: object
      description: The estimated backlog at the END of one calendar day.
      required: [day, items, md, hiddenItems, hiddenMd]
      properties:
        day: { type: string, format: date, description: 'ISO date in the configured zone.' }
        items: { type: integer, minimum: 0, description: 'Items counted — with `touchedWithinDays`, only those touched within the window.' }
        md: { type: number, format: double, minimum: 0, description: "Man-days — the sum of the counted items' own estimates." }
        hiddenItems: { type: integer, minimum: 0, description: 'Items the `touchedWithinDays` filter leaves out that day; 0 when it is off.' }
        hiddenMd: { type: number, format: double, minimum: 0, description: 'Man-days of those hidden items; 0 when the filter is off.' }

    BacklogCurrent:
      type: object
      description: The backlog on the last listed day, and report 13's backlog in sprints.
      required: [items, md, hiddenItems, hiddenMd, windowSprints, sprintsUsed]
      properties:
        asOfDay: { type: string, format: date, nullable: true, description: "The day the snapshot is read for (the trend's last day); null when the trend is empty." }
        items: { type: integer, minimum: 0 }
        md: { type: number, format: double, minimum: 0 }
        hiddenItems: { type: integer, minimum: 0, description: "The last day's items the `touchedWithinDays` filter leaves out; 0 when it is off." }
        hiddenMd: { type: number, format: double, minimum: 0, description: "Man-days of those hidden items; 0 when the filter is off." }
        meanDeliveredMd:
          type: number
          format: double
          nullable: true
          description: >-
            Mean `delivered_md` of the team's last `windowSprints` closed sprints as of `asOfDay`; null with no closed sprint, or for a scope with no velocity of its own.
        windowSprints: { type: integer, minimum: 1, description: 'The configured window (`backlog_window_sprints`).' }
        sprintsUsed: { type: integer, minimum: 0, description: 'How many closed sprints the mean was taken over: fewer than the window when fewer exist.' }
        backlogInSprints:
          type: number
          format: double
          nullable: true
          description: "`md ÷ meanDeliveredMd`; null when the mean is null or 0."

    BacklogReport:
      type: object
      required: [meta, current, trend]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        current: { $ref: '#/components/schemas/BacklogCurrent' }
        trend:
          type: array
          description: One point per calendar day of the period, oldest first, zero-filled, cut off after the last derived day.
          items: { $ref: '#/components/schemas/BacklogTrendPoint' }
        touchedWithinDays:
          type: integer
          format: int32
          nullable: true
          description: The effective `touchedWithinDays` filter in days; null when it is off (absent or `0`).
        note:
          type: string
          nullable: true
          description: >-
            Why the report is empty or partial — USER level, not derived yet, no sprint resolved (incl. `teamId=0`
            with a sprint-relative period), connections that never derived and were left out of the cut-off; null
            otherwise.

    AgingPercentile:
      type: object
      required: [percentile]
      properties:
        percentile: { type: integer, minimum: 1, maximum: 99, description: A configured `aging_percentiles` entry. }
        workingDays: { type: number, format: double, nullable: true, description: 'That percentile of the cycle working days; null while the thresholds are hidden.' }

    AgingThresholds:
      type: object
      description: The cycle-time percentiles of the last `aging_window_items` DONE items; hidden below `minSampleSize`.
      required: [n, hidden, percentiles]
      properties:
        n: { type: integer, format: int64, minimum: 0, description: How many DONE items the window held. }
        hidden: { type: boolean }
        percentiles:
          type: array
          items: { $ref: '#/components/schemas/AgingPercentile' }

    AgingItem:
      type: object
      required: [issueKey, itemKind, startedAt, ageWorkingDays, blocked, waiting, stage, position]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        itemKind: { type: string, enum: [TASK, EPIC] }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The current team (tasks) or owner team (epics); null = UNASSIGNED / UNOWNED.' }
        assigneeAccountId: { type: string, nullable: true }
        assignee: { type: string, nullable: true, description: The assignee's Jira display name; null for an epic or an unassigned task. }
        startedAt: { type: integer, format: int64, description: "Epoch millis of the first entry into an IN_PROGRESS, WAITING or BLOCKED stage." }
        ageWorkingDays: { type: number, format: double, minimum: 0, description: Working days from `startedAt` to the request's clock. }
        blocked: { type: boolean, description: "Blocked as of the connection's last DERIVE (a Flagged or BLOCKED-stage spell covers its clock)." }
        waiting: { type: boolean, description: "The item's current stage is WAITING (started, nothing actively worked on, a queue) rather than IN_PROGRESS or BLOCKED." }
        band:
          type: string
          nullable: true
          description: 'The highest threshold the age is above (`P50`, `P85`, ...), `WITHIN` when above none, null when the thresholds are hidden.'
        statusId: { type: string, nullable: true, description: "The Jira status the item is in now, from its OPEN `metrics.item_stage` row; null only if it has none (a DERIVE invariant says it has)." }
        statusName: { type: string, nullable: true, description: The `norm.statuses` name of `statusId`. }
        stage: { type: string, enum: [IN_PROGRESS, WAITING, BLOCKED], description: "The stage of that same open row, so it always agrees with `waiting` and with the band." }
        position: { type: string, description: "The `positions` key the item is plotted at: its board column (one team with a mapped board, `(no column)` when its status is on none) or its status id." }

    AgingPosition:
      type: object
      description: One x-axis category of the aging chart.
      required: [key, label, kind]
      properties:
        key: { type: string, description: 'An item''s `position`: a board column name (`kind` COLUMN) or a status id (`kind` STATUS).' }
        label: { type: string }
        kind: { type: string, enum: [STATUS, COLUMN] }

    AgingWipReport:
      type: object
      required: [meta, thresholds, epicThresholds, items, itemsTruncated, positions]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        thresholds: { $ref: '#/components/schemas/AgingThresholds' }
        epicThresholds: { $ref: '#/components/schemas/AgingThresholds' }
        items:
          type: array
          description: Every in-progress task and epic, oldest first, at most 500.
          items: { $ref: '#/components/schemas/AgingItem' }
        itemsTruncated: { type: boolean, description: True when more than 500 items matched. }
        positions:
          type: array
          description: >-
            The aging chart's x-axis in workflow order, over the LISTED items only (so after the 500 cap). One team with a board mapped in the
            scope's connections: that board's columns in board order, `(no column)` last. Otherwise the statuses, ordered by their earliest
            stage (IN_PROGRESS before WAITING before BLOCKED), then name, then id. Only positions holding at least one listed item.
          items: { $ref: '#/components/schemas/AgingPosition' }

    BlockedShareExcluded:
      type: object
      description: >-
        DONE items the blocked-time histograms leave out, each in ONE bucket (`neverBlocked`, then `neverStarted`, then
        `zeroCycle`). `blockedWorkingDays.n + neverBlocked = population`; `shareOfCycle.n + neverBlocked + neverStarted +
        zeroCycle = population`.
      required: [population, neverStarted, zeroCycle, neverBlocked]
      properties:
        population: { type: integer, minimum: 0 }
        neverBlocked:
          type: integer
          minimum: 0
          description: Items with no blocked working days — out of both histograms (`population - blockedItems`).
        neverStarted: { type: integer, minimum: 0, description: Blocked items with no cycle — out of the share histogram only. }
        zeroCycle: { type: integer, minimum: 0, description: Blocked items with a cycle of 0 working days — out of the share histogram only. }

    BlockedTopItem:
      type: object
      required: [issueKey, itemKind, doneAt, blockedWorkingDays]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        itemKind: { type: string, enum: [TASK, EPIC] }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        doneAt: { type: integer, format: int64 }
        blockedWorkingDays: { type: number, format: double, minimum: 0 }
        cycleWorkingDays: { type: number, format: double, nullable: true }
        share: { type: number, format: double, nullable: true, description: '`blockedWorkingDays / cycleWorkingDays`; null when the item has no measurable cycle.' }

    BlockedGroup:
      type: object
      required: [blockedWorkingDays, shareOfCycle, blockedItems, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        blockedWorkingDays: { $ref: '#/components/schemas/Distribution' }
        shareOfCycle: { $ref: '#/components/schemas/Distribution' }
        blockedItems: { type: integer, minimum: 0 }
        excluded: { $ref: '#/components/schemas/BlockedShareExcluded' }

    BlockedTimeReport:
      type: object
      required: [meta, itemKind, blockedWorkingDays, shareOfCycle, blockedItems, excluded, topItems, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        itemKind: { type: string, enum: [TASK, EPIC, BOTH], description: 'Which DONE items were counted (the request itemKind, default TASK).' }
        blockedWorkingDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: '`blocked_working_days` of the DONE items blocked at all (above zero); the never-blocked ones are in `excluded.neverBlocked`.'
        shareOfCycle:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: '`blocked_working_days / cycle_working_days` over the blocked items with a cycle above zero.'
        blockedItems: { type: integer, minimum: 0, description: How many DONE items were blocked at all. }
        excluded: { $ref: '#/components/schemas/BlockedShareExcluded' }
        topItems:
          type: array
          description: The 20 most-blocked DONE items, most first.
          items: { $ref: '#/components/schemas/BlockedTopItem' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/BlockedGroup' }

    EpicProgressScope:
      type: object
      description: The one thing a curve is about.
      required: [kind, id, key, name]
      properties:
        kind: { type: string, enum: [EPIC, DOMAIN, TEAM] }
        id: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The team id (`0` = UNASSIGNED); null for an epic or a domain.' }
        key: { type: string, nullable: true, description: The epic's issue key or the domain key; null for a team. }
        name: { type: string, description: 'The epic summary (its key when none), the domain name or the team name.' }

    EpicProgressPoint:
      type: object
      description: >-
        One calendar day of the series (configured zone) — running values at the end of the day, from the beginning of
        time (`basis` CUMULATIVE) or minus the sum before the period's first day (`basis` PERIOD).
      required: [date, pv, ev, ac, pvOriginal]
      properties:
        date: { type: string, format: date, description: 'ISO date (YYYY-MM-DD).' }
        pv: { type: number, format: double, description: Running planned value in man-days. }
        ev: { type: number, format: double, description: Running earned value in man-days. }
        ac: { type: number, format: double, description: Running actual cost in man-days. }
        pvOriginal: { type: number, format: double, nullable: true, description: "EPIC level: the epic's first baseline redrawn (running man-days, rebased like `pv`); null elsewhere and when that baseline has no curve." }

    EpicProgressPeriod:
      type: object
      description: >-
        The figures inside the period `[firstDay, asOf.day]` (A37): ΔPV, ΔEV and ΔAC, man-days at two decimals. `spi` and
        `cpi` are null while their denominator (ΔPV, ΔAC) is under 1 man-day.
      required: [firstDay, pv, ev, ac, sv, spi, cv, cpi]
      properties:
        firstDay: { type: string, format: date, nullable: true, description: 'The period''s first listed day; null (every figure 0) when the period lies after `asOf.day`.' }
        pv: { type: number, format: double }
        ev: { type: number, format: double }
        ac: { type: number, format: double }
        sv: { type: number, format: double, description: 'ΔEV − ΔPV.' }
        spi: { type: number, format: double, nullable: true, description: ΔEV ÷ ΔPV; null when ΔPV is under 1 man-day. }
        cv: { type: number, format: double, description: 'ΔEV − ΔAC.' }
        cpi: { type: number, format: double, nullable: true, description: ΔEV ÷ ΔAC; null when ΔAC is under 1 man-day. }

    EpicProgressRowPeriod:
      type: object
      description: A drill row's figures inside the period (the same rule as `EpicProgressPeriod`, without the day).
      required: [pv, ev, ac, sv, spi, cv, cpi]
      properties:
        pv: { type: number, format: double }
        ev: { type: number, format: double }
        ac: { type: number, format: double }
        sv: { type: number, format: double }
        spi: { type: number, format: double, nullable: true }
        cv: { type: number, format: double }
        cpi: { type: number, format: double, nullable: true }

    EpicProgressTrendPoint:
      type: object
      description: SPI and CPI over the trailing `trendWindowDays` ending at `day` (a week end; the last one is `asOf.day`).
      required: [day, spi, cpi]
      properties:
        day: { type: string, format: date }
        spi: { type: number, format: double, nullable: true, description: ΔEV ÷ ΔPV over the window; null when ΔPV is under 1 man-day. }
        cpi: { type: number, format: double, nullable: true, description: ΔEV ÷ ΔAC over the window; null when ΔAC is under 1 man-day. }

    EpicProgressAsOf:
      type: object
      description: The figures at `day`, man-days at two decimals.
      required: [day, pv, ev, ac, sv, spi, cv, cpi]
      properties:
        day: { type: string, format: date, nullable: true, description: 'ISO date the figures are read at; null when there is nothing to read.' }
        pv: { type: number, format: double }
        ev: { type: number, format: double }
        ac: { type: number, format: double }
        sv: { type: number, format: double, description: 'Schedule variance: EV − PV.' }
        spi: { type: number, format: double, nullable: true, description: Schedule performance index EV ÷ PV; null when PV is 0. }
        cv: { type: number, format: double, description: 'Cost variance: EV − AC.' }
        cpi: { type: number, format: double, nullable: true, description: Cost performance index EV ÷ AC; null when AC is 0. }

    EpicProgressRow:
      type: object
      description: One drill row, its CUMULATIVE figures as of the response's `asOf.day` and its `period` figures beside them.
      required: [kind, id, key, name, pv, ev, ac, sv, spi, cv, cpi, period]
      properties:
        kind: { type: string, enum: [EPIC, DOMAIN, TEAM] }
        id: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The team id (`0` = UNASSIGNED) of a TEAM row; null otherwise.' }
        key: { type: string, nullable: true, description: The epic's issue key or the domain key; null for a team. }
        name: { type: string }
        active: { type: boolean, nullable: true, description: 'TEAM rows only: false for a soft-deleted team that still has figures (its own drill answers 400); null otherwise.' }
        partial: { type: boolean, nullable: true, description: 'EPIC rows of a DOMAIN drill only: true when the epic was in another domain up to asOf, so this row holds this domain''s share; null otherwise.' }
        pv: { type: number, format: double }
        ev: { type: number, format: double }
        ac: { type: number, format: double }
        sv: { type: number, format: double }
        spi: { type: number, format: double, nullable: true }
        cv: { type: number, format: double }
        cpi: { type: number, format: double, nullable: true }
        period: { $ref: '#/components/schemas/EpicProgressRowPeriod' }

    EpicProgressBaseline:
      type: object
      description: One `fact_epic_plan` baseline, in effect from `effectiveFrom` until `supersededAt` (null = the current one).
      required: [effectiveFrom, supersededAt, startAt, dueAt, budgetMd]
      properties:
        effectiveFrom: { type: integer, format: int64, description: Epoch millis the baseline took effect. }
        supersededAt: { type: integer, format: int64, nullable: true }
        startAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the planned start date (a zone-free calendar date). }
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the planned due date (a zone-free calendar date). }
        budgetMd: { type: number, format: double, nullable: true }

    EpicProgressDrift:
      type: object
      description: Whether the CURRENT baseline differs from the FIRST one (both false with a single baseline or none current).
      required: [dates, budget]
      properties:
        dates: { type: boolean, description: The start and/or due date moved. }
        budget: { type: boolean, description: The budget changed. }

    EpicProgressEpic:
      type: object
      description: The EPIC level's plan facts.
      required: [budgetMd, budgetSource, startAt, dueAt, inPvHorizon, hasPvCurve, baselines, drift]
      properties:
        budgetMd: { type: number, format: double, nullable: true, description: 'The current budget: the current baseline''s, else the delivery fact''s (own estimate, else the child sum, D4).' }
        budgetSource: { type: string, nullable: true, description: 'OWN (the epic''s own estimate) or CHILDREN (the child sum, D4); null with no baseline and no delivery fact.' }
        startAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the epic's own start date. }
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the epic's own due date. }
        inPvHorizon: { type: boolean, description: 'True when the current baseline is complete and both its dates lie within ±10 years of the DERIVE clock; false means no PV at all (A23).' }
        hasPvCurve: { type: boolean, description: 'inPvHorizon AND the baseline window holds at least one working day, so PV is actually spread over it.' }
        baselines:
          type: array
          description: Every baseline, oldest first.
          items: { $ref: '#/components/schemas/EpicProgressBaseline' }
        drift: { $ref: '#/components/schemas/EpicProgressDrift' }

    EpicProgressReport:
      type: object
      required: [meta, level, scope, basis, series, asOf, period, trend, epic, foreignWorkShare, foreignWorkSharePeriod, rows, note]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        level: { type: string, enum: [DOMAIN, EPIC, TEAM], description: 'What the report is about (`meta.level` keeps the shared UNIT/TEAM/USER meaning of `teamId`). A request always names an epic, a domain or a team: the whole unit is never answered.' }
        scope:
          allOf: [{ $ref: '#/components/schemas/EpicProgressScope' }]
          nullable: true
          description: The epic, domain or team the report is about.
        basis: { type: string, enum: [PERIOD, CUMULATIVE], description: "The EFFECTIVE basis of `series`: the request's, else the level's default (PERIOD at DOMAIN and TEAM, CUMULATIVE at EPIC)." }
        series:
          type: array
          description: One point per calendar day of the period up to `asOf.day`, on `basis`.
          items: { $ref: '#/components/schemas/EpicProgressPoint' }
        asOf: { $ref: '#/components/schemas/EpicProgressAsOf' }
        period: { $ref: '#/components/schemas/EpicProgressPeriod' }
        trend:
          type: array
          description: SPI and CPI per week end over the trailing `trendWindowDays`; empty when the period lies after `asOf.day`.
          items: { $ref: '#/components/schemas/EpicProgressTrendPoint' }
        epic:
          allOf: [{ $ref: '#/components/schemas/EpicProgressEpic' }]
          nullable: true
          description: EPIC level only.
        foreignWorkShare: { type: number, format: double, nullable: true, description: "TEAM level only: the team authors' foreign-work MD ÷ their logged MD from the beginning of time up to asOf.day (0..1, A20 — the same cumulative window as CPI); null when they logged none." }
        foreignWorkSharePeriod: { type: number, format: double, nullable: true, description: "TEAM level only: the same share over the worklogs started inside the period (0..1) — the window of the period CPI; null when they logged none or the period lies after asOf.day." }
        rows:
          type: array
          description: 'The drill table as of `asOf.day`: a domain''s epics (DOMAIN); empty at EPIC and TEAM level.'
          items: { $ref: '#/components/schemas/EpicProgressRow' }
        note:
          type: string
          nullable: true
          description: >-
            Why the answer is empty or partial — nothing derived yet, no sprint resolved (incl. `teamId=0` with a
            sprint-relative period), connections that never derived and were left out of the cut-off, a period that lies
            after `asOf.day`; null otherwise.
    DataQualityTaskRef:
      type: object
      description: One task a finding points at (`doneAt` null = still open).
      required: [issueKey, summary, teamId, assigneeAccountId, assignee, doneAt, startedAt, estimateMd]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The credit team (DONE) / current team (open); null = UNASSIGNED.' }
        assigneeAccountId: { type: string, nullable: true }
        assignee: { type: string, nullable: true, description: The Jira display name (the account id when none is known). }
        doneAt: { type: integer, format: int64, nullable: true }
        startedAt: { type: integer, format: int64, nullable: true }
        estimateMd: { type: number, format: double, nullable: true, description: 'The estimate at done (DONE) / the current one (open) in man-days; null = unestimated.' }
    DataQualityDoneOpen:
      type: object
      description: A count split by DONE-in-the-period and currently open started tasks.
      required: [done, open]
      properties:
        done: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
    DataQualityTaskFinding:
      type: object
      description: >-
        A task finding: `done` DONE tasks of the period plus `open` open started ones (0 for a finding that only makes sense
        once a task is done), `total` their sum, `md` the matching tasks' estimates, and the first 50 in `items` (DONE newest
        first, then open by age).
      required: [done, open, total, md, items]
      properties:
        done: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        md: { type: number, format: double }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityTaskRef' }
    DataQualityEpicRef:
      type: object
      description: One epic a finding points at; `flags` names the D11 drift codes (empty outside the drift finding).
      required: [issueKey, summary, ownerTeamId, domainKey, startAt, dueAt, doneAt, flags]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The domain owner team (A19); null = UNOWNED.' }
        domainKey: { type: string, nullable: true }
        startAt: { type: integer, format: int64, nullable: true }
        dueAt: { type: integer, format: int64, nullable: true }
        doneAt: { type: integer, format: int64, nullable: true }
        flags:
          type: array
          items: { type: string, enum: [EPIC_NOT_STARTED_WITH_ACTIVE_CHILDREN, EPIC_OPEN_AFTER_CHILDREN_DONE, EPIC_DONE_WITH_OPEN_CHILDREN] }
    DataQualityEpicList:
      type: object
      description: A capped list of epics.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityEpicRef' }
    DataQualityEpicEstimateGap:
      type: object
      description: >-
        An epic whose own estimate and the sum of its tasks' estimates disagree by more than the configured tolerance of the own
        estimate (`epicEstimateGapTolerancePercent`, default 25 %; exactly the tolerance is not flagged). `gapMd` = `childSumMd` − `ownEstimateMd` (signed); `direction` is OVER when the
        tasks sum above the epic, UNDER when below.
      required: [epic, ownEstimateMd, childSumMd, gapMd, direction]
      properties:
        epic: { $ref: '#/components/schemas/DataQualityEpicRef' }
        ownEstimateMd: { type: number, format: double, description: The epic's own current estimate in man-days (above 0). }
        childSumMd: { type: number, format: double, description: The sum of its tasks' current estimates in man-days (above 0). }
        gapMd: { type: number, format: double, description: '`childSumMd` − `ownEstimateMd`.' }
        direction: { type: string, enum: [OVER, UNDER] }
    DataQualityEpicEstimateGapList:
      type: object
      description: A capped list of epics whose estimate disagrees with their tasks', the widest gap first.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityEpicEstimateGap' }
    DataQualityUnownedDomain:
      type: object
      description: 'A domain no team owns (A19, A22): its epics and backlog land in UNOWNED.'
      required: [connectionId, domainKey, name, projectKeys, epics]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        domainKey: { type: string }
        name: { type: string }
        projectKeys: { type: array, items: { type: string } }
        epics: { type: integer, minimum: 0, description: The domain's epics (any state). }
    DataQualityUnownedDomainList:
      type: object
      description: A capped list of domains without an owner team.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityUnownedDomain' }
    DataQualityAboveEpicItem:
      type: object
      description: 'A live issue above the epic level (Jira hierarchy level 2 and up, A31): outside the task/epic model, so DERIVE builds no task, epic or backlog row for it.'
      required: [connectionId, issueKey, summary, issueType, hierarchyLevel, projectKey, worklogMd]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        issueType: { type: string }
        hierarchyLevel: { type: integer, format: int32, minimum: 2, description: The issue type's Jira hierarchy level (2 and up). }
        projectKey: { type: string }
        worklogMd: { type: number, format: double, description: 'Man-days logged on the issue itself (Σ `fact_worklog.md`), all time -- not bound to the report period; 0 when none.' }
    DataQualityAboveEpicItemList:
      type: object
      description: A capped list of issues above the epic level (highest level first, then by key).
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityAboveEpicItem' }
    DataQualityUnmappedStatus:
      type: object
      description: A Jira status with no stage mapping — its time is tiled UNMAPPED, never started, never done.
      required: [connectionId, statusId, name, category, items, openItems]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        statusId: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        items: { type: integer, minimum: 0, description: Work items (sub-tasks included) that have ever sat in the status. }
        openItems: { type: integer, minimum: 0, description: Work items sitting in it now. }
    DataQualityUnmappedStatusList:
      type: object
      description: A capped list of unmapped statuses.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityUnmappedStatus' }
    DataQualityUnmappedBoard:
      type: object
      description: A Jira board no team is mapped to — its sprints have no team and no snapshot.
      required: [connectionId, boardId, name, projectKey, sprints, doneTasks]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        boardId: { type: integer, format: int64 }
        name: { type: string }
        projectKey: { type: string, nullable: true }
        sprints: { type: integer, minimum: 0 }
        doneTasks: { type: integer, minimum: 0, description: "Level-0 tasks of the period done inside one of the board's sprints (they fall back to the assignee's team, D5)." }
    DataQualityUnmappedBoardList:
      type: object
      description: >-
        A capped list of unmapped boards, plus the residual `unattributedDoneTasks`: tasks of the period done inside a sprint
        with no team that belongs to none of the boards listed (the sprint has no board, or its board is mapped yet the sprint
        carries no team) — so no task done in a teamless sprint is counted nowhere.
      required: [total, items, unattributedDoneTasks]
      properties:
        total: { type: integer, minimum: 0, description: How many boards matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityUnmappedBoard' }
        unattributedDoneTasks: { type: integer, minimum: 0 }
    DataQualityAuthor:
      type: object
      description: A worklog author who was in no team when logging (a null `accountId` = worklogs with no known author).
      required: [accountId, name, worklogs, md]
      properties:
        accountId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        worklogs: { type: integer, minimum: 0 }
        md: { type: number, format: double }
    DataQualityAuthorList:
      type: object
      description: A capped list of authors without a team, most logged MD first.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityAuthor' }
    DataQualitySnapshotDrift:
      type: object
      description: >-
        One figure of a closed, team-mapped sprint whose live value has moved away from the frozen snapshot (D13):
        MD figures beyond 0.005, item counts exactly, load beyond 0.0005; a figure null on one side only counts.
      required: [connectionId, sprintId, name, teamId, completeAt, field, live, frozen, delta, reconstructed]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completeAt: { type: integer, format: int64, nullable: true }
        field:
          type: string
          enum: [committedMd, committedItems, addedMd, addedItems, removedMd, removedItems, finalMd, finalItems, deliveredMd, deliveredItems, carriedOverMd, carriedOverItems, droppedMd, droppedItems, capacityMd, load]
        live: { type: number, format: double, nullable: true }
        frozen: { type: number, format: double, nullable: true }
        delta: { type: number, format: double, nullable: true, description: '`live − frozen`, null when either is null.' }
        reconstructed: { type: boolean, description: 'The snapshot was written by a DERIVE that ran after the sprint closed — a baseline rebuilt from history, not a real freeze.' }
    DataQualitySnapshotDriftList:
      type: object
      description: A capped list of drifted sprint figures.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualitySnapshotDrift' }
    DataQualityDeriveWarning:
      type: object
      description: 'A connection whose latest SUCCEEDED DERIVE run reported warnings (A13: `sprintFieldUnresolved` — the sprint step was skipped).'
      required: [connectionId, connectionName, runId, startedAt, warnings]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        connectionName: { type: string }
        runId: { type: integer, format: int32 }
        startedAt: { type: integer, format: int64 }
        warnings: { type: array, items: { type: string, enum: [sprintFieldUnresolved] } }
    DataQualityPopulations:
      type: object
      required: [doneTasks, openStartedTasks, epics, worklogs]
      properties:
        doneTasks: { type: integer, minimum: 0 }
        openStartedTasks: { type: integer, minimum: 0 }
        epics: { type: integer, minimum: 0 }
        worklogs: { type: integer, minimum: 0 }
    DataQualityWorklogCoverage:
      type: object
      description: D14 — DONE tasks of the period with worklogs; `coverage` = `withWorklogs ÷ doneTasks` (fraction 0..1, null with no DONE task); `without` lists the tasks with none.
      required: [doneTasks, withWorklogs, coverage, without]
      properties:
        doneTasks: { type: integer, minimum: 0 }
        withWorklogs: { type: integer, minimum: 0 }
        coverage: { type: number, format: double, nullable: true }
        without: { $ref: '#/components/schemas/DataQualityTaskFinding' }
    DataQualityLoggedHours:
      type: object
      description: >-
        Hours logged by team members (Σ `md` × `hoursPerDay`; authors in no team are left out) over their member-days (roster
        rows clipped to the period up to now, counted in working days). `hoursPerMemberDay` is null without member-days.
      required: [memberDays, hours, hoursPerMemberDay]
      properties:
        memberDays: { type: number, format: double }
        hours: { type: number, format: double }
        hoursPerMemberDay: { type: number, format: double, nullable: true }
    DataQualityLateWorklog:
      type: object
      required: [worklogId, issueKey, summary, authorAccountId, author, teamId, startedAt, lateDays]
      properties:
        worklogId: { type: integer, format: int64 }
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        authorAccountId: { type: string, nullable: true }
        author: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: The author's team when logging; null = none. }
        startedAt: { type: integer, format: int64 }
        lateDays: { type: number, format: double, description: 'Days between the worklog''s start and when it was logged.' }
    DataQualityLateLogging:
      type: object
      description: >-
        Late logging over the period's worklogs: `measurable` of the `worklogs` know their creation time; `over1Day` /
        `over7Days` count those logged more than 1 / 7 days after they started; `distribution` is the lateness in days
        (hidden below `minSampleSize`); `worst` the latest-logged ones (at most 50).
      required: [worklogs, measurable, over1Day, over7Days, distribution, worst]
      properties:
        worklogs: { type: integer, minimum: 0 }
        measurable: { type: integer, minimum: 0 }
        over1Day: { type: integer, minimum: 0 }
        over7Days: { type: integer, minimum: 0 }
        distribution: { $ref: '#/components/schemas/Distribution' }
        worst:
          type: array
          items: { $ref: '#/components/schemas/DataQualityLateWorklog' }
    DataQualityMissing:
      type: object
      description: >-
        Missing data. The task findings split DONE-in-period from open started tasks; `workCategoryConfigured` says whether
        any connection in scope has a work-category field (with none, `noWorkCategory` is empty by design); the epic findings
        cover epics open or done in the period.
      required: [noEstimate, noEpic, noWorkCategory, workCategoryConfigured, unassigned, estimatedLate, estimatedAfterDone, epicsWithoutEstimate, epicsWithoutDates, epicsOutsidePvHorizon]
      properties:
        noEstimate: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        noEpic: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        noWorkCategory: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        workCategoryConfigured: { type: boolean }
        unassigned: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        estimatedLate:
          allOf: [{ $ref: '#/components/schemas/DataQualityTaskFinding' }]
          description: >-
            Started tasks with no estimate at start but one by the end of the work (done: at `done_at`; open: now), A35.
        estimatedAfterDone:
          allOf: [{ $ref: '#/components/schemas/DataQualityTaskFinding' }]
          description: >-
            DONE tasks whose estimate first appeared after `done_at` (a backfill, A35). Open is always 0; `md` and the list
            carry the backfilled (current) estimate, since these tasks have none at done.
        epicsWithoutEstimate: { $ref: '#/components/schemas/DataQualityEpicList' }
        epicsWithoutDates: { $ref: '#/components/schemas/DataQualityEpicList' }
        epicsOutsidePvHorizon:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicList' }]
          description: Epics with both dates set but at least one outside ±10 years of the connection's last DERIVE — they get no PV curve.
    DataQualityTaskCounts:
      type: object
      required: [done, openStarted, withoutWorklogs, unassigned, outsideSprint, crossDomain, noEstimate, noEpic, noWorkCategory, estimatedLate, estimatedAfterDone]
      properties:
        done: { type: integer, minimum: 0 }
        openStarted: { type: integer, minimum: 0 }
        withoutWorklogs: { type: integer, minimum: 0 }
        unassigned: { type: integer, minimum: 0 }
        outsideSprint: { type: integer, minimum: 0 }
        crossDomain: { type: integer, minimum: 0 }
        noEstimate: { $ref: '#/components/schemas/DataQualityDoneOpen' }
        noEpic: { $ref: '#/components/schemas/DataQualityDoneOpen' }
        noWorkCategory: { $ref: '#/components/schemas/DataQualityDoneOpen' }
        estimatedLate: { $ref: '#/components/schemas/DataQualityDoneOpen' }
        estimatedAfterDone: { type: integer, minimum: 0, description: DONE tasks only (an open task cannot be estimated after done). }
    DataQualityWorklogCounts:
      type: object
      required: [worklogs, md, over1Day, over7Days, hours, memberDays, hoursPerMemberDay]
      properties:
        worklogs: { type: integer, minimum: 0 }
        md: { type: number, format: double }
        over1Day: { type: integer, minimum: 0 }
        over7Days: { type: integer, minimum: 0 }
        hours: { type: number, format: double }
        memberDays: { type: number, format: double }
        hoursPerMemberDay: { type: number, format: double, nullable: true }
    DataQualityEpicCounts:
      type: object
      required: [epics, withoutEstimate, withoutDates, outsidePvHorizon, drifting, estimateGap]
      properties:
        epics: { type: integer, minimum: 0 }
        withoutEstimate: { type: integer, minimum: 0 }
        withoutDates: { type: integer, minimum: 0 }
        outsidePvHorizon: { type: integer, minimum: 0 }
        drifting: { type: integer, minimum: 0 }
        estimateGap: { type: integer, minimum: 0, description: Epics whose own estimate and their tasks' estimates differ by more than the configured tolerance (default 25%). }
    DataQualityGroup:
      type: object
      description: >-
        A team (UNIT level; `teamId` null = UNASSIGNED tasks/authors and UNOWNED epics) or a member (TEAM level; a null
        `accountId` with a null `label` is the unassigned bucket). `epics` is null at TEAM level — epics carry no user.
        Always empty at USER level.
      required: [teamId, accountId, label, tasks, worklogs, epics]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        tasks: { $ref: '#/components/schemas/DataQualityTaskCounts' }
        worklogs: { $ref: '#/components/schemas/DataQualityWorklogCounts' }
        epics:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicCounts' }]
          nullable: true
    DataQualityReport:
      type: object
      required:
        - meta
        - hoursPerDay
        - populations
        - groups
        - worklogCoverage
        - loggedHours
        - lateLogging
        - missing
        - outsideSprint
        - crossDomain
        - epicDrift
        - epicEstimateGap
        - epicEstimateGapTolerancePercent
        - domainsWithoutOwner
        - unmappedStatuses
        - unmappedBoards
        - authorsWithoutTeam
        - itemsAboveEpic
        - snapshotDrift
        - deriveWarnings
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        hoursPerDay: { type: number, format: double, description: The configured hours per man-day the logged hours per member-day are read against. }
        populations: { $ref: '#/components/schemas/DataQualityPopulations' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/DataQualityGroup' }
        worklogCoverage: { $ref: '#/components/schemas/DataQualityWorklogCoverage' }
        loggedHours: { $ref: '#/components/schemas/DataQualityLoggedHours' }
        lateLogging: { $ref: '#/components/schemas/DataQualityLateLogging' }
        missing: { $ref: '#/components/schemas/DataQualityMissing' }
        outsideSprint:
          allOf: [{ $ref: '#/components/schemas/DataQualityTaskFinding' }]
          description: 'DONE tasks with no sprint at done (D10); `md` is their estimate at done.'
        crossDomain:
          allOf: [{ $ref: '#/components/schemas/DataQualityTaskFinding' }]
          description: DONE tasks whose epic's domain as of `done_at` (A47) is not the task's own domain.
        epicDrift:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicList' }]
          description: Epics with a D11 drift flag.
        epicEstimateGap:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicEstimateGapList' }]
          description: >-
            Epics with both an own estimate and estimated tasks whose figures differ by more than the configured tolerance
            (`epicEstimateGapTolerancePercent`) of the own estimate, open and done alike; the widest absolute gap first.
        epicEstimateGapTolerancePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: The `metrics.settings` tolerance (whole percent, default 25) the `epicEstimateGap` list and the groups' `estimateGap` counts used.
        domainsWithoutOwner: { $ref: '#/components/schemas/DataQualityUnownedDomainList' }
        unmappedStatuses: { $ref: '#/components/schemas/DataQualityUnmappedStatusList' }
        unmappedBoards: { $ref: '#/components/schemas/DataQualityUnmappedBoardList' }
        authorsWithoutTeam: { $ref: '#/components/schemas/DataQualityAuthorList' }
        itemsAboveEpic: { $ref: '#/components/schemas/DataQualityAboveEpicItemList' }
        snapshotDrift: { $ref: '#/components/schemas/DataQualitySnapshotDriftList' }
        deriveWarnings:
          type: array
          items: { $ref: '#/components/schemas/DataQualityDeriveWarning' }

    CostBreakdownSlice:
      type: object
      description: One slice of a cost breakdown (activity type or work category) with its man-days (rounded exact sum).
      required: [key, md, exactMd]
      properties:
        key: { type: string, description: 'The activity type or work category; `UNCATEGORIZED` for none.' }
        md: { type: number, format: double, description: 'The exact sum rounded once to 2 decimals.' }
        exactMd: { type: number, format: double, description: 'The exact sum (4 decimals, as stored), unrounded: a client that merges slices sums these and rounds once, so a merged figure equals the drill''s `bar.sumMd`.' }

    CostsReport:
      type: object
      description: Report 16, Costs — the man-days logged in the period with the foreign-work share and the two parts-of-whole splits.
      required: [meta, totalMd, foreignMd, foreignShare, byActivityType, byWorkCategory, sprints, outsideSprintsMd, categoryTargets, categoryShareTrend]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        totalMd: { type: number, format: double, description: 'The grand total: the rounded EXACT sum of every worklog in scope.' }
        foreignMd: { type: number, format: double, description: 'The rounded EXACT sum of the foreign-work worklogs in scope.' }
        foreignShare: { type: number, format: double, nullable: true, description: 'Exact foreign MD ÷ exact MD; null when nothing was logged.' }
        byActivityType:
          type: array
          description: >-
            The same worklogs (period, level, domain, domain view and every slice) split by activity type, in the same transaction, for the
            parts-of-whole chart: one slice per type, ordered by `md` descending then `key`; a worklog with no activity type is `UNCATEGORIZED`.
            Each `md` is the rounded exact sum of its worklogs, and the exact sums add up to the grand total, so the rounded slices add up to
            `totalMd` within the report's 0.005-per-addend rule. Empty for an empty report; present whatever the `activityType` slice.
          items: { $ref: '#/components/schemas/CostBreakdownSlice' }
        byWorkCategory:
          type: array
          description: The same split by work category (`UNCATEGORIZED` = none); same rules as `byActivityType`.
          items: { $ref: '#/components/schemas/CostBreakdownSlice' }
        sprints:
          type: array
          description: >-
            The sprint widgets (A44), TEAM and USER level of a real team only (empty at UNIT level and for `teamId=0`): the team's closed
            sprints completed in the period (an open sprint only by an explicit `sprintId`), oldest first, each with its AC, its by-epic
            split and its capacity. Σ `acMd` over the sprints can exceed the period's cost: a sprint reaches outside the period and two
            overlapping sprints each count a worklog inside both.
          items: { $ref: '#/components/schemas/CostsSprint' }
        outsideSprintsMd:
          type: number
          format: double
          nullable: true
          description: >-
            The rounded exact MD the same slice logged in the period inside none of the listed sprints' dates (the time between and
            around the sprints). Null without a real team; equal to `totalMd` for a team with no listed sprint.
        categoryTargets:
          allOf: [{ $ref: '#/components/schemas/CostsCategoryTargets' }]
          nullable: true
          description: >-
            The work-category widget (A45): the team's target share of effort beside what its members logged, per work category. It compares
            the team's WHOLE mix, so it is null without a real team (UNIT level, `teamId=0`), at USER level and whenever a `domain`,
            `activityType` or `workCategory` slice narrows the worklogs. Read at query time, so an earlier period is compared against the
            CURRENT targets.
        categoryShareTrend:
          allOf: [{ $ref: '#/components/schemas/CostsCategoryTrend' }]
          nullable: true
          description: >-
            The weekly cumulative share per work category (A45). Null without a real team (UNIT level, `teamId=0`) and when the period touches
            more than 160 Monday-start weeks; present at TEAM and USER level of a real team, and under a slice it shows the mix of what the
            slice selects. The weeks are zero-filled even when nothing was logged or no connection is in scope; `weeks` is empty only when the
            period resolves to no window.

    CostsCategoryTargets:
      type: object
      description: >-
        A team's work-category targets against its actual time in the period, over the very worklogs `byWorkCategory` splits, so `totalMd`
        equals the report's `totalMd`.
      required: [configured, totalMd, rows]
      properties:
        configured: { type: boolean, description: "The team has a stored target set (PUT /teams/{id}/work-category-targets). False: every row's `targetPercent` and `deltaPoints` are null and the rows carry the actuals only." }
        totalMd: { type: number, format: double, description: "The rounded EXACT sum of the period's worklogs under the report's slices (= the report's `totalMd`)." }
        rows:
          type: array
          description: >-
            Every stored target plus every work category with a worklog in the period (`UNCATEGORIZED` = none), ordered by `targetPercent`
            descending (no target counts 0), then the exact actual MD descending, then `key`.
          items: { $ref: '#/components/schemas/CostsCategoryTargetRow' }

    CostsCategoryTargetRow:
      type: object
      required: [key, targetPercent, actualMd, actualShare, deltaPoints, mapped]
      properties:
        key: { type: string, description: "A work category label, or `UNCATEGORIZED` (the \"No category\" row)." }
        targetPercent: { type: integer, format: int32, minimum: 0, maximum: 100, nullable: true, description: "The team's whole-percent target; in a configured set a category with none counts 0. Null only when the set is not configured." }
        actualMd: { type: number, format: double, description: "The rounded EXACT sum of the category's worklogs in the period." }
        actualShare: { type: number, format: double, nullable: true, description: "Exact category MD ÷ exact total MD (a fraction 0..1); null when nothing was logged." }
        deltaPoints: { type: number, format: double, nullable: true, description: "Actual percent minus target percent, in percentage points rounded half-up to one decimal from the exact figures; null without a target or without logged time." }
        mapped: { type: boolean, description: "The category is choosable now (mapped on an active data source, or `UNCATEGORIZED`); false flags a stored target or a logged label nobody can pick any more." }

    CostsCategoryTrend:
      type: object
      required: [weeks]
      properties:
        weeks:
          type: array
          description: "One entry per Monday-start week (configured zone) from the period's first to its last, zero-filled. Empty when the period resolves to no window."
          items: { $ref: '#/components/schemas/CostsTrendWeek' }

    CostsTrendWeek:
      type: object
      description: "Everything logged from the period's start through the end of this week, cut by category. The last week's `cumulativeMd` equals the report's `totalMd`."
      required: [weekStart, cumulativeMd, byCategory]
      properties:
        weekStart: { type: string, format: date, description: "The week's Monday (ISO date, configured zone); the first week may start before the period." }
        cumulativeMd: { type: number, format: double, description: "The rounded EXACT cumulative sum." }
        byCategory:
          type: array
          description: "Every work category with a worklog in the period, the same keys in the same order (the `byWorkCategory` order) in every week."
          items: { $ref: '#/components/schemas/CostsTrendCategory' }

    CostsTrendCategory:
      type: object
      required: [key, cumulativeMd, share]
      properties:
        key: { type: string, description: "A work category label, or `UNCATEGORIZED`." }
        cumulativeMd: { type: number, format: double, description: "The category's rounded EXACT cumulative sum through this week." }
        share: { type: number, format: double, nullable: true, description: "Exact category cumulative ÷ exact cumulative total (a fraction 0..1); null while the cumulative total is 0." }

    CostsSprint:
      type: object
      description: >-
        One sprint of the Costs report: its ACTUAL COST (the man-days the team's members logged in the sprint's own dates, under the
        report's slices), that AC split by current epic and the sprint's capacity.
      required: [sprintId, name, teamId, connectionId, startAt, completedAt, acMd, capacityMd, capacitySource, byEpic]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 1 }
        connectionId: { type: integer, format: int32, minimum: 1, description: "The sprint's own connection: its AC reads the worklogs of this connection." }
        startAt: { type: integer, format: int64, nullable: true, description: "Epoch ms; a sprint without a start has an empty window (acMd 0)." }
        completedAt: { type: integer, format: int64, nullable: true, description: "Epoch ms; null for an open sprint (listed only by an explicit sprintId), whose window runs to now." }
        acMd: { type: number, format: double, description: "The rounded EXACT sum of the MD logged with `started_at` in `[startAt, completedAt)` (open: to now)." }
        capacityMd: { type: number, format: double, nullable: true, description: "The team's sprint capacity in man-days (A3, A32), shown to every viewer (A44). Null when the sprint has none, and always null at USER level." }
        capacitySource:
          type: string
          enum: [CALENDAR, TEAM_DEFAULT, DEFAULT, CONFIGURED]
          nullable: true
          description: "As Commitments' `capacitySource`. Null exactly when capacityMd is null."
        byEpic:
          type: array
          description: "The AC split by the worklogs' current epic: the top 6 epics (by Σ AC over the whole response) as their own segments, then OTHER_EPICS, then NO_EPIC; zero segments omitted, the same order in every sprint; the segments add up to `acMd` within 0.005 per segment."
          items: { $ref: '#/components/schemas/CostsEpicSegment' }

    CostsEpicSegment:
      type: object
      description: "One epic segment of a sprint's AC - the worklogs whose current epic this is."
      required: [key, epicId, epicKey, label, acMd]
      properties:
        key: { type: string, description: "The epic's issue id as a string, OTHER_EPICS (every epic outside the top 6) or NO_EPIC. The drill's epicSegment value (with by=EPIC)." }
        epicId: { type: integer, format: int64, nullable: true, description: "The epic's issue id; null on OTHER_EPICS and NO_EPIC." }
        epicKey: { type: string, nullable: true, description: "The epic's Jira key; null on OTHER_EPICS and NO_EPIC, and on an epic with no key on record (then `label` falls back to the epic id)." }
        label: { type: string, description: "The epic's key and summary; the English fallback text on OTHER_EPICS and NO_EPIC (the web localises those by key)." }
        acMd: { type: number, format: double, description: "The rounded exact sum of the segment's worklogs; equals the drill's `bar.sumMd` for this segment." }

    DeepDiveRange:
      type: object
      required: [from, to, asOfDay]
      properties:
        from: { type: string, format: date, description: 'ISO date; the day every series offset counts from.' }
        to: { type: string, format: date, description: 'ISO date, inclusive.' }
        asOfDay: { type: string, format: date, nullable: true, description: 'The day of the selected connection''s last DERIVE clock (where an open in-progress interval stops); null when nothing derived.' }

    DeepDiveSprint:
      type: object
      description: A selected sprint (selection a) with its plan window as day offsets from `range.from`.
      required: [id, name, startDay, endDay]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        startDay: { type: integer, format: int32, nullable: true, description: 'Offset of the window start; null when the sprint contributes no day.' }
        endDay: { type: integer, format: int32, nullable: true, description: 'Offset of the window close; null when the sprint contributes no day.' }

    DeepDiveAuthor:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string }
        displayName: { type: string, description: 'The Jira display name; the account id for an account the people table does not know.' }

    DeepDiveMdDay:
      type: object
      required: [d, md]
      properties:
        d: { type: integer, format: int32, description: Day offset from `range.from`. }
        md: { type: number, format: double, description: Man-days on that day (2 decimals). }

    DeepDiveCostDay:
      type: object
      required: [d, a, md]
      properties:
        d: { type: integer, format: int32, description: Day offset from `range.from`. }
        a: { type: integer, format: int32, nullable: true, minimum: 0, description: 'Index into `authors`; null when Jira gave no author.' }
        md: { type: number, format: double, description: The author's man-days logged that day (2 decimals). }

    DeepDiveDone:
      type: object
      description: The EV marker.
      required: [d, evMd]
      properties:
        d: { type: integer, format: int32, description: Day offset of `done_at` from `range.from`. }
        evMd: { type: number, format: double, description: '`estimate_at_done_md`; 0 when unestimated.' }

    DeepDiveTotals:
      type: object
      description: Each layer's full sum over ALL days, in or out of `range`. Approximate EV has no figure of its own - it is a split of `evMd`, so its whole-life sum is `evMd`.
      required: [pvMd, evMd, costMd]
      properties:
        pvMd: { type: number, format: double }
        evMd: { type: number, format: double }
        costMd: { type: number, format: double }

    DeepDiveTask:
      type: object
      required: [key, summary, epicKey, planBasisMd, planSource, noPlanReason, pv, approxEv, inProgress, evState, done, cost, totals]
      properties:
        key: { type: string }
        summary: { type: string, nullable: true }
        epicKey: { type: string, nullable: true, description: 'Null for a task with no epic (the `(no epic)` row).' }
        planBasisMd: { type: number, format: double, nullable: true, description: 'The estimate `pv` spreads; null for a task with no estimate. Whenever `noPlanReason` is absent, `pv` sums to it.' }
        planSource: { type: string, enum: [EARLIEST, LATER_FALLBACK, NONE], description: 'Whether the basis is the earliest sprint''s, the first later sprint''s FALLBACK, or none.' }
        noPlanReason: { type: string, enum: [NEVER_IN_SPRINT, NO_ESTIMATE, NO_WORKING_DAY], nullable: true, description: Why `pv` is empty; null when the task has a plan. }
        pv:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveMdDay' }
        approxEv:
          type: array
          description: 'Approximate EV (A40): the EV spread over the in-progress working days (or all of it on the done day when there is none), clipped to `range`; empty unless `evState` is EARNED. Its whole-life sum is `totals.evMd`.'
          items: { $ref: '#/components/schemas/DeepDiveMdDay' }
        inProgress:
          type: array
          description: 'Day offsets of the working days the task spent IN_PROGRESS, clipped to `range`, ascending - also for a task that earns nothing (the hollow mark).'
          items: { type: integer, format: int32 }
        evState:
          type: string
          enum: [EARNED, OPEN, UNESTIMATED]
          description: 'EARNED: done with an estimate. OPEN: not done yet. UNESTIMATED: done with no or a zero estimate at done.'
        done:
          nullable: true
          description: The EV marker; null when the task is not done or its done day is outside `range`.
          allOf: [{ $ref: '#/components/schemas/DeepDiveDone' }]
        cost:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveCostDay' }
        totals: { $ref: '#/components/schemas/DeepDiveTotals' }

    DeepDiveOwnCost:
      type: object
      description: The worklog MD logged on an epic itself (selection b).
      required: [cost, totalMd]
      properties:
        cost:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveCostDay' }
        totalMd: { type: number, format: double, description: 'The whole-life sum, in or out of `range`.' }

    DeepDiveEpic:
      type: object
      description: One epic row; the row with a null `key` is the `(no epic)` bucket.
      required: [key, summary, plannedStart, plannedDue, budgetMd, ownCost]
      properties:
        key: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        plannedStart: { type: integer, format: int32, nullable: true, description: 'Offset of the CURRENT baseline''s planned start from `range.from` (an outline, never summed); null without a complete window.' }
        plannedDue: { type: integer, format: int32, nullable: true, description: Offset of the planned due day. }
        budgetMd: { type: number, format: double, nullable: true, description: The current baseline's budget; null without a baseline. }
        ownCost:
          nullable: true
          description: The worklog MD logged on the epic itself — selection (b) only, null otherwise or when there is none.
          allOf: [{ $ref: '#/components/schemas/DeepDiveOwnCost' }]

    DeepDiveQuality:
      type: object
      description: The limits the page states openly, counted over ALL selected tasks.
      required: [neverInSprint, noEstimate, noWorkingDay, epicsWithoutWindow, laterFallback, openInProgress, doneUnestimated, epicOwnCostMd]
      properties:
        neverInSprint: { type: integer, format: int32, minimum: 0 }
        noEstimate: { type: integer, format: int32, minimum: 0 }
        noWorkingDay: { type: integer, format: int32, minimum: 0, description: Tasks whose estimate has no working day to sit on. }
        epicsWithoutWindow: { type: integer, format: int32, minimum: 0 }
        laterFallback: { type: integer, format: int32, minimum: 0, description: Tasks whose PV came from the first-later-sprint fallback. }
        openInProgress: { type: integer, format: int32, minimum: 0, description: 'Open tasks with at least one in-progress working day (whole-life): worked, nothing earned yet.' }
        doneUnestimated: { type: integer, format: int32, minimum: 0, description: Tasks done with no or a zero estimate - nothing to earn. }
        epicOwnCostMd: { type: number, format: double, description: The worklog MD logged on the listed epics themselves (selection b). }

    DeepDiveReport:
      type: object
      required: [meta, mode, range, nonWorkingDays, sprints, authors, epics, tasks, quality, note]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        mode: { type: string, enum: [SPRINTS, EPICS] }
        range: { $ref: '#/components/schemas/DeepDiveRange' }
        nonWorkingDays:
          type: array
          items: { type: integer, format: int32 }
        sprints:
          type: array
          description: Selection (a) only — the selected sprints, earliest first.
          items: { $ref: '#/components/schemas/DeepDiveSprint' }
        authors:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveAuthor' }
        epics:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveEpic' }
        tasks:
          type: array
          description: By issue key.
          items: { $ref: '#/components/schemas/DeepDiveTask' }
        quality: { $ref: '#/components/schemas/DeepDiveQuality' }
        note: { type: string, nullable: true, description: 'The not-derived-yet message when nothing in scope has derived; a message starting `RANGE_CLAMPED` when an implied range was cut to its last 1100 days and/or one containing `HISTORY_HORIZON` when the history horizon emptied it to a single day; null otherwise.' }

    DeepDiveSprintOption:
      type: object
      required: [id, connectionId, name, state, startAt, endAt, completeAt, taskCount]
      properties:
        id: { type: integer, format: int64, description: The Jira sprint id (unique within a connection). }
        connectionId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        state: { type: string, description: 'The sprint state as stored (`future`, `active` or `closed`).' }
        startAt: { type: integer, format: int64, nullable: true, description: Epoch millis. }
        endAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the planned end. }
        completeAt: { type: integer, format: int64, nullable: true, description: Epoch millis; null while the sprint is not closed. }
        taskCount: { type: integer, format: int32, minimum: 1, description: The domain's level-0 tasks `in_scope_at_close` in this sprint. }

    DeepDiveEpicOption:
      type: object
      required: [id, connectionId, key, summary, domain]
      properties:
        id: { type: integer, format: int64, description: The epic's Jira issue id (unique within a connection). }
        connectionId: { type: integer, format: int32, minimum: 0 }
        key: { type: string }
        summary: { type: string, nullable: true }
        domain: { type: string, nullable: true, description: The epic's own domain key; null when it maps to none. }

    DeepDiveSprintPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeepDiveSprintOption'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DeepDiveEpicPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeepDiveEpicOption'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    ReportedTimeExcluded:
      type: object
      description: >-
        DONE level-0 tasks a reported-time-ratio read could not turn into a ratio, each in ONE bucket
        (`noWorklogs` first, incl. `actual_md` of 0.00; then `neverStarted`; then `zeroCycle`).
        `ratio.n + noWorklogs + neverStarted + zeroCycle = population`.
      required: [population, noWorklogs, neverStarted, zeroCycle]
      properties:
        population: { type: integer, minimum: 0 }
        noWorklogs: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        zeroCycle: { type: integer, minimum: 0 }
    FlowEfficiencyExcluded:
      type: object
      description: >-
        DONE level-0 tasks a flow-efficiency read could not measure, each in ONE bucket (`neverStarted` first,
        then `zeroCycle` — `cycle_ms` of 0). `flowEfficiency.n + neverStarted + zeroCycle = population`.
      required: [population, neverStarted, zeroCycle]
      properties:
        population: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        zeroCycle: { type: integer, minimum: 0 }
    ReportedTimeGroup:
      type: object
      description: >-
        A credit team (UNIT level; `teamId` null = UNASSIGNED, `accountId` null) or an assignee at done (TEAM
        level; a null `accountId` with a null `label` is the unassigned bucket) or, at USER level, one picked account
        (an empty entry when it has no task).
      required: [teamId, accountId, label, ratio, excluded, flowEfficiency, flowEfficiencyExcluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        ratio: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/ReportedTimeExcluded' }
        flowEfficiency: { $ref: '#/components/schemas/Distribution' }
        flowEfficiencyExcluded: { $ref: '#/components/schemas/FlowEfficiencyExcluded' }
    ReportedTimeRatioReport:
      type: object
      required: [meta, ratio, excluded, flowEfficiency, flowEfficiencyExcluded, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        ratio:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ cycle_working_days` per DONE level-0 task."
        excluded: { $ref: '#/components/schemas/ReportedTimeExcluded' }
        flowEfficiency:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "A18: `active_ms ÷ cycle_ms` per DONE level-0 task with a non-zero cycle."
        flowEfficiencyExcluded: { $ref: '#/components/schemas/FlowEfficiencyExcluded' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ReportedTimeGroup' }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: >-
            A URI reference identifying the problem type. `about:blank` for almost every problem; the data-source
            scope `409`s carry `urn:flow:problem:data-source-other-site`, `urn:flow:problem:data-source-project-overlap`
            (Jira), `urn:flow:problem:data-source-other-instance` or `urn:flow:problem:data-source-group-overlap` (GitLab)
            (their `instance` is then the conflicting data source's path, not the request path); a route that does not
            serve the data source's kind (the metrics-config routes and the raw-issue inspector on a GitLab source)
            answers `409` with `urn:flow:problem:data-source-kind-unsupported`.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path; for the data-source scope conflicts, the conflicting data source's path).

    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, connections, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        connections:
          type: array
          items: { $ref: '#/components/schemas/TelemetryConnection' }
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'web, worker or all.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'raw, norm, metrics, public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryConnection:
      type: object
      description: One data source - id and name only (never its settings or token) - with its size estimate, freshness, queue, last runs and DERIVE.
      required:
        - id
        - name
        - enabled
        - deleted
        - issues
        - estimatedBytes
        - estimatedAt
        - freshness
        - queue
        - lastSync
        - lastBackfill
        - rateLimited24h
        - backoffMs24h
        - derive
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        deleted: { type: boolean, description: Soft-deleted and awaiting its PURGE - its storage is still held. }
        issues: { type: integer, format: int64, nullable: true, description: Live issues at the last estimate run; null before the first. }
        estimatedBytes:
          type: integer
          format: int64
          nullable: true
          description: Estimated bytes the connection's rows take over every `raw`/`norm`/`metrics` table (its row share times the table's size); an estimate, exact for one connection.
        estimatedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the estimate run }
        freshness: { $ref: '#/components/schemas/TelemetryFreshness' }
        queue: { $ref: '#/components/schemas/TelemetryQueue' }
        lastSync:
          allOf: [{ $ref: '#/components/schemas/TelemetrySyncRun' }]
          nullable: true
          description: The most recently requested SYNC job; null when none is retained.
        lastBackfill:
          allOf: [{ $ref: '#/components/schemas/TelemetryBackfill' }]
          nullable: true
          description: The latest SYNC job whose run was a first download or widened the scope (`progress.backfill = 1`); null when none is retained.
        rateLimited24h: { type: integer, format: int64, description: Jira 429 responses over the last 24 hours (SYNC jobs that ended in it). }
        backoffMs24h: { type: integer, format: int64, description: Milliseconds slept in Retry-After and back-off over the last 24 hours (SYNC jobs that ended in it). }
        derive:
          allOf: [{ $ref: '#/components/schemas/TelemetryDerive' }]
          nullable: true
          description: The latest ended DERIVE run; null when none is retained.
    TelemetryFreshness:
      type: object
      required: [lastSyncSucceededAt, consecutiveFailures, lastSyncErrorCode, nextSyncAt]
      properties:
        lastSyncSucceededAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        consecutiveFailures: { type: integer, format: int32, minimum: 0 }
        lastSyncErrorCode: { type: string, nullable: true }
        nextSyncAt: { type: integer, format: int64, nullable: true, description: Epoch millis }
        pausedAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch millis the ceiling-trip pause began; while set, scheduled SYNC is off and `nextSyncAt` never fires.
        pauseReason: { type: string, nullable: true, description: The trip code that paused it (`LIMIT_EXCEEDED` or `TIME_EXCEEDED`). }
        reconcilePausedAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch millis the RECONCILE ceiling-trip pause began; while set, scheduled RECONCILE is off (SYNC is unaffected).
        reconcilePauseReason: { type: string, nullable: true, description: The trip code that paused RECONCILE (`LIMIT_EXCEEDED` or `TIME_EXCEEDED`). }
    TelemetryQueue:
      type: object
      required: [pending, running]
      properties:
        pending: { type: integer, format: int64, minimum: 0, description: Jobs a worker could claim now. }
        running: { type: integer, format: int64, minimum: 0 }
    TelemetrySyncRun:
      type: object
      required: [startedAt, finishedAt, status]
      properties:
        startedAt: { type: integer, format: int64, nullable: true, description: Epoch millis; null while still PENDING }
        finishedAt: { type: integer, format: int64, nullable: true, description: Epoch millis; null until it ends }
        status: { type: string, description: 'PENDING, RUNNING, SUCCEEDED, FAILED or CANCELLED.' }
    TelemetryBackfill:
      type: object
      required: [startedAt, finishedAt, durationMs, status]
      properties:
        startedAt: { type: integer, format: int64, nullable: true }
        finishedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true, description: '`finishedAt - startedAt`; null while it runs.' }
        status: { type: string, description: 'PENDING, RUNNING, SUCCEEDED, FAILED or CANCELLED.' }
    TelemetryDerive:
      type: object
      required: [lastFinishedAt, lastDurationMs, lastStatus, peakDurationMs, rowsWritten]
      properties:
        lastFinishedAt: { type: integer, format: int64, description: Epoch millis }
        lastDurationMs: { type: integer, format: int64 }
        lastStatus: { type: string, description: 'SUCCEEDED or FAILED.' }
        peakDurationMs: { type: integer, format: int64, nullable: true, description: The longest DERIVE run that ended in the last 7 days. }
        rowsWritten: { type: integer, format: int64, nullable: true, description: The last run's rows written (the sum of its `row_counts`); null for a run that recorded none. }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live web process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/reports/...`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, omittedConnectionIds, series]
      properties:
        group: { type: string, enum: [memory, storage, sync, derive, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40; `sync`, `derive` and `storage`: 25 connections), or connections were left out whole.' }
        omittedConnectionIds:
          type: array
          maxItems: 10000
          items: { type: integer, format: int64 }
          description: '`sync`, `derive` and `storage` only: the connections left out whole (the fewest ended runs in the range; storage: the smallest estimated bytes) when more than 25 qualify; empty otherwise.'
        series:
          type: array
          maxItems: 102
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, connectionId, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, `sync.runs`, ...).' }
        label: { type: string, description: 'A route, a GC collector, a schema or a connection id; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (web, worker, all); null for cluster-wide, per-connection and `requests` series (those merge every serving role).' }
        connectionId: { type: integer, format: int64, nullable: true, description: The data source of a per-connection series. }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total (a read-time `sync.*` / `derive.*` count's `max` equals it); for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }
