      properties:
        configRevision: { type: integer, format: int64, minimum: 1 }
        hoursPerDay: { type: number, format: double, minimum: 0, maximum: 24, exclusiveMinimum: true }
        timeZone: { type: string, description: "An IANA zone id, e.g. Europe/Warsaw." }
        weekendDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "ISO weekday numbers, 1 (Monday) .. 7 (Sunday)."
        holidays:
          type: array
          items: { type: string, description: "ISO date (YYYY-MM-DD)." }
        commitmentGraceMinutes: { type: integer, minimum: 0 }
        minSampleSize: { type: integer, minimum: 1 }
        agingWindowItems: { type: integer, minimum: 1 }
        agingPercentiles:
          type: array
          items: { type: integer, minimum: 1, maximum: 99 }
        backlogWindowSprints: { type: integer, minimum: 1 }
        epicDriftDays: { type: integer, minimum: 0 }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        updatedByUserId: { type: integer, format: int64, minimum: 0, nullable: true }
    MetricsSettingsRequest:
      type: object
      required:
        - hoursPerDay
        - timeZone
        - weekendDays
        - holidays
        - commitmentGraceMinutes
        - minSampleSize
        - agingWindowItems
        - agingPercentiles
        - backlogWindowSprints
        - epicDriftDays
      properties:
        hoursPerDay: { type: number, format: double, minimum: 0, maximum: 24, exclusiveMinimum: true }
        timeZone: { type: string }
        weekendDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        holidays:
          type: array
          items: { type: string }
        commitmentGraceMinutes: { type: integer, minimum: 0 }
        minSampleSize: { type: integer, minimum: 1 }
        agingWindowItems: { type: integer, minimum: 1 }
        agingPercentiles:
          type: array
          items: { type: integer, minimum: 1, maximum: 99 }
        backlogWindowSprints: { type: integer, minimum: 1 }
        epicDriftDays: { type: integer, minimum: 0 }

    JiraUserResponse:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string }
        displayName: { type: string }
    JiraUserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JiraUserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    TeamMembershipListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMembershipResponse'
    TeamMembershipResponse:
      type: object
      required: [id, accountId, validFrom, validTo, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        accountId: { type: string, description: "The Jira accountId — global across connections." }
        validFrom: { type: integer, format: int64, description: Epoch millis }
        validTo: { type: integer, format: int64, nullable: true, description: "Epoch millis; null = open-ended (the current membership)." }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamMembershipCreateRequest:
      type: object
      required: [accountId, validFrom]
      properties:
        accountId: { type: string, maxLength: 100 }
        validFrom: { type: integer, format: int64 }
        validTo: { type: integer, format: int64, nullable: true }
    TeamMembershipUpdateRequest:
      type: object
      required: [validFrom]
      properties:
        validFrom: { type: integer, format: int64 }
        validTo: { type: integer, format: int64, nullable: true }

    # — reports (v0.3.0 M4 commit 10a) —

    HistogramBucket:
      type: object
      required: [from, to, count]
      properties:
        from: { type: number, format: double }
        to: { type: number, format: double }
        count: { type: integer, format: int64, minimum: 0 }
    Distribution:
      type: object
      description: >-
        `hidden = true` (fewer than `minSampleSize` items) means only `n` is meaningful — every
        other field is null/empty.
      required: [n, hidden, histogram]
      properties:
        n: { type: integer, format: int64, minimum: 0 }
        hidden: { type: boolean }
        mean: { type: number, format: double, nullable: true }
        min: { type: number, format: double, nullable: true }
        max: { type: number, format: double, nullable: true }
        p50: { type: number, format: double, nullable: true }
        p90: { type: number, format: double, nullable: true }
        p95: { type: number, format: double, nullable: true }
        histogram:
          type: array
          items: { $ref: '#/components/schemas/HistogramBucket' }
    ResolvedSprintGroup:
      type: object
      required: [teamId, sprintIds]
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        sprintIds:
          type: array
          items: { type: integer, format: int64 }
    ReportMeta:
      type: object
      description: The `meta` block every report response carries beside its own body.
      required: [derivedAt, configRevision, from, to, level, domainView, resolvedSprints, minSampleSize]
      properties:
        derivedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null before any connection has ever completed a DERIVE." }
        configRevision: { type: integer, format: int64, minimum: 1, nullable: true, description: "The config revision the served figures were DERIVED under: the oldest `config_revision` among the newest SUCCEEDED DERIVE runs of the connections the report read (not the live `metrics.settings.config_revision`, which runs ahead of the data between a configuration change and its DERIVE); null before any connection has completed a DERIVE." }
        from: { type: string, format: date, nullable: true, description: "ISO date; null for a lastSprints/sprintId-selected period." }
        to: { type: string, format: date, nullable: true, description: "ISO date; null for a lastSprints/sprintId-selected period." }
        level: { type: string, enum: [UNIT, TEAM, USER] }
        domainView: { type: string, enum: [TASK, EPIC] }
        resolvedSprints:
          type: array
          items: { $ref: '#/components/schemas/ResolvedSprintGroup' }
        minSampleSize: { type: integer, minimum: 1 }
    ReportFilterSprint:
      type: object
      required: [sprintId, name, state, startAt, completeAt]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        state: { type: string }
        startAt: { type: integer, format: int64, nullable: true }
        completeAt: { type: integer, format: int64, nullable: true }
    ReportFilterMember:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string }
        displayName: { type: string }
    ReportFilterTeam:
      type: object
      required: [id, name, sprints, members]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        sprints:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterSprint' }
        members:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterMember' }
    ReportFilterDomain:
      type: object
      required: [domainKey, domainName]
      properties:
        domainKey: { type: string }
        domainName: { type: string }
    ReportFilterConnection:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    ReportFilters:
      type: object
      required: [teams, domains, activityTypes, workCategories, connections, derivedAt, configRevision, minSampleSize, timeZone]
      properties:
        teams:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterTeam' }
        domains:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterDomain' }
        activityTypes:
          type: array
          items: { type: string }
        workCategories:
          type: array
          items: { type: string }
        connections:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterConnection' }
        derivedAt: { type: integer, format: int64, nullable: true }
        configRevision: { type: integer, format: int64, minimum: 1, nullable: true, description: "The config revision the served figures were DERIVED under: the oldest `config_revision` among the newest SUCCEEDED DERIVE runs of the connections the report read (not the live `metrics.settings.config_revision`, which runs ahead of the data between a configuration change and its DERIVE); null before any connection has completed a DERIVE." }
        minSampleSize: { type: integer, minimum: 1 }
        timeZone: { type: string, description: "The configured IANA time zone (`metrics.settings.time_zone`) that `from`/`to` are read in — a client renders report dates and computes period presets in it." }

    VelocitySnapshot:
      type: object
      description: The four figures a velocity row carries, live or frozen.
      required: [initialMd, initialItems, finalMd, finalItems]
      properties:
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
    VelocitySprint:
      type: object
      required: [sprintId, name, teamId, completedAt, initialMd, initialItems, finalMd, finalItems, snapshot, drift]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completedAt: { type: integer, format: int64, nullable: true, description: "Null only for an active/future sprint, reachable through an explicit sprintId." }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        snapshot:
          allOf: [{ $ref: '#/components/schemas/VelocitySnapshot' }]
          nullable: true
        drift: { type: boolean }
    VelocityGroup:
      type: object
      description: >-
        A team's own sums (UNIT level) or one user's `assignee_at_commitment` sums (TEAM level) —
        always empty at USER level. `teamId`/`accountId`/`label` are mutually exclusive with each
        other's absence: exactly one of `teamId` or `accountId` is set per row (a null `accountId`
        with a null `label` is the unassigned-at-commitment bucket, never a stored sentinel).
      required: [initialMd, initialItems, finalMd, finalItems]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
    VelocityReport:
      type: object
      required: [meta, sprints, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        sprints:
          type: array
          items: { $ref: '#/components/schemas/VelocitySprint' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/VelocityGroup' }

    ThroughputSnapshot:
      type: object
      description: A sprint's delivered figures, live or frozen.
      required: [deliveredMd, deliveredItems]
      properties:
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
    ThroughputSprint:
      type: object
      description: One sprint's delivered scope (the SPRINT view — priced at the sprint's close).
      required: [sprintId, name, teamId, completedAt, deliveredMd, deliveredItems, snapshot, drift]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completedAt: { type: integer, format: int64, nullable: true, description: "Null only for an active/future sprint, reachable through an explicit sprintId." }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        snapshot:
          allOf: [{ $ref: '#/components/schemas/ThroughputSnapshot' }]
          nullable: true
        drift: { type: boolean }
    ThroughputBucketRow:
      type: object
      description: One time bucket of the PERIOD view (tasks by `done_at`, priced at done).
      required: [bucketStart, deliveredMd, deliveredItems]
      properties:
        bucketStart: { type: string, description: "The bucket's first day, ISO date (a Monday for weeks, the 1st for months)." }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
    ThroughputGroup:
      type: object
      description: >-
        A credit team's sums (UNIT level; `teamId: null` is the UNASSIGNED bucket, `accountId` null) or
        one assignee-at-done's sums (TEAM level; `accountId` null with a null `label` is the
        unassigned bucket) over the PERIOD view — always empty at USER level.
      required: [teamId, accountId, label, deliveredMd, deliveredItems]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
    ThroughputReport:
      type: object
      required: [meta, bySprint, byBucket, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        bySprint:
          type: array
          items: { $ref: '#/components/schemas/ThroughputSprint' }
        byBucket:
          type: array
          items: { $ref: '#/components/schemas/ThroughputBucketRow' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ThroughputGroup' }

    SprintFigures:
      type: object
      description: The fourteen sprint figures (MD beside items), live or frozen.
      required: [committedMd, committedItems, addedMd, addedItems, removedMd, removedItems, finalMd, finalItems, deliveredMd, deliveredItems, carriedOverMd, carriedOverItems, droppedMd, droppedItems]
      properties:
        committedMd: { type: number, format: double }
        committedItems: { type: integer }
        addedMd: { type: number, format: double }
        addedItems: { type: integer }
        removedMd: { type: number, format: double }
        removedItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        carriedOverMd: { type: number, format: double }
        carriedOverItems: { type: integer }
        droppedMd: { type: number, format: double }
        droppedItems: { type: integer }
    SprintConsistencySprint:
      type: object
      required: [sprintId, name, teamId, completedAt, committedMd, committedItems, addedMd, addedItems, removedMd, removedItems, finalMd, finalItems, deliveredMd, deliveredItems, carriedOverMd, carriedOverItems, droppedMd, droppedItems, snapshot, drift]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completedAt: { type: integer, format: int64, nullable: true, description: "Null only for an active/future sprint, reachable through an explicit sprintId." }
        committedMd: { type: number, format: double }
        committedItems: { type: integer }
        addedMd: { type: number, format: double }
        addedItems: { type: integer }
        removedMd: { type: number, format: double }
        removedItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        carriedOverMd: { type: number, format: double }
        carriedOverItems: { type: integer }
        droppedMd: { type: number, format: double }
        droppedItems: { type: integer }
        snapshot:
          allOf: [{ $ref: '#/components/schemas/SprintFigures' }]
          nullable: true
        drift: { type: boolean }
    SprintConsistencyGroup:
      type: object
      description: >-
        A team's summed figures (UNIT level, `teamId` set) or one user's `assignee_at_commitment` figures
        (TEAM level; a null `accountId` with a null `label` is the unassigned-at-commitment bucket) —
        always empty at USER level.
      required: [committedMd, committedItems, addedMd, addedItems, removedMd, removedItems, finalMd, finalItems, deliveredMd, deliveredItems, carriedOverMd, carriedOverItems, droppedMd, droppedItems]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        committedMd: { type: number, format: double }
        committedItems: { type: integer }
        addedMd: { type: number, format: double }
        addedItems: { type: integer }
        removedMd: { type: number, format: double }
        removedItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        carriedOverMd: { type: number, format: double }
        carriedOverItems: { type: integer }
        droppedMd: { type: number, format: double }
        droppedItems: { type: integer }
    SprintConsistencyReport:
      type: object
      required: [meta, sprints, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        sprints:
          type: array
          items: { $ref: '#/components/schemas/SprintConsistencySprint' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/SprintConsistencyGroup' }

    TaskAccuracyExcluded:
      type: object
      description: >-
        DONE level-0 tasks a task-accuracy read could not turn into a ratio, each in ONE bucket
        (`noWorklogs` first — D14, incl. `actual_md` of 0.00, both views; then `neverStarted` — `atStart` only; then
        `unestimatedAtStart` / `unestimatedAtDone`). `atStart.n + noWorklogs + neverStarted +
        unestimatedAtStart = population`; `atDone.n + noWorklogs + unestimatedAtDone = population`.
      required: [population, noWorklogs, neverStarted, unestimatedAtStart, unestimatedAtDone]
      properties:
        population: { type: integer, minimum: 0 }
        noWorklogs: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        unestimatedAtStart: { type: integer, minimum: 0 }
        unestimatedAtDone: { type: integer, minimum: 0 }
    TaskAccuracyGroup:
      type: object
      description: >-
        A credit team (UNIT level; `teamId` null = UNASSIGNED, `accountId` null) or an assignee at done
        (TEAM level; a null `accountId` with a null `label` is the unassigned bucket) — always empty at
        USER level.
      required: [teamId, accountId, label, atStart, atDone, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        atStart: { $ref: '#/components/schemas/Distribution' }
        atDone: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/TaskAccuracyExcluded' }
    TaskEstimationAccuracyReport:
      type: object
      required: [meta, atStart, atDone, excluded, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        atStart:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ estimate at start` (D15) per DONE level-0 task."
        atDone:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ estimate at done` per DONE level-0 task."
        excluded: { $ref: '#/components/schemas/TaskAccuracyExcluded' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/TaskAccuracyGroup' }

    EpicAccuracyExcluded:
      type: object
      description: >-
        DONE epics an accuracy read could not turn into a ratio, each in ONE bucket (`noActual` first,
        then `neverStarted` — `atStart` only — then `unestimatedAtStart` / `unestimatedAtDone`).
        `atStart.n + noActual + neverStarted + unestimatedAtStart = population`;
        `atDone.n + noActual + unestimatedAtDone = population`.
      required: [population, noActual, neverStarted, unestimatedAtStart, unestimatedAtDone]
      properties:
        population: { type: integer, minimum: 0 }
        noActual: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        unestimatedAtStart: { type: integer, minimum: 0 }
        unestimatedAtDone: { type: integer, minimum: 0 }
    EpicAccuracyRow:
      type: object
      description: >-
        One DONE epic in scope. `ratio` is `actualMd ÷ ownEstimateAtStartMd` (D15), `ratioAtDone` the same
        at done — each null when the epic is excluded from that distribution. `childSumMd` is the sum of
        the child estimates, shown beside the own estimate.
      required: [issueKey, summary, ownerTeamId, doneAt, ownEstimateAtStartMd, ownEstimateAtDoneMd, childSumMd, actualMd, ratio, ratioAtDone]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The domain's owner team (A19); null = UNOWNED." }
        doneAt: { type: integer, format: int64 }
        ownEstimateAtStartMd: { type: number, format: double, nullable: true }
        ownEstimateAtDoneMd: { type: number, format: double, nullable: true }
        childSumMd: { type: number, format: double }
        actualMd: { type: number, format: double }
        ratio: { type: number, format: double, nullable: true }
        ratioAtDone: { type: number, format: double, nullable: true }
    EpicAccuracyGroup:
      type: object
      description: One owner team (UNIT level only; `teamId` null = UNOWNED).
      required: [teamId, label, atStart, atDone, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        label: { type: string, nullable: true }
        atStart: { $ref: '#/components/schemas/Distribution' }
        atDone: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/EpicAccuracyExcluded' }
    EpicEstimationAccuracyReport:
      type: object
      required: [meta, atStart, atDone, excluded, epics, epicsTruncated, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        atStart:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ OWN estimate at start` (D15) per DONE epic."
        atDone:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ OWN estimate at done` per DONE epic."
        excluded: { $ref: '#/components/schemas/EpicAccuracyExcluded' }
        epics:
          type: array
          maxItems: 200
          description: Every DONE epic in scope, newest `doneAt` first (then connection id, then issue id), at most 200.
          items: { $ref: '#/components/schemas/EpicAccuracyRow' }
        epicsTruncated: { type: boolean, description: "True when more than 200 epics matched." }
        groups:
          type: array
          items: { $ref: '#/components/schemas/EpicAccuracyGroup' }

    AdjustmentChangeExcluded:
      type: object
      description: >-
        DONE items (by `done_at`) the change distribution could not take, each in ONE bucket:
        `estimatedLate` (never a `+∞` change), else `unestimated` (either estimate missing, incl. never
        started). `changeDistribution.n + estimatedLate + unestimated = population`.
      required: [population, estimatedLate, unestimated]
      properties:
        population: { type: integer, minimum: 0 }
        estimatedLate: { type: integer, minimum: 0 }
        unestimated: { type: integer, minimum: 0 }
    AdjustmentFigures:
      type: object
      description: >-
        The adjustment figures of one item kind. Of the items STARTED in the period: `changedAfterStart`
        had an estimate change after start, `share` is their 0..1 fraction (null when fewer than
        `minSampleSize` items started),
        `estimatedLate` gained an estimate only after start. `changeDistribution` is the fractional change
        start → done (`(done − start) ÷ start`) over items DONE in the period with both estimates.
      required: [started, changedAfterStart, share, estimatedLate, changeDistribution, changeExcluded]
      properties:
        started: { type: integer, minimum: 0 }
        changedAfterStart: { type: integer, minimum: 0 }
        share: { type: number, format: double, nullable: true }
        estimatedLate: { type: integer, minimum: 0 }
        changeDistribution: { $ref: '#/components/schemas/Distribution' }
        changeExcluded: { $ref: '#/components/schemas/AdjustmentChangeExcluded' }
    EstimateAdjustmentsGroup:
      type: object
      description: >-
        A team (UNIT level; `teamId` null = UNASSIGNED tasks / UNOWNED epics, `accountId` null) or an
        assignee at done (TEAM level, tasks only — `epics` null; a null `accountId` with a null `label`
        is the unassigned bucket) — always empty at USER level.
      required: [teamId, accountId, label, tasks, epics]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        tasks: { $ref: '#/components/schemas/AdjustmentFigures' }
        epics:
          allOf: [{ $ref: '#/components/schemas/AdjustmentFigures' }]
          nullable: true
    EstimateAdjustmentsReport:
      type: object
      required: [meta, tasks, epics, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        tasks: { $ref: '#/components/schemas/AdjustmentFigures' }
        epics: { $ref: '#/components/schemas/AdjustmentFigures' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/EstimateAdjustmentsGroup' }

    CycleTimeExcluded:
      type: object
      description: >-
        DONE level-0 tasks (or, in the `epics` block, DONE epics) a cycle-time read could not measure:
        `neverStarted` (no `started_at`) is the only exclusion. `workingDays.n = population - neverStarted`.
      required: [population, neverStarted]
      properties:
        population: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
    CycleTimeTrendBucket:
      type: object
      description: >-
        One bucket of the trend: the working-day cycle time of tasks done in the bucket. `p50`/`p90` are null
        when `n` is below `minSampleSize` (an empty bucket has `n` 0).
      required: [bucketStart, p50, p90, n]
      properties:
        bucketStart: { type: string, description: "The bucket's first day, ISO date (a Monday for weeks, the 1st for months)." }
        p50: { type: number, format: double, nullable: true }
        p90: { type: number, format: double, nullable: true }
        n: { type: integer, format: int64, minimum: 0 }
    CycleTimeGroup:
      type: object
      description: >-
        A credit team (UNIT level; `teamId` null = UNASSIGNED, `accountId` null) or an assignee at done (TEAM
        level; a null `accountId` with a null `label` is the unassigned bucket) — always empty at USER level.
      required: [teamId, accountId, label, elapsedDays, workingDays, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        elapsedDays: { $ref: '#/components/schemas/Distribution' }
        workingDays: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/CycleTimeExcluded' }
    EpicCycleTimeGroup:
      type: object
      description: >-
        One owner team's epic cycle time (UNIT level only; `teamId` null = UNOWNED, `label` the team name).
      required: [teamId, label, elapsedDays, workingDays, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        label: { type: string, nullable: true }
        elapsedDays: { $ref: '#/components/schemas/Distribution' }
        workingDays: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/CycleTimeExcluded' }
    EpicCycleTime:
      type: object
      description: >-
        Cycle time of the epics DONE (by their own status, D11) in the period: `elapsedDays` is
        `fact_epic_delivery.cycle_ms` in wall-clock days, `workingDays` its `cycle_working_days`; both hidden below
        `minSampleSize`. `excluded.neverStarted` (no `started_at`) is the only exclusion, so
        `workingDays.n = population − neverStarted`. All zero at USER level (epics carry no user).
      required: [elapsedDays, workingDays, excluded, groups]
      properties:
        elapsedDays: { $ref: '#/components/schemas/Distribution' }
        workingDays: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/CycleTimeExcluded' }
        groups:
          type: array
          description: One per owner team at UNIT level (`teamId` null = UNOWNED); empty at TEAM and USER level.
          items: { $ref: '#/components/schemas/EpicCycleTimeGroup' }
    CycleTimeReport:
      type: object
      required: [meta, elapsedDays, workingDays, excluded, trend, groups, epics]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        elapsedDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`cycle_ms` in wall-clock days per DONE level-0 task."
        workingDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`cycle_working_days` per DONE level-0 task."
        excluded: { $ref: '#/components/schemas/CycleTimeExcluded' }
        trend:
          type: array
          description: One bucket per week/month across the whole window, zero-filled, by `done_at`, on working days.
          items: { $ref: '#/components/schemas/CycleTimeTrendBucket' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/CycleTimeGroup' }
        epics: { $ref: '#/components/schemas/EpicCycleTime' }

    WipKey:
      type: object
      description: One legend entry of a WIP series — the `key` every point's `counts` uses, and its display `label`.
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }

    WipPoint:
      type: object
      description: One calendar day of a WIP series; `counts` carries EVERY key of the report's `keys` (zero-filled).
      required: [day, isWorkingDay, counts]
      properties:
        day: { type: string, description: 'ISO date in the configured zone.' }
        isWorkingDay: { type: boolean, description: 'Whether the day is a working day of the configured calendar (weekends and holidays are not).' }
        counts:
          type: object
          description: Items at the END of the day, per key of `keys`.
          additionalProperties: { type: integer, minimum: 0 }

    WipReport:
      type: object
      required: [meta, by, itemKind, keys, series]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        by:
          type: string
          enum: [STATUS, STAGE, COLUMN]
          description: "What `counts` is keyed by (the request's `by`, default STAGE)."
        itemKind:
          type: string
          enum: [TASK, EPIC, BOTH]
          description: "Which items were counted (the request's `itemKind`, default TASK)."
        keys:
          type: array
          description: >-
            The legend, in display order — the four stages for STAGE, the statuses seen (ordered by stage, then
            name) for STATUS, the board's columns in board order (plus "(no column)" when used) for COLUMN.
          items: { $ref: '#/components/schemas/WipKey' }
        series:
          type: array
          description: >-
            One point per calendar day of the period, oldest first, cut off after the last derived day. Empty at USER
            level (see `note`), for a period with nothing to read, and for a period entirely past the last derived day.
          items: { $ref: '#/components/schemas/WipPoint' }
        note:
          type: string
          nullable: true
          description: >-
            Why the series is empty or partial — USER level, not derived yet, no sprint resolved (incl. `teamId=0`
            with a sprint-relative period), connections that never derived and were left out of the cut-off; null
            otherwise.

    BacklogTrendPoint:
      type: object
      description: The estimated backlog at the END of one calendar day.
      required: [day, items, md]
      properties:
        day: { type: string, description: 'ISO date in the configured zone.' }
        items: { type: integer, minimum: 0 }
        md: { type: number, format: double, minimum: 0, description: "Man-days — the sum of the items' own estimates." }

    BacklogCurrent:
      type: object
      description: The backlog on the last listed day, and report 13's backlog in sprints.
      required: [items, md, windowSprints, sprintsUsed]
      properties:
        asOfDay: { type: string, nullable: true, description: "The day the snapshot is read for (the trend's last day); null when the trend is empty." }
        items: { type: integer, minimum: 0 }
        md: { type: number, format: double, minimum: 0 }
        meanDeliveredMd:
          type: number
          format: double
          nullable: true
          description: >-
            Mean `delivered_md` of the team's last `windowSprints` closed sprints as of `asOfDay` (at UNIT level the
            sum of each team's own mean); null with no closed sprint, or for a scope with no velocity of its own.
        windowSprints: { type: integer, minimum: 1, description: 'The configured window (`backlog_window_sprints`).' }
        sprintsUsed: { type: integer, minimum: 0, description: 'How many closed sprints the mean was taken over: fewer than the window when fewer exist, and at UNIT level the minimum across the teams that have closed a sprint.' }
        backlogInSprints:
          type: number
          format: double
          nullable: true
          description: "`md ÷ meanDeliveredMd`; null when the mean is null or 0."

    BacklogReport:
      type: object
      required: [meta, current, trend]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        current: { $ref: '#/components/schemas/BacklogCurrent' }
        trend:
          type: array
          description: One point per calendar day of the period, oldest first, zero-filled, cut off after the last derived day.
          items: { $ref: '#/components/schemas/BacklogTrendPoint' }
        note:
          type: string
          nullable: true
          description: >-
            Why the report is empty or partial — USER level, not derived yet, no sprint resolved (incl. `teamId=0`
            with a sprint-relative period), connections that never derived and were left out of the cut-off; null
            otherwise.

    AgingPercentile:
      type: object
      required: [percentile]
      properties:
        percentile: { type: integer, minimum: 1, maximum: 99, description: A configured `aging_percentiles` entry. }
        workingDays: { type: number, format: double, nullable: true, description: 'That percentile of the cycle working days; null while the thresholds are hidden.' }

    AgingThresholds:
      type: object
      description: The cycle-time percentiles of the last `aging_window_items` DONE items; hidden below `minSampleSize`.
      required: [n, hidden, percentiles]
      properties:
        n: { type: integer, format: int64, minimum: 0, description: How many DONE items the window held. }
        hidden: { type: boolean }
        percentiles:
          type: array
          items: { $ref: '#/components/schemas/AgingPercentile' }

    AgingItem:
      type: object
      required: [issueKey, itemKind, startedAt, ageWorkingDays, blocked]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        itemKind: { type: string, enum: [TASK, EPIC] }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The current team (tasks) or owner team (epics); null = UNASSIGNED / UNOWNED.' }
        assigneeAccountId: { type: string, nullable: true }
        assignee: { type: string, nullable: true, description: The assignee's Jira display name; null for an epic or an unassigned task. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the first entry into an IN_PROGRESS stage. }
        ageWorkingDays: { type: number, format: double, minimum: 0, description: Working days from `startedAt` to the request's clock. }
        blocked: { type: boolean, description: "Blocked as of the connection's last DERIVE (a blocked spell covers its clock)." }
        band:
          type: string
          nullable: true
          description: 'The highest threshold the age is above (`P50`, `P85`, ...), `WITHIN` when above none, null when the thresholds are hidden.'

    AgingWipReport:
      type: object
      required: [meta, thresholds, epicThresholds, items, itemsTruncated]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        thresholds: { $ref: '#/components/schemas/AgingThresholds' }
        epicThresholds: { $ref: '#/components/schemas/AgingThresholds' }
        items:
          type: array
          description: Every in-progress task and epic, oldest first, at most 500.
          items: { $ref: '#/components/schemas/AgingItem' }
        itemsTruncated: { type: boolean, description: True when more than 500 items matched. }

    BlockedShareExcluded:
      type: object
      description: >-
        DONE items with no measurable share of cycle, each in ONE bucket (`neverStarted`, then `zeroCycle`).
        `shareOfCycle.n + neverStarted + zeroCycle = population`.
      required: [population, neverStarted, zeroCycle]
      properties:
        population: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        zeroCycle: { type: integer, minimum: 0 }

    BlockedTopItem:
      type: object
      required: [issueKey, itemKind, doneAt, blockedWorkingDays]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        itemKind: { type: string, enum: [TASK, EPIC] }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        doneAt: { type: integer, format: int64 }
        blockedWorkingDays: { type: number, format: double, minimum: 0 }
        cycleWorkingDays: { type: number, format: double, nullable: true }
        share: { type: number, format: double, nullable: true, description: '`blockedWorkingDays / cycleWorkingDays`; null when the item has no measurable cycle.' }

    BlockedGroup:
      type: object
      required: [blockedWorkingDays, shareOfCycle, blockedItems, excluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        blockedWorkingDays: { $ref: '#/components/schemas/Distribution' }
        shareOfCycle: { $ref: '#/components/schemas/Distribution' }
        blockedItems: { type: integer, minimum: 0 }
        excluded: { $ref: '#/components/schemas/BlockedShareExcluded' }

    BlockedTimeReport:
      type: object
      required: [meta, itemKind, blockedWorkingDays, shareOfCycle, blockedItems, excluded, topItems, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        itemKind: { type: string, enum: [TASK, EPIC, BOTH], description: 'Which DONE items were counted (the request itemKind, default TASK).' }
        blockedWorkingDays:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: '`blocked_working_days` of every DONE item — zeros (never blocked) included.'
        shareOfCycle:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: '`blocked_working_days / cycle_working_days` over the items with a cycle above zero.'
        blockedItems: { type: integer, minimum: 0, description: How many DONE items were blocked at all. }
        excluded: { $ref: '#/components/schemas/BlockedShareExcluded' }
        topItems:
          type: array
          description: The 20 most-blocked DONE items, most first.
          items: { $ref: '#/components/schemas/BlockedTopItem' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/BlockedGroup' }

    EpicProgressScope:
      type: object
      description: The one thing a curve is about.
      required: [kind, id, key, name]
      properties:
        kind: { type: string, enum: [EPIC, DOMAIN, TEAM] }
        id: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The team id (`0` = UNASSIGNED); null for an epic or a domain.' }
        key: { type: string, nullable: true, description: The epic's issue key or the domain key; null for a team. }
        name: { type: string, description: 'The epic summary (its key when none), the domain name or the team name.' }

    EpicProgressPoint:
      type: object
      description: One calendar day of the series (configured zone) — CUMULATIVE values at the end of the day.
      required: [date, pv, ev, ac, pvOriginal]
      properties:
        date: { type: string, description: 'ISO date (YYYY-MM-DD).' }
        pv: { type: number, format: double, description: Cumulative planned value in man-days. }
        ev: { type: number, format: double, description: Cumulative earned value in man-days. }
        ac: { type: number, format: double, description: Cumulative actual cost in man-days. }
        pvOriginal: { type: number, format: double, nullable: true, description: "EPIC level: the epic's first baseline redrawn (cumulative man-days); null elsewhere and when that baseline has no curve." }

    EpicProgressAsOf:
      type: object
      description: The figures at `day`, man-days at two decimals.
      required: [day, pv, ev, ac, sv, spi, cv, cpi]
      properties:
        day: { type: string, nullable: true, description: 'ISO date the figures are read at; null when there is nothing to read.' }
        pv: { type: number, format: double }
        ev: { type: number, format: double }
        ac: { type: number, format: double }
        sv: { type: number, format: double, description: 'Schedule variance: EV − PV.' }
        spi: { type: number, format: double, nullable: true, description: Schedule performance index EV ÷ PV; null when PV is 0. }
        cv: { type: number, format: double, description: 'Cost variance: EV − AC.' }
        cpi: { type: number, format: double, nullable: true, description: Cost performance index EV ÷ AC; null when AC is 0. }

    EpicProgressRow:
      type: object
      description: One drill row, its figures as of the response's `asOf.day`.
      required: [kind, id, key, name, pv, ev, ac, sv, spi, cv, cpi]
      properties:
        kind: { type: string, enum: [EPIC, DOMAIN, TEAM] }
        id: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The team id (`0` = UNASSIGNED) of a TEAM row; null otherwise.' }
        key: { type: string, nullable: true, description: The epic's issue key or the domain key; null for a team. }
        name: { type: string }
        active: { type: boolean, nullable: true, description: 'TEAM rows only: false for a soft-deleted team that still has figures (its own drill answers 400); null otherwise.' }
        pv: { type: number, format: double }
        ev: { type: number, format: double }
        ac: { type: number, format: double }
        sv: { type: number, format: double }
        spi: { type: number, format: double, nullable: true }
        cv: { type: number, format: double }
        cpi: { type: number, format: double, nullable: true }

    EpicProgressBaseline:
      type: object
      description: One `fact_epic_plan` baseline, in effect from `effectiveFrom` until `supersededAt` (null = the current one).
      required: [effectiveFrom, supersededAt, startAt, dueAt, budgetMd]
      properties:
        effectiveFrom: { type: integer, format: int64, description: Epoch millis the baseline took effect. }
        supersededAt: { type: integer, format: int64, nullable: true }
        startAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the planned start date (a zone-free calendar date). }
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the planned due date (a zone-free calendar date). }
        budgetMd: { type: number, format: double, nullable: true }

    EpicProgressDrift:
      type: object
      description: Whether the CURRENT baseline differs from the FIRST one (both false with a single baseline or none current).
      required: [dates, budget]
      properties:
        dates: { type: boolean, description: The start and/or due date moved. }
        budget: { type: boolean, description: The budget changed. }

    EpicProgressEpic:
      type: object
      description: The EPIC level's plan facts.
      required: [budgetMd, budgetSource, startAt, dueAt, inPvHorizon, hasPvCurve, baselines, drift]
      properties:
        budgetMd: { type: number, format: double, nullable: true, description: 'The current budget: the current baseline''s, else the delivery fact''s (own estimate, else the child sum, D4).' }
        budgetSource: { type: string, nullable: true, description: 'OWN (the epic''s own estimate) or CHILDREN (the child sum, D4); null with no baseline and no delivery fact.' }
        startAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the epic's own start date. }
        dueAt: { type: integer, format: int64, nullable: true, description: Epoch millis of UTC midnight of the epic's own due date. }
        inPvHorizon: { type: boolean, description: 'True when the current baseline is complete and both its dates lie within ±10 years of the DERIVE clock; false means no PV at all (A23).' }
        hasPvCurve: { type: boolean, description: 'inPvHorizon AND the baseline window holds at least one working day, so PV is actually spread over it.' }
        baselines:
          type: array
          description: Every baseline, oldest first.
          items: { $ref: '#/components/schemas/EpicProgressBaseline' }
        drift: { $ref: '#/components/schemas/EpicProgressDrift' }

    EpicProgressReport:
      type: object
      required: [meta, level, scope, series, asOf, epic, foreignWorkShare, rows, note]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        level: { type: string, enum: [UNIT, DOMAIN, EPIC, TEAM], description: 'What the report is about (`meta.level` keeps the shared UNIT/TEAM/USER meaning of `teamId`).' }
        scope:
          allOf: [{ $ref: '#/components/schemas/EpicProgressScope' }]
          nullable: true
          description: The epic, domain or team; null at UNIT level.
        series:
          type: array
          description: One point per calendar day of the period up to `asOf.day`; empty at UNIT level.
          items: { $ref: '#/components/schemas/EpicProgressPoint' }
        asOf: { $ref: '#/components/schemas/EpicProgressAsOf' }
        epic:
          allOf: [{ $ref: '#/components/schemas/EpicProgressEpic' }]
          nullable: true
          description: EPIC level only.
        foreignWorkShare: { type: number, format: double, nullable: true, description: "TEAM level only: the team authors' foreign-work MD ÷ their logged MD from the beginning of time up to asOf.day (0..1, A20 — the same cumulative window as CPI); null when they logged none." }
        rows:
          type: array
          description: 'The drill table as of `asOf.day`: a domain''s epics (DOMAIN), the domains then the teams (UNIT); empty at EPIC and TEAM level.'
          items: { $ref: '#/components/schemas/EpicProgressRow' }
        note:
          type: string
          nullable: true
          description: >-
            Why the answer is empty or partial — nothing derived yet, no sprint resolved (incl. `teamId=0` with a
            sprint-relative period), connections that never derived and were left out of the cut-off, a period that lies
            after `asOf.day`; null otherwise.
    DataQualityTaskRef:
      type: object
      description: One task a finding points at (`doneAt` null = still open).
      required: [issueKey, summary, teamId, assigneeAccountId, assignee, doneAt, startedAt, estimateMd]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The credit team (DONE) / current team (open); null = UNASSIGNED.' }
        assigneeAccountId: { type: string, nullable: true }
        assignee: { type: string, nullable: true, description: The Jira display name (the account id when none is known). }
        doneAt: { type: integer, format: int64, nullable: true }
        startedAt: { type: integer, format: int64, nullable: true }
        estimateMd: { type: number, format: double, nullable: true, description: 'The estimate at done (DONE) / the current one (open) in man-days; null = unestimated.' }
    DataQualityDoneOpen:
      type: object
      description: A count split by DONE-in-the-period and currently open started tasks.
      required: [done, open]
      properties:
        done: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
    DataQualityTaskFinding:
      type: object
      description: >-
        A task finding: `done` DONE tasks of the period plus `open` open started ones (0 for a finding that only makes sense
        once a task is done), `total` their sum, `md` the matching tasks' estimates, and the first 50 in `items` (DONE newest
        first, then open by age).
      required: [done, open, total, md, items]
      properties:
        done: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        md: { type: number, format: double }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityTaskRef' }
    DataQualityEpicRef:
      type: object
      description: One epic a finding points at; `flags` names the D11 drift codes (empty outside the drift finding).
      required: [issueKey, summary, ownerTeamId, domainKey, startAt, dueAt, doneAt, flags]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        ownerTeamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The domain owner team (A19); null = UNOWNED.' }
        domainKey: { type: string, nullable: true }
        startAt: { type: integer, format: int64, nullable: true }
        dueAt: { type: integer, format: int64, nullable: true }
        doneAt: { type: integer, format: int64, nullable: true }
        flags:
          type: array
          items: { type: string, enum: [EPIC_NOT_STARTED_WITH_ACTIVE_CHILDREN, EPIC_OPEN_AFTER_CHILDREN_DONE, EPIC_DONE_WITH_OPEN_CHILDREN] }
    DataQualityEpicList:
      type: object
      description: A capped list of epics.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityEpicRef' }
    DataQualityUnownedDomain:
      type: object
      description: 'A domain no team owns (A19, A22): its epics and backlog land in UNOWNED.'
      required: [connectionId, domainKey, name, projectKeys, epics]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        domainKey: { type: string }
        name: { type: string }
        projectKeys: { type: array, items: { type: string } }
        epics: { type: integer, minimum: 0, description: The domain's epics (any state). }
    DataQualityUnownedDomainList:
      type: object
      description: A capped list of domains without an owner team.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityUnownedDomain' }
    DataQualityUnmappedStatus:
      type: object
      description: A Jira status with no stage mapping — its time is tiled UNMAPPED, never started, never done.
      required: [connectionId, statusId, name, category, items, openItems]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        statusId: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        items: { type: integer, minimum: 0, description: Work items (sub-tasks included) that have ever sat in the status. }
        openItems: { type: integer, minimum: 0, description: Work items sitting in it now. }
    DataQualityUnmappedStatusList:
      type: object
      description: A capped list of unmapped statuses.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityUnmappedStatus' }
    DataQualityUnmappedBoard:
      type: object
      description: A Jira board no team is mapped to — its sprints have no team and no snapshot.
      required: [connectionId, boardId, name, projectKey, sprints, doneTasks]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        boardId: { type: integer, format: int64 }
        name: { type: string }
        projectKey: { type: string, nullable: true }
        sprints: { type: integer, minimum: 0 }
        doneTasks: { type: integer, minimum: 0, description: "Level-0 tasks of the period done inside one of the board's sprints (they fall back to the assignee's team, D5)." }
    DataQualityUnmappedBoardList:
      type: object
      description: >-
        A capped list of unmapped boards, plus the residual `unattributedDoneTasks`: tasks of the period done inside a sprint
        with no team that belongs to none of the boards listed (the sprint has no board, or its board is mapped yet the sprint
        carries no team) — so no task done in a teamless sprint is counted nowhere.
      required: [total, items, unattributedDoneTasks]
      properties:
        total: { type: integer, minimum: 0, description: How many boards matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityUnmappedBoard' }
        unattributedDoneTasks: { type: integer, minimum: 0 }
    DataQualityAuthor:
      type: object
      description: A worklog author who was in no team when logging (a null `accountId` = worklogs with no known author).
      required: [accountId, name, worklogs, md]
      properties:
        accountId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        worklogs: { type: integer, minimum: 0 }
        md: { type: number, format: double }
    DataQualityAuthorList:
      type: object
      description: A capped list of authors without a team, most logged MD first.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualityAuthor' }
    DataQualitySnapshotDrift:
      type: object
      description: >-
        One figure of a closed, team-mapped sprint whose live value has moved away from the frozen snapshot (D13):
        MD figures beyond 0.005, item counts exactly, load beyond 0.0005; a figure null on one side only counts.
      required: [connectionId, sprintId, name, teamId, completeAt, field, live, frozen, delta, reconstructed]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completeAt: { type: integer, format: int64, nullable: true }
        field:
          type: string
          enum: [committedMd, committedItems, addedMd, addedItems, removedMd, removedItems, finalMd, finalItems, deliveredMd, deliveredItems, carriedOverMd, carriedOverItems, droppedMd, droppedItems, capacityMd, load]
        live: { type: number, format: double, nullable: true }
        frozen: { type: number, format: double, nullable: true }
        delta: { type: number, format: double, nullable: true, description: '`live − frozen`, null when either is null.' }
        reconstructed: { type: boolean, description: 'The snapshot was written by a DERIVE that ran after the sprint closed — a baseline rebuilt from history, not a real freeze.' }
    DataQualitySnapshotDriftList:
      type: object
      description: A capped list of drifted sprint figures.
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0, description: How many matched — `items` carries the first 50. }
        items:
          type: array
          items: { $ref: '#/components/schemas/DataQualitySnapshotDrift' }
    DataQualityDeriveWarning:
      type: object
      description: 'A connection whose latest SUCCEEDED DERIVE run reported warnings (A13: `sprintFieldUnresolved` — the sprint step was skipped).'
      required: [connectionId, connectionName, runId, startedAt, warnings]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        connectionName: { type: string }
        runId: { type: integer, format: int32 }
        startedAt: { type: integer, format: int64 }
        warnings: { type: array, items: { type: string, enum: [sprintFieldUnresolved] } }
    DataQualityPopulations:
      type: object
      required: [doneTasks, openStartedTasks, epics, worklogs]
      properties:
        doneTasks: { type: integer, minimum: 0 }
        openStartedTasks: { type: integer, minimum: 0 }
        epics: { type: integer, minimum: 0 }
        worklogs: { type: integer, minimum: 0 }
    DataQualityWorklogCoverage:
      type: object
      description: D14 — DONE tasks of the period with worklogs; `coverage` = `withWorklogs ÷ doneTasks` (fraction 0..1, null with no DONE task); `without` lists the tasks with none.
      required: [doneTasks, withWorklogs, coverage, without]
      properties:
        doneTasks: { type: integer, minimum: 0 }
        withWorklogs: { type: integer, minimum: 0 }
        coverage: { type: number, format: double, nullable: true }
        without: { $ref: '#/components/schemas/DataQualityTaskFinding' }
    DataQualityLoggedHours:
      type: object
      description: >-
        Hours logged by team members (Σ `md` × `hoursPerDay`; authors in no team are left out) over their member-days (roster
        rows clipped to the period up to now, counted in working days). `hoursPerMemberDay` is null without member-days.
      required: [memberDays, hours, hoursPerMemberDay]
      properties:
        memberDays: { type: number, format: double }
        hours: { type: number, format: double }
        hoursPerMemberDay: { type: number, format: double, nullable: true }
    DataQualityLateWorklog:
      type: object
      required: [worklogId, issueKey, summary, authorAccountId, author, teamId, startedAt, lateDays]
      properties:
        worklogId: { type: integer, format: int64 }
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        authorAccountId: { type: string, nullable: true }
        author: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: The author's team when logging; null = none. }
        startedAt: { type: integer, format: int64 }
        lateDays: { type: number, format: double, description: 'Days between the worklog''s start and when it was logged.' }
    DataQualityLateLogging:
      type: object
      description: >-
        Late logging over the period's worklogs: `measurable` of the `worklogs` know their creation time; `over1Day` /
        `over7Days` count those logged more than 1 / 7 days after they started; `distribution` is the lateness in days
        (hidden below `minSampleSize`); `worst` the latest-logged ones (at most 50).
      required: [worklogs, measurable, over1Day, over7Days, distribution, worst]
      properties:
        worklogs: { type: integer, minimum: 0 }
        measurable: { type: integer, minimum: 0 }
        over1Day: { type: integer, minimum: 0 }
        over7Days: { type: integer, minimum: 0 }
        distribution: { $ref: '#/components/schemas/Distribution' }
        worst:
          type: array
          items: { $ref: '#/components/schemas/DataQualityLateWorklog' }
    DataQualityMissing:
      type: object
      description: >-
        Missing data. The task findings split DONE-in-period from open started tasks; `workCategoryConfigured` says whether
        any connection in scope has a work-category field (with none, `noWorkCategory` is empty by design); the epic findings
        cover epics open or done in the period.
      required: [noEstimate, noEpic, noWorkCategory, workCategoryConfigured, unassigned, epicsWithoutEstimate, epicsWithoutDates, epicsOutsidePvHorizon]
      properties:
        noEstimate: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        noEpic: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        noWorkCategory: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        workCategoryConfigured: { type: boolean }
        unassigned: { $ref: '#/components/schemas/DataQualityTaskFinding' }
        epicsWithoutEstimate: { $ref: '#/components/schemas/DataQualityEpicList' }
        epicsWithoutDates: { $ref: '#/components/schemas/DataQualityEpicList' }
        epicsOutsidePvHorizon:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicList' }]
          description: Epics with both dates set but at least one outside ±10 years of the connection's last DERIVE — they get no PV curve.
    DataQualityTaskCounts:
      type: object
      required: [done, openStarted, withoutWorklogs, unassigned, outsideSprint, crossDomain, noEstimate, noEpic, noWorkCategory]
      properties:
        done: { type: integer, minimum: 0 }
        openStarted: { type: integer, minimum: 0 }
        withoutWorklogs: { type: integer, minimum: 0 }
        unassigned: { type: integer, minimum: 0 }
        outsideSprint: { type: integer, minimum: 0 }
        crossDomain: { type: integer, minimum: 0 }
        noEstimate: { $ref: '#/components/schemas/DataQualityDoneOpen' }
        noEpic: { $ref: '#/components/schemas/DataQualityDoneOpen' }
        noWorkCategory: { $ref: '#/components/schemas/DataQualityDoneOpen' }
    DataQualityWorklogCounts:
      type: object
      required: [worklogs, md, over1Day, over7Days, hours, memberDays, hoursPerMemberDay]
      properties:
        worklogs: { type: integer, minimum: 0 }
        md: { type: number, format: double }
        over1Day: { type: integer, minimum: 0 }
        over7Days: { type: integer, minimum: 0 }
        hours: { type: number, format: double }
        memberDays: { type: number, format: double }
        hoursPerMemberDay: { type: number, format: double, nullable: true }
    DataQualityEpicCounts:
      type: object
      required: [epics, withoutEstimate, withoutDates, outsidePvHorizon, drifting]
      properties:
        epics: { type: integer, minimum: 0 }
        withoutEstimate: { type: integer, minimum: 0 }
        withoutDates: { type: integer, minimum: 0 }
        outsidePvHorizon: { type: integer, minimum: 0 }
        drifting: { type: integer, minimum: 0 }
    DataQualityGroup:
      type: object
      description: >-
        A team (UNIT level; `teamId` null = UNASSIGNED tasks/authors and UNOWNED epics) or a member (TEAM level; a null
        `accountId` with a null `label` is the unassigned bucket). `epics` is null at TEAM level — epics carry no user.
        Always empty at USER level.
      required: [teamId, accountId, label, tasks, worklogs, epics]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        tasks: { $ref: '#/components/schemas/DataQualityTaskCounts' }
        worklogs: { $ref: '#/components/schemas/DataQualityWorklogCounts' }
        epics:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicCounts' }]
          nullable: true
    DataQualityReport:
      type: object
      required:
        - meta
        - hoursPerDay
        - populations
        - groups
        - worklogCoverage
        - loggedHours
        - lateLogging
        - missing
        - outsideSprint
        - crossDomain
        - epicDrift
        - domainsWithoutOwner
        - unmappedStatuses
        - unmappedBoards
        - authorsWithoutTeam
        - snapshotDrift
        - deriveWarnings
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        hoursPerDay: { type: number, format: double, description: The configured hours per man-day the logged hours per member-day are read against. }
        populations: { $ref: '#/components/schemas/DataQualityPopulations' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/DataQualityGroup' }
        worklogCoverage: { $ref: '#/components/schemas/DataQualityWorklogCoverage' }
        loggedHours: { $ref: '#/components/schemas/DataQualityLoggedHours' }
        lateLogging: { $ref: '#/components/schemas/DataQualityLateLogging' }
        missing: { $ref: '#/components/schemas/DataQualityMissing' }
        outsideSprint:
          allOf: [{ $ref: '#/components/schemas/DataQualityTaskFinding' }]
          description: 'DONE tasks with no sprint at done (D10); `md` is their estimate at done.'
        crossDomain:
          allOf: [{ $ref: '#/components/schemas/DataQualityTaskFinding' }]
          description: DONE tasks whose epic lives in another domain.
        epicDrift:
          allOf: [{ $ref: '#/components/schemas/DataQualityEpicList' }]
          description: Epics with a D11 drift flag.
        domainsWithoutOwner: { $ref: '#/components/schemas/DataQualityUnownedDomainList' }
        unmappedStatuses: { $ref: '#/components/schemas/DataQualityUnmappedStatusList' }
        unmappedBoards: { $ref: '#/components/schemas/DataQualityUnmappedBoardList' }
        authorsWithoutTeam: { $ref: '#/components/schemas/DataQualityAuthorList' }
        snapshotDrift: { $ref: '#/components/schemas/DataQualitySnapshotDriftList' }
        deriveWarnings:
          type: array
          items: { $ref: '#/components/schemas/DataQualityDeriveWarning' }

    CostColumn:
      type: object
      required: [domain, name, totalMd]
      properties:
        domain: { type: string, nullable: true, description: 'The domain key; null is the `(no domain)` column (invariant 6 says it never occurs).' }
        name: { type: string, nullable: true, description: 'The domain display name; null when no domain row names the key.' }
        totalMd: { type: number, format: double, description: 'The rounded EXACT sum of the column (2 decimals).' }

    CostCell:
      type: object
      required: [domain, md]
      properties:
        domain: { type: string, nullable: true, description: 'The column this cell belongs to (`CostColumn.domain`).' }
        md: { type: number, format: double, description: 'Man-days logged on the domain by the row (2 decimals, rounded from the exact sum).' }

    CostRow:
      type: object
      required: [teamId, accountId, label, cells, totalMd, foreignMd, foreignShare]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'UNIT: the author team (0 = UNASSIGNED, last). TEAM/USER: the requested team.' }
        accountId: { type: string, nullable: true, description: 'TEAM/USER: the author (null = worklogs with no known author); null at UNIT.' }
        label: { type: string, nullable: true, description: 'The team name (UNIT) or the Jira display name (TEAM/USER); null for UNASSIGNED and the no-author bucket.' }
        cells:
          type: array
          description: Dense — one cell per column, in column order.
          items: { $ref: '#/components/schemas/CostCell' }
        totalMd: { type: number, format: double, description: 'The rounded EXACT sum of the row (not the sum of the rounded cells).' }
        foreignMd: { type: number, format: double, description: 'The row''s foreign-work MD (A21).' }
        foreignShare: { type: number, format: double, nullable: true, description: 'Exact foreign MD ÷ exact MD (0..1); null when the row logged nothing.' }
        active: { type: boolean, nullable: true, description: 'UNIT rows only: false for a soft-deleted author team that still logged work in the period (its own drill answers 400); true for UNASSIGNED and live teams; null at TEAM/USER level.' }

    CostMatrixReport:
      type: object
      required: [meta, columns, rows, totalMd, foreignMd, foreignShare]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        columns:
          type: array
          description: The domains that received work, by domain key (a `(no domain)` column last, when one exists).
          items: { $ref: '#/components/schemas/CostColumn' }
        rows:
          type: array
          description: 'UNIT: one per author team, UNASSIGNED last. TEAM/USER: one per author, by display name.'
          items: { $ref: '#/components/schemas/CostRow' }
        totalMd: { type: number, format: double, description: 'The grand total: the rounded EXACT sum of every worklog in scope.' }
        foreignMd: { type: number, format: double }
        foreignShare: { type: number, format: double, nullable: true, description: 'Exact foreign MD ÷ exact MD; null when nothing was logged.' }

    DeepDiveRange:
      type: object
      required: [from, to, asOfDay]
      properties:
        from: { type: string, format: date, description: 'ISO date; the day every series offset counts from.' }
        to: { type: string, format: date, description: 'ISO date, inclusive.' }
        asOfDay: { type: string, format: date, nullable: true, description: 'The day of the selected connection''s last DERIVE clock (where open execution stops); null when nothing derived.' }

    DeepDiveSprint:
      type: object
      description: A selected sprint (selection a) with its plan window as day offsets from `range.from`.
      required: [id, name, startDay, endDay]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        startDay: { type: integer, format: int32, nullable: true, description: 'Offset of the window start; null when the sprint contributes no day.' }
        endDay: { type: integer, format: int32, nullable: true, description: 'Offset of the window close; null when the sprint contributes no day.' }

    DeepDiveAuthor:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string }
        displayName: { type: string, description: 'The Jira display name; the account id for an account the people table does not know.' }

    DeepDiveMdDay:
      type: object
      required: [d, md]
      properties:
        d: { type: integer, format: int32, description: Day offset from `range.from`. }
        md: { type: number, format: double, description: Man-days on that day (2 decimals). }

    DeepDiveExecDay:
      type: object
      required: [d, td]
      properties:
        d: { type: integer, format: int32, description: Day offset from `range.from`. }
        td: { type: number, format: double, description: 'The fraction of a working day spent IN_PROGRESS (task-days, 4 decimals).' }

    DeepDiveCostDay:
      type: object
      required: [d, a, md]
      properties:
        d: { type: integer, format: int32, description: Day offset from `range.from`. }
        a: { type: integer, format: int32, nullable: true, minimum: 0, description: 'Index into `authors`; null when Jira gave no author.' }
        md: { type: number, format: double, description: The author's man-days logged that day (2 decimals). }

    DeepDiveDone:
      type: object
      description: The EV marker.
      required: [d, evMd]
      properties:
        d: { type: integer, format: int32, description: Day offset of `done_at` from `range.from`. }
        evMd: { type: number, format: double, description: '`estimate_at_done_md`; 0 when unestimated.' }

    DeepDiveTotals:
      type: object
      description: Each layer's full sum over ALL days, in or out of `range`.
      required: [pvMd, execTaskDays, evMd, costMd]
      properties:
        pvMd: { type: number, format: double }
        execTaskDays: { type: number, format: double }
        evMd: { type: number, format: double }
        costMd: { type: number, format: double }

    DeepDiveTask:
      type: object
      required: [key, summary, epicKey, planBasisMd, planSource, noPlanReason, pv, exec, done, cost, totals]
      properties:
        key: { type: string }
        summary: { type: string, nullable: true }
        epicKey: { type: string, nullable: true, description: 'Null for a task with no epic (the `(no epic)` row).' }
        planBasisMd: { type: number, format: double, nullable: true, description: 'The estimate `pv` spreads; null for a task with no estimate. Whenever `noPlanReason` is absent, `pv` sums to it.' }
        planSource: { type: string, enum: [EARLIEST, LATER_FALLBACK, NONE], description: 'Whether the basis is the earliest sprint''s, the first later sprint''s FALLBACK, or none.' }
        noPlanReason: { type: string, enum: [NEVER_IN_SPRINT, NO_ESTIMATE, NO_WORKING_DAY], nullable: true, description: Why `pv` is empty; null when the task has a plan. }
        pv:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveMdDay' }
        exec:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveExecDay' }
        done:
          nullable: true
          description: The EV marker; null when the task is not done or its done day is outside `range`.
          allOf: [{ $ref: '#/components/schemas/DeepDiveDone' }]
        cost:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveCostDay' }
        totals: { $ref: '#/components/schemas/DeepDiveTotals' }

    DeepDiveOwnCost:
      type: object
      description: The worklog MD logged on an epic itself (selection b).
      required: [cost, totalMd]
      properties:
        cost:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveCostDay' }
        totalMd: { type: number, format: double, description: 'The whole-life sum, in or out of `range`.' }

    DeepDiveEpic:
      type: object
      description: One epic row; the row with a null `key` is the `(no epic)` bucket.
      required: [key, summary, plannedStart, plannedDue, budgetMd, ownCost]
      properties:
        key: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        plannedStart: { type: integer, format: int32, nullable: true, description: 'Offset of the CURRENT baseline''s planned start from `range.from` (an outline, never summed); null without a complete window.' }
        plannedDue: { type: integer, format: int32, nullable: true, description: Offset of the planned due day. }
        budgetMd: { type: number, format: double, nullable: true, description: The current baseline's budget; null without a baseline. }
        ownCost:
          nullable: true
          description: The worklog MD logged on the epic itself — selection (b) only, null otherwise or when there is none.
          allOf: [{ $ref: '#/components/schemas/DeepDiveOwnCost' }]

    DeepDiveQuality:
      type: object
      description: The limits the page states openly, counted over ALL selected tasks.
      required: [neverInSprint, noEstimate, noWorkingDay, epicsWithoutWindow, laterFallback, epicOwnCostMd]
      properties:
        neverInSprint: { type: integer, format: int32, minimum: 0 }
        noEstimate: { type: integer, format: int32, minimum: 0 }
        noWorkingDay: { type: integer, format: int32, minimum: 0, description: Tasks whose estimate has no working day to sit on. }
        epicsWithoutWindow: { type: integer, format: int32, minimum: 0 }
        laterFallback: { type: integer, format: int32, minimum: 0, description: Tasks whose PV came from the first-later-sprint fallback. }
        epicOwnCostMd: { type: number, format: double, description: The worklog MD logged on the listed epics themselves (selection b). }

    DeepDiveReport:
      type: object
      required: [meta, mode, range, nonWorkingDays, sprints, authors, epics, tasks, quality, note]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        mode: { type: string, enum: [SPRINTS, EPICS, TASKS] }
        range: { $ref: '#/components/schemas/DeepDiveRange' }
        nonWorkingDays:
          type: array
          items: { type: integer, format: int32 }
        sprints:
          type: array
          description: Selection (a) only — the selected sprints, earliest first.
          items: { $ref: '#/components/schemas/DeepDiveSprint' }
        authors:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveAuthor' }
        epics:
          type: array
          items: { $ref: '#/components/schemas/DeepDiveEpic' }
        tasks:
          type: array
          description: By issue key.
          items: { $ref: '#/components/schemas/DeepDiveTask' }
        quality: { $ref: '#/components/schemas/DeepDiveQuality' }
        note: { type: string, nullable: true, description: 'The not-derived-yet message when nothing in scope has derived; a message starting `RANGE_CLAMPED` when an implied range was cut to its last 1100 days; null otherwise.' }

    DeepDiveSprintOption:
      type: object
      required: [id, connectionId, name, state, startAt, endAt, completeAt, taskCount]
      properties:
        id: { type: integer, format: int64, description: The Jira sprint id (unique within a connection). }
        connectionId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        state: { type: string, description: 'The sprint state as stored (`future`, `active` or `closed`).' }
        startAt: { type: integer, format: int64, nullable: true, description: Epoch millis. }
        endAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the planned end. }
        completeAt: { type: integer, format: int64, nullable: true, description: Epoch millis; null while the sprint is not closed. }
        taskCount: { type: integer, format: int32, minimum: 1, description: The domain's level-0 tasks `in_scope_at_close` in this sprint. }

    DeepDiveEpicOption:
      type: object
      required: [id, connectionId, key, summary, domain]
      properties:
        id: { type: integer, format: int64, description: The epic's Jira issue id (unique within a connection). }
        connectionId: { type: integer, format: int32, minimum: 0 }
        key: { type: string }
        summary: { type: string, nullable: true }
        domain: { type: string, nullable: true, description: The epic's own domain key; null when it maps to none. }

    DeepDiveTaskOption:
      type: object
      required: [id, connectionId, key, summary]
      properties:
        id: { type: integer, format: int64, description: The task's Jira issue id (unique within a connection). }
        connectionId: { type: integer, format: int32, minimum: 0 }
        key: { type: string }
        summary: { type: string, nullable: true }

    DeepDiveSprintPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeepDiveSprintOption'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DeepDiveEpicPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeepDiveEpicOption'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DeepDiveTaskPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeepDiveTaskOption'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    ReportedTimeExcluded:
      type: object
      description: >-
        DONE level-0 tasks a reported-time-ratio read could not turn into a ratio, each in ONE bucket
        (`noWorklogs` first, incl. `actual_md` of 0.00; then `neverStarted`; then `zeroCycle`).
        `ratio.n + noWorklogs + neverStarted + zeroCycle = population`.
      required: [population, noWorklogs, neverStarted, zeroCycle]
      properties:
        population: { type: integer, minimum: 0 }
        noWorklogs: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        zeroCycle: { type: integer, minimum: 0 }
    FlowEfficiencyExcluded:
      type: object
      description: >-
        DONE level-0 tasks a flow-efficiency read could not measure, each in ONE bucket (`neverStarted` first,
        then `zeroCycle` — `cycle_ms` of 0). `flowEfficiency.n + neverStarted + zeroCycle = population`.
      required: [population, neverStarted, zeroCycle]
      properties:
        population: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
        zeroCycle: { type: integer, minimum: 0 }
    ReportedTimeGroup:
      type: object
      description: >-
        A credit team (UNIT level; `teamId` null = UNASSIGNED, `accountId` null) or an assignee at done (TEAM
        level; a null `accountId` with a null `label` is the unassigned bucket) — always empty at USER level.
      required: [teamId, accountId, label, ratio, excluded, flowEfficiency, flowEfficiencyExcluded]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        ratio: { $ref: '#/components/schemas/Distribution' }
        excluded: { $ref: '#/components/schemas/ReportedTimeExcluded' }
        flowEfficiency: { $ref: '#/components/schemas/Distribution' }
        flowEfficiencyExcluded: { $ref: '#/components/schemas/FlowEfficiencyExcluded' }
    ReportedTimeRatioReport:
      type: object
      required: [meta, ratio, excluded, flowEfficiency, flowEfficiencyExcluded, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        ratio:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "`actual_md ÷ cycle_working_days` per DONE level-0 task."
        excluded: { $ref: '#/components/schemas/ReportedTimeExcluded' }
        flowEfficiency:
          allOf: [{ $ref: '#/components/schemas/Distribution' }]
          description: "A18: `active_ms ÷ cycle_ms` per DONE level-0 task with a non-zero cycle."
        flowEfficiencyExcluded: { $ref: '#/components/schemas/FlowEfficiencyExcluded' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ReportedTimeGroup' }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
