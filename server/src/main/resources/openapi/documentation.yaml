        projects:
          type: array
          items: { type: string }
        boards:
          type: array
          items: { $ref: '#/components/schemas/MetricsBoardOption' }
        issueTypes:
          type: array
          items: { type: string }
        workCategoryValues:
          type: array
          items: { $ref: '#/components/schemas/MetricsFieldValueOption' }
