        a: { $ref: '#/components/schemas/CompareCell' }
        b: { $ref: '#/components/schemas/CompareCell' }
        better: { type: string, enum: [A, B], description: "The better side; absent on a NEUTRAL row, a tie, when either side has no value, or when either side is under `minSampleSize` (not for `deliveredItems` and `wipAtEndItems`, the pure item counts)." }
        difference: { type: number, format: double, description: "B's value minus A's; present when both values are." }
        margin: { type: number, format: double, minimum: 0, description: "Present exactly with `better`: the value gap (HIGHER/LOWER) or the gap between the two distances to `target` (TARGET)." }
        drill:
          type: string
          enum: [DELIVERED, CYCLE_WORKING_DAYS, CYCLE_ELAPSED_DAYS, REPORTED_TIME_RATIO, FLOW_EFFICIENCY, ACCURACY_AT_START, ACCURACY_AT_DONE, ADJUSTED, ADJUSTMENT_CHANGE, WIP_TASK_DAYS, WIP_AT_END, BLOCKED, LOGGED, FOREIGN, LATE, NO_WORKLOGS, NO_ESTIMATE, TASK_SIZE, REOPENED, COMMITS, MRS_MERGED, MR_CYCLE_WORKING_DAYS, MR_SIZE_LINES, REVIEWS_GIVEN, APPROVALS_GIVEN, COMMENTS]
          description: "The `view` of `GET /api/v1/reports/compare-people/items` that lists the items behind a cell of this row; absent for the available man-days."
    CompareCycleTime:
