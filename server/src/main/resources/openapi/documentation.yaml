        accuracyAtDone:
          allOf: [{ $ref: '#/components/schemas/AccuracyMeasures' }]
          nullable: true
          description: The accuracy measures over the ratios `atDone` summarises; null while it is hidden.

    AdjustmentChangeExcluded:
      type: object
      description: >-
        DONE items (by `done_at`) the change distribution did not take, each in ONE bucket:
        `unchanged` (both estimates present and equal, a 0 % change: measurable but not charted, so the one tall zero bar
        cannot dwarf the real adjustments), else `estimatedLate` (no estimate at start, one by the time it was done; never a
        `+∞` change), else `unestimated` (either estimate missing, incl. never started).
        `changeDistribution.n + unchanged + estimatedLate + unestimated = population`; the measurable items are
        `changeDistribution.n + unchanged`.
        `estimatedAfterDone` is a BREAKOUT of `unestimated`, not a fourth bucket: the done items whose estimate first
        appeared after `done_at` (a backfill, A35), so `estimatedAfterDone <= unestimated`. This block counts DONE items;
        `AdjustmentFigures.estimatedLate` counts STARTED ones.
      required: [population, unchanged, estimatedLate, estimatedAfterDone, unestimated]
      properties:
        population: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0, description: 'Done items with both estimates and no change (start equals done); left out of `changeDistribution`.' }
        estimatedLate: { type: integer, minimum: 0 }
        estimatedAfterDone: { type: integer, minimum: 0, description: 'Done items whose estimate first appeared after `done_at` (included in `unestimated`).' }
        unestimated: { type: integer, minimum: 0 }
    AdjustmentFigures:
      type: object
      description: >-
        The adjustment figures of one item kind. Of the items STARTED in the period: `changedAfterStart`
        had an estimate change after start, `share` is their 0..1 fraction (null when fewer than
        `minSampleSize` items started),
        `estimatedLate` gained an estimate only after start (a done item: by its `done_at`; an estimate set only after
        `done_at` is a backfill, A35). A change counts as an adjustment only between `started_at` and `done_at`.
        `changeDistribution` is the fractional change
        start → done (`(done − start) ÷ start`) over items DONE in the period with both estimates and a change
        (`changeExcluded.unchanged` counts those without one).
      required: [started, changedAfterStart, share, estimatedLate, changeDistribution, changeExcluded]
      properties:
        started: { type: integer, minimum: 0 }
        changedAfterStart: { type: integer, minimum: 0 }
        share: { type: number, format: double, nullable: true }
        estimatedLate: { type: integer, minimum: 0 }
        changeDistribution: { $ref: '#/components/schemas/Distribution' }
        changeExcluded: { $ref: '#/components/schemas/AdjustmentChangeExcluded' }
    EstimateAdjustmentsGroup:
      type: object
      description: >-
        A team (UNIT level; `teamId` null = UNASSIGNED tasks / UNOWNED epics, `accountId` null) or an
        assignee at done (TEAM level, tasks only — `epics` null; a null `accountId` with a null `label`
        is the unassigned bucket), or at USER level one entry per picked account (tasks only, `epics` null,
        an empty entry when the pick has no task).
      required: [teamId, accountId, label, tasks, epics]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        tasks: { $ref: '#/components/schemas/AdjustmentFigures' }
        epics:
          allOf: [{ $ref: '#/components/schemas/AdjustmentFigures' }]
          nullable: true
    EstimateAdjustmentsReport:
      type: object
      required: [meta, tasks, epics, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        tasks: { $ref: '#/components/schemas/AdjustmentFigures' }
        epics: { $ref: '#/components/schemas/AdjustmentFigures' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/EstimateAdjustmentsGroup' }

    CycleTimeExcluded:
      type: object
      description: >-
        DONE level-0 tasks (or, in the `epics` block, DONE epics) a cycle-time read could not measure:
        `neverStarted` (no `started_at`) is the only exclusion. `workingDays.n = population - neverStarted`.
      required: [population, neverStarted]
      properties:
        population: { type: integer, minimum: 0 }
        neverStarted: { type: integer, minimum: 0 }
