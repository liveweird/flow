        Any authenticated user (the team-reads posture). Most recent `validFrom` first. Deliberately NOT paged
        (a plain `{items}`, no `page`/`pageSize`/`total`): it returns one row per dated membership interval of this
        ONE team, an admin-curated roster that grows only by hand-entered intervals (a Jira account never overlaps
        itself, so rows are bounded by the team's roster times its own membership changes), not by synced data.
      responses:
        '200':
          description: The team's membership rows
