    # — reports (v0.3.0 M4 commit 10a) —

    HistogramBucket:
      type: object
      required: [from, to, count]
      properties:
        from: { type: number, format: double }
        to:
          type: number
          format: double
          nullable: true
          description: >-
            The bucket's upper edge; `null` ONLY on the final open tail bucket (see `Distribution.histogram`), which has
            no upper bound.
        count: { type: integer, format: int64, minimum: 0 }
    Distribution:
      type: object
      description: >-
        `hidden = true` (fewer than `minSampleSize` items) means only `n` is meaningful — every
        other field is null/empty. `histogram` is equal-width buckets over `[min, X]` (each `[from, to)`, the last
        equal-width one closed at its `to`), where X is the `(100 − tailPercent)`th percentile, followed by ONE final
        open bucket `{from: X, to: null, count}` holding every value strictly above X (the long tail). With no value
        above X (`tailPercent=0`, or ties at the top) there is no open bucket and the buckets span `[min, max]`. The
        counts always sum to `n`; `n`, `mean`, `min`, `max` and the percentiles are over ALL values. `byUser` (only on
        a report that splits per picked person, at USER level, and never on a hidden distribution) lists one
        `DistributionShare` per picked account in request order, each index-aligned with `histogram`. `bucketWidth` is set
        ONLY by the fixed-width layout (Task estimates, Report 19): every body bar is then `(from, to]`, `bucketWidth` wide, on
        the multiples of that width and labelled by its upper bound `to`; the open tail bucket and everything else are as above.
      required: [n, hidden, histogram]
      properties:
        n: { type: integer, format: int64, minimum: 0 }
        hidden: { type: boolean }
        mean: { type: number, format: double, nullable: true }
        min: { type: number, format: double, nullable: true }
        max: { type: number, format: double, nullable: true }
        p50: { type: number, format: double, nullable: true }
        p90: { type: number, format: double, nullable: true }
        p95: { type: number, format: double, nullable: true }
        histogram:
          type: array
          items: { $ref: '#/components/schemas/HistogramBucket' }
        byUser:
          type: array
          items: { $ref: '#/components/schemas/DistributionShare' }
        bucketWidth:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: >-
            Present only on a fixed-width histogram (Task estimates): the width of every body bar in the values' unit
            (0.5 MD, or a larger multiple of it when 0.5 MD would draw more than 40 bars). Absent on every other report.
    DistributionShare:
      type: object
      description: >-
        One picked person's slice of a `Distribution.histogram`: `counts[i]` is how many of the person's values fall in
        `histogram[i]` (the open tail bucket included), so over the shares Σ `counts[i]` is that bucket's `count` and
        Σ `counts` is the person's own item count. All zeros for a person with no values.
      required: [accountId, label, counts]
      properties:
        accountId: { type: string }
        label: { type: string, description: "The Jira display name, the account id when none is known." }
        counts:
          type: array
          items: { type: integer, format: int64, minimum: 0 }
    ResolvedSprintGroup:
      type: object
      required: [teamId, sprintIds]
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        sprintIds:
          type: array
          items: { type: integer, format: int64 }
    ReportMeta:
      type: object
      description: The `meta` block every report response carries beside its own body.
      required: [derivedAt, configRevision, from, to, level, domainView, resolvedSprints, minSampleSize, historyHorizon]
      properties:
        derivedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis; null before any connection has ever completed a DERIVE." }
        configRevision: { type: integer, format: int64, minimum: 1, nullable: true, description: "The config revision the served figures were DERIVED under: the oldest `config_revision` among the newest SUCCEEDED DERIVE runs of the connections the report read (not the live `metrics.settings.config_revision`, which runs ahead of the data between a configuration change and its DERIVE); null before any connection has completed a DERIVE." }
        from: { type: string, format: date, nullable: true, description: "ISO date; null for a lastSprints/sprintId-selected period." }
        to: { type: string, format: date, nullable: true, description: "ISO date; null for a lastSprints/sprintId-selected period." }
        level: { type: string, enum: [UNIT, TEAM, USER] }
        domainView: { type: string, enum: [TASK, EPIC] }
        resolvedSprints:
          type: array
          items: { $ref: '#/components/schemas/ResolvedSprintGroup' }
          description: Each team's resolved sprints for a lastSprints/sprintId period; empty for a from/to period, except on the Home overview, whose from/to window still lists each team's last closed sprint.
        minSampleSize: { type: integer, minimum: 1 }
        historyHorizon:
          allOf: [{ $ref: '#/components/schemas/HistoryHorizon' }]
          nullable: true
          description: The history horizon the report was read under (null = off); nothing anchored before its `from` is in the figures.
    HistoryHorizon:
      type: object
      description: The reporting history horizon (domain-model A48) as of the request - read time only, no derived row depends on it.
      required: [months, from]
      properties:
        months: { type: integer, minimum: 6, maximum: 120, description: The configured number of months (`metrics.settings.history_horizon_months`). }
        from: { type: string, format: date, description: "The first day that still counts: today in the configured zone minus `months`." }
    ReportFilterSprint:
      type: object
      required: [sprintId, name, state, startAt, endAt, completeAt]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        state: { type: string }
        startAt: { type: integer, format: int64, nullable: true }
        endAt:
          type: integer
          format: int64
          nullable: true
          description: The planned end (epoch ms); a sprint picker shows its end as `endAt`, else `completeAt`.
        completeAt: { type: integer, format: int64, nullable: true }
    ReportFilterMember:
      type: object
      required: [accountId, displayName]
      properties:
        accountId: { type: string }
        displayName: { type: string }
    ReportFilterTeam:
      type: object
      required: [id, name, sprints, members]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's stored manager (a user id), null when it has none. RAW — unlike `GET /api/v1/teams` it is NOT blanked when
            that user was soft-deleted; the Home page defaults to the teams the viewer manages.
        sprints:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterSprint' }
        members:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterMember' }
    ReportFilterDomain:
      type: object
      required: [domainKey, domainName]
      properties:
        domainKey: { type: string }
        domainName: { type: string }
    ReportFilterConnection:
      type: object
      required: [id, name, siteUrl]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        siteUrl:
          type: string
          description: >-
            The connection's Jira site origin (`https://<site>.atlassian.net`, no trailing slash) — the organisation's own host,
            not a secret; the SPA links an issue key to `{siteUrl}/browse/{KEY}`. The only `settings` key a report-reader sees
            (never the account email, project keys or token). An empty string when unknown.
    ReportFilters:
      type: object
      required: [teams, domains, activityTypes, workCategories, connections, derivedAt, configRevision, minSampleSize, timeZone, historyHorizon]
      properties:
        teams:
          type: array
          description: Each team's `sprints` list holds the open sprints and those completed on or after the history horizon's first day.
          items: { $ref: '#/components/schemas/ReportFilterTeam' }
        domains:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterDomain' }
        activityTypes:
          type: array
          items: { type: string }
        workCategories:
          type: array
          items: { type: string }
        connections:
          type: array
          items: { $ref: '#/components/schemas/ReportFilterConnection' }
        derivedAt: { type: integer, format: int64, nullable: true }
        configRevision: { type: integer, format: int64, minimum: 1, nullable: true, description: "The config revision the served figures were DERIVED under: the oldest `config_revision` among the newest SUCCEEDED DERIVE runs of the connections the report read (not the live `metrics.settings.config_revision`, which runs ahead of the data between a configuration change and its DERIVE); null before any connection has completed a DERIVE." }
        minSampleSize: { type: integer, minimum: 1 }
        timeZone: { type: string, description: "The configured IANA time zone (`metrics.settings.time_zone`) that `from`/`to` are read in — a client renders report dates and computes period presets in it." }
        historyHorizon:
          allOf: [{ $ref: '#/components/schemas/HistoryHorizon' }]
          nullable: true
          description: The history horizon the data was read under (null = off); the same object every report carries in `meta.historyHorizon`.

    CommitmentsSnapshot:
      type: object
      description: The four figures a commitments row carries, live or frozen.
      required: [initialMd, initialItems, finalMd, finalItems]
      properties:
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
    CommitmentsSprint:
      type: object
      required: [sprintId, name, teamId, completedAt, initialMd, initialItems, finalMd, finalItems, snapshot, drift, capacityMd, capacitySource, byUser, byEpic]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completedAt: { type: integer, format: int64, nullable: true, description: "Null only for an active/future sprint, reachable through an explicit sprintId." }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        snapshot:
          allOf: [{ $ref: '#/components/schemas/CommitmentsSnapshot' }]
          nullable: true
        drift: { type: boolean }
        capacityMd: { type: number, format: double, nullable: true, description: "The team's sprint capacity in man-days (A3, A32). Null when the sprint has none, and always null at USER level (capacity is team-only)." }
        capacitySource:
          type: string
          enum: [CALENDAR, TEAM_DEFAULT, DEFAULT, CONFIGURED]
          nullable: true
          description: "CALENDAR = the sprint's calendar, TEAM_DEFAULT = the team's default figure, DEFAULT = members × working days (A3); CONFIGURED is the pre-V24 per-sprint override, read back only from rows not yet re-derived. Null exactly when capacityMd is null."
        byUser:
          type: array
          description: "USER level only: one entry per picked account, in request order, zeros included; empty at UNIT/TEAM level."
          items: { $ref: '#/components/schemas/CommitmentsUserShare' }
        byEpic:
          type: array
          description: "The LIVE initial/final figures split by the items' current epic: the top 6 epics (by Σ final MD over the whole response) as their own segments, then OTHER_EPICS, then NO_EPIC; zero segments omitted, same order in every sprint; Σ segments == this row's initial*/final* to the cent (the MD are rounded sums; the item counts exactly)."
          items: { $ref: '#/components/schemas/CommitmentsEpicSegment' }
    CommitmentsUserShare:
      type: object
      description: One picked account's own live share of a sprint (its `assignee_at_commitment` scope rows, the removed-row rule).
      required: [accountId, label, initialMd, initialItems, finalMd, finalItems]
      properties:
        accountId: { type: string }
        label: { type: string, description: "The Jira display name; the account id when none is known." }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
    CommitmentsEpicSegment:
      type: object
      description: "One epic segment of a sprint's initial and final scope (live) - the items whose current epic this is."
      required: [key, epicId, epicKey, label, initialMd, initialItems, finalMd, finalItems]
      properties:
        key: { type: string, description: "The epic's issue id as a string, OTHER_EPICS (every epic outside the top 6) or NO_EPIC (items without an epic). The drill's epicSegment value." }
        epicId: { type: integer, format: int64, nullable: true, description: "The epic's issue id; null on OTHER_EPICS and NO_EPIC." }
        epicKey: { type: string, nullable: true, description: "The epic's Jira key (e.g. FLO-12); null on OTHER_EPICS and NO_EPIC, and on an epic with no key on record (then `label` falls back to the epic id)." }
        label: { type: string, description: "The epic's key and summary; the English fallback text on OTHER_EPICS and NO_EPIC (the web localises those by key)." }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
    CommitmentsGroup:
      type: object
      description: >-
        A team's own sums (UNIT level — no longer answered: commitments is read per team), one user's `assignee_at_commitment` sums (TEAM level) or, at
        USER level, one picked account's period totals (zero when it has no scope row).
        `teamId`/`accountId`/`label` are mutually exclusive with each other's absence: exactly one of
        `teamId` or `accountId` is set per row (a null `accountId` with a null `label` is the unassigned-at-commitment bucket, never a stored sentinel).
      required: [initialMd, initialItems, finalMd, finalItems]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
    CommitmentsReport:
      type: object
      required: [meta, sprints, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        sprints:
          type: array
          items: { $ref: '#/components/schemas/CommitmentsSprint' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/CommitmentsGroup' }

    ThroughputSnapshot:
      type: object
      description: A sprint's delivered figures, live or frozen.
      required: [deliveredMd, deliveredItems]
      properties:
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
    ThroughputSprint:
      type: object
      description: One sprint's delivered scope (the SPRINT view — priced at the sprint's close).
      required: [sprintId, name, teamId, completedAt, deliveredMd, deliveredItems, actualCostMd, snapshot, drift, byUser, byEpic]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0 }
        completedAt: { type: integer, format: int64, nullable: true, description: "Null only for an active/future sprint, reachable through an explicit sprintId." }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        actualCostMd: { type: number, format: double, description: "The sprint's actual cost: the MD logged between its start and end on the tasks of its FINAL scope (live; not in the frozen snapshot). At USER level the picked accounts' own logged time." }
        snapshot:
          allOf: [{ $ref: '#/components/schemas/ThroughputSnapshot' }]
          nullable: true
        drift: { type: boolean }
        byUser:
          type: array
          description: "USER level only: one entry per picked account, in request order, zeros included; empty at UNIT/TEAM level."
          items: { $ref: '#/components/schemas/ThroughputUserShare' }
        byEpic:
          type: array
          description: "The LIVE delivered figures split by the items' current epic: the top 6 epics (by Σ delivered MD over the whole response) as their own segments, then OTHER_EPICS, then NO_EPIC; zero segments omitted, same order in every sprint; Σ segments == this row's deliveredMd to the cent (the MD are rounded sums) and deliveredItems exactly. The period view (byBucket) is not split."
          items: { $ref: '#/components/schemas/ThroughputEpicSegment' }
    ThroughputEpicSegment:
      type: object
      description: "One epic segment of a sprint's delivered scope (live) - the delivered items whose current epic this is."
      required: [key, epicId, epicKey, label, deliveredMd, deliveredItems]
      properties:
        key: { type: string, description: "The epic's issue id as a string, OTHER_EPICS (every epic outside the top 6) or NO_EPIC (items without an epic). The drill's epicSegment value." }
        epicId: { type: integer, format: int64, nullable: true, description: "The epic's issue id; null on OTHER_EPICS and NO_EPIC." }
        epicKey: { type: string, nullable: true, description: "The epic's Jira key (e.g. FLO-12); null on OTHER_EPICS and NO_EPIC, and on an epic with no key on record (then `label` falls back to the epic id)." }
        label: { type: string, description: "The epic's key and summary; the English fallback text on OTHER_EPICS and NO_EPIC (the web localises those by key)." }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
    ThroughputUserShare:
      type: object
      description: One picked account's own live share of a sprint or of a time bucket - delivered by ASSIGNEE (a sprint's `assignee_at_commitment` deliveries, a bucket's tasks by `assignee_at_done`), actual cost by worklog AUTHOR.
      required: [accountId, label, deliveredMd, deliveredItems, actualCostMd]
      properties:
        accountId: { type: string }
        label: { type: string, description: "The Jira display name; the account id when none is known." }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        actualCostMd: { type: number, format: double, description: "The MD this person logged on the figure's items inside the bucket / the sprint's dates (their own rounded exact sum)." }
    ThroughputBucketRow:
      type: object
      description: One time bucket of the PERIOD view (tasks by `done_at`, priced at done).
      required: [bucketStart, deliveredMd, deliveredItems, actualCostMd, byUser]
      properties:
        bucketStart: { type: string, format: date, description: "The bucket's first day, ISO date (a Monday for weeks, the 1st for months)." }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        actualCostMd: { type: number, format: double, description: "The MD logged inside the bucket on the scope's items not done before it began. At USER level the picked accounts' own logged time." }
        byUser:
          type: array
          description: "USER level only: one entry per picked account, in request order, zeros included; empty at UNIT/TEAM level."
          items: { $ref: '#/components/schemas/ThroughputUserShare' }
    ThroughputGroup:
      type: object
      description: >-
        A credit team's sums (UNIT level; `teamId: null` is the UNASSIGNED bucket, `accountId` null) or
        one assignee-at-done's sums (TEAM level; `accountId` null with a null `label` is the
        unassigned bucket) over the PERIOD view — at USER level one entry per picked account (its period
        totals, a zero entry when it delivered nothing).
      required: [teamId, accountId, label, deliveredMd, deliveredItems]
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        accountId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
    ThroughputReport:
      type: object
      required: [meta, bySprint, byBucket, groups]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        bySprint:
          type: array
          items: { $ref: '#/components/schemas/ThroughputSprint' }
        byBucket:
          type: array
          items: { $ref: '#/components/schemas/ThroughputBucketRow' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ThroughputGroup' }
    ReportDrillBar:
      type: object
      description: The bar a drill list adds up to, recomputed by the server over the listed set. Fields a bar kind does not have are null.
      required: [count, sumMd, from, to]
      properties:
        count: { type: integer }
        sumMd: { type: number, format: double, nullable: true, description: "Σ MD of the items (MD bars; an unestimated item adds 0)." }
        from: { type: number, format: double, nullable: true, description: "Lower edge of a histogram bucket." }
        to: { type: number, format: double, nullable: true, description: "Upper edge of a histogram bucket; null on the open tail bucket." }
    ReportDrillItem:
      type: object
      required: [issueKey, summary, itemKind, accountId, assignee, teamId, anchorAt, figure]
      properties:
        issueKey: { type: string }
        summary: { type: string, nullable: true }
        itemKind: { type: string, enum: [TASK, EPIC, WORKLOG, COMMIT, MERGE_REQUEST], description: "`COMMIT` / `MERGE_REQUEST` are Report 21's (the GitLab code drill): `issueKey` is then `<project path>@<sha12>` / `<project path>!<iid>`." }
        accountId: { type: string, nullable: true, description: "The item's account (assignee, or the one author); null when there is none, and for the cost drill when the slice has several authors." }
        assignee: { type: string, nullable: true, description: "Display name of `accountId` (the id itself when no name is known). For the cost drill (`/costs/items`) the display names of ALL the item's authors in the slice, joined with \", \", the largest contributor first." }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        anchorAt: { type: integer, format: int64, nullable: true, description: "Epoch millis of the instant the report anchors the item to (e.g. `done_at`)." }
        figure: { type: number, format: double, nullable: true, description: "The bar's own per-item value (MD, days, a ratio, …); null = unestimated (counted as 0 MD)." }
        linkedKeys:
          type: array
          nullable: true
          items: { type: string }
          description: |
            The Jira issue keys a merge request names in its title or source branch, uppercased, sorted, and only those of a KNOWN Jira project
            (a configured `projectKeys` entry of an active Jira data source, or an old project of a moved issue). Set only on the
            `MERGE_REQUEST` items of Report 21's drill and of Home's `CODE_*` lists (which run its selection);
            `[]` = it names none; null for every other kind and report. A key is listed whether or not Jira has such an issue.
    ReportDrillItems:
      type: object
      description: |
        A drill list: the report's `meta`, the recomputed `bar`, at most 500 `items` (largest figure first) and the `total` behind
        the bar (equal to `bar.count`); `truncated` when `total` exceeds the listed items.
      required: [meta, bar, items, total, truncated]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        bar: { $ref: '#/components/schemas/ReportDrillBar' }
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ReportDrillItem' }
        total: { type: integer }
        truncated: { type: boolean }

    HomeWindow:
      type: object
      description: An inclusive ISO-date window in the configured zone.
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    HomeFreshness:
      type: object
      description: One active connection's last successful ingest (SYNC or RECONCILE) and last successful DERIVE; null = never.
      required: [connectionId, name, lastSyncAt, lastDeriveAt]
      properties:
        connectionId: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        lastSyncAt: { type: integer, format: int64, nullable: true }
        lastDeriveAt: { type: integer, format: int64, nullable: true }
    HomePrevious:
      type: object
      description: The same figure over the previous window and what the current one says against it.
      required: [value, n, hidden, verdict, difference]
      properties:
        value: { type: number, format: double, nullable: true }
        n: { type: integer, minimum: 0 }
        hidden: { type: boolean }
        verdict:
          type: string
          enum: [BETTER, WORSE]
          nullable: true
          description: The current figure against the previous one by the figure's direction; null for a tie within the unit's tolerance, a hidden side or a sample under `minSampleSize`.
        difference: { type: number, format: double, nullable: true, description: Current minus previous; present when both values are. }
    HomeFigure:
      type: object
      description: One 90-day figure. `value` is null while `hidden` (n under `meta.minSampleSize`) or undefined.
      required: [value, n, hidden, numerator, previous]
      properties:
        value: { type: number, format: double, nullable: true }
        n: { type: integer, minimum: 0 }
        hidden: { type: boolean }
        numerator: { type: integer, minimum: 0, nullable: true, description: "The items within a PRED share (the drill's `bar.count`); null on other figures." }
        previous:
          allOf: [{ $ref: '#/components/schemas/HomePrevious' }]
          nullable: true
          description: Null on a figure that has no trend.
    HomeSprint:
      type: object
      description: A team's last closed sprint, its live figures beside the frozen snapshot.
      required: [sprintId, name, startAt, completedAt, capacityMd, capacitySource, initialMd, initialItems, finalMd, finalItems, deliveredMd, deliveredItems, snapshot, drift]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string }
        startAt: { type: integer, format: int64, nullable: true }
        completedAt: { type: integer, format: int64 }
        capacityMd: { type: number, format: double, nullable: true }
        capacitySource: { type: string, nullable: true, description: "CALENDAR, TEAM_DEFAULT or DEFAULT (pre-V24 CONFIGURED)." }
        initialMd: { type: number, format: double }
        initialItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        snapshot:
          allOf: [{ $ref: '#/components/schemas/SprintFigures' }]
          nullable: true
        drift: { type: boolean }
    HomeGranularity:
      type: object
      required: [estimateMd, cycleWorkingDays, costMd]
      properties:
        estimateMd: { $ref: '#/components/schemas/HomeFigure' }
        cycleWorkingDays: { $ref: '#/components/schemas/HomeFigure' }
        costMd: { $ref: '#/components/schemas/HomeFigure' }
    HomePredLine:
      type: object
      description: The share of items within 10 / 25 / 50 % of their actual (PRED, estimate at start).
      required: [pred10, pred25, pred50]
      properties:
        pred10: { $ref: '#/components/schemas/HomeFigure' }
        pred25: { $ref: '#/components/schemas/HomeFigure' }
        pred50: { $ref: '#/components/schemas/HomeFigure' }
    HomeAccuracy:
      type: object
      required: [tasks, epics]
      properties:
        tasks: { $ref: '#/components/schemas/HomePredLine' }
        epics: { $ref: '#/components/schemas/HomePredLine' }
    HomeWip:
      type: object
      description: The open items in progress now; the age percentiles (working days) are hidden (null) under `meta.minSampleSize`.
      required: [count, hidden, p50, p85, p95]
      properties:
        count: { type: integer, minimum: 0 }
        hidden: { type: boolean }
        p50: { type: number, format: double, nullable: true }
        p85: { type: number, format: double, nullable: true }
        p95: { type: number, format: double, nullable: true }
    HomeWeek:
      type: object
      required: [bucketStart, deliveredMd, deliveredItems]
      properties:
        bucketStart: { type: string, format: date, description: The Monday of the week. }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer, minimum: 0 }
    HomeThroughput:
      type: object
      required: [weeks, deliveredMd, deliveredItems, cycleP50, cycleP85]
      properties:
        weeks:
          type: array
          items: { $ref: '#/components/schemas/HomeWeek' }
        deliveredMd: { $ref: '#/components/schemas/HomeFigure' }
        deliveredItems: { $ref: '#/components/schemas/HomeFigure' }
        cycleP50: { $ref: '#/components/schemas/HomeFigure' }
        cycleP85: { $ref: '#/components/schemas/HomeFigure' }
    HomeQuality:
      type: object
      description: Counts of findings; the task ones (done in the window) carry a trend, the epic ones (the Data quality page's population) do not.
      required: [tasksNoEstimate, tasksUnassigned, tasksEstimatedLate, epicsNoEstimate, epicsNoDates, epicsEstimateGap]
      properties:
        tasksNoEstimate: { $ref: '#/components/schemas/HomeFigure' }
        tasksUnassigned: { $ref: '#/components/schemas/HomeFigure' }
        tasksEstimatedLate: { $ref: '#/components/schemas/HomeFigure' }
        epicsNoEstimate: { $ref: '#/components/schemas/HomeFigure' }
        epicsNoDates: { $ref: '#/components/schemas/HomeFigure' }
        epicsEstimateGap: { $ref: '#/components/schemas/HomeFigure' }
    HomeTeamCode:
      type: object
      description: >-
        One team's Code figures (Report 21's own): the merge requests merged in the window, their cycle p50 in working days, the open ones
        now (`openCount` waiting for review, `openDrafts` beside, no trend) with their age p50 in working days, and the merged merge
        requests with no review by another human. `mergedWithoutReview.numerator` is Report 21's count, `n` the merged merge requests whose
        details were read (the share's denominator); the share (`value`) is hidden under `meta.minSampleSize`, the count never is.
      required: [linkedMembers, merged, cycleP50, openCount, openDrafts, openAgeP50, mergedWithoutReview]
      properties:
        linkedMembers: { type: integer, minimum: 0, description: The team's people (both windows and now) with at least one linked GitLab identity. }
        merged: { $ref: '#/components/schemas/HomeFigure' }
        cycleP50: { $ref: '#/components/schemas/HomeFigure' }
        openCount: { $ref: '#/components/schemas/HomeFigure' }
        openDrafts: { type: integer, minimum: 0 }
        openAgeP50: { $ref: '#/components/schemas/HomeFigure' }
        mergedWithoutReview: { $ref: '#/components/schemas/HomeFigure' }
    HomeCode:
      type: object
      description: The code layer's side of the overview.
      required: [sources, overBudget]
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/CodeActivitySource' }
          description: The active GitLab sources with their freshness (Report 21's `sources[]`); empty = none, the section is absent.
        overBudget: { type: boolean, description: The code read exceeded `reports.codeMaxRows`; every team's `code` is null. }
    HomeTeam:
      type: object
      required: [teamId, name, lastSprint, granularity, accuracy, wipEpics, wipTasks, throughput, quality, code]
      properties:
        teamId: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        lastSprint:
          allOf: [{ $ref: '#/components/schemas/HomeSprint' }]
          nullable: true
          description: Null = the team has no closed sprint.
        granularity: { $ref: '#/components/schemas/HomeGranularity' }
        accuracy: { $ref: '#/components/schemas/HomeAccuracy' }
        wipEpics: { $ref: '#/components/schemas/HomeWip' }
        wipTasks: { $ref: '#/components/schemas/HomeWip' }
        throughput: { $ref: '#/components/schemas/HomeThroughput' }
        quality: { $ref: '#/components/schemas/HomeQuality' }
        code:
          allOf: [{ $ref: '#/components/schemas/HomeTeamCode' }]
          nullable: true
          description: Null = no GitLab source is active, or the code read was over the row budget (`HomeOverview.code.overBudget`).
    HomeUnassigned:
      type: object
      description: Work of no ACTIVE team (no team, or a soft-deleted one), whichever teams the request picked.
      required: [doneTasks, openTasks, epics]
      properties:
        doneTasks: { type: integer, minimum: 0 }
        openTasks: { type: integer, minimum: 0 }
        epics: { type: integer, minimum: 0 }
    HomeOverview:
      type: object
      required: [meta, window, previousWindow, timeZone, epicEstimateGapTolerancePercent, freshness, teams, unassigned, code]
      properties:
        meta: { $ref: '#/components/schemas/ReportMeta' }
        window: { $ref: '#/components/schemas/HomeWindow' }
        previousWindow: { $ref: '#/components/schemas/HomeWindow' }
        timeZone: { type: string, description: The configured IANA zone the windows are read in. }
        epicEstimateGapTolerancePercent: { type: integer, minimum: 0, maximum: 100 }
        freshness:
          type: array
          items: { $ref: '#/components/schemas/HomeFreshness' }
        teams:
          type: array
          items: { $ref: '#/components/schemas/HomeTeam' }
        unassigned: { $ref: '#/components/schemas/HomeUnassigned' }
        code: { $ref: '#/components/schemas/HomeCode' }

    SprintFigures:
      type: object
      description: The fourteen sprint figures (MD beside items), live or frozen.
      required: [committedMd, committedItems, addedMd, addedItems, removedMd, removedItems, finalMd, finalItems, deliveredMd, deliveredItems, carriedOverMd, carriedOverItems, droppedMd, droppedItems]
      properties:
        committedMd: { type: number, format: double }
        committedItems: { type: integer }
        addedMd: { type: number, format: double }
        addedItems: { type: integer }
        removedMd: { type: number, format: double }
        removedItems: { type: integer }
        finalMd: { type: number, format: double }
        finalItems: { type: integer }
        deliveredMd: { type: number, format: double }
        deliveredItems: { type: integer }
        carriedOverMd: { type: number, format: double }
        carriedOverItems: { type: integer }
        droppedMd: { type: number, format: double }
        droppedItems: { type: integer }
