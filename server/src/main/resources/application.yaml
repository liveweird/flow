ktor:
  # Development default for :server:run and tests; the Docker image ships
  # KTOR_DEVELOPMENT=false (production mode: JWT/seed fail-closed checks active,
  # HSTS + HTTPS redirect on).
  development: "$KTOR_DEVELOPMENT:true"
  deployment:
    port: 8084
  application:
    # Ktor cancels module loading after `startupTimeoutMillis` (default 10 s) — which cut the cold-start
    # Flyway retry wait (up to ~103 s at the maximum 15 retries, infra/db/Flyway.kt) short and crashed the
    # pod once on every fresh deploy (checkup 2, live k8s). 140 s outlasts that wait plus boot and stays
    # inside the k8s startupProbe (~150 s); FlywayConnectRetriesTest pins both bounds.
    startupTimeoutMillis: 140000
    modules:
      # — base plugins
      - ch.nokillswit.plugins.HttpKt.configureHttp
      - ch.nokillswit.plugins.SecurityHeadersKt.configureSecurityHeaders
      - ch.nokillswit.plugins.MonitoringKt.configureMonitoring
      - ch.nokillswit.plugins.SerializationKt.configureSerialization
      - ch.nokillswit.plugins.SecurityKt.configureSecurity
      # Every per-IP bucket (login, refresh, password reset, MFA) — before any route module.
      - ch.nokillswit.plugins.RateLimitsKt.configureRateLimits
      - ch.nokillswit.plugins.ErrorHandlingKt.configureErrorHandling
      - ch.nokillswit.plugins.OpenTelemetryKt.configureOpenTelemetry
      - ch.nokillswit.plugins.AutoHeadResponseKt.configureAutoHeadResponse
      - ch.nokillswit.plugins.ResourcesKt.configureResources
      # The FLOW_ROLE switch (web|worker|all — app.role below). Early: no dependency on infra, and
      # every later module (feature routes, the SPA catch-all) reads Application.servesApi() off
      # the attribute this publishes.
      - ch.nokillswit.plugins.RoleKt.configureRole
      # — infrastructure
      - ch.nokillswit.infra.mail.MailKt.configureMail
      # Crypto before Database: the composition root hands the FieldCipher to any service
      # owning encrypted columns.
      - ch.nokillswit.infra.crypto.CryptoKt.configureCrypto
      - ch.nokillswit.infra.db.FlywayKt.configureFlyway
      - ch.nokillswit.infra.db.DatabaseKt.configureDatabase
      - ch.nokillswit.infra.db.BootstrapKt.configureBootstrap
      # Public liveness/readiness probes (/api/v1/health, /api/v1/ready); after Database (the probe
      # round-trips it).
      - ch.nokillswit.plugins.HealthKt.configureHealth
      # The guarded Jira HTTP stack (outbound guard + Test-connection service + the Connector
      # registry) — before the data-sources/sync-job routes, which read it off attributes.
      - ch.nokillswit.jira.JiraKt.configureJira
      # The metrics layer's composition root (v0.3.0 M1 commit 3, `.claude/docs/domain-model.md`
      # "Configuration"; `.claude/docs/metrics.md` is its own guide):
      # publishes MetricsConfigService/TeamMembershipService and registers the tiny
      # /metrics-settings singleton's own routes. After configureJira (the metrics layer reads
      # `norm`, which configureJira publishes), before the worker scheduler (which dispatches the
      # DERIVE job kind to this package).
      - ch.nokillswit.metrics.MetricsKt.configureMetrics
      # The FLOW_ROLE=worker scheduler (v0.2.0 plan §5) — a no-op unless runsWorker(); after the
      # Connector registry, before the feature route modules.
      - ch.nokillswit.ingest.IngestWorkerKt.configureIngestWorker
      # The per-process telemetry sampler (`.claude/docs/observability.md` "Telemetry") - EVERY role samples its own JVM; after
      # the worker (nothing to order against it) and the database/monitoring seams it reads.
      - ch.nokillswit.telemetry.TelemetryKt.configureTelemetry
      # — features
      - ch.nokillswit.flowusers.FlowUserRoutesKt.configureFlowUserRoutes
      - ch.nokillswit.teams.TeamRoutesKt.configureTeamRoutes
      - ch.nokillswit.auth.AuthRoutesKt.configureAuthRoutes
      - ch.nokillswit.auth.PasswordResetRoutesKt.configurePasswordResetRoutes
      - ch.nokillswit.ingest.DataSourceRoutesKt.configureDataSourceRoutes
      - ch.nokillswit.ingest.SyncJobRoutesKt.configureSyncJobRoutes
      - ch.nokillswit.ingest.SyncStatusRoutesKt.configureSyncStatusRoutes
      - ch.nokillswit.ingest.RawIssueInspectorRoutesKt.configureRawIssueInspectorRoutes
      - ch.nokillswit.ingest.DataProfileRoutesKt.configureDataProfileRoutes
      - ch.nokillswit.metrics.MetricsConfigRoutesKt.configureMetricsConfigRoutes
      - ch.nokillswit.metrics.TeamMembershipRoutesKt.configureTeamMembershipRoutes
      - ch.nokillswit.metrics.TeamMembershipSeedRoutesKt.configureTeamMembershipSeedRoutes
      - ch.nokillswit.metrics.SprintCalendarRoutesKt.configureSprintCalendarRoutes
      - ch.nokillswit.metrics.TeamWorkCategoryTargetRoutesKt.configureTeamWorkCategoryTargetRoutes
      - ch.nokillswit.metrics.PublicHolidayRoutesKt.configurePublicHolidayRoutes
      - ch.nokillswit.metrics.JiraUsersRoutesKt.configureJiraUsersRoutes
      # The reports API (v0.3.0 M4 commit 10a) — read-only, any authenticated (D12); after the
      # metrics feature routes it reads from.
      - ch.nokillswit.reports.ReportRoutesKt.configureReportRoutes
      # The telemetry read API (ADMIN, `.claude/docs/observability.md` "Telemetry"): reads what the samplers wrote and the job tables;
      # after the metrics and ingest services it reaches through their attributes.
      - ch.nokillswit.telemetry.TelemetryRoutesKt.configureTelemetryRoutes
      # — catch-all router
      - ch.nokillswit.plugins.RoutingKt.configureRouting

app:
  # The FLOW_ROLE switch (plugins/Role.kt): web|worker|all, case-insensitive. `web` serves the
  # HTTP API; `worker` serves only the health/ready probes and runs the ingestion worker; `all`
  # (the default — dev, docker compose) does both in one process; the test suite defaults to
  # `web` (TestEnvironment.kt). An unrecognized value fails startup in every mode.
  role: "$FLOW_ROLE:all"

security:
  # Per-account login lockout (complements the per-IP rate limit): after `threshold`
  # consecutive failures for one email, further attempts are 429 for `durationSeconds`.
  # A successful login resets the counter. In-memory, per-instance.
  lockout:
    threshold: "$LOGIN_LOCKOUT_THRESHOLD:5"
    durationSeconds: "$LOGIN_LOCKOUT_DURATION_SECONDS:900"
    maxTracked: "$LOGIN_LOCKOUT_MAX_TRACKED:10000"
  # Per-IP token bucket on POST /api/v1/login. The per-account lockout above is the
  # actual brute-force defence and is unaffected by this. Blank FOLLOWS THE MODE:
  # 10/min in production, 1000/min in development — the e2e suite drives many logins
  # from a single host and would otherwise spend minutes sleeping out the bucket.
  # Set a number to pin it in either mode.
  rateLimit:
    loginPerMinute: "$LOGIN_RATE_LIMIT_PER_MINUTE:"
    # Blank keeps the default 30/min (both modes); a number pins it.
    refreshPerMinute: "$REFRESH_RATE_LIMIT_PER_MINUTE:"
    # Per-IP bucket on GET /api/v1/ready (the anonymous probe that takes a pooled DB connection per
    # call). Blank keeps the default 60/min (both modes; the kubelet probes 12/min); a number pins it.
    readyPerMinute: "$READY_RATE_LIMIT_PER_MINUTE:"
    # Per-USER bucket (the JWT's user id, not the IP) shared by every GET /api/v1/reports/** call -- the reports, Home and the
    # drills. Blank FOLLOWS THE MODE (120/min in production, 1000/min in development: the e2e suite drives its report calls and
    # derive pollers from one seeded admin across parallel workers); a number pins it in either mode.
    reportsPerMinute: "$REPORT_RATE_LIMIT_PER_MINUTE:"
    # Per-IP bucket on POST /api/v1/password-reset. Blank FOLLOWS THE MODE (5/min in
    # production, 100/min in development — the loginPerMinute rationale); a number pins it.
    # The per-EMAIL reset throttle below is the actual abuse defence in both modes. The confirm step
    # (POST /api/v1/password-reset/confirm) rides its own `password-reset-confirm` bucket: 10/min per IP in
    # every mode, NOT configurable (the MFA bucket idiom; plugins/RateLimits.kt).
    passwordResetPerMinute: "$PASSWORD_RESET_RATE_LIMIT_PER_MINUTE:"
  # Not configurable, stated for the operator: the per-request access-token check
  # (auth/TokenBlocklistService.accessVerdict, plugins/Security.kt) is ONE uncached database
  # statement (revocation, account liveness, credential revision, roles), so a logout, a delete,
  # a demotion or a password change ends the token on its next request on ANY replica. The
  # per-instance in-memory state is the lockout, the reset throttle, the MFA challenges and the
  # refresh-rotation records: the deployment is single-replica (k8s/web-deployment.yaml), like
  # those assume; scale out only after moving them to a shared store.
  # Refresh-token rotation (auth/TokenBlocklistService.kt): every /refresh blocklists the presented
  # token. A replay of a token this instance rotated less than `replayGraceSeconds` ago still gets a
  # fresh pair (covers a /refresh response lost in flight; must exceed the SPA's 30 s request deadline);
  # beyond it the replay is a 401 `replayed`. 0 = strict one-time use. In-memory, per-instance: a
  # restart forgets the rotations (strict fallback).
  refresh:
    replayGraceSeconds: "$REFRESH_REPLAY_GRACE_SECONDS:60"
  # Self-service password reset: at most one request per submitted email per interval,
  # uniformly whether or not the account exists. In-memory, per-instance, like the lockout.
  # The emailed link is a persisted single-use grant (V35, only its digest is stored) valid for
  # tokenTtlSeconds (1..3600; default 15 minutes) - a request never changes a password, only
  # the owner opening the link and choosing one does (auth/PasswordResetService.kt).
  passwordReset:
    minIntervalSeconds: "$PASSWORD_RESET_MIN_INTERVAL_SECONDS:60"
    maxTracked: "$PASSWORD_RESET_MAX_TRACKED:10000"
    tokenTtlSeconds: "$PASSWORD_RESET_TOKEN_TTL_SECONDS:900"
  # Email MFA (opt-in per user via the MFA feature flag): a login with correct credentials
  # mints a challenge and emails a 6-digit code; the code must come back to
  # POST /api/v1/login/mfa within the TTL and attempt cap. Challenges are in-memory,
  # per-instance, like the lockout above (a restart just means signing in again).
  mfa:
    codeTtlSeconds: "$MFA_CODE_TTL_SECONDS:300"
    maxAttempts: "$MFA_MAX_ATTEMPTS:5"
    maxTracked: "$MFA_MAX_TRACKED:10000"
  # Application-level encryption at rest (infra/crypto/): an AES-256-GCM key (64 hex chars,
  # `openssl rand -hex 32`) for stored credentials (today the Jira API token). The
  # default is a committed dev-only key (infra/crypto/Crypto.kt — it is on the burned list,
  # so production startup refuses it).
  # LOSING THIS KEY MEANS LOSING EVERY STORED ENCRYPTED VALUE — back it up apart from the DB.
  encryption:
    key: "$DATA_ENCRYPTION_KEY:ef9b766b3b3dc805220826e796b1b907d7b7fb55048940e1b730af61b7f17aa4"
    # Decrypt-only fallback for key rotation: set the OLD key here and the new one above, boot
    # once (the startup backfill re-encrypts every row under the new key), then remove it.
    previousKey: "$DATA_ENCRYPTION_KEY_PREVIOUS:"
  csrf:
    # TEMPLATE PLACEHOLDER — CSRF protection is off by default because this API
    # authenticates via bearer JWT in the Authorization header, which browsers
    # do not auto-attach to cross-origin requests. Enable only if you move to
    # cookie-based session auth.
    enabled: "$SECURITY_CSRF_ENABLED:false"

jwt:
  secret: "$JWT_SECRET:secret"
  issuer: "$JWT_ISSUER:http://0.0.0.0:8084/"
  audience: "$JWT_AUDIENCE:flow-api"
  realm: "$JWT_REALM:flow-api"
  # Short-lived access token used as the API bearer; the SPA silently refreshes it.
  accessExpiresInSeconds: "$JWT_ACCESS_EXPIRES_IN_SECONDS:900"
  # Longer-lived refresh token exchanged at POST /api/v1/refresh. Pure-sliding with rotation: each
  # refresh mints a fresh pair and retires the presented refresh token (security.refresh below), so an
  # idle session ends only after this window elapses.
  refreshExpiresInSeconds: "$JWT_REFRESH_EXPIRES_IN_SECONDS:3600"

bootstrap:
  # When set and the V3 seed admin still has the well-known "changeme" password,
  # it is rotated to this value at startup (idempotent — a later admin-chosen
  # password is never overwritten). Outside development mode, startup FAILS if
  # any account still carries the seed password.
  adminInitialPassword: "$ADMIN_INITIAL_PASSWORD:"

http:
  # Set true when the app runs behind a reverse proxy / ingress that terminates TLS.
  # Installs XForwardedHeaders so the client IP (rate limiting) and scheme (HTTPS
  # redirect) come from X-Forwarded-* headers. The proxy MUST set X-Forwarded-For,
  # X-Forwarded-Proto and X-Forwarded-Host and overwrite client-supplied values —
  # k8s/web-deployment.yaml is the reference. X-Forwarded-Port is NOT read (cleared
  # in plugins/Http.kt — nothing needs it, and a non-numeric client value used to
  # throw a 500 out of CallSetup before any route ran).
  behindProxy: "$HTTP_BEHIND_PROXY:false"
  # Trusted proxies in front of the app when behindProxy is true (default 1 = the
  # ingress alone). X-Forwarded-For is folded from every header LINE the request
  # carries (plugins/Http.kt's resolveForwardedForOrigin, installed ahead of
  # XForwardedHeaders — a proxy that APPENDS a fresh line instead of merging into an
  # existing one, e.g. HAProxy's `option forwardedfor`, would otherwise leave a
  # client-supplied first line as the trusted value; Ktor's own header reader only
  # ever sees the first line) and then read from the END of the combined, comma-
  # joined list: 1 trusts the value the last proxy wrote; N skips the N-1 addresses
  # trusted proxies appended after the client's. Only count proxies that APPEND
  # (nginx proxy_add_x_forwarded_for, ingress-nginx with compute-full-forwarded-for);
  # ingress-nginx's default REPLACES the header, so 1 is right. Anything before the
  # values your proxies wrote is client-supplied and spoofable — never the first value.
  proxyHops: "$HTTP_PROXY_HOPS:1"
  # Comma-separated cross-origin hosts allowed to call the API (e.g.
  # "app.example.com,other.example.com:8443"). Empty (the default) = CORS is not
  # installed at all: production is single-origin (Ktor serves the SPA) and local
  # dev goes through the Vite proxy, so no cross-origin caller exists.
  corsHosts: "$CORS_ALLOWED_HOSTS:"
  # Swagger UI + the OpenAPI spec at /openapi. Blank (default) = follow the mode:
  # served in development, hidden in production. Set "true" to expose them in a
  # trusted production environment, "false" to hide them even in development.
  exposeOpenApi: "$HTTP_EXPOSE_OPENAPI:"

monitoring:
  # How often the Dropwizard registry (Ktor's request/JVM meters) is dumped to the `metrics` logger (plugins/Monitoring.kt), whole
  # seconds: 0 = off (the meters are still collected), otherwise 30..3600; anything else fails startup. 300 by default: every
  # dump formats the whole registry into dozens of lines that the console log exporter then re-emits, and at the old 10 s that was
  # a main source of idle allocation and log volume (memory deep dive, option K) for a snapshot nobody reads continuously - five
  # minutes still leaves a trail to look back on when diagnosing. Nothing else consumes these lines.
  reporterIntervalSeconds: "$METRICS_REPORT_INTERVAL_SECONDS:300"

telemetry:
  # The in-app telemetry sampler (telemetry/, `.claude/docs/observability.md` "Telemetry"): every process writes its own memory/JVM
  # figures to the `ops` schema. All three intervals are whole seconds, validated on every boot (enabled or not).
  enabled: "$TELEMETRY_ENABLED:true"
  # How often a process samples itself (60..1800 and a divisor of 3600, so an hour's samples tile it); stored as the raw rows' `resolution`.
  # Also the window of the request timers, capped at 300.
  sampleIntervalSeconds: "$TELEMETRY_SAMPLE_INTERVAL_SECONDS:300"
  # How often the cluster section measures storage sizes (900..86400).
  storageIntervalSeconds: "$TELEMETRY_STORAGE_INTERVAL_SECONDS:3600"
  # How often the per-connection storage estimate runs (3600..604800); the most expensive collector, hence the slow default.
  connectionEstimateIntervalSeconds: "$TELEMETRY_CONNECTION_ESTIMATE_INTERVAL_SECONDS:21600"

reports:
  # Per-statement time budget for every report read (reports/ReportService.reportTransaction sets it as the
  # transaction's statement timeout). A statement that outruns it is cancelled by PostgreSQL and answered as a 500
  # problem, so one pathological selection cannot pin a pooled connection. WHOLE SECONDS (the unit Exposed's
  # per-statement timeout takes), 1..3600.
  statementTimeoutSeconds: "$REPORTS_STATEMENT_TIMEOUT_SECONDS:30"
  peerCellCache:
    # Person trend's peer-cell cache (reports/PersonTrendCache.kt, WHY 49): at most this many cached (account, window) cells per data-stamp
    # generation, per web instance. Entries are fixed-size (~0.4 KiB measured), so the default holds ~8 MiB; a full generation refuses
    # writes (the request still answers correctly). 0 turns the cache off (every request reads every teammate's rows); 0..50000.
    maxEntries: "$REPORTS_PEER_CELL_CACHE_MAX_ENTRIES:20000"

web:
  # When set, the server serves the built React SPA from this directory (static
  # assets + SPA fallback to index.html). Empty in local dev, where Vite serves
  # the SPA on its own port; set to /app/web inside the Docker image.
  staticDir: "$WEB_STATIC_DIR:"

mail:
  # Outbound-email transport (infra/mail/Mail.kt): `log` (dev default — messages,
  # including password-reset links and MFA codes, go to the ch.nokillswit.mail logger instead of
  # being sent; production startup REFUSES it), `smtp` (real delivery; blank host
  # refuses startup in any mode), or `disabled` (the Docker image default — email
  # features answer 503).
  transport: "$MAIL_TRANSPORT:log"
  smtp:
    host: "$SMTP_HOST:"
    port: "$SMTP_PORT:587"
    user: "$SMTP_USER:"
    password: "$SMTP_PASSWORD:"
    startTls: "$SMTP_STARTTLS:true"
  from: "$MAIL_FROM:flow@localhost"
  # The deployment's public ORIGIN (e.g. https://flow.example.com): the self-service password reset
  # builds its emailed link from it - configured, never derived from the request Host header. A
  # non-blank value must be an https origin (http only in development) without path, query, fragment
  # or credentials, or startup is refused in any mode; blank leaves the reset answering 503.
  appUrl: "$MAIL_APP_URL:"

jira:
  # Outbound HTTP behavior for the Jira Cloud client (v0.2.0 plan §5/§6,
  # `.claude/docs/jira-integration.md`). Every call is bounded by this timeout (HttpTimeout, both
  # request and connect) and retried with exponential backoff on 429/5xx/IOException.
  requestTimeoutSeconds: "$JIRA_REQUEST_TIMEOUT_SECONDS:30"
  # [LOW-2] The TOTAL budget for one logical call, covering every retry attempt plus backoff —
  # `requestTimeoutSeconds` above only bounds a SINGLE attempt, so unbounded retries could
  # otherwise keep one call going for the ~10 minutes a `maxRetries`-deep exponential backoff can
  # sum to (a call hands its `jira.maxConcurrentRequests` permit back while it waits, so this bounds
  # the call's own time, not a permit). A Retry-After beyond the remaining budget fails RATE_LIMITED
  # immediately rather than waiting it out.
  requestDeadlineSeconds: "$JIRA_REQUEST_DEADLINE_SECONDS:180"
  # The Covenant-shaped bounded-read ceiling on a single response body (8 MiB default; it was 32 MiB). It bounds the WIRE bytes, not
  # the parsed tree: a response is held ~3-5x its size while read and parsed (buffer, copy, string, JSON tree), up to ~30x for a
  # document of minimal objects, 4 in flight (maxConcurrentRequests), in a worker of -Xmx512m. So it closes the risk of a legitimate
  # tenant's biggest response. A body is also refused (LIMIT_EXCEEDED, before it is parsed) past a structural node ceiling of
  # maxResponseBytes / 8 tokens (derived from this value, so there is no second knob to raise with it: 1,048,576 at the default) or past
  # 512 levels of nesting (jira/JiraNodeCeiling.kt), and a body over 1 MiB is parsed under one lock, one big tree at a time. A dense
  # hostile document is still ~108 MiB of tree per response at the default (~230-300 MiB before), and an OOM exits the worker
  # (ExitOnOutOfMemoryError): narrowed, not closed (`.claude/docs/jira-integration.md` "Node and depth ceiling", BACKLOG). A boot check
  # (jira/JiraHeapFit.kt) refuses a worker role whose heap cannot hold ingest.workerSlots slots, each the largest of one such tree
  # (112 B a node: the raw writers canonicalize the tree they are given), a PROCESS slot (processPageBytes, below) and the CHANGELOGS /
  # WORKLOGS answer text (those two convert every page under the big-parse lock, so one slot at a time adds a tree on top of its text),
  # + maxConcurrentRequests bodies of this size + a 96 MiB reserve (425 MiB of the 448 MiB old generation of -Xmx512m at the defaults), so raising this value (or the slots, or the requests) means raising the worker's -Xmx with it (build-times WHY 48).
  # A page over the cap is halved (ISSUES, CHANGELOGS, WORKLOGS batches) or its single id skipped, but a one-shot list cannot be: the
  # largest real one is `GET /field` (~4 MB on a site with ~10k fields; a WARN fires past half the cap), so a site whose own list
  # outgrows 8 MiB must raise this (`.claude/docs/jira-integration.md` "Response size cap"). The answer ceilings do not move with it.
  maxResponseBytes: "$JIRA_MAX_RESPONSE_BYTES:8388608"
  # The stored-size ceiling of ONE issue or reference entity (256 KiB..8 MiB; default 2 MiB, far above any real issue):
  # the raw writers REFUSE a larger canonical document (nothing is written, an existing row keeps its old payload and is only touched;
  # a WARN and the issuesSkipped/entitiesSkipped counters say so) because the stored text is re-read into a tree by PROCESS, the data
  # profile and PROJECT_FIELDS. A history (512 KiB) and a worklog (16 KiB) have constant ceilings (jira/JiraStoredCeilings.kt). It is
  # part of the heap fit budget: raising it means raising the worker's -Xmx (`.claude/docs/jira-integration.md` "Stored-size ceilings").
  maxStoredPayloadBytes: "$JIRA_MAX_STORED_PAYLOAD_BYTES:2097152"
  # The stored text one PROCESS page may claim (an issue's payload + its histories + its live worklogs; 2..64 MiB, default 8 MiB; 50
  # issues at most): pages are cut by these bytes, not only by count; an issue that alone exceeds it is left unprocessed (issuesOversized)
  # and the raw issue inspector answers 413 for it. Also the size of each chunk a reference kind is read in, and the heap fit's PROCESS term (4 x this + dense trees of one stored
  # item); startup fails unless it is at least maxStoredPayloadBytes + 512 KiB (an issue must be processable once stored).
  processPageBytes: "$JIRA_PROCESS_PAGE_BYTES:8388608"
  # A Semaphore cap on concurrent in-flight Jira calls (per process).
  maxConcurrentRequests: "$JIRA_MAX_CONCURRENT_REQUESTS:4"
  maxRetries: "$JIRA_MAX_RETRIES:4"
  # The ISSUES stream's (plan §7, jira/JiraIssuesStream.kt) `search/jql` page size — the stub
  # ignores this and returns its own fixed-size pages regardless (sample-data/README.md).
  pageSize: "$JIRA_PAGE_SIZE:100"
  # The CHANGELOGS stream's (plan §7, jira/JiraChangelogStream.kt) `changelog/bulkfetch` chunk size
  # — MUST match sample-data/jira-stub's own fixed 50-id chunking (sample-data/README.md) for the
  # pipeline test's exact-count assertions (and a real tenant's own bulkfetch ceiling) to hold.
  changelogBulkSize: "$JIRA_CHANGELOG_BULK_SIZE:50"
  # The histories asked per `changelog/bulkfetch` page (`maxResults`, Jira's default 1,000, max 10,000; 1..10,000). Was
  # the chunk size (50) until 1.17.2: ~37 calls per 50-issue batch at the real tenant's density, ~75 % of a backfill.
  changelogPageSize: "$JIRA_CHANGELOG_PAGE_SIZE:1000"
  # How far the ISSUES stream re-widens its relative `updated` window past the last completed
  # run's watermark, on every run AFTER the first (the first run's window is `backfillFrom`
  # instead) — covers clock skew/a slow last page committing an issue Jira stamped just before the
  # watermark but the search only surfaced after it.
  incrementalOverlapMinutes: "$JIRA_INCREMENTAL_OVERLAP_MINUTES:10"
  # How old (hours, 0..168) a data source's Jira users may get before a SYNC's REFERENCE pass fetches them again
  # (`users/search`, ~47 of an incremental SYNC's ~74 calls at the real tenant's ~2,300 users). 0 = every SYNC (until 1.17.4).
  usersRefreshHours: "$JIRA_USERS_REFRESH_HOURS:24"
  # Reroutes BOTH the tenant_info host and the gateway host to the in-JVM/compose Jira stub
  # (sample-data/jira-stub) — DEVELOPMENT ONLY; production startup refuses a non-blank value
  # (jira/Jira.kt's fail-closed check, ported from the crypto-key/mail-transport precedent).
  stubBaseUrl: "$JIRA_STUB_BASE_URL:"

ingest:
  # The sync-job queue and worker scheduler (v0.2.0 plan §5/§9, ingest/IngestWorker.kt,
  # `.claude/docs/ingestion.md` "Worker scheduler"). Validated on every boot regardless of
  # FLOW_ROLE (the configureRole/configureJira fail-fast idiom) — only the scan loop itself is
  # worker-only.
  # How often the worker's scan loop runs: enqueue due jobs, prune old rows, claim+run.
  schedulerTickSeconds: "$INGEST_SCHEDULER_TICK_SECONDS:15"
  # The Semaphore cap on concurrently RUNNING jobs for this worker instance. Each slot may keep one worst-case Jira response tree
  # alive (~112 MiB at the default response cap), so the worker's heap must grow with it (jira/JiraHeapFit.kt refuses a worker otherwise).
  workerSlots: "$INGEST_WORKER_SLOTS:2"
  # A claimed job's lease lifetime; heartbeated at leaseSeconds/3. An expired RUNNING lease is
  # reclaimable by any worker (a crashed/partitioned worker's job is not stuck forever).
  leaseSeconds: "$INGEST_LEASE_SECONDS:300"
  # How many times a job may be (re)claimed before the claim loop fails it RETRIES_EXHAUSTED.
  maxAttempts: "$INGEST_MAX_ATTEMPTS:3"
  # The wall-clock ceiling of ONE SYNC or RECONCILE run, in minutes (5..1440). The run stops BETWEEN pages once it is up
  # (`TIME_EXCEEDED`; the graceful check at each heartbeat between pages; PROCESS/PROFILE never call Jira, so they are exempt) and the
  # next run resumes from the stream cursors, exactly like a paging-ceiling trip. A run that does not reach a page boundary (a Jira call
  # in flight, a 429 wait, a page's transaction) is cancelled in flight `hardStopGraceSeconds` after the budget - see below. A SYNC
  # stopped after storing pages just continues at its normal interval (no failure recorded). 60 = ~3x the slowest full backfill
  # measured on the real tenant (22 min before the fetch-ahead work, ~5 min after it for the largest project); the stub's SYNC takes
  # seconds. `.claude/docs/ingestion.md` "Ceiling trips and the pause".
  maxJobMinutes: "$INGEST_MAX_JOB_MINUTES:60"
  # The hard stop behind the wall clock, in seconds (10..900): a SYNC/RECONCILE run still in flight this long after `maxJobMinutes` is
  # cancelled (the call or page in flight is abandoned and its transaction rolls back) and ends as the same `TIME_EXCEEDED`, so a run
  # never overruns its budget by more than this. Without it the budget was only checked between pages, and a stuck call (180 s deadline),
  # a 429 wait (120 s) and a page's transaction could add ~5 minutes. 60: a healthy page takes seconds, so the graceful stop normally
  # wins; PROCESS/PROFILE are exempt. `.claude/docs/ingestion.md` "Ceiling trips and the pause".
  hardStopGraceSeconds: "$INGEST_HARD_STOP_GRACE_SECONDS:60"
  # How many SYNCs in a row must stop at a ceiling (`LIMIT_EXCEEDED` or `TIME_EXCEEDED`) WITHOUT storing a page in the stream that
  # tripped before the connection is PAUSED (1..100): scheduled SYNC stops (RECONCILE continues), an ERROR is logged and `data_source.paused` audited, and an
  # ADMIN's "Sync now" or config save resumes it. A trip that did store pages is a normal "continue next run" and is not
  # counted; a succeeded SYNC resets the count. The same threshold pauses a connection's scheduled RECONCILE (V38) after that many
  # consecutive RECONCILE ceiling trips, counted with or without progress (its pass never resumes); "Reconcile now" or a config save resumes it.
  pauseAfterLimitTrips: "$INGEST_PAUSE_AFTER_LIMIT_TRIPS:5"
  # The DERIVE debounce (V27 `sync_jobs.not_before`, `.claude/docs/ingestion.md` "Worker scheduler"): a CONFIGURATION change
  # (settings, membership, capacity, per-connection config, public holidays) schedules the connection's DERIVE no earlier than
  # this many seconds from now, and a further edit inside the window pushes it out - a burst of edits becomes ONE DERIVE, this
  # long after the last. A DERIVE chained after a SYNC/RECONCILE/REPROCESS and a manual one are never delayed. 0 turns it off.
  deriveQuietSeconds: "$INGEST_DERIVE_QUIET_SECONDS:45"
  # Finished (SUCCEEDED/FAILED/CANCELLED) rows older than this are hard-deleted — the documented
  # sync_jobs history-pruning exception (`.claude/docs/persistence.md`).
  jobRetentionDays: "$INGEST_JOB_RETENTION_DAYS:90"
  # A soft-deleted connection becomes eligible for the internal PURGE job after this many days —
  # a mistaken delete can be undone within the grace period (plan §0 A2).
  purgeGraceDays: "$INGEST_PURGE_GRACE_DAYS:7"
  # This worker instance's lease-owner identity. Blank derives hostname + a random suffix.
  workerId: "$INGEST_WORKER_ID:"
  # The data-source scope rules (ingest/DataSourceScope.kt, `.claude/docs/ingestion.md` "Data sources"): `enforced` = every
  # active data source reads the same Jira site and no project key sits in two of them. `off` is e2e-only (the isolated
  # stack's fixtures create overlapping sources) and REFUSED at boot outside development mode; anything else fails startup.
  scopeRules: "$INGEST_SCOPE_RULES:enforced"

postgres:
  # Local-dev defaults point at the docker-compose Postgres, which maps host port
  # 5435 (not 5432/5433/5434 — sibling apps may occupy those on the same machine).
  jdbcUrl: "$POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5435/flow"
  r2dbcUrl: "$POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5435/flow"
  user: "$POSTGRES_USER:flow"
  password: "$POSTGRES_PASSWORD:flow"
  # How many times Flyway retries its connection at boot (doubling 1, 2, 4, 8, 8… s waits — 10 is
  # ~63 s) before failing, so a cold start with Postgres not yet accepting connections waits instead
  # of crash-looping (infra/db/Flyway.kt). 0 = fail fast.
  connectRetries: "$POSTGRES_CONNECT_RETRIES:10"
  # Bounded R2DBC connection pool (infra/db/Database.kt, `.claude/docs/persistence.md`
  # "Connection pool") — a plain r2dbc:postgresql:// connect opens one PostgreSQL backend
  # per suspendTransaction with nothing capping how many run at once. Sizing assumes a
  # SINGLE replica: `maxSize × replicas` must stay well under PostgreSQL's default
  # `max_connections = 100`, with room left for Flyway's one short-lived JDBC connection
  # (infra/db/Flyway.kt) and any other client.
  pool:
    # The ceiling on concurrent pooled connections for this instance.
    maxSize: "$POSTGRES_POOL_MAX_SIZE:20"
    # The floor the pool fills up to on its FIRST acquire (r2dbc-pool warms up lazily — no
    # explicit warmup() call). configureBootstrap queries the database during every boot — the
    # encrypted-at-rest backfill over the `EncryptedAtRest` registry (the Jira API token) runs in
    # every mode, and outside development mode so does the seed-password check — so these
    # connections are already open before the first request.
    initialSize: "$POSTGRES_POOL_INITIAL_SIZE:2"
    # How long a caller waits for a free connection before failing (surfaces as a 500 —
    # see "Connection pool" in persistence.md — rather than a new declared status).
    maxAcquireTimeSeconds: "$POSTGRES_POOL_MAX_ACQUIRE_SECONDS:10"
    # How long an idle pooled connection may sit before the pool recycles it.
    maxIdleTimeSeconds: "$POSTGRES_POOL_MAX_IDLE_SECONDS:600"
    # PostgreSQL's idle_in_transaction_session_timeout on every pooled connection (0 = off): the
    # server ends a session left idle inside an open transaction, releasing its locks. 300 s is ~8x
    # the longest legitimate gap (a DERIVE) — see "Connection pool" in persistence.md.
    idleInTransactionTimeoutSeconds: "$POSTGRES_POOL_IDLE_IN_TRANSACTION_TIMEOUT_SECONDS:300"
