ktor:
  # Development default for :server:run and tests; the Docker image ships
  # KTOR_DEVELOPMENT=false (production mode: JWT/seed fail-closed checks active,
  # HSTS + HTTPS redirect on).
  development: "$KTOR_DEVELOPMENT:true"
  deployment:
    port: 8084
  application:
    modules:
      # — base plugins
      - ch.nokillswit.plugins.HttpKt.configureHttp
      - ch.nokillswit.plugins.SecurityHeadersKt.configureSecurityHeaders
      - ch.nokillswit.plugins.MonitoringKt.configureMonitoring
      - ch.nokillswit.plugins.SerializationKt.configureSerialization
      - ch.nokillswit.plugins.SecurityKt.configureSecurity
      # Every per-IP bucket (login, refresh, password reset, MFA) — before any route module.
      - ch.nokillswit.plugins.RateLimitsKt.configureRateLimits
      - ch.nokillswit.plugins.ErrorHandlingKt.configureErrorHandling
      - ch.nokillswit.plugins.OpenTelemetryKt.configureOpenTelemetry
      - ch.nokillswit.plugins.AutoHeadResponseKt.configureAutoHeadResponse
      - ch.nokillswit.plugins.ResourcesKt.configureResources
      # The FLOW_ROLE switch (web|worker|all — app.role below). Early: no dependency on infra, and
      # every later module (feature routes, the SPA catch-all) reads Application.servesApi() off
      # the attribute this publishes.
      - ch.nokillswit.plugins.RoleKt.configureRole
      # — infrastructure
      - ch.nokillswit.infra.mail.MailKt.configureMail
      # Crypto before Database: the composition root hands the FieldCipher to any service
      # owning encrypted columns.
      - ch.nokillswit.infra.crypto.CryptoKt.configureCrypto
      - ch.nokillswit.infra.db.FlywayKt.configureFlyway
      - ch.nokillswit.infra.db.DatabaseKt.configureDatabase
      - ch.nokillswit.infra.db.BootstrapKt.configureBootstrap
      # Public liveness/readiness probes (/api/v1/health, /api/v1/ready); after Database (the probe
      # round-trips it).
      - ch.nokillswit.plugins.HealthKt.configureHealth
      # The guarded Jira HTTP stack (outbound guard + Test-connection service + the Connector
      # registry) — before the data-sources/sync-job routes, which read it off attributes.
      - ch.nokillswit.jira.JiraKt.configureJira
      # The metrics layer's composition root (v0.3.0 M1 commit 3, `.claude/docs/domain-model.md`
      # "Configuration" — `metrics.md` itself arrives with commit 4, per the phase-3 plan):
      # publishes MetricsConfigService/TeamMembershipService and registers the tiny
      # /metrics-settings singleton's own routes. After configureJira (the metrics layer reads
      # `norm`, which configureJira publishes), before the worker scheduler (which gains a DERIVE
      # dispatch to this package from a later commit).
      - ch.nokillswit.metrics.MetricsKt.configureMetrics
      # The FLOW_ROLE=worker scheduler (v0.2.0 plan §5) — a no-op unless runsWorker(); after the
      # Connector registry, before the feature route modules.
      - ch.nokillswit.ingest.IngestWorkerKt.configureIngestWorker
      # — features
      - ch.nokillswit.users.UserRoutesKt.configureUserRoutes
      - ch.nokillswit.teams.TeamRoutesKt.configureTeamRoutes
      - ch.nokillswit.auth.AuthRoutesKt.configureAuthRoutes
      - ch.nokillswit.ingest.DataSourceRoutesKt.configureDataSourceRoutes
      - ch.nokillswit.ingest.SyncJobRoutesKt.configureSyncJobRoutes
      - ch.nokillswit.ingest.SyncStatusRoutesKt.configureSyncStatusRoutes
      - ch.nokillswit.ingest.RawIssueInspectorRoutesKt.configureRawIssueInspectorRoutes
      - ch.nokillswit.ingest.DataProfileRoutesKt.configureDataProfileRoutes
      - ch.nokillswit.metrics.MetricsConfigRoutesKt.configureMetricsConfigRoutes
      - ch.nokillswit.metrics.TeamMembershipRoutesKt.configureTeamMembershipRoutes
      - ch.nokillswit.metrics.JiraUsersRoutesKt.configureJiraUsersRoutes
      # The reports API (v0.3.0 M4 commit 10a) — read-only, any authenticated (D12); after the
      # metrics feature routes it reads from.
      - ch.nokillswit.reports.ReportRoutesKt.configureReportRoutes
      # — catch-all router
      - ch.nokillswit.plugins.RoutingKt.configureRouting

app:
  # The FLOW_ROLE switch (plugins/Role.kt): web|worker|all, case-insensitive. `web` serves the
  # HTTP API; `worker` serves only the health/ready probes and runs the ingestion worker (arriving
  # in commit 5 of the v0.2.0 plan); `all` (the default — dev, docker compose, tests) does both in
  # one process. An unrecognized value fails startup in every mode.
  role: "$FLOW_ROLE:all"

security:
  # Per-account login lockout (complements the per-IP rate limit): after `threshold`
  # consecutive failures for one email, further attempts are 429 for `durationSeconds`.
  # A successful login resets the counter. In-memory, per-instance.
  lockout:
    threshold: "$LOGIN_LOCKOUT_THRESHOLD:5"
    durationSeconds: "$LOGIN_LOCKOUT_DURATION_SECONDS:900"
    maxTracked: "$LOGIN_LOCKOUT_MAX_TRACKED:10000"
  # Per-IP token bucket on POST /api/v1/login. The per-account lockout above is the
  # actual brute-force defence and is unaffected by this. Blank FOLLOWS THE MODE:
  # 10/min in production, 1000/min in development — the e2e suite drives many logins
  # from a single host and would otherwise spend minutes sleeping out the bucket.
  # Set a number to pin it in either mode.
  rateLimit:
    loginPerMinute: "$LOGIN_RATE_LIMIT_PER_MINUTE:"
    # Blank keeps the default 30/min (both modes); a number pins it.
    refreshPerMinute: "$REFRESH_RATE_LIMIT_PER_MINUTE:"
    # Per-IP bucket on POST /api/v1/password-reset. Blank FOLLOWS THE MODE (5/min in
    # production, 100/min in development — the loginPerMinute rationale); a number pins it.
    # The per-EMAIL reset throttle below is the actual abuse defence in both modes.
    passwordResetPerMinute: "$PASSWORD_RESET_RATE_LIMIT_PER_MINUTE:"
  # Not configurable, stated for the operator: the JWT blocklist (auth/TokenBlocklistService.kt)
  # serves revocation verdicts through a 30-second in-memory cache per instance. A logout revokes
  # on the instance that handled it immediately; on a SECOND instance the token would keep working
  # for up to 30 s — the deployment is single-replica (k8s/web-deployment.yaml), like the throttles
  # above assume; scale out only after moving these to a shared store.
  # Self-service password reset: at most one request per submitted email per interval,
  # uniformly whether or not the account exists. In-memory, per-instance, like the lockout.
  passwordReset:
    minIntervalSeconds: "$PASSWORD_RESET_MIN_INTERVAL_SECONDS:60"
    maxTracked: "$PASSWORD_RESET_MAX_TRACKED:10000"
  # Email MFA (opt-in per user via the MFA feature flag): a login with correct credentials
  # mints a challenge and emails a 6-digit code; the code must come back to
  # POST /api/v1/login/mfa within the TTL and attempt cap. Challenges are in-memory,
  # per-instance, like the lockout above (a restart just means signing in again).
  mfa:
    codeTtlSeconds: "$MFA_CODE_TTL_SECONDS:300"
    maxAttempts: "$MFA_MAX_ATTEMPTS:5"
    maxTracked: "$MFA_MAX_TRACKED:10000"
  # Application-level encryption at rest (infra/crypto/): an AES-256-GCM key (64 hex chars,
  # `openssl rand -hex 32`) for any future stored credential (e.g. a Jira API token). The
  # default is a committed dev-only key (infra/crypto/Crypto.kt — it is on the burned list,
  # so production startup refuses it).
  # LOSING THIS KEY MEANS LOSING EVERY STORED ENCRYPTED VALUE — back it up apart from the DB.
  encryption:
    key: "$DATA_ENCRYPTION_KEY:ef9b766b3b3dc805220826e796b1b907d7b7fb55048940e1b730af61b7f17aa4"
    # Decrypt-only fallback for key rotation: set the OLD key here and the new one above, boot
    # once (the startup backfill re-encrypts every row under the new key), then remove it.
    previousKey: "$DATA_ENCRYPTION_KEY_PREVIOUS:"
  csrf:
    # TEMPLATE PLACEHOLDER — CSRF protection is off by default because this API
    # authenticates via bearer JWT in the Authorization header, which browsers
    # do not auto-attach to cross-origin requests. Enable only if you move to
    # cookie-based session auth.
    enabled: "$SECURITY_CSRF_ENABLED:false"

jwt:
  secret: "$JWT_SECRET:secret"
  issuer: "$JWT_ISSUER:http://0.0.0.0:8084/"
  audience: "$JWT_AUDIENCE:flow-api"
  realm: "$JWT_REALM:flow-api"
  # Short-lived access token used as the API bearer; the SPA silently refreshes it.
  accessExpiresInSeconds: "$JWT_ACCESS_EXPIRES_IN_SECONDS:900"
  # Longer-lived refresh token exchanged at POST /api/v1/refresh. Pure-sliding: each
  # refresh mints a fresh pair, so an idle session ends only after this window elapses.
  refreshExpiresInSeconds: "$JWT_REFRESH_EXPIRES_IN_SECONDS:3600"

bootstrap:
  # When set and the V3 seed admin still has the well-known "changeme" password,
  # it is rotated to this value at startup (idempotent — a later admin-chosen
  # password is never overwritten). Outside development mode, startup FAILS if
  # any account still carries the seed password.
  adminInitialPassword: "$ADMIN_INITIAL_PASSWORD:"

http:
  # Set true when the app runs behind a reverse proxy / ingress that terminates TLS.
  # Installs XForwardedHeaders so the client IP (rate limiting) and scheme (HTTPS
  # redirect) come from X-Forwarded-* headers. The proxy MUST set X-Forwarded-For,
  # X-Forwarded-Proto and X-Forwarded-Host and overwrite client-supplied values —
  # k8s/web-deployment.yaml is the reference. X-Forwarded-Port is NOT read (cleared
  # in plugins/Http.kt — nothing needs it, and a non-numeric client value used to
  # throw a 500 out of CallSetup before any route ran).
  behindProxy: "$HTTP_BEHIND_PROXY:false"
  # Trusted proxies in front of the app when behindProxy is true (default 1 = the
  # ingress alone). X-Forwarded-For is folded from every header LINE the request
  # carries (plugins/Http.kt's resolveForwardedForOrigin, installed ahead of
  # XForwardedHeaders — a proxy that APPENDS a fresh line instead of merging into an
  # existing one, e.g. HAProxy's `option forwardedfor`, would otherwise leave a
  # client-supplied first line as the trusted value; Ktor's own header reader only
  # ever sees the first line) and then read from the END of the combined, comma-
  # joined list: 1 trusts the value the last proxy wrote; N skips the N-1 addresses
  # trusted proxies appended after the client's. Only count proxies that APPEND
  # (nginx proxy_add_x_forwarded_for, ingress-nginx with compute-full-forwarded-for);
  # ingress-nginx's default REPLACES the header, so 1 is right. Anything before the
  # values your proxies wrote is client-supplied and spoofable — never the first value.
  proxyHops: "$HTTP_PROXY_HOPS:1"
  # Comma-separated cross-origin hosts allowed to call the API (e.g.
  # "app.example.com,other.example.com:8443"). Empty (the default) = CORS is not
  # installed at all: production is single-origin (Ktor serves the SPA) and local
  # dev goes through the Vite proxy, so no cross-origin caller exists.
  corsHosts: "$CORS_ALLOWED_HOSTS:"
  # Swagger UI + the OpenAPI spec at /openapi. Blank (default) = follow the mode:
  # served in development, hidden in production. Set "true" to expose them in a
  # trusted production environment, "false" to hide them even in development.
  exposeOpenApi: "$HTTP_EXPOSE_OPENAPI:"

web:
  # When set, the server serves the built React SPA from this directory (static
  # assets + SPA fallback to index.html). Empty in local dev, where Vite serves
  # the SPA on its own port; set to /app/web inside the Docker image.
  staticDir: "$WEB_STATIC_DIR:"

mail:
  # Outbound-email transport (infra/mail/Mail.kt): `log` (dev default — messages,
  # including generated passwords, go to the ch.nokillswit.mail logger instead of
  # being sent; production startup REFUSES it), `smtp` (real delivery; blank host
  # refuses startup in any mode), or `disabled` (the Docker image default — email
  # features answer 503).
  transport: "$MAIL_TRANSPORT:log"
  smtp:
    host: "$SMTP_HOST:"
    port: "$SMTP_PORT:587"
    user: "$SMTP_USER:"
    password: "$SMTP_PASSWORD:"
    startTls: "$SMTP_STARTTLS:true"
  from: "$MAIL_FROM:flow@localhost"
  # Optional absolute URL of this deployment (e.g. https://flow.example.com);
  # when set, outbound emails include a sign-in link.
  appUrl: "$MAIL_APP_URL:"

jira:
  # Outbound HTTP behavior for the Jira Cloud client (v0.2.0 plan §5/§6,
  # `.claude/docs/jira-integration.md`). Every call is bounded by this timeout (HttpTimeout, both
  # request and connect) and retried with exponential backoff on 429/5xx/IOException.
  requestTimeoutSeconds: "$JIRA_REQUEST_TIMEOUT_SECONDS:30"
  # [LOW-2] The TOTAL budget for one logical call, covering every retry attempt plus backoff —
  # `requestTimeoutSeconds` above only bounds a SINGLE attempt, so unbounded retries could
  # otherwise hold a `jira.maxConcurrentRequests` Semaphore permit for the ~10 minutes a
  # `maxRetries`-deep exponential backoff can sum to. A Retry-After beyond the remaining budget
  # fails RATE_LIMITED immediately rather than waiting it out.
  requestDeadlineSeconds: "$JIRA_REQUEST_DEADLINE_SECONDS:180"
  # The Covenant-shaped bounded-read ceiling on a single response body (32 MiB default).
  maxResponseBytes: "$JIRA_MAX_RESPONSE_BYTES:33554432"
  # A Semaphore cap on concurrent in-flight Jira calls (per process).
  maxConcurrentRequests: "$JIRA_MAX_CONCURRENT_REQUESTS:4"
  maxRetries: "$JIRA_MAX_RETRIES:4"
  # The ISSUES stream's (plan §7, jira/JiraIssuesStream.kt) `search/jql` page size — the stub
  # ignores this and returns its own fixed-size pages regardless (sample-data/README.md).
  pageSize: "$JIRA_PAGE_SIZE:100"
  # The CHANGELOGS stream's (plan §7, jira/JiraChangelogStream.kt) `changelog/bulkfetch` chunk size
  # — MUST match sample-data/jira-stub's own fixed 50-id chunking (sample-data/README.md) for the
  # pipeline test's exact-count assertions (and a real tenant's own bulkfetch ceiling) to hold.
  changelogBulkSize: "$JIRA_CHANGELOG_BULK_SIZE:50"
  # How far the ISSUES stream re-widens its relative `updated` window past the last completed
  # run's watermark, on every run AFTER the first (the first run's window is `backfillFrom`
  # instead) — covers clock skew/a slow last page committing an issue Jira stamped just before the
  # watermark but the search only surfaced after it.
  incrementalOverlapMinutes: "$JIRA_INCREMENTAL_OVERLAP_MINUTES:10"
  # Reroutes BOTH the tenant_info host and the gateway host to the in-JVM/compose Jira stub
  # (sample-data/jira-stub) — DEVELOPMENT ONLY; production startup refuses a non-blank value
  # (jira/Jira.kt's fail-closed check, ported from the crypto-key/mail-transport precedent).
  stubBaseUrl: "$JIRA_STUB_BASE_URL:"

ingest:
  # The sync-job queue and worker scheduler (v0.2.0 plan §5/§9, ingest/IngestWorker.kt,
  # `.claude/docs/ingestion.md` "Worker scheduler"). Validated on every boot regardless of
  # FLOW_ROLE (the configureRole/configureJira fail-fast idiom) — only the scan loop itself is
  # worker-only.
  # How often the worker's scan loop runs: enqueue due jobs, prune old rows, claim+run.
  schedulerTickSeconds: "$INGEST_SCHEDULER_TICK_SECONDS:15"
  # The Semaphore cap on concurrently RUNNING jobs for this worker instance.
  workerSlots: "$INGEST_WORKER_SLOTS:2"
  # A claimed job's lease lifetime; heartbeated at leaseSeconds/3. An expired RUNNING lease is
  # reclaimable by any worker (a crashed/partitioned worker's job is not stuck forever).
  leaseSeconds: "$INGEST_LEASE_SECONDS:300"
  # How many times a job may be (re)claimed before the claim loop fails it RETRIES_EXHAUSTED.
  maxAttempts: "$INGEST_MAX_ATTEMPTS:3"
  # Finished (SUCCEEDED/FAILED/CANCELLED) rows older than this are hard-deleted — the documented
  # sync_jobs history-pruning exception (`.claude/docs/persistence.md`).
  jobRetentionDays: "$INGEST_JOB_RETENTION_DAYS:90"
  # A soft-deleted connection becomes eligible for the internal PURGE job after this many days —
  # a mistaken delete can be undone within the grace period (plan §0 A2).
  purgeGraceDays: "$INGEST_PURGE_GRACE_DAYS:7"
  # This worker instance's lease-owner identity. Blank derives hostname + a random suffix.
  workerId: "$INGEST_WORKER_ID:"

postgres:
  # Local-dev defaults point at the docker-compose Postgres, which maps host port
  # 5435 (not 5432/5433/5434 — sibling apps may occupy those on the same machine).
  jdbcUrl: "$POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5435/flow"
  r2dbcUrl: "$POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5435/flow"
  user: "$POSTGRES_USER:flow"
  password: "$POSTGRES_PASSWORD:flow"
  # Bounded R2DBC connection pool (infra/db/Database.kt, `.claude/docs/persistence.md`
  # "Connection pool") — a plain r2dbc:postgresql:// connect opens one PostgreSQL backend
  # per suspendTransaction with nothing capping how many run at once. Sizing assumes a
  # SINGLE replica: `maxSize × replicas` must stay well under PostgreSQL's default
  # `max_connections = 100`, with room left for Flyway's one short-lived JDBC connection
  # (infra/db/Flyway.kt) and any other client.
  pool:
    # The ceiling on concurrent pooled connections for this instance.
    maxSize: "$POSTGRES_POOL_MAX_SIZE:20"
    # The floor the pool fills up to on its FIRST acquire (r2dbc-pool warms up lazily — no
    # explicit warmup() call). Outside development mode, configureBootstrap's seed-password check
    # queries the database during boot, so these connections are already open before the first
    # request there; in development (the common local/test path) nothing acquires during boot
    # unless ADMIN_INITIAL_PASSWORD is set — the encrypted-at-rest backfill would be the other
    # boot-time acquirer, but that registry is empty today.
    initialSize: "$POSTGRES_POOL_INITIAL_SIZE:2"
    # How long a caller waits for a free connection before failing (surfaces as a 500 —
    # see "Connection pool" in persistence.md — rather than a new declared status).
    maxAcquireTimeSeconds: "$POSTGRES_POOL_MAX_ACQUIRE_SECONDS:10"
    # How long an idle pooled connection may sit before the pool recycles it.
    maxIdleTimeSeconds: "$POSTGRES_POOL_MAX_IDLE_SECONDS:600"
