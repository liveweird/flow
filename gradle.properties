kotlin.code.style=official

# Shared by settings plugin resolution and the locked security-audit configuration.
foojayResolverVersion=1.0.0

# Cap JVM heaps so the build stays within a modest container/VM (e.g. a 2 GiB
# Podman machine). Without these, Gradle/Kotlin size their heaps from the host's
# apparent RAM and get OOM-killed inside a small build container, surfacing as
# "Gradle build daemon disappeared unexpectedly" during :server:compileKotlin.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1536m
