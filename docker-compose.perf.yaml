# The phase-3 performance check (`.claude/docs/metrics.md` "Performance (scale 20)"): the normal
# stack, but its jira-stub serves the ~24k-issue dataset generated by
#   node sample-data/jira/generate.mjs --scale 20 --out /tmp/flow-jira-x20
# (never committed; override the directory with FLOW_PERF_STUB_DIR — it is the generator's --out
# directory, so the stub mounts its `jira-stub/` child).
#
# ALWAYS run it as its own compose PROJECT so it can never touch a dev stack's containers or
# volumes (`postgres-data` becomes `flow-perf_postgres-data`):
#   docker compose -p flow-perf -f docker-compose.yaml -f docker-compose.perf.yaml up --build -d
#   docker compose -p flow-perf -f docker-compose.yaml -f docker-compose.perf.yaml down -v
#
# Distinct container names and host ports (app 8184, postgres 5535, stub 8194, mailpit 8128) so it
# runs beside a dev stack. Sizing mirrors production (k8s/worker-deployment.yaml's 512m heap in a
# 768Mi container, k8s/postgres-deployment.yaml's 1Gi) rather than the demo's tiny limits.
services:
  postgres:
    container_name: flow-perf-postgres
    ports: !override
      - "127.0.0.1:5535:5432"
    mem_limit: 1g

  mailpit:
    container_name: flow-perf-mailpit
    ports: !override
      - "127.0.0.1:8128:8025"

  jira-stub:
    container_name: flow-perf-jira-stub
    command: ["--disable-banner", "--no-request-journal"]
    volumes: !override
      - ${FLOW_PERF_STUB_DIR:-/tmp/flow-jira-x20}/jira-stub:/home/wiremock:ro
    ports: !override
      - "127.0.0.1:8194:8080"
    mem_limit: 2g
    environment:
      JAVA_OPTS: "-Xmx1g"

  app:
    container_name: flow-perf-app
    environment:
      MAIL_APP_URL: http://localhost:8184
      JAVA_OPTS: "-Xmx512m"
    ports: !override
      - "127.0.0.1:8184:8084"
    mem_limit: 768m
