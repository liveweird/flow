# The phase-3 performance check (`.claude/docs/metrics.md` "Performance (scale 20)"): the normal
# stack, but its jira-stub serves the ~24k-issue dataset generated by
#   node sample-data/jira/generate.mjs --scale 20 --out /tmp/flow-jira-x20   (regenerate after any change of the ISSUES `fields`, 1.17.1)
# (never committed; override the directory with FLOW_PERF_STUB_DIR — it is the generator's --out
# directory, so the stub mounts its `jira-stub/` child).
#
# ALWAYS run it as its own compose PROJECT so it can never touch a dev stack's containers or
# volumes (`postgres-data` becomes `flow-perf_postgres-data`):
#   docker compose -p flow-perf -f docker-compose.yaml -f docker-compose.perf.yaml up --build -d
#   docker compose -p flow-perf -f docker-compose.yaml -f docker-compose.perf.yaml down -v
#
# Distinct container names and host ports (web 8184, worker 8185, postgres 5535, stub 8194, mailpit 8128) so it
# runs beside a dev stack. Since 2026-10-25 (the production-scale check, build-times.md WHY 41) it runs the PRODUCTION
# role split, not the demo's `all`: `web` (FLOW_ROLE=web, the image's baked -Xmx256m in 512m = k8s/web-deployment.yaml)
# serves the API and the SPA on 8184, and `app` is the worker (FLOW_ROLE=worker, -Xmx512m in 768m =
# k8s/worker-deployment.yaml), answering only /api/v1/health and /ready on 8185. WHY 14-27 measured the `all` role (one
# heap for both); set FLOW_PERF_APP_ROLE=all and stop `web` to repeat them. Postgres mirrors k8s/postgres-deployment.yaml's
# 1536Mi.
services:
  postgres:
    container_name: flow-perf-postgres
    ports: !override
      - "127.0.0.1:5535:5432"
    mem_limit: 1536m

  mailpit:
    container_name: flow-perf-mailpit
    ports: !override
      - "127.0.0.1:8128:8025"

  jira-stub:
    container_name: flow-perf-jira-stub
    command: ["--disable-banner", "--no-request-journal"]
    volumes: !override
      - ${FLOW_PERF_STUB_DIR:-/tmp/flow-jira-x20}/jira-stub:/home/wiremock:ro
    ports: !override
      - "127.0.0.1:8194:8080"
    mem_limit: 2g
    environment:
      JAVA_OPTS: "-Xmx1g"

  # The worker (k8s/worker-deployment.yaml): ingestion and DERIVE, no API.
  app:
    container_name: flow-perf-worker
    environment:
      FLOW_ROLE: ${FLOW_PERF_APP_ROLE:-worker}
      MAIL_APP_URL: http://localhost:8184
      JAVA_OPTS: "-Xmx512m"
    ports: !override
      - "127.0.0.1:8185:8084"
    mem_limit: 768m

  # The web role (k8s/web-deployment.yaml): the API and the SPA, no worker. The same image (an identical build, so the
  # second build is a cache hit); an empty JAVA_OPTS leaves the image's baked -Xmx256m, as the web Deployment does.
  web:
    extends:
      file: docker-compose.yaml
      service: app
    container_name: flow-perf-web
    environment:
      FLOW_ROLE: web
      MAIL_APP_URL: http://localhost:8184
      JAVA_OPTS: ""
    ports: !override
      - "127.0.0.1:8184:8084"
    mem_limit: 512m
